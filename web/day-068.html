を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。お席は二十時までお取りしておきます。","prompt_zh":"店方请客人做的是什么？","options":["二十時までに必ず来ること","予約を取り消すこと","人数を二名に戻すこと","十八時を過ぎるなら連絡すること"],"answer":"十八時を過ぎるなら連絡すること","rationale":"「十八時を過ぎる場合は…一度ご連絡ください」是请求。「二十時までお席をお取りしておきます」是店方的安排（G0051 ておく），不是对客人的要求。","audio_text":"","rubric":"选 十八時を過ぎるなら連絡すること 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0262","type":"read","prompt_ja":"新しいアプリは、使い始める前に、画面の指示に従って初期設定を済ませておく必要があります。設定を飛ばすと、あとで通知が届かなかったり、データが正しく保存されなかったりすることがあります。一度設定してしまえば、日常の操作はとても簡単で、説明書を読まなくても使えるほどです。","prompt_zh":"跳过设置会怎样？","options":["料金が高くなる","通知が届かない・データが保存されない","操作が逆に簡単になる","アプリがすぐ消える"],"answer":"通知が届かない・データが保存されない","rationale":"「あとで通知が届かなかったり、データが正しく保存されなかったりすることがあります」＝G0066（ことがある，有时会）的替换读法。末句「操作は簡単」是设置之后的事，不是跳过设置的结果。","audio_text":"","rubric":"选 通知が届かない・データが保存されない 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0264","type":"read","prompt_ja":"【経済】ある調査によると、今年新しく就職した人のうち、給料よりも『働きやすい職場かどうか』を重視した人が、初めて半数を超えたそうです。残業の少なさや、休みの取りやすさを理由に挙げる人が多く、専門家は『働き方への意識が変わってきた結果だろう』と話しています。","prompt_zh":"最适合作为标题的是哪一项？","options":["残業が法律で禁止された","就職で給料より働きやすさを重視する人が増加","新入社員の給料が大幅に上がった","会社が休みを減らすと発表"],"answer":"就職で給料より働きやすさを重視する人が増加","rationale":"「給料より…働きやすい職場を重視した人が半数を超えた」是主旨（含 G0058 かどうか、G0043 传闻）。加薪、立法、减少休假都未在文中出现，不能凭常识添信息。","audio_text":"","rubric":"选 就職で給料より働きやすさを重視する人が増加 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0265","type":"read","prompt_ja":"『気持ち』と『気分』は似ていますが、使い方が少し違います。『気持ち』は、うれしい・悲しいなど、心の状態や相手への思いを表すときに使います。一方、『気分』は、体の調子や、その場の雰囲気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分転換』のように使います。","prompt_zh":"关于「気分」的说明，正确的是哪一项？","options":["うれしさ・悲しさそのもの","物事の意味や理由","体調やその場の雰囲気による一時的な感じ","相手への長く続く思い"],"answer":"体調やその場の雰囲気による一時的な感じ","rationale":"文中「体の調子や、その場の雰囲気に左右される一時的な感じ」即答案。『相手への思い』『うれしさ・悲しさ』属于「気持ち」，『意味・理由』是别的词，本文用「一方」做了对照（G0085）。","audio_text":"","rubric":"选 体調やその場の雰囲気による一時的な感じ 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが
