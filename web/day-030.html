ce":"しかし","kana":"しかし","romaji":"shikashi","pos":"接続詞","meaning_zh":"但是；然而","jlpt":"N4","examples":[{"ja":"安いです。しかし、美味しくないです。","zh":"便宜，但是不好吃。","audio_text":"安いです。しかし、美味しくないです。"}],"notes_for_zh":"「しかし」是书面/正式逆接，口语用「でも／だけど」；中文「但是」口语书面通用，日语按语体选词，别在随意对话里用 しかし。","confusables":["V0148"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0044","pattern":"～ようだ / ～らしい","meaning_zh":"好像…／似乎…（推测）","connection":"普通形 + ようだ／らしい（名 + の + ようだ）","example":"彼は忙しいようです。","usage":"ようだ 偏主观直感，らしい 偏传闻/典型特征；名词接 ようだ 要加 の","explanation_zh":"意思是「好像…／似乎…（推测）」；接续：普通形 + ようだ／らしい（名 + の + ようだ）（中文术语：简体 + ようだ／らしい（名 + の + ようだ））；用法：ようだ 偏主观直感，らしい 偏传闻/典型特征；名词接 ようだ 要加 の","common_errors":[{"wrong":"雨ようです。","why":"名词接 ようだ 要加 の：雨のようです","fix":"雨のようです。","learner":"zh"},{"wrong":"彼は忙しいようだ です","why":"ようだ 本身可结句，叠加 です 时要变成 ようです","fix":"彼は忙しいようです。","learner":"zh"}],"compare":[],"examples":[{"ja":"彼は忙しいようです。","zh":"他好像很忙。","audio_text":"彼は忙しいようです。"},{"ja":"明日は雨らしいです。","zh":"明天好像有雨。","audio_text":"明日は雨らしいです。"}],"ko":"-인 것 같다 / -(으)ㄴ가 보다 / -답다","ko_hint":"都表『好像／似乎』的推测，可对照『推量』语义。","caution":"ようだ 偏主观印象、らしい 偏传闻/典型特征，韩语 -것 같다/-가 보다/-답다 分工不同且不一一对应；ようだ 还表比喻（まるで夢のようだ），韩语要用 -처럼，别一律 같다。"},{"id":"G0045","pattern":"～かもしれない / ～でしょう","meaning_zh":"也许…／大概…吧","connection":"普通形 + かもしれない；普通形 + でしょう","example":"明日は雨かもしれません。","usage":"かもしれない 表不确定推测，でしょう 表较有把握的推量/委婉断定","explanation_zh":"意思是「也许…／大概…吧」；接续：普通形 + かもしれない；普通形 + でしょう（中文术语：简体 + かもしれない；简体 + でしょう）；用法：かもしれない 表不确定推测，でしょう 表较有把握的推量/委婉断定","common_errors":[{"wrong":"雨かもしれないです。","why":"かもしれない 礼貌形是 かもしれません，不是 〜です 直接叠加","fix":"雨かもしれません。","learner":"zh"},{"wrong":"雨でしょう かもしれません","why":"でしょう 与 かもしれない 是两种推测，不叠加","fix":"雨でしょう。／雨かもしれません。","learner":"zh"}],"compare":[],"examples":[{"ja":"明日は雨かもしれません。","zh":"明天也许下雨。","audio_text":"明日は雨かもしれません。"},{"ja":"彼は来るでしょう。","zh":"他大概会来吧。","audio_text":"彼は来るでしょう。"}],"ko":"-(으)ㄹ지도 모른다 / -(으)ㄹ 거예요·-(으)ㄹ 것 같아요","ko_hint":"都表『也许／大概…吧』的推测，可对照把握度层次。","caution":"かもしれない 把握低、でしょう 把握较高且可表确认/征求同意，韩语 -(으)ㄹ지도 몰라요 / -(으)ㄹ 거예요 对应但语感不同；でしょう 还能表委婉断定，韩语没有对等的一形多用。"}],"kanji"
