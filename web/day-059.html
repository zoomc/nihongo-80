hint":"","caution":""},{"id":"V0284","surface":"印鑑","kana":"いんかん","romaji":"inkan","pos":"名詞","meaning_zh":"印章；图章","jlpt":"N3","examples":[{"ja":"印鑑を持ってきてください。","zh":"请带上印章。","audio_text":"印鑑を持ってきてください。"}],"notes_for_zh":"中文“印鉴”偏银行用语，日语日常「印鑑」就是印章；「はんこ」更口语；读 いんかん。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0285","surface":"署名","kana":"しょめい","romaji":"shomei","pos":"名詞/サ変","meaning_zh":"签名","jlpt":"N3","examples":[{"ja":"ここに署名してください。","zh":"请在这里签名。","audio_text":"ここに署名してください。"}],"notes_for_zh":"「署名」是亲笔签名，不是盖章；「ここに署名してください」；与「サイン」近义但更正式。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0286","surface":"住民票","kana":"じゅうみんひょう","romaji":"juuminhyou","pos":"名詞","meaning_zh":"居民票（户籍住址证明）","jlpt":"N3","examples":[{"ja":"住民票の写しを取ります。","zh":"去开居民票的复印件。","audio_text":"住民票の写しを取ります。"}],"notes_for_zh":"日本行政文件，记录住址/家庭成员；中文无完全对应；「住民票の写し」是复印件；读 じゅうみんひょう。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0288","surface":"許可","kana":"きょか","romaji":"kyoka","pos":"名詞/サ変","meaning_zh":"许可；批准","jlpt":"N3","examples":[{"ja":"許可をもらってから入ってください。","zh":"拿到许可后再进去。","audio_text":"許可をもらってから入ってください。"}],"notes_for_zh":"「許可」是官方/管理方允许；「許可をもらう／許可が必要」；与「承認」不同，許可偏“准许做某事”。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0070","pattern":"普通形 + に 違いない","meaning_zh":"一定是…；肯定…（强烈推断）","connection":"動詞・い形 普通形 / 名詞・な形 词干（＋である 可省）+ に違いない；礼貌体 に違いありません","example":"彼はもう帰ったに違いありません。","usage":"基于证据的高置信推断，语气比 かもしれない（G0045）强、比 はず（G0053）更带主观断定","explanation_zh":"意思是「一定是…；肯定…（强烈推断）」；接续：動詞・い形 普通形 / 名詞・な形 词干（＋である 可省）+ に違いない；礼貌体 に違いありません（中文术语：动词・い形 简体 / 名词・な形 词干（＋である 可省）+ に違いない；礼貌体 に違いありません）；用法：基于证据的高置信推断，语气比 かもしれない（G0045）强、比 はず（G0053）更带主观断定","common_errors":[{"wrong":"彼は帰るに違いないです。","why":"「に違いない」已是断定语，不加 です；礼貌应说 に違いありません；中文「一定」直译加 です 错","fix":"彼は帰ったに違いありません。","learner":"zh"},{"wrong":"彼は学生だに違いない。","why":"名词/な形 接 に違いない 一般去掉 だ（或 である）；中文「一定是学生」直译保留 だ 错","fix":"彼は学生に違いない。","learner":"zh"}],"compare":[{"id":"G0053","diff":"はずだ 是「按理应该（逻辑推断，可能落空）」；に違いない 是「必定」"},{"id":"G0045","diff":"かもしれない 只是「也许」低置信；に違いない 是高置信，方向相反"}],"examples":[{"ja":"彼はもう帰ったに違いありません。","zh":"他肯定已经回去了。","audio_text":"彼はもう帰ったに違いありません。"},{"ja":"この値段は安すぎる。セールに違いない。","zh":"这价格太便宜，肯定是促销。","audio_text":"この値段は安すぎる。セールに違いない。"}],"ko":"-에 틀림없다 / -임이 분명하다","ko_hint":"『一定是…／肯定…』≒ -에 틀림없다，强烈推断可对照。","caution":"日语 に違いない 的 に 不对应韩语 에（韩语 -에 틀림없다 是固定搭配，别当成 G0009 的 に）；相比 でしょう/かもしれない 这是最高把握推断，韩语 틀림없다/분명하다 也有层级，但语气强度不完全一致。"},{"id":"G0064","pattern":"V辞書形 / Vない形 + ように する","meaning_zh":"努力做到…／设法不…（有意识地做）","connection":"動詞 辞書形／ない形 + ように + する；する 按 サ変 变形（ようにしています／ようにした）","example":"毎日野菜を食べるようにしています。","usage":"表示意志性的努力或习惯；与 〜ようになる（G0048，自然变成）相对，关键在有无人的意志","explanation_zh":"意思是「努力做到…／设法不…（有意识地做）」；接续：動詞 辞書形／ない形 + ように + する；する 按 サ変 变形（ようにしています／ようにした）（中文术语：动词 辞书形／ない形 + ように + する；する 按 サ変 变形（ようにしています／ようにした））；用法：表示意志性的努力或习惯；与 〜ようになる（G0048，自然变成）相对，关键在有无人的意志","common_errors":[{"wrong":"毎日走るようになりました。","why":"想表达「我坚持每天跑步」应用 ようにする（意志努力）；ようになる 是自然变化，中文「坚持」直译易混","fix":"毎日走るようにしています。","learner":"zh"},{"wrong":"遅刻するようにしてください。","why":"「请别迟到」须用 ない形 遅刻しないように；中文「请做到…」直译用肯定形意思反了","fix":"遅刻しないようにしてください。","learner":"zh"}],"compare":[{"id":"G0048","diff":"ようになる 是「（自然而然）变得…」；ようにする 是「有意识地做到…」"},{"id":"G0035","diff":"〜に する 是把…变成/选成；ようにする 是努力做到某动作"}],"examples":[{"ja":"毎日野菜を食べるようにしています。","zh":"我尽量每天吃蔬菜。","audio_text":"毎日野菜を食べるようにしています。"},{"ja":"寝る前にスマホを見ないようにしています。","zh":"睡前尽量不看手机。","audio_text":"寝る前にスマホを見ないようにしています。"}],"ko":"-도록 하다 / -(으)려고 노력하다","ko_hint":"『努力做到…／设法不…』≒ -도록 하다，意志性习惯可对照。","caution":"ように する 表有意识地使成为习惯，韩语 -도록 하다 还表让/吩咐别人做，多一层使役；ように なる（G0048）与 ように する 日语只差 する/なる，韩语 -도록 하다/-게 되다 是两套，别套一个。"}],"kanji":[{"id":"K0130","char":"入","onyomi":["ニュウ"],"kunyomi":["はいる","いれる"],"meaning_zh":"入；进入；放入；住院","zh_trap":"中文「入」rù；日语 入 音读 ニュウ（入院 にゅういん）、训读 はいる（自動）/いれる（他動）；「入院」住院 ≠ 中文「进入医院」字面，且 ニュウ 不可按中文 rù 推，自他两读要分。","vocab_refs":["V0258"],"examples":[{"ja":"入院","kana":"にゅういん","zh":"住院"}],"ko_hint":""},{"id":"K0131","char":"看","onyomi":["カン"],"kunyomi":["みる"],"meaning_zh":"看；看护；照料","zh_trap":"中文「看」kàn/kān；日语「看病」かんびょう 是「护理病人」，中文「看病」是「（病人去）就诊/（医生）诊治」，主客完全颠倒——经典中日同形异义，绝不能靠汉字猜；「看護」かんご 也读 カン。","vocab_refs":["V0259"],"examples":[{"ja":"看病","kana":"かんびょう","zh":"护理；照料病人"}],"ko_hint":""}],"questions":[{"id":"Q0310","type":"free_production","prompt_ja":"","prompt_zh":"用「〜に 違いない」（G0070）写一句话，对眼前的情况做一个有把握的推断。","options":[],"answer":"","rationale":"「普通形＋に違いない」强烈推断；动词/い形用普通形直接接，な形/名词用（である，可省）；常与「きっと」呼应。","audio_text":"","rubric":"①普通形＋に違いない强烈推断 1 分；②接续正确（动词普通形/名・な形である）1 分；③きっと等呼应、语境自然 1 分","expected_production":"部長の机に資料がないから、きっと会議中に違いない。","difficulty":4},{"id":"Q0328","type":"dialogue","prompt_ja":"上司：新しいシステム、みんなに使ってほしいんですが…／あなた：（　）","prompt_zh":"作为部下，回应会『努力做到让大家都用起来』，使用「〜ように する」（G0064）。","options":[],"answer":"","rationale":"「V辞書形＋ように する」（G0064）＝有意识地努力做到；用「説明する／操作」（V0170/V0254）；对上司用「はい、〜ます」敬体。","audio_text":"","rubric":"①V辞書形＋ようにする 1 分；②用説明する/操作等词 1 分；③〜ます敬体、对上司语气 1 分","expected_production":"はい、全員が使えるように、明日説明会を開きます。","difficulty":4},{"id":"Q0366","type":"mcq","prompt_ja":"印鑑登録の手続きは、市民課の窓口で行います。登録できる印鑑は、自分の名前がはっきり読めるもので、他の人と区別できるものに限ります。ゴム印や、文字が欠けている印鑑は登録できません。手続きのときは、印鑑と本人確認の書類を持って来てください。登録が済むと、印鑑登録証明書がすぐに発行できます。この証明書は、家を借りるときや、会社を設立するときなどに使われます。代理人が手続きをする場合は、本人からの委任状が別に必要です。","prompt_zh":"【読解】根据第3句，登録できない印鑑はどれですか。","options":["文字が欠けている印鑑","自分の名前の印鑑","名前がはっきり読める印鑑","他の人と区別できる印鑑"],"answer":"文字が欠けている印鑑","rationale":"第3句「ゴム印や、文字が欠けている印鑑は登録できません」明确缺字印章不能登记。其余三项正是可登记条件。","audio_text":"","rubric":"选 文字が欠けている印鑑 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0371","type":"mcq","prompt_ja":"社員駐車場の利用について、お知らせします。駐車できるのは、許可証を車の前に貼っている車だけです。許可証のない車は、たとえ短い時間でも止めることができません。駐車場は先着順で、予約はできません。満車のときは、近くの有料駐車場を利用し、領収書を総務部に出してください。月に一度、経費として精算します。また、エンジンをかけたまま車を離れることは禁止です。違反が続く場合は、許可を取り消すことがあります。規則を守って、気持ちよく利用しましょう。","prompt_zh":"【読解】根据第2句，駐車できる車はどれですか。","options":["社長の車","短時間なら許可証のない車","予約した車","許可証を車の前に貼っている車"],"answer":"許可証を車の前に貼っている車","rationale":"第2句「許可証を車の前に貼っている車だけ」=仅限贴许可证的车。第3句明确无证车即使短时间也不能停；停车场不能预约。","audio_text":"","rubric":"选 許可証を車の前に貼っている車 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0385","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，最初に持ってきた書類は何でしたか。","options":["印鑑","運転免許証","古い住所の住民票の写し","新しい住所の住民票の写し"],"answer":"古い住所の住民票の写し","rationale":"A 带的是住民票の写し，B 指出「こちらは古い住所のものですね」。驾照是之后拿出的身份证明。","audio_text":"A：すみません、引っ越しの届けを出したいのですが。\nB：はい。新しい住所が分かる書類はお持ちですか。\nA：住民票の写しを持ってきました。\nB：ありがとうございます。あ、こちらは古い住所のものですね。","rubric":"选 古い住所の住民票の写し 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0386","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，今回必要ないものは何ですか。","options":["本人確認書類","新しい住所が分かる書類","印鑑","署名"],"answer":"印鑑","rationale":"A 问印鑑是否必要，B 明确「今回は必要ありません。署名で大丈夫です」。所以不需要印章。","audio_text":"A：はい。あのう、印鑑は必要ですか。\nB：今回は必要ありません。署名で大丈夫です。","rubric":"选 印鑑 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0045","kind":"reading","title":"「気持ち」と「気分」の違い","text_ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","text_kana":"","text_zh":"「気持ち」和「気分」是相近的词，用法略有不同。「気持ち」表示高兴、悲伤等心理状态或对对方的心意。而「気分」多指受身体状况或当场气氛影响的一时感受，如「気分が悪い」「気分を変えたい」。拿不准时，可想想是长期持续的心理状态，还是仅当下的一时感受。","focus_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","url":"","license":"original"},{"id":"M0088","kind":"listening","title":"同僚：説明会の資料部数","text_ja":"A：山田さん、明日の説明会の資料、何部コピーした？\nB：十部です。出席者は八人と聞いていたので。\nA：あ、それが、今日になって二人増えたんだ。\nB：じゃあ、十二部ですね。すぐに二部追加します。\nA：うん、お願い。あと、表紙の色は青でいい？\nB：青でお願いします。前回は赤だったので、今回は青にしましょう。\nA：わかった。それと、資料の最後に質問用の紙を入れておいて。\nB：質問用の紙ですね。白い紙でいいですか。\nA：白で大丈夫。ありがとう。","text_kana":"A：やまださん、あしたのせつめいかいのしりょう、なんぶコピーした？\nB：じゅうぶです。しゅっせきしゃははちにんときいていたので。\nA：あ、それが、きょうになってふたりふえたんだ。\nB：じゃあ、じゅうにぶですね。すぐににぶついかします。\nA：うん、おねがい。あと、ひょうしのいろはあおでいい？\nB：あおでおねがいします。ぜんかいはあかだったので、こんかいはあおにしましょう。\nA：わかった。それと、しりょうのさいごにしつもんようのかみをいれておいて。\nB：しつもんようのかみですね。しろいかみでいいですか。\nA：しろでだいじょうぶ。ありがとう。","text_zh":"A：山田，明天说明会的资料复印了几份？\nB：十份。因为听说出席者是八人。\nA：啊，那个，今天又增加了两个人。\nB：那就是十二份。马上再加两份。\nA：嗯，拜托。还有，封面用蓝色可以吗？\nB：请用蓝色。上次是红色，这次用蓝色吧。\nA：知道了。还有，资料最后放一张提问用纸。\nB：提问用纸是吧。白纸可以吗？\nA：白纸就行。谢谢。","focus_zh":"人物关系是同事。信息干扰：先按八名出席者复印十份，当天增加两人，最终十二份；表纸颜色从上次的红色改为蓝色。","audio_text":"A：山田さん、明日の説明会の資料、何部コピーした？\nB：十部です。出席者は八人と聞いていたので。\nA：あ、それが、今日になって二人増えたんだ。\nB：じゃあ、十二部ですね。すぐに二部追加します。\nA：うん、お願い。あと、表紙の色は青でいい？\nB：青でお願いします。前回は赤だったので、今回は青にしましょう。\nA：わかった。それと、資料の最後に質問用の紙を入れておいて。\nB：質問用の紙ですね。白い紙でいいですか。\nA：白で大丈夫。ありがとう。","url":"","license":"original"}],"viz":{"day":59,"phase":"P4","new_count":11,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。","kana":"","zh":"「気持ち」和「気分」是相近的词，用法略有不同。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。","origin":"material","source_id":"M0045"},{"ja":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。","kana":"","zh":"「気持ち」表示高兴、悲伤等心理状态或对对方的心意。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。","origin":"material","source_id":"M0045"},{"ja":"一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。","kana":"","zh":"而「気分」多指受身体状况或当场气氛影响的一时感受，如「気分が悪い」「気分を変えたい」。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。","origin":"material","source_id":"M0045"}],"review_plan":[{"kid":"V0278","surface":"転送","kana":"てんそう","zh":"转发；转送","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":58,"next_hint_zh":"按课程间隔，大约 Day 60 再预习","planned_only":true},{"kid":"V0295","surface":"退去","kana":"たいきょ","zh":"搬出；退租","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":58,"next_hint_zh":"按课程间隔，大约 Day 60 再预习","planned_only":true},{"kid":"V0233","surfa
