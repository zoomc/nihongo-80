,"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0086","pattern":"V辞書形 / Nの + たびに","meaning_zh":"每当…就…；每次…都…","connection":"動詞辞書形 + たびに；名詞 + の + たびに（する名詞可直接 するたびに）","example":"大阪へ出張するたびに、この店に寄ります。","usage":"表示每次发生前项时，后项都随之发生；后项多为反复出现的习惯或自然结果，不用一次性的命令、请求。","explanation_zh":"意思是「每当…就…；每次…都…」；接续：動詞辞書形 + たびに；名詞 + の + たびに（する名詞可直接 するたびに）（中文术语：动词辞书形 + たびに；名词 + の + たびに（する名词可直接 するたびに））；用法：表示每次发生前项时，后项都随之发生；后项多为反复出现的习惯或自然结果，不用一次性的命令、请求。","common_errors":[{"wrong":"大阪へ出張するのたびに、この店に寄ります。","why":"辞书形后接 たびに 不加 の；の 只能接名词。中文“每次去…”直译容易多写の。","fix":"大阪へ出張するたびに、この店に寄ります。","learner":"zh"},{"wrong":"会議のたびにで、資料を準備します。","why":"たびに 后不接 で；中文“在每次会议上”直译容易加 で。","fix":"会議のたびに、資料を準備します。","learner":"zh"}],"compare":[{"id":"G0077","diff":"につれて 表示随时间逐渐变化，是一个连续过程；たびに 表示每次事件反复发生。"}],"examples":[{"ja":"大阪へ出張するたびに、この店に寄ります。","zh":"每次去大阪出差，都会来这家店。","audio_text":"大阪へ出張するたびに、この店に寄ります。"},{"ja":"会議のたびに、資料を準備します。","zh":"每次开会都准备资料。","audio_text":"会議のたびに、資料を準備します。"}],"ko":"","ko_hint":"","caution":""},{"id":"G0078","pattern":"N + に 基づいて / を もとに / どおり(に)","meaning_zh":"基于…／以…为依据／按照…","connection":"名詞 + に基づいて（依据资料/规则/数据）；名詞 + をもとに（以…为素材/基础）；名詞 + どおり(に)（照原样、按预定）","example":"調査結果に基づいて、報告書を作成しました。","usage":"书面；に基づいて 偏「依据权威来源」，をもとに 偏「以…为材料加工」，どおり 偏「不改动地照做」","explanation_zh":"意思是「基于…／以…为依据／按照…」；接续：名詞 + に基づいて（依据资料/规则/数据）；名詞 + をもとに（以…为素材/基础）；名詞 + どおり(に)（照原样、按预定）（中文术语：名词 + に基づいて（依据资料/规则/数据）；名词 + をもとに（以…为素材/基础）；名词 + どおり(に)（照原样、按预定））；用法：书面；に基づいて 偏「依据权威来源」，をもとに 偏「以…为材料加工」，どおり 偏「不改动地照做」","common_errors":[{"wrong":"資料に基づいてに書きました。","why":"に基づいて 已含 に，不再叠 に；中文「基于资料」直译叠加助词错","fix":"資料に基づいて書きました。","learner":"zh"},{"wrong":"アンケート結果をに基づいて改善します。","why":"に基づいて 前用 に（結果に基づいて），もとに 才用 を；中文「以…为基础」直译混了 を 与 に","fix":"アンケート結果に基づいて改善します。","learner":"zh"}],"compare":[{"id":"G0055","diff":"によって 表原因/手段；に基づいて 表「以…为根据/来源」"},{"id":"G0077","diff":"に伴って 是伴随变化；に基づいて 是静态依据，无变化义"}],"examples":[{"ja":"調査結果に基づいて、報告書を作成しました。","zh":"依据调查结果写成了报告。","audio_text":"調査結果に基づいて、報告書を作成しました。"},{"ja":"予定どおりに、会議を始めます。","zh":"按预定开始会议。","audio_text":"予定どおりに、会議を始めます。"}],"ko":"-에 근거해(서) / -(으)ㄹ 바탕으로 / -대로","ko_hint":"『基于…／以…为依据／按照…』≒ -에 근거해/-바탕으로/-대로，可成组对照。","caution":"基于/依据/按照三义在韩语是 -근거해/-바탕으로/-대로 三套，日语 に/を/どおり 也不同格，别逐字拼；どおり 接名词后（予定どおり）韩语 -대로 也接名词、这条较近，但 に基づいて 的 に 不是 G0009 的 에。"}],"kanji":[{"id":"K0116","char":"就","onyomi":["シュウ"],"kunyomi":["つく"],"meaning_zh":"就；就任；就职","zh_trap":"中文「就」jiù 多作副词；日语 就 音读 シュウ，「就職」しゅうしょく 是「就业/就职」（名词/サ変）；中文「就」的词性与日语完全不同，不能按中文直译。","vocab_refs":["V0249"],"examples":[{"ja":"就職","kana":"しゅうしょく","zh":"就职；就业"}],"ko_hint":""},{"id":"K0113","char":"告","onyomi":["コク"],"kunyomi":["つげる"],"meaning_zh":"告；告诉；报告；广告","zh_trap":"中文「告」gào；日语 告 音读 コク（入声 -ク）、训读 つげる（告げる），「報告」ほうこく「広告」こうこく；不可按中文 gào 推成 ゴウ/カオ。","vocab_refs":["V0247"],"examples":[{"ja":"報告","kana":"ほうこく","zh":"报告；汇报"}],"ko_hint":"韩语汉字词可参考：보고(하다)。日韩汉字词同形同义（ほうこく／보고＝报告）。"}],"questions":[{"id":"Q0219","type":"mcq","prompt_ja":"明日の会議の資料は用意しました。___、来週の出張の件ですが…","prompt_zh":"选出用于转换话题的接续词","options":["ところで","それとも","そのため","そのうえ"],"answer":"ところで","rationale":"「ところで」用于『对了/话说回来』转入新话题；其余三项分别表因果、选择、累加，不具备转话题功能。","audio_text":"","rubric":"选 ところで 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0229","type":"fill","prompt_ja":"会議の資料は、もう ___ てありますから、ご安心ください。","prompt_zh":"填入使「〜てあります」成立的形式","options":[],"answer":"用意し","rationale":"「N が Vて ある」表人为事先做好并留下结果（G0056）；サ変「用意する」て形为「用意して」，去掉「てあります」填「用意し」。原本的「を」改由「は/が」提示。","audio_text":"","rubric":"填 用意し 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0230","type":"fill","prompt_ja":"明日の会議に部長が出席する ___ 、まだ分かりません。","prompt_zh":"填入表示『是否』的表达","options":[],"answer":"かどうか","rationale":"「普通形＋かどうか」＝『是否…』（G0058）；名词/な形词干直接接、不加 だ。中文『是否』常错加成「か」或「だ」。","audio_text":"","rubric":"填 かどうか 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0234","type":"fill","prompt_ja":"昨日は ___ すぎて、今朝はとても疲れています。","prompt_zh":"填入「〜すぎる」前的ます形词干","options":[],"answer":"残業し","rationale":"「Vます形去ます＋すぎる」＝过于…（G0063）；サ変「残業する」→「残業しすぎて」（て形中顿）。中文『加班太多』直译易写成「残業が多すぎる」而混淆结构。","audio_text":"","rubric":"填 残業し 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0239","type":"fill","prompt_ja":"ちょうど今から会議を ___ ところです。少々お待ちください。","prompt_zh":"填入「〜ところだ（正要）」前的动词形","options":[],"answer":"始める","rationale":"「V辞書形＋ところだ」＝正要做…（G0069）；「Vている＋ところだ」是正在做，「Vた＋ところだ」是刚做完。此处「今から」用辞书形「始める」。","audio_text":"","rubric":"填 始める 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0270","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：昨天加班过头，累了（用「すぎる」）","options":["疲れました","残業し","すぎて","昨日は"],"answer":"4,2,3,1","rationale":"时间词「昨日は」→「Vます形去ます＋すぎて」（て形中顿，G0063＋G0020）→结果「疲れました」。","audio_text":"","rubric":"编号序列为 4,2,3,1 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0062","kind":"reading","title":"企画会議の日程変更メール","text_ja":"田中さま。お疲れさまです。来週水曜日の企画会議についてご連絡します。会場の都合で、開催日を木曜日の午後三時に変更することになりました。開始時刻は変わりませんが、会議室は三階の第二会議室から五階の大会議室に移ります。資料は前日までに共有フォルダーへ入れておいてください。当日は、先月の売上について五分ほど報告をお願いします。ご確認のうえ、返信をお願いいたします。不明な点があれば、企画部の山田までお問い合わせください。山田より。","text_kana":"たなかさま。おつかれさまです。らいしゅうすいようびのきかくかいぎについてごれんらくします。かいじょうのつごうで、かいさいびをもくようびのごごさんじにへんこうすることになりました。かいしじこくはかわりませんが、かいぎしつはさんかいのだいにかいぎしつからごかいのだいかいぎしつにうつります。しりょうはぜんじつまでにきょうゆうフォルダーへいれておいてください。とうじつは、せんげつのうりあげについてごふんほどほうこくをおねがいします。ごかくにんのうえ、へんしんをおねがいいたします。ふめいなてんがあれば、きかくぶのやまだまでおといあわせください。やまだより。","text_zh":"田中先生。辛苦了。关于下周三的企划会议，向您联络。因会场安排，举办日改到周四下午三点。开始时间不变，但会议室从三楼第二会议室移到五楼大会议室。请在前一天之前把资料放进共享文件夹。当天请就上个月的销售额做约五分钟的报告。请确认后回复。如有不明之处，请联系企划部山田。山田 敬上。","focus_zh":"「開催日を木曜日に変更」但「開始時刻は変わりません」；「会場の都合」是原因；「移ります」是换房间，不是取消。","audio_text":"田中さま。お疲れさまです。来週水曜日の企画会議についてご連絡します。会場の都合で、開催日を木曜日の午後三時に変更することになりました。開始時刻は変わりませんが、会議室は三階の第二会議室から五階の大会議室に移ります。資料は前日までに共有フォルダーへ入れておいてください。当日は、先月の売上について五分ほど報告をお願いします。ご確認のうえ、返信をお願いいたします。不明な点があれば、企画部の山田までお問い合わせください。山田より。","url":"","license":"original"},{"id":"M0047","kind":"listening","title":"会社での会議資料の打ち合わせ","text_ja":"田中さん、あしたの会議の資料はもうできていますか。はい、部長。夕方までに用意して、メールでお送りします。ありがとう。実は取引先が急に来ることになったので、資料をもう一枚増やしていただけませんか。わかりました。すぐ追加します。","text_kana":"","text_zh":"田中，明天会议的资料做好了吗？是的，部长。傍晚前准备好，用邮件发给您。谢谢。其实客户临时要来，能麻烦您再加一页资料吗？明白了。我马上补上。","focus_zh":"部下对部长用「夕方までに用意して、お送りします」，部长却用「増やしていただけませんか」客气请求；日语职场里上级对下级也常保持礼貌体，别按中文命令直译。","audio_text":"田中さん、あしたの会議の資料はもうできていますか。はい、部長。夕方までに用意して、メールでお送りします。ありがとう。実は取引先が急に来ることになったので、資料をもう一枚増やしていただけませんか。わかりました。すぐ追加します。","url":"","license":"original"},{"id":"M0078","kind":"reading","title":"在宅勤務のルール","text_ja":"来月から、会社は週に二日まで在宅勤務を認めることになりました。対象は、入社一年以上の社員です。在宅勤務をする日は、前日の午後五時までに、上司にメールで知らせてください。仕事の開始と終了の時刻は、通常の勤務と同じです。会社のパソコンを持ち帰る場合は、情報が漏れないように、十分注意してください。自宅のインターネット環境が整っていない場合は、会社の端末を借りることもできます。不明な点は、人事部まで問い合わせてください。","text_kana":"らいげつから、かいしゃはしゅうにふつかまでざいたくきんむをみとめることになりました。たいしょうは、にゅうしゃいちねんいじょうのしゃいんです。ざいたくきんむをするひは、ぜんじつのごごごじまでに、じょうしにメールでしらせてください。しごとのかいしとしゅうりょうのじこくは、つうじょうのきんむとおなじです。かいしゃのパソコンをもちかえるばあいは、じょうほうがもれないように、じゅうぶんちゅういしてください。じたくのインターネットかんきょうがととのっていないばあいは、かいしゃのたんまつをかりることもできます。ふめいなてんは、じんじぶまでといあわせてください。","text_zh":"从下个月起，公司允许每周最多两天居家办公。对象是入职一年以上的员工。居家办公的日子，请在前一天下午五点前用邮件通知上司。工作开始和结束时间与正常出勤相同。带回公司电脑时，请充分注意防止信息泄露。家中网络环境不完善时，也可以借公司终端。不明之处请咨询人事部。","focus_zh":"「週に二日まで」=最多两天；「前日の午後五時までに」是截止；「情報が漏れないように」表目的；「端末を借りる」是替代方案。","audio_text":"来月から、会社は週に二日まで在宅勤務を認めることになりました。対象は、入社一年以上の社員です。在宅勤務をする日は、前日の午後五時までに、上司にメールで知らせてください。仕事の開始と終了の時刻は、通常の勤務と同じです。会社のパソコンを持ち帰る場合は、情報が漏れないように、十分注意してください。自宅のインターネット環境が整っていない場合は、会社の端末を借りることもできます。不明な点は、人事部まで問い合わせてください。","url":"","license":"original"},{"id":"M0092","kind":"listening","title":"人事と応募者：面接の会場","text_ja":"A：もしもし、株式会社みなみの人事部です。\nB：応募した李と申します。面接のことでお電話しました。\nA：李さんですね。面接は来週の火曜日の午後二時からです。\nB：火曜日ですね。会場は本社ですか。\nA：あ、申し訳ありません。本社ではなく、駅前の支社です。\nB：駅前の支社ですね。何を持って行けばいいですか。\nA：履歴書などの書類と筆記用具をお持ちください。あと、入館証を渡しますので、十分前に来てください。\nB：わかりました。よろしくお願いいたします。","text_kana":"A：もしもし、かぶしきがいしゃみなみのじんじぶです。\nB：おうぼしたりともうします。めんせつのことでおでんわしました。\nA：りさんですね。めんせつはらいしゅうのかようびのごごにじからです。\nB：かようびですね。かいじょうはほんしゃですか。\nA：あ、もうしわけありません。ほんしゃではなく、えきまえのししゃです。\nB：えきまえのししゃですね。なにをもっていけばいいですか。\nA：りれきしょなどのしょるいとひっきようぐをおもちください。あと、にゅうかんしょうをおわたししますので、じゅうぶんまえにきてください。\nB：わかりました。よろしくおねがいいたします。","text_zh":"A：喂，这里是南株式会社人事部。\nB：我是应聘的李。为面试的事打电话来。\nA：李先生吧。面试在下周二下午两点开始。\nB：周二是吧。会场在总公司吗？\nA：啊，非常抱歉。不是总公司，是站前分公司。\nB：站前分公司是吧。需要带什么？\nA：请带履历书等文件和笔记用具。另外要发入馆证，请提前十分钟到。\nB：明白了。请多关照。","focus_zh":"人物关系是企业人事与应聘者。信息干扰：面接先说本社，马上更正为站前支社；要带履历书和笔记用具，提前十分钟到。","audio_text":"A：もしもし、株式会社みなみの人事部です。\nB：応募した李と申します。面接のことでお電話しました。\nA：李さんですね。面接は来週の火曜日の午後二時からです。\nB：火曜日ですね。会場は本社ですか。\nA：あ、申し訳ありません。本社ではなく、駅前の支社です。\nB：駅前の支社ですね。何を持って行けばいいですか。\nA：履歴書などの書類と筆記用具をお持ちください。あと、入館証を渡しますので、十分前に来てください。\nB：わかりました。よろしくお願いいたします。","url":"","license":"original"},{"id":"M0094","kind":"listening","title":"同僚：出張の交通手段","text_ja":"A：来週の大阪出張、新幹線で行くよね。\nB：それが、部長から飛行機にしろと言われたんだ。\nA：えっ、飛行機？　新幹線のほうが駅に近いのに。\nB：うん。でも、向こうの工場が空港の近くにあるから、飛行機のほうが早いらしい。\nA：なるほど。何時の便？\nB：朝八時の便を取った。七時には空港に着かないといけない。\nA：じゃあ、六時に会社を出る？\nB：そうだね。あ、違う。会社ではなく、駅で待ち合わせよう。\nA：わかった。じゃあ、六時に駅の改札で。","text_kana":"A：らいしゅうのおおさかしゅっちょう、しんかんせんでいくよね。\nB：それが、ぶちょうからひこうきにしろといわれたんだ。\nA：えっ、ひこうき？　しんかんせんのほうがえきにちかいのに。\nB：うん。でも、むこうのこうじょうがくうこうのちかくにあるから、ひこうきのほうがはやいらしい。\nA：なるほど。なんじのびん？\nB：あさはちじのびんをとった。しちじにはくうこうにつかないといけない。\nA：じゃあ、ろくじにかいしゃをでる？\nB：そうだね。あ、ちがう。かいしゃではなく、えきでまちあわせよう。\nA：わかった。じゃあ、ろくじにえきのかいさつで。","text_zh":"A：下周去大阪出差，坐新干线吧？\nB：那个，部长让我改坐飞机。\nA：诶，飞机？新干线离车站更近啊。\nB：嗯。不过对方工厂在机场附近，听说飞机更快。\nA：原来如此。几点的航班？\nB：订了早上八点的航班。七点必须到机场。\nA：那六点从公司出发？\nB：是啊。啊，不对。不是公司，在车站碰头吧。\nA：知道了。那六点在车站检票口。","focus_zh":"人物关系是同事。信息干扰：原以为坐新干线，部长要求改飞机；集合地点也从公司改为车站检票口。","audio_text":"A：来週の大阪出張、新幹線で行くよね。\nB：それが、部長から飛行機にしろと言われたんだ。\nA：えっ、飛行機？　新幹線のほうが駅に近いのに。\nB：うん。でも、向こうの工場が空港の近くにあるから、飛行機のほうが早いらしい。\nA：なるほど。何時の便？\nB：朝八時の便を取った。七時には空港に着かないといけない。\nA：じゃあ、六時に会社を出る？\nB：そうだね。あ、違う。会社ではなく、駅で待ち合わせよう。\nA：わかった。じゃあ、六時に駅の改札で。","url":"","license":"original"}],"viz":{"day":54,"phase":"P4","new_count":12,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"田中さま。","kana":"たなかさま。","zh":"田中先生。","note_zh":"「開催日を木曜日に変更」但「開始時刻は変わりません」；「会場の都合」是原因；「移ります」是换房间，不是取消。","audio_text":"田中さま。","origin":"material","source_id":"M0062"},{"ja":"お疲れさまです。","kana":"おつかれさまです。","zh":"辛苦了。","note_zh":"「開催日を木曜日に変更」但「開始時刻は変わりません」；「会場の都合」是原因；「移ります」是换房间，不是取消。","audio_text":"お疲れさまです。","origin":"material","source_id":"M0062"},{"ja":"来週水曜日の企画会議についてご連絡します。","
