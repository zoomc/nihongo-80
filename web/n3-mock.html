["しよう","します","した","する"],"answer":0,"answer_text":"しよう"},{"id":"Q0354","type":"mcq","prompt":"彼が約束を忘れる___がありません。","prompt_zh":"【言語知識】填入表示“不可能”的语法。","audio_text":"","options":["最中","うち","はず","ばかり"],"answer":2,"answer_text":"はず"},{"id":"Q0215","type":"mcq","prompt":"忙しいのに、駅まで ___ 送ってくれてありがとう。","prompt_zh":"选出最贴切的副词（专程做本不必做的事）","audio_text":"","options":["むしろ","せっかく","わざわざ","かえって"],"answer":2,"answer_text":"わざわざ"},{"id":"Q0216","type":"mcq","prompt":"彼の話し方は、まるで ___ みたいですね。","prompt_zh":"选出「みたい」的正确接续","audio_text":"","options":["先生","先生の","先生だ","先生な"],"answer":0,"answer_text":"先生"},{"id":"Q0220","type":"mcq","prompt":"なくした鍵が、かばんの中で ___。","prompt_zh":"选出正确动词形式（自他动词之别）","audio_text":"","options":["見つけました","見つけています","見つかりたいです","見つかりました"],"answer":3,"answer_text":"見つかりました"},{"id":"Q0226","type":"mcq","prompt":"「どうぞたくさん食べてください」「すみません、甘いものは ___ します」","prompt_zh":"选出表示委婉谢绝的词","audio_text":"","options":["満足","感動","安心","遠慮"],"answer":3,"answer_text":"遠慮"},{"id":"Q0227","type":"mcq","prompt":"母が入院したので、毎日病院へ ___ に行っています。","prompt_zh":"选出表示『去照料病人』的词","audio_text":"","options":["見物","診察","見学","看病"],"answer":3,"answer_text":"看病"},{"id":"Q0231","type":"fill","prompt":"約束の時間に遅れてすみません。実は、電車が ___ んです。","prompt_zh":"填入「んです」前的普通形","audio_text":"","options":[],"answer":-1,"answer_text":"遅れた"},{"id":"Q0237","type":"fill","prompt":"忙しいと、つい約束の時間を ___ ことがあります。","prompt_zh":"填入「〜ことが ある（有时会）」前的动词形","audio_text":"","options":[],"answer":-1,"answer_text":"忘れる"},{"id":"Q0241","type":"fill","prompt":"日本の大学に進学する ___ 、日本語を勉強しています。","prompt_zh":"填入表示『为了（目的）』的表达","audio_text":"","options":[],"answer":-1,"answer_text":"ために"}]},{"id":"reading","name":"文法・読解","minutes":70,"max_score":60,"pass_min":19,"questions":[{"id":"Q0355","type":"mcq","prompt":"市民のみなさまへ。来月から、燃えるごみを集める日が変わります。これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。祝日がある週は、次の平日に順延します。ごみは朝八時までに、決められた場所へ出してください。指定の袋を使わないごみは集めることができませんので、ご注意ください。詳しくは市役所のホームページで確認してください。ごみを出す時間を守らないと、収集できないことがあります。市役所環境課よりお知らせしました。","prompt_zh":"【読解】根据第4句「祝日がある週は、次の平日に順延します」，祝日がある週のごみ収集はどうなりますか。","audio_text":"","options":["土曜日に集める","その週は集めない","祝日の前日に集める","次の平日に順延される"],"answer":3,"answer_text":"次の平日に順延される"},{"id":"Q0356","type":"mcq","prompt":"田中さま。お疲れさまです。来週水曜日の企画会議についてご連絡します。会場の都合で、開催日を木曜日の午後三時に変更することになりました。開始時刻は変わりませんが、会議室は三階の第二会議室から五階の大会議室に移ります。資料は前日までに共有フォルダーへ入れておいてください。当日は、先月の売上について五分ほど報告をお願いします。ご確認のうえ、返信をお願いいたします。不明な点があれば、企画部の山田までお問い合わせください。山田より。","prompt_zh":"【読解】根据第4、5句，このメールで変わったものはどれですか。","audio_text":"","options":["開催日と会議室","報告の担当者","資料の枚数","開始時刻だけ"],"answer":0,"answer_text":"開催日と会議室"},{"id":"Q0357","type":"mcq","prompt":"市立図書館の利用者が増加しています。図書館によると、今年の利用者数は去年より一割ほど多いということです。仕事や子育てについて調べる大人が増えたことに加え、静かに勉強できる場所を求める学生も目立つようになりました。一方で、席が足りないという声も出ています。図書館は来月から、夜八時まで開館する日を週に二日増やす予定です。ただし、本の貸し出しの受付は七時半までとなります。また、静かな席を増やす工事も予定されています。","prompt_zh":"【読解】根据第2句，今年の利用者数はどうなりましたか。","audio_text":"","options":["去年より約一割増えた","去年より約一割減った","去年と同じだった","去年の二倍になった"],"answer":0,"answer_text":"去年より約一割増えた"},{"id":"Q0358","type":"mcq","prompt":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。申請書に名前と住所を書き、本人確認の書類を見せてください。運転免許証やマイナンバーカードがあれば、一つの書類で足ります。手数料は一通三百円で、現金またはキャッシュレスで払えます。代理人が来る場合は、本人が書いた委任状と、代理人の本人確認の書類も必要です。郵送を希望する方は、返信用の封筒を入れてください。平日の午後五時までに受け付けた分は、その日のうちに発行できます。","prompt_zh":"【読解】根据第5句，代理人が手続きするとき、必要なものはどれですか。","audio_text":"","options":["本人が書いた委任状","住民票の写し","印鑑","本人の運転免許証"],"answer":0,"answer_text":"本人が書いた委任状"},{"id":"Q0359","type":"mcq","prompt":"睡眠不足が続くと、仕事や勉強の能率が下がるだけでなく、体の免疫力も弱くなります。成人の場合、六時間から八時間の睡眠が目安とされていますが、時間よりも大切なのは、毎日ほぼ同じ時刻に寝て、同じ時刻に起きることです。寝る前にスマートフォンを見ると、脳が起きたままと感じて、眠りにくくなることがあります。どうしても眠れないときは、無理に布団に入らず、部屋を暗くして軽くストレッチをするのも一つの方法です。昼寝をするなら、三十分以内にするとよいでしょう。","prompt_zh":"【読解】根据第2句，筆者が最も大切だと言っているのはどれですか。","audio_text":"","options":["毎日ほぼ同じ時刻に寝て起きること","寝る前にスマホを見ること","眠れないとき布団に入ること","八時間以上眠ること"],"answer":0,"answer_text":"毎日ほぼ同じ時刻に寝て起きること"},{"id":"Q0360","type":"mcq","prompt":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","prompt_zh":"【読解】根据第2句，午前十時以降の運転について、正しいものはどれですか。","audio_text":"","options":["必ず十時に再開する","十時以降は終日運休する","雨が降れば必ず再開する","風が強ければ再開できないことがある"],"answer":3,"answer_text":"風が強ければ再開できないことがある"},{"id":"Q0361","type":"mcq","prompt":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。敷金は、修理が必要な場合に使われ、残った分は返ってきます。ただし、通常の使用による傷は、借りた人の負担にならないのが一般的です。契約書に書いてある内容を、必ず確認しておきましょう。","prompt_zh":"【読解】根据第4句，敷金について正しいものはどれですか。","audio_text":"","options":["礼金と同じで返ってこない","必ず全額返ってくる","修理に使われ、残った分は返ってくる","退去時には一切使われない"],"answer":2,"answer_text":"修理に使われ、残った分は返ってくる"},{"id":"Q0362","type":"mcq","prompt":"株式会社山川商事 御中。いつもお世話になっております。新製品の展示会用に、パンフレットを三百部お願いしたく、ご連絡いたしました。先日お送りいただいた見積書を拝見し、価格は問題ありませんでした。つきましては、納品を来月十日の午前中にしていただけますでしょうか。当日は午後から会場の準備があるため、午前中の納品を希望しております。納品先は、本社ではなく、展示会場の受付です。ご確認のうえ、ご返信いただけますと幸いです。株式会社みなみ 営業部 佐藤より。","prompt_zh":"【読解】根据第6句，午前中の納品を希望する理由は何ですか。","audio_text":"","options":["午後から会場の準備があるから","トラックが午前しかないから","午後は会社が休みだから","商品が午前しか届かないから"],"answer":0,"answer_text":"午後から会場の準備があるから"},{"id":"Q0363","type":"mcq","prompt":"来月三日の午前九時から、市全体で防災訓練を行います。訓練の開始と同時に、防災無線から大きな音が流れますので、驚かないでください。この音は、地震が起きたことを知らせるものではありません。訓練では、近くの小学校まで歩いて避難する練習をします。参加する方は、動きやすい服装で、飲み物を持って来てください。車での来場は禁止です。雨の場合も実施しますが、警報が出たときは中止します。参加を希望する方は、今週金曜日までに町内会へ申し込んでください。","prompt_zh":"【読解】根据第6句，訓練に参加するとき、してはいけないことはどれですか。","audio_text":"","options":["動きやすい服を着る","車で来場する","飲み物を持つ","歩いて避難する"],"answer":1,"answer_text":"車で来場する"},{"id":"Q0364","type":"mcq","prompt":"来月から営業部に来る後藤さんへ。今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。丸井商店は、毎月二十五日までに注文の確認をしないと、次の月の納品が遅れます。北川工業は、担当者が先月変わったばかりなので、こちらから連絡したほうがいいでしょう。引き継ぎの資料は、共有フォルダーの「営業引継ぎ」に入れてあります。分からないことがあったら、遠慮なく聞いてください。来週の月曜日に、一時間ほど時間を取って、一緒に確認しましょう。","prompt_zh":"【読解】根据第3句，丸井商店について気をつけることはどれですか。","audio_text":"","options":["北川工業に連絡する","毎週月曜日に担当者を変える","毎月25日までに注文の確認をする","納品をわざと遅らせる"],"answer":2,"answer_text":"毎月25日までに注文の確認をする"},{"id":"Q0365","type":"mcq","prompt":"今年、この町を訪れた観光客は、去年より二割増えました。特に、週末に開かれる朝市を見に来る人が多く、地元の野菜や加工品がよく売れています。一方で、観光客の車が増えたことで、住民からは「道が混みすぎる」という声も上がっています。町は来月から、中心部に限って車の進入を制限し、代わりに無料のバスを走らせる方針です。商店の店主からは賛成の声がある一方、車で来る客が減ることを心配する声もあります。町は来月、住民説明会を開く予定です。","prompt_zh":"【読解】根据第4句，町が来月から行うことはどれですか。","audio_text":"","options":["朝市を中止する","すべての車の進入を禁止する","中心部の車の進入を制限し、無料バスを走らせる","駐車場をすべて無料にする"],"answer":2,"answer_text":"中心部の車の進入を制限し、無料バスを走らせる"},{"id":"Q0366","type":"mcq","prompt":"印鑑登録の手続きは、市民課の窓口で行います。登録できる印鑑は、自分の名前がはっきり読めるもので、他の人と区別できるものに限ります。ゴム印や、文字が欠けている印鑑は登録できません。手続きのときは、印鑑と本人確認の書類を持って来てください。登録が済むと、印鑑登録証明書がすぐに発行できます。この証明書は、家を借りるときや、会社を設立するときなどに使われます。代理人が手続きをする場合は、本人からの委任状が別に必要です。","prompt_zh":"【読解】根据第3句，登録できない印鑑はどれですか。","audio_text":"","options":["文字が欠けている印鑑","自分の名前の印鑑","名前がはっきり読める印鑑","他の人と区別できる印鑑"],"answer":0,"answer_text":"文字が欠けている印鑑"},{"id":"Q0367","type":"mcq","prompt":"夏の暑い日は、熱中症の予防に注意が必要です。熱中症は、屋外だけでなく、風の通らない室内でも起こります。のどが渇いたと感じたときには、すでに体の水分が足りなくなっていることが多いので、時間を決めてこまめに水を飲みましょう。汗をたくさんかいた日は、水だけでなく、塩分も一緒に取ることが大切です。朝から頭が痛い、気分が悪いと感じたら、無理をせず、涼しい場所で休んでください。それでもよくならないときは、すぐに病院へ行きましょう。","prompt_zh":"【読解】根据第3句，のどが渇いたと感じたとき、体はどうなっていることが多いですか。","audio_text":"","options":["水分が十分にある","塩分が多すぎる","熱中症が治っている","すでに水分が足りなくなっている"],"answer":3,"answer_text":"すでに水分が足りなくなっている"},{"id":"Q0368","type":"mcq","prompt":"来月一日から、市内を走る青葉バスの路線が一部変わります。これまで駅前から病院までを結んでいた便は、途中の図書館を経由するようになります。そのため、駅から病院までの所要時間は、これまでの十五分より五分ほど長くなります。朝夕の時間帯は、利用者が多いため、十分間隔で運行します。昼間は、これまで通り二十分間隔です。なお、工事が終わるまでの間、市民公園前の停留所は使用できません。近くの仮の停留所をご利用ください。","prompt_zh":"【読解】根据第3句，駅から病院まで、所要時間は何分くらいになりますか。","audio_text":"","options":["25分","10分","20分","15分"],"answer":2,"answer_text":"20分"},{"id":"Q0369","type":"mcq","prompt":"この部屋の家賃は月六万円ですが、別に共益費が五千円かかります。共益費には、建物の掃除や、エレベーターの点検の費用が含まれています。水道代は共益費に含まれますが、電気代とガス代は自分で払う必要があります。契約のときは、家賃一か月分の敷金と、一か月分の礼金をお預かりします。敷金は、退去するときに、部屋の修理が必要なければ全額返します。ペットを飼う場合は、事前に相談してください。無断で飼うと、契約を解除することがあります。","prompt_zh":"【読解】根据第2句，共益費に含まれるものはどれですか。","audio_text":"","options":["電気代","礼金","建物の掃除とエレベーターの点検の費用","ガス代"],"answer":2,"answer_text":"建物の掃除とエレベーターの点検の費用"},{"id":"Q0370","type":"mcq","prompt":"山本さま。先日は、勉強会の日程についてご連絡いただき、ありがとうございました。誠に申し訳ありませんが、当日はどうしても外せない会議が入ってしまい、参加できなくなりました。楽しみにしていたので、とても残念です。代わりに、来週の木曜日か金曜日でしたら、時間を作ることができます。もしご都合がよろしければ、資料を送っていただけますでしょうか。今回の分は、後日、私のほうから先生に説明しておきます。急なご連絡で申し訳ありませんが、ご検討をお願いいたします。鈴木より。","prompt_zh":"【読解】根据第5句，筆者が参加できるのはいつですか。","audio_text":"","options":["今週の木曜日","先週の金曜日","来週の木曜日か金曜日","来週の月曜日"],"answer":2,"answer_text":"来週の木曜日か金曜日"},{"id":"Q0371","type":"mcq","prompt":"社員駐車場の利用について、お知らせします。駐車できるのは、許可証を車の前に貼っている車だけです。許可証のない車は、たとえ短い時間でも止めることができません。駐車場は先着順で、予約はできません。満車のときは、近くの有料駐車場を利用し、領収書を総務部に出してください。月に一度、経費として精算します。また、エンジンをかけたまま車を離れることは禁止です。違反が続く場合は、許可を取り消すことがあります。規則を守って、気持ちよく利用しましょう。","prompt_zh":"【読解】根据第2句，駐車できる車はどれですか。","audio_text":"","options":["社長の車","短時間なら許可証のない車","予約した車","許可証を車の前に貼っている車"],"answer":3,"answer_text":"許可証を車の前に貼っている車"},{"id":"Q0372","type":"mcq","prompt":"来月から、会社は週に二日まで在宅勤務を認めることになりました。対象は、入社一年以上の社員です。在宅勤務をする日は、前日の午後五時までに、上司にメールで知らせてください。仕事の開始と終了の時刻は、通常の勤務と同じです。会社のパソコンを持ち帰る場合は、情報が漏れないように、十分注意してください。自宅のインターネット環境が整っていない場合は、会社の端末を借りることもできます。不明な点は、人事部まで問い合わせてください。","prompt_zh":"【読解】根据第3句，在宅勤務の前日、何時までに上司へ連絡しますか。","audio_text":"","options":["午後5時","午前9時","午後8時","午後3時"],"answer":0,"answer_text":"午後5時"},{"id":"Q0373","type":"mcq","prompt":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。地元の農家が作る干し柿は、甘くて柔らかいのが特徴で、以前から観光客に人気がありました。輸出を始めるにあたり、農家では、衛生管理の基準を満たすための設備を新しく作りました。町は、海外での販売を支援するため、現地のバイヤーとの話し合いの場を設ける予定です。生産量には限りがありますが、まずは少ない量から始め、味を確かめてもらう方針です。","prompt_zh":"【読解】根据第3句，農家が新しく作ったものは何ですか。","audio_text":"","options":["干し柿の木","現地の工場","輸出用の港","衛生管理の基準を満たすための設備"],"answer":3,"answer_text":"衛生管理の基準を満たすための設備"},{"id":"Q0374","type":"mcq","prompt":"図書館の利用カードの有効期限は、発行から三年です。期限を過ぎると、本を借りることができなくなりますので、更新の手続きをしてください。更新には、現在使っているカードと、住所が分かる書類が必要です。住所が変わった方は、新しい住所を届け出てから、更新してください。手続きは、中央図書館のほか、駅前の分館でもできます。混雑を避けたい方は、平日の午前中に来ることをおすすめします。カードの再発行には、三百円かかります。","prompt_zh":"【読解】根据第4句，引っ越して住所が変わった人はどうすればいいですか。","audio_text":"","options":["300円払って再発行する","新しい住所を届け出てから更新する","カードを新規に作る","古い住所のまま更新する"],"answer":1,"answer_text":"新しい住所を届け出てから更新する"},{"id":"Q0256","type":"read","prompt":"【お知らせ】来月から、資源ごみの出し方が変わります。これまで毎週水曜日でしたが、来月からは毎週金曜日の朝八時までに出してください。集める曜日が変わるだけで、出す場所や分け方は今までと同じです。ご協力をお願いします。／市役所 環境課","prompt_zh":"这则通知里，变更的是什么？","audio_text":"","options":["ごみの分け方","集める回数","出す場所","出す曜日"],"answer":3,"answer_text":"出す曜日"},{"id":"Q0257","type":"read","prompt":"件名：明日の会議について／田中様　お疲れさまです。佐藤です。明日の会議ですが、開始時間を十時から十一時に変更いたしました。資料は今日中にメールでお送りします。お忙しいところ恐れ入りますが、ご確認のほどよろしくお願いいたします。","prompt_zh":"这封邮件的主要事项是什么？","audio_text":"","options":["会議の開始時間が変わったこと","会議が中止になったこと","資料が作れなかったこと","佐藤が休むこと"],"answer":0,"answer_text":"会議の開始時間が変わったこと"},{"id":"Q0258","type":"read","prompt":"【ニュース】大型の台風が近づいており、明日の午後から西日本で雨と強い風が予想されています。交通機関への影響も心配されるため、各鉄道会社は、明日の一部の列車を運休すると発表しました。最新の情報は、各社のホームページで確認できます。","prompt_zh":"与报道内容相符的是哪一项？","audio_text":"","options":["すべての電車が止まる","台風はもう去った","一部の列車が運休になる","明日は晴れて暑くなる"],"answer":2,"answer_text":"一部の列車が運休になる"},{"id":"Q0259","type":"read","prompt":"眠れない夜が続くと、日中の集中力が落ちるだけでなく、気分も不安定になりやすいと言われています。寝る前に明るい画面を長く見ることは、かえって目を覚ましてしまいます。寝る一時間前には、照明を少し暗くし、静かな音楽を聴くなどして、体を休める準備をするとよいでしょう。","prompt_zh":"作者推荐的做法是哪一项？","audio_text":"","options":["寝る直前まで仕事を続ける","寝る前に明るい画面を避け、体を休める準備をする","夜は明るい部屋で強い光を浴びる","薬を飲んで無理に眠る"],"answer":1,"answer_text":"寝る前に明るい画面を避け、体を休める準備をする"},{"id":"Q0260","type":"read","prompt":"図書館からのお知らせ：本を借りるには、利用カードが必要です。カードは、受付で申請書に記入し、身分が確認できるものを一つお見せいただければ、その場でお作りします。カードをなくした場合も、同じ手続きで再発行できますので、お気軽にお申し出ください。","prompt_zh":"办理借书证需要什么？","audio_text":"","options":["申請書への記入と身分証明になるもの","学校からの手紙","お金と写真二枚","事前の予約"],"answer":0,"answer_text":"申請書への記入と身分証明になるもの"},{"id":"Q0261","type":"read","prompt":"先日はご予約ありがとうございました。ご連絡いただいた人数の変更ですが、二名から三名へ、承知いたしました。なお、当日のご到着が十八時を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。お席は二十時までお取りしておきます。","prompt_zh":"店方请客人做的是什么？","audio_text":"","options":["二十時までに必ず来ること","予約を取り消すこと","人数を二名に戻すこと","十八時を過ぎるなら連絡すること"],"answer":3,"answer_text":"十八時を過ぎるなら連絡すること"},{"id":"Q0262","type":"read","prompt":"新しいアプリは、使い始める前に、画面の指示に従って初期設定を済ませておく必要があります。設定を飛ばすと、あとで通知が届かなかったり、データが正しく保存されなかったりすることがあります。一度設定してしまえば、日常の操作はとても簡単で、説明書を読まなくても使えるほどです。","prompt_zh":"跳过设置会怎样？","audio_text":"","options":["料金が高くなる","通知が届かない・データが保存されない","操作が逆に簡単になる","アプリがすぐ消える"],"answer":1,"answer_text":"通知が届かない・データが保存されない"},{"id":"Q0263","type":"read","prompt":"いつもご利用ありがとうございます。改装工事のため、来週の月曜日から水曜日まで、当店は臨時休業とさせていただきます。木曜日からは、これまでより一時間早い朝九時に開店し、夜は同じく二十時まで営業します。ご迷惑をおかけしますが、よろしくお願いいたします。","prompt_zh":"周四以后，变化的是什么？","audio_text":"","options":["店の場所","開店時間","休業する曜日","閉店時間"],"answer":1,"answer_text":"開店時間"},{"id":"Q0265","type":"read","prompt":"『気持ち』と『気分』は似ていますが、使い方が少し違います。『気持ち』は、うれしい・悲しいなど、心の状態や相手への思いを表すときに使います。一方、『気分』は、体の調子や、その場の雰囲気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分転換』のように使います。","prompt_zh":"关于「気分」的说明，正确的是哪一项？","audio_text":"","options":["うれしさ・悲しさそのもの","物事の意味や理由","体調やその場の雰囲気による一時的な感じ","相手への長く続く思い"],"answer":2,"answer_text":"体調やその場の雰囲気による一時的な感じ"},{"id":"Q0266","type":"read","prompt":"お客様へ：ただいま、線路内に人が立ち入った影響で、上下線の電車に最大二十分の遅れが出ています。運転再開のめどは立っておりますが、しばらくは間隔が広くなります。お急ぎの方は、ほかの路線をご利用ください。ご不便をおかけし、深くおわび申し上げます。","prompt_zh":"这则告示最接近的目的是哪一项？","audio_text":"","options":["運賃を返金すると約束する","遅れの原因と状況を知らせ、代替を案内する","新しい時刻表を発表する","事故がなかったと訂正する"],"answer":1,"answer_text":"遅れの原因と状況を知らせ、代替を案内する"}]},{"id":"listening","name":"聴解","minutes":40,"max_score":60,"pass_min":19,"questions":[{"id":"Q0375","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，会議は何時からになりましたか。","audio_text":"A：田中さん、明日の企画会議は三時からですよね。\nB：はい、部長。三時からです。\nA：あ、すみません。三時ではなく、三時半からになりました。\nB：わかりました。三時半ですね。","options":["2時半","3時半","3時","4時"],"answer":1,"answer_text":"3時半"},{"id":"Q0376","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，部下は念のため何部用意しますか。","audio_text":"A：出席者は十二人なので、十三部お願いします。\nB：十三部ですね。念のため、十五部用意しておきます。","options":["13部","15部","10部","12部"],"answer":1,"answer_text":"15部"},{"id":"Q0377","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，この部屋の敷金はいくらですか。","audio_text":"A：この部屋を借りたいのですが、敷金はいくらですか。\nB：敷金は家賃の二か月分です。\nA：二か月分ですか。少し高いですね。\nB：あ、失礼しました。この部屋は一か月分でした。","options":["礼金1か月分","5000円","家賃1か月分","家賃2か月分"],"answer":2,"answer_text":"家賃1か月分"},{"id":"Q0378","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，水道代はどうなりますか。","audio_text":"A：一か月分なら、助かります。礼金はかかりますか。\nB：礼金はかかりません。その代わり、共益費が毎月五千円かかります。\nA：共益費に水道代は含まれますか。\nB：いいえ、水道代は別です。電気代とガス代も自分で払ってください。","options":["敷金から払う","共益費に含まれる","礼金に含まれる","共益費に含まれず、別に払う"],"answer":3,"answer_text":"共益費に含まれず、別に払う"},{"id":"Q0379","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，東京行きの電車は何番線ですか。","audio_text":"A：すみません、東京行きの電車は何番線ですか。\nB：東京行きは三番線です。駅の掲示もご確認ください。\nA：三番線ですね。ありがとうございます。\nB：あ、申し訳ありません。工事のため、今日は四番線に変わりました。","options":["5番線","3番線","4番線","1番線"],"answer":2,"answer_text":"4番線"},{"id":"Q0380","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，発車時刻は何時ですか。","audio_text":"A：四番線ですか。発車時刻も変わりますか。\nB：いいえ、時刻は変わりません。十時十五分発です。","options":["9時45分","10時","10時15分","10時30分"],"answer":2,"answer_text":"10時15分"},{"id":"Q0381","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，予約は何時になりましたか。","audio_text":"A：はい。今日は何時ごろがご希望ですか。\nB：十時にお願いしたいです。\nA：あ、すみません。十時は予約が入っていますので、十時半でしたら空いています。\nB：では、十時半でお願いします。","options":["11時","10時","10時半","9時半"],"answer":2,"answer_text":"10時半"},{"id":"Q0382","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，納品日はいつになりましたか。","audio_text":"A：こちらこそお世話になっております。納品は金曜日でお願いしていましたが。\nB：はい。ただ、あいにく金曜日はトラックが足りません。\nA：では、木曜日に変更できますか。\nB：木曜日の午前中でしたら、お届けできます。","options":["土曜日","水曜日","木曜日","金曜日"],"answer":2,"answer_text":"木曜日"},{"id":"Q0383","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，Aは何時ごろ会場に届けるよう頼みましたか。","audio_text":"A：助かります。午前十時ごろに会場へお願いします。\nB：承知しました。念のため、前日にご連絡いたします。","options":["午後3時ごろ","午前8時ごろ","午後1時ごろ","午前10時ごろ"],"answer":3,"answer_text":"午前10時ごろ"},{"id":"Q0384","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，手伝いはいつになりましたか。","audio_text":"B：あ、ごめん。土曜日は昼から歯医者だった。日曜日でもいい？\nA：日曜日は大家さんが来るから、午後は無理なんだ。\nB：じゃあ、土曜日の夕方ならどう？　歯医者が終わってから行くよ。\nA：助かる。六時ごろでいい？\nB：うん。軽トラックは借りたの？","options":["日曜日の午後","土曜日の午前9時","日曜日の朝","土曜日の夕方6時ごろ"],"answer":3,"answer_text":"土曜日の夕方6時ごろ"},{"id":"Q0385","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，最初に持ってきた書類は何でしたか。","audio_text":"A：すみません、引っ越しの届けを出したいのですが。\nB：はい。新しい住所が分かる書類はお持ちですか。\nA：住民票の写しを持ってきました。\nB：ありがとうございます。あ、こちらは古い住所のものですね。","options":["印鑑","運転免許証","古い住所の住民票の写し","新しい住所の住民票の写し"],"answer":2,"answer_text":"古い住所の住民票の写し"},{"id":"Q0386","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，今回必要ないものは何ですか。","audio_text":"A：はい。あのう、印鑑は必要ですか。\nB：今回は必要ありません。署名で大丈夫です。","options":["本人確認書類","新しい住所が分かる書類","印鑑","署名"],"answer":2,"answer_text":"印鑑"},{"id":"Q0387","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，最終的に資料は何部になりますか。","audio_text":"A：山田さん、明日の説明会の資料、何部コピーした？\nB：十部です。出席者は八人と聞いていたので。\nA：あ、それが、今日になって二人増えたんだ。\nB：じゃあ、十二部ですね。すぐに二部追加します。","options":["10部","12部","15部","8部"],"answer":1,"answer_text":"12部"},{"id":"Q0388","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，バスはどこに着きますか。","audio_text":"A：すみません、このバスは市民病院まで行きますか。\nB：はい、行きます。ですが、今日は工事で、病院の前ではなく、西門に到着します。","options":["西門","駅前","病院の前","公園前"],"answer":0,"answer_text":"西門"},{"id":"Q0389","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，薬は1日何回飲みますか。","audio_text":"A：風邪ですね。お薬を処方します。一日二回、朝と晩に飲んでください。\nB：一日二回ですね。\nA：あ、すみません。この薬は一日三回です。昼にも飲んでください。","options":["2回","4回","3回","1回"],"answer":2,"answer_text":"3回"},{"id":"Q0390","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，薬は何日分出ますか。","audio_text":"A：はい、食べた後でお願いします。三日分出します。","options":["5日分","2日分","1週間分","3日分"],"answer":3,"answer_text":"3日分"},{"id":"Q0391","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，来月から共益費はいくらになりますか。","audio_text":"A：来月から、この建物の共益費が上がります。\nB：えっ、いくらになりますか。\nA：今まで五千円でしたが、来月から六千円になります。","options":["3000円","5000円","8000円","6000円"],"answer":3,"answer_text":"6000円"},{"id":"Q0392","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，面接の会場はどこですか。","audio_text":"A：李さんですね。面接は来週の火曜日の午後二時からです。\nB：火曜日ですね。会場は本社ですか。\nA：あ、申し訳ありません。本社ではなく、駅前の支社です。","options":["空港","駅前の支社","本社","工場"],"answer":1,"answer_text":"駅前の支社"},{"id":"Q0393","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，今日は何時までチェックアウトできますか。","audio_text":"B：三〇五号室ですね。通常のチェックアウトは十時ですが、今日は十一時まで大丈夫です。","options":["9時半","11時","10時","12時"],"answer":1,"answer_text":"11時"},{"id":"Q0394","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，この本は何日遅れていますか。","audio_text":"B：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。","options":["3日","7日","5日","2日"],"answer":2,"answer_text":"5日"},{"id":"Q0395","type":"mcq","prompt":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，何で大阪へ行きますか。","audio_text":"A：来週の大阪出張、新幹線で行くよね。\nB：それが、部長から飛行機にしろと言われたんだ。","options":["新幹線","飛行機","車","バス"],"answer":1,"answer_text":"飛行機"},{"id":"Q0243","type":"listen","prompt":"会話を聞いて、二人の関係を答えてください。","prompt_zh":"说话的两人是什么关系？","audio_text":"田中さん、明日の会議の資料はもうできていますか。はい、部長。夕方までに用意して、メールでお送りします。ありがとう。実は取引先が急に来ることになったので、資料を一枚増やしていただけませんか。分かりました。追加します。","options":["医者と患者","兄弟","部長と部下","店員と客"],"answer":2,"answer_text":"部長と部下"},{"id":"Q0244","type":"listen","prompt":"会話を聞いて、入院している人と看病している人の組み合わせを選んでください。","prompt_zh":"住院的是谁、谁在护理？","audio_text":"お母さん、具合はどう？だいぶ良くなったわ。でも、まだ一人で歩くのは危ないの。じゃあ、今日も私が病院に泊まって看病するね。明日、父が来るって連絡があったよ。ありがとう。安心したわ。","options":["母が入院していて、娘が看病している","父が入院していて、母が看病している","母が入院していて、父が看病している","娘が入院していて、母が看病している"],"answer":0,"answer_text":"母が入院していて、娘が看病している"},{"id":"Q0245","type":"listen","prompt":"駅の放送を聞いて、電車が止まっている原因を答えてください。","prompt_zh":"列车停靠（晚点）的原因是什么？","audio_text":"お客様にお知らせします。先ほど、隣の駅で人身事故があったため、この電車は現在、駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。","options":["天気","渋滞","故障","事故"],"answer":3,"answer_text":"事故"},{"id":"Q0246","type":"listen","prompt":"電話を聞いて、客が希望している部屋を選んでください。","prompt_zh":"客人希望要什么样的房间？","audio_text":"はい、さくらホテルでございます。明日の夜、部屋を予約したいのですが。かしこまりました。何名様で、何泊でしょうか。二人で一泊です。できれば駅が見える部屋をお願いします。少々お待ちください。確認いたします。","options":["駅が見える部屋","二つ並んだ部屋","安い部屋","禁煙の部屋"],"answer":0,"answer_text":"駅が見える部屋"},{"id":"Q0248","type":"listen","prompt":"会話を聞いて、李さんの今の気持ちを選んでください。","prompt_zh":"小李现在的心情是哪一种？","audio_text":"李さん、就職活動はどう？先週、ある会社の面接を受けたんです。結果はまだですか。ええ、来週までに連絡が来るはずですが、まだなので少し不安です。きっと大丈夫ですよ。しっかり準備していましたから。","options":["満足","嬉しい","不安","残念"],"answer":2,"answer_text":"不安"},{"id":"Q0249","type":"listen","prompt":"窓口の会話を聞いて、利用者がしなければならないことを選んでください。","prompt_zh":"办事人必须做的是什么？","audio_text":"すみません、在留カードの更新の手続きをしたいのですが。はい。まず、この申請書にご記入ください。写真が一枚必要です。写真は持ってきました。ここで撮らなければなりませんか。いいえ、お持ちいただければ結構ですよ。","options":["次の日また来る","申請書に記入する","カードを返す","写真を撮る"],"answer":1,"answer_text":"申請書に記入する"},{"id":"Q0250","type":"listen","prompt":"サポート電話を聞いて、パソコンに起きている問題を選んでください。","prompt_zh":"电脑出了什么问题？","audio_text":"お客様サポートセンターです。パソコンの調子がおかしいんです。朝から急に画面が消えて、何度操作しても動きません。それでは、一度電源を切って、十分ほど待ってから入れ直していただけますか。分かりました。やってみます。","options":["操作が難しいだけ","画面が汚れている","電源を入れ忘れた","故障して動かない"],"answer":3,"answer_text":"故障して動かない"},{"id":"Q0251","type":"listen","prompt":"会話を聞いて、薬を飲んだあとどうなったか選んでください。","prompt_zh":"喝药之后结果如何？","audio_text":"顔色が悪いですよ。昨日から頭が痛くて、あまり眠れなかったんです。それは心配ですね。薬は飲みましたか。はい、でも、かえって気分が悪くなって…。そうですか。じゃあ、今日は無理をせず、ゆっくり休んだほうがいいですよ。","options":["かえって気分が悪くなった","すっかり元気になった","頭痛だけ治った","眠れるようになった"],"answer":0,"answer_text":"かえって気分が悪くなった"},{"id":"Q0252","type":"listen","prompt":"会話を聞いて、新しい企画が今日どうなったか選んでください。","prompt_zh":"新提案今天结果如何？","audio_text":"佐藤さん、さっきの会議、部長は何とおっしゃっていましたか。新しい企画については、一度持ち帰って検討するようにと。ということは、今日は決まらないんですね。ええ、来週もう一度相談しましょう。","options":["採用が決まった","まだ決まっていない","部長が反対した","中止になった"],"answer":1,"answer_text":"まだ決まっていない"}]}]}</script>
<script>
(function () {
  'use strict';
  var data = {};
  try { data = JSON.parse(document.getElementById('mock-data').textContent); } catch (e) { data = {}; }
  var sections = data.sections || [];
  var wrap = document.getElementById('mock-sections');
  var resultBox = document.getElementById('mock-result');
  var timers = {};
  var finished = {};
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function norm(v) {
    var s = String(v == null ? '' : v);
    if (s.normalize) s = s.normalize('NFKC');
    s = s.replace(/\s+/g, '').replace(/，/g, ',');
    return s.replace(/[。．.！!？?]+$/g, '');
  }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function startTimer(secId) {
    var sec = null;
    for (var i = 0; i < sections.length; i++) if (String(sections[i].id) === String(secId)) sec = sections[i];
    if (!sec || timers[secId]) return;
    var left = Math.max(0, Number(sec.minutes || 0) * 60);
    var node = document.querySelector('[data-timer="' + secId + '"]');
    function tick() {
      if (node) node.textContent = fmt(left);
      if (left <= 0) {
        clearInterval(timers[secId]); timers[secId] = null;
        finished[secId] = true;
        if (node) node.textContent = '时间到（已锁定）';
        var sb = document.querySelector('[data-sec="' + secId + '"]');
        if (sb) {
          var ins = sb.querySelectorAll('input');
          for (var k = 0; k < ins.length; k++) ins[k].disabled = true;
          var lock = el('div', 'mock-note', '本项时间到，答案已锁定；可继续其他分项。');
          sb.appendChild(lock);
        }
        return;
      }
      left -= 1;
    }
    tick();
    timers[secId] = setInterval(tick, 1000);
  }
  sections.forEach(function (sec) {
    var box = el('section', 'mock-sec');
    box.setAttribute('data-sec', String(sec.id));
    var head = el('div', 'mock-head');
    head.appendChild(el('span', 'mock-name', sec.name || '分项'));
    head.appendChild(el('span', 'mock-note',
      '满分 ' + (sec.max_score || 0) + ' · 限时 ' + (sec.minutes || 0) + ' 分钟'));
    var timer = el('span', 'mock-timer', fmt(Number(sec.minutes || 0) * 60));
    timer.setAttribute('data-timer', String(sec.id));
    head.appendChild(timer);
    var start = el('button', 'btn btn-mini', '开始本项');
    start.type = 'button';
    start.addEventListener('click', function () { start.added = true; start.disabled = true; startTimer(sec.id); });
    head.appendChild(start);
    box.appendChild(head);
    (sec.questions || []).forEach(function (q, qi) {
      var qb = el('div', 'mock-q');
      qb.appendChild(el('div', 'mock-prompt', (qi + 1) + '. ' + (q.prompt || '')));
      if (q.audio_text) {
        var play = el('button', 'btn btn-mini', '听题目（TTS）');
        play.type = 'button';
        play.addEventListener('click', function () {
          if (!window.speechSynthesis) { play.textContent = '此浏览器不支持朗读'; return; }
          var u = new SpeechSynthesisUtterance(q.audio_text);
          u.lang = 'ja-JP'; u.rate = 0.95;
          window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
        });
        qb.appendChild(play);
      }
      var opts = el('div', 'mock-opts');
      (q.options || []).forEach(function (o, oi) {
        var lab = el('label', 'mock-opt');
        var input = document.createElement('input');
        input.type = 'radio'; input.name = 'q-' + sec.id + '-' + q.id + '-' + qi;
        input.value = String(oi);
        lab.appendChild(input);
        lab.appendChild(el('span', '', o));
        opts.appendChild(lab);
      });
      if (!(q.options || []).length) {
        var ti = document.createElement('input');
        ti.type = 'text';
        ti.className = 'mock-text';
        ti.name = 'q-' + sec.id + '-' + q.id + '-' + qi;
        ti.placeholder = '在此输入答案';
        ti.style.cssText = 'width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)';
        opts.appendChild(ti);
      }
      qb.appendChild(opts);
      box.appendChild(qb);
    });
    wrap.appendChild(box);
  });
  document.getElementById('mock-submit').addEventListener('click', function () {
    var total = 0, rows = [];
    sections.forEach(function (sec) {
      var qs = sec.questions || [];
      var right = 0;
      qs.forEach(function (q, qi) {
        var name = 'q-' + sec.id + '-' + q.id + '-' + qi;
        var field = document.querySelector('[name="' + name + '"]');
        if (field && field.type === 'text') {
          if (norm(field.value) === norm(q.answer_text)) right += 1;
        } else {
          var picked = document.querySelector('input[name="' + name + '"]:checked');
          if (picked && Number(picked.value) === Number(q.answer)) right += 1;
        }
      });
      var score = qs.length ? Math.round(Number(sec.max_score || 0) * right / qs.length) : 0;
      total += score;
      rows.push({ name: sec.name || '分项', score: score, max: Number(sec.max_score || 0),
                  pass_min: Number(sec.pass_min || 19), right: right, total: qs.length });
    });
    var ok = total >= Number(data.pass_total || 95) && rows.every(function (r) {
      return r.score >= Number(r.pass_min || data.pass_section || 19);
    });
    resultBox.innerHTML = '';
    var box = el('div', 'mock-result');
    box.appendChild(el('div', 'mock-name', '模拟估分：' + total + ' / ' +
      rows.reduce(function (a, r) { return a + r.max; }, 0) + ' · ' + (ok ? '达到模拟合格线' : '未达到模拟合格线')));
    rows.forEach(function (r) {
      box.appendChild(el('div', 'mock-note',
        r.name + '：' + r.score + ' / ' + r.max + '（答对 ' + r.right + ' / ' + r.total + '）'));
    });
    box.appendChild(el('div', 'mock-note',
      '判定口径：总分 ≥ ' + (data.pass_total || 95) + ' 且每项 ≥ ' + (data.pass_section || 19) +
      '。这是模拟估分，不是 JLPT 官方判定。'));
    resultBox.appendChild(box);
  });
})();
</script>
</body>
