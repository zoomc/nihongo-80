。","why":"想说「不能不休息」应用 わけにはいかない；わけがない 是「不可能休息」，中文「不能」直译混淆两形","fix":"病気だから、休まないわけにはいきません。","learner":"zh"}],"compare":[{"id":"G0053","diff":"わけではない 是「并非…」部分否定；わけがない 是「绝不可能」全盘否定"},{"id":"G0070","diff":"に違いない 肯定推断；わけがない 否定推断，二者反向"}],"examples":[{"ja":"彼がそんなことを言うわけがありません。","zh":"他不可能说那种话。","audio_text":"彼がそんなことを言うわけがありません。"},{"ja":"明日試験があるので、遊びに行くわけにはいきません。","zh":"明天有考试，不能去玩。","audio_text":"明日試験があるので、遊びに行くわけにはいきません。"}],"ko":"-(으)ㄹ 리가 없다 / -(으)ㄹ 수가 없다·-(으)ㄹ 수 없다","ko_hint":"『不可能…』≒ -(으)ㄹ 리가 없다、『不能/不好…』≒ -(으)ㄹ 수 없다，可对照。","caution":"わけがない 是不可能（推断）、わけにはいかない 是不能做（情理上不允许），意思差很大，韩语 리가 없다/수 없다 也分，但别把两条都翻成一个；わけ 的本义（道理/结论）韩语没有对等词。"},{"id":"G0072","pattern":"普通形 + と は 限らない","meaning_zh":"未必…；不一定…；不见得…","connection":"動詞・い形 普通形 / 名詞・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应","example":"高いものが必ずしも良いとは限りません。","usage":"否定「一概如此」，修正以偏概全；礼貌体 とは 限りません","explanation_zh":"意思是「未必…；不一定…；不见得…」；接续：動詞・い形 普通形 / 名詞・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应（中文术语：动词・い形 简体 / 名词・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应）；用法：否定「一概如此」，修正以偏概全；礼貌体 とは 限りません","common_errors":[{"wrong":"安いとは限らないです。","why":"「限らない」已含否定，不加 です；礼貌用 限りません；中文「不一定」直译加 です 错","fix":"安いとは限りません。","learner":"zh"},{"wrong":"学生だとは限りません。","why":"名词/な形 接 とは限らない 通常去掉 だ（学生とは限りません）；中文直译保留 だ 错","fix":"学生とは限りません。","learner":"zh"}],"compare":[{"id":"G0053","diff":"わけではない 否定某个具体命题「并非…」；とは限らない 否定「总是如此」的普遍化"},{"id":"G0071","diff":"わけがない 是「绝无可能」；とは限らない 是「不一定」，留有余地"}],"examples":[{"ja":"高いものが必ずしも良いとは限りません。","zh":"贵的东西未必就好。","audio_text":"高いものが必ずしも良いとは限りません。"},{"ja":"先生だからといって、何でも知っているとは限りません。","zh":"虽说是老师，也未必什么都懂。","audio_text":"先生だからといって、何でも知っているとは限りません。"}],"ko":"반드시 -는 것은 아니다 / -(으)란 법은 없다","ko_hint":"『未必…／不一定…』≒ 반드시 -는 것은 아니다，部分否定可对照。","caution":"とは 限らない 的 と 是引用、は 是提示，韩语 -는 것은 아니다/-란 법은 없다 结构不同源；它否定的是必然而非全部，别和 わけではない（G0053 部分否定）混，两者韩语都可能翻 -는 것은 아니다，要靠日语区分。"}],"kanji":[{"id":"K0132","char":"記","onyomi":["キ"],"kunyomi":["しるす"],"meaning_zh":"记；记载；报道；记号","zh_trap":"中文「记」jì；日语 記 音读 キ（記事 きじ、日記 にっき）、训读 しるす（記す）；「記事」是「报道/条目」，≠中文「记事」（记录事情），简体「记」与「記」不同。","vocab_refs":["V0260"],"examples":[{"ja":"記事","kana":"きじ","zh":"报道；文章；条目"}],"ko_hint":"韩语汉字词可参考：기사。日韩汉字词形近（きじ／기사＝报道/文章条目）。"},{"id":"K0135","char":"由","onyomi":["ユ","ユウ"],"kunyomi":["よし"],"meaning_zh":"由；理由；经由；缘由","zh_trap":"中文「由」yóu；日语 由 音读 ユ（経由 けいゆ）/ユウ（理由 りゆう）/ユイ，训读 よし（古语，现代罕用）；「理由」是「理由」。【疑点】ユ/ユウ/ユイ 三读随词分布、训读 よし 是否列常用建议二次核实，故标 needs_review；不可按中文 yóu 类推成单一读音。","vocab_refs":["V0206"],"examples":[{"ja":"理由","kana":"りゆう","zh":"理由；缘由"}],"ko_hint":"韩语汉字词可参考：이유。日韩汉字词同形同义（りゆう／이유＝理由）。"}],"questions":[{"id":"Q0228","type":"mcq","prompt_ja":"新聞の ___ に、事故の原因が書いてありました。","prompt_zh":"选出表示『报上报道』的词","options":["意味","機会","目的","記事"],"answer":"記事","rationale":"日语「記事（きじ）」是『报道/文章』，「新聞の記事」＝报上的报道；中文『记事』是『记录事情』，不能按汉字猜。「書いてありました」正是 G0056 てある。","audio_text":"","rubric":"选 記事 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0231","type":"fill","prompt_ja":"約束の時間に遅れてすみません。実は、電車が ___ んです。","prompt_zh":"填入「んです」前的普通形","options":[],"answer":"遅れた","rationale":"「んです」用于说明原因/强调，前接普通形（G0059）；「遅れる」た形「遅れた」＋「んです」。中文母语者常误用「でした」或加「だ」。","audio_text":"","rubric":"填 遅れた 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0235","type":"fill","prompt_ja":"日本語の勉強のために、毎朝新聞の記事を ___ ようにしています。","prompt_zh":"填入「〜ように する」前的动词形","options":[],"answer":"読む","rationale":"「V辞書形＋ように する」＝有意识地努力做到…（G0064）；此处用辞书形「読む」，不用 た形/ない形。中文『坚持读』直译易误用「読んでいます」。","audio_text":"","rubric":"填 読む 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0241","type":"fill","prompt_ja":"日本の大学に進学する ___ 、日本語を勉強しています。","prompt_zh":"填入表示『为了（目的）』的表达","options":[],"answer":"ために","rationale":"「V辞書形＋ため(に)」＝为了…（目的，前项为意志动词，G0074）；原因用法的「ため(に)」前多接 た形/ている/ない形。中文『为了』直译易混。","audio_text":"","rubric":"填 ために 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0256","type":"read","prompt_ja":"【お知らせ】来月から、資源ごみの出し方が変わります。これまで毎週水曜日でしたが、来月からは毎週金曜日の朝八時までに出してください。集める曜日が変わるだけで、出す場所や分け方は今までと同じです。ご協力をお願いします。／市役所 環境課","prompt_zh":"这则通知里，变更的是什么？","options":["ごみの分け方","集める回数","出す場所","出す曜日"],"answer":"出す曜日","rationale":"文中明写「水曜日→金曜日」「曜日が変わるだけで、場所や分け方は今までと同じ」。时间是「朝八時までに」，场所、分け方、回数均未变。","audio_text":"","rubric":"选 出す曜日 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0268","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べ、遅刻の理由を説明する文にしてください。","prompt_zh":"排列成句：说明迟到理由（用「んです」）","options":["遅れた","電車が","んです","実は"],"answer":"4,2,1,3","rationale":"「実は」置于句首，主语「電車が」→「遅れた」普通形→「んです」句末说明语气（G0059）。","audio_text":"","rubric":"编号序列为 4,2,1,3 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0323","type":"dialogue","prompt_ja":"友達：昨日の飲み会、来なかったね。どうしたの？／あなた：（　）","prompt_zh":"用「〜んです」说明缺席的原因（如加班、电车晚点）。","options":[],"answer":"","rationale":"「普通形＋んです」（G0059）用于说明原因；用具体 N3/N4 词（残業 V0245／遅れる V0165）；不是单纯「〜でした」，可加「実は」「ごめんなさい」。","audio_text":"","rubric":"①普通形＋んです说明语气 1 分；②用具体新词（残業/遅れる）1 分；③不是单纯〜でした、语气自然 1 分","expected_production":"実は、昨日は残業があったんです。ごめんなさい。","difficulty":4},{"id":"Q0344","type":"mcq","prompt_ja":"「症状」の意味として最も近いものを選んでください。","prompt_zh":"【言語知識】选出「症状」最接近的中文意思。","options":["症状","处方","治疗","诊断"],"answer":"症状","rationale":"「症状」是病情表现；「診断」是诊断结论，「処方」是开处方，「治療」是治疗。","audio_text":"","rubric":"选 症状 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0028","kind":"listening","title":"弟の希望","text_ja":"弟は家族と旅行に行きたがっています。しかし、雨が降るかもしれません。","text_kana":"","text_zh":"弟弟想去和家人旅行。不过也许会下雨。","focus_zh":"「行きたがっています」用「たがる」表弟弟（第三人称）想去，说自己想要只能用「たい」；「降るかもしれません」是也许会下的低把握推测。","audio_text":"弟は家族と旅行に行きたがっています。しかし、雨が降るかもしれません。","url":"","license":"original"},{"id":"M0079","kind":"reading","title":"干し柿の輸出開始","text_ja":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。地元の農家が作る干し柿は、甘くて柔らかいのが特徴で、以前から観光客に人気がありました。輸出を始めるにあたり、農家では、衛生管理の基準を満たすための設備を新しく作りました。町は、海外での販売を支援するため、現地のバイヤーとの話し合いの場を設ける予定です。生産量には限りがありますが、まずは少ない量から始め、味を確かめてもらう方針です。","text_kana":"このまちのとくさんひんであるほしがきが、らいげつからとうなんアジアへゆしゅつされることになりました。じもとののうかがつくるほしがきは、あまくてやわらかいのがとくちょうで、いぜんからかんこうきゃくににんきがありました。ゆしゅつをはじめるにあたり、のうかでは、えいせいかんりのきじゅんをみたすためのせつびをあたらしくつくりました。まちは、かいがいでのはんばいをしえんするため、げんちのバイヤーとはなしあいのばをもうけるよていです。せいさんりょうにはかぎりがありますが、まずはすくないりょうからはじめ、あじをたしかめてもらうほうしんです。","text_zh":"
