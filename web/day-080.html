ifficulty":4},{"id":"Q0377","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，この部屋の敷金はいくらですか。","options":["礼金1か月分","5000円","家賃1か月分","家賃2か月分"],"answer":"家賃1か月分","rationale":"B 先说两个月，马上更正「この部屋は一か月分でした」。最终是一个月房租；5000日元是共益费。","audio_text":"A：この部屋を借りたいのですが、敷金はいくらですか。\nB：敷金は家賃の二か月分です。\nA：二か月分ですか。少し高いですね。\nB：あ、失礼しました。この部屋は一か月分でした。","rubric":"选 家賃1か月分 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0378","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，水道代はどうなりますか。","options":["敷金から払う","共益費に含まれる","礼金に含まれる","共益費に含まれず、別に払う"],"answer":"共益費に含まれず、別に払う","rationale":"B 明确「水道代は別です」；共益費は毎月五千円かかるが、水道代・電気代・ガス代は別に払う。","audio_text":"A：一か月分なら、助かります。礼金はかかりますか。\nB：礼金はかかりません。その代わり、共益費が毎月五千円かかります。\nA：共益費に水道代は含まれますか。\nB：いいえ、水道代は別です。電気代とガス代も自分で払ってください。","rubric":"选 共益費に含まれず、別に払う 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0391","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，来月から共益費はいくらになりますか。","options":["3000円","5000円","8000円","6000円"],"answer":"6000円","rationale":"A 说「今まで五千円でしたが、来月から六千円になります」。5000是旧价，3000是停车费。","audio_text":"A：来月から、この建物の共益費が上がります。\nB：えっ、いくらになりますか。\nA：今まで五千円でしたが、来月から六千円になります。","rubric":"选 6000円 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0218","type":"mcq","prompt_ja":"コーヒーにしますか、___ 紅茶にしますか。","prompt_zh":"选出用于二者选一的接续词","options":["そのため","そのうえ","それとも","それでも"],"answer":"それとも","rationale":"「A か、それとも B か」表『还是/或者』的选择疑问；「そのうえ」累加、「それでも」转折、「そのため」因果，都不能连接两个选项。","audio_text":"","rubric":"选 それとも 得 1 分，其余 0 分","expected_production":"","difficulty":3},{"id":"Q0247","type":"listen","prompt_ja":"天気予報を聞いて、明日の午後の天気を選んでください。","prompt_zh":"预报说明天下午天气如何？","options":["雪が降る","曇ったまま","雨が降る","晴れ続く"],"answer":"雨が降る","rationale":"「午後から雨が降り」正对应下午。上午晴、夜里转冷且风大，是按时间段给的信息，不能互相错位。","audio_text":"明日の天気予報です。午前中は晴れますが、午後から雨が降り、夜にはかなり冷え込むでしょう。風も強くなる見込みです。外出の際は、傘と上着をお持ちください。","rubric":"选 雨が降る 得 1 分，其余 0 分","expected_production":"","difficulty":3},{"id":"Q0145","type":"mcq","prompt_ja":"空が暗いです。雨が___そうです。","prompt_zh":"选出样态 そう 的正确接续","options":["降って","降る","降った","降り"],"answer":"降り","rationale":"样态 そう 接ます形词干（降り）；传闻才接普通形","audio_text":"雨が降りそうです。","rubric":"选 降り 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0075","kind":"reading","title":"家賃と共益費の説明","text_ja":"この部屋の家賃は月六万円ですが、別に共益費が五千円かかります。共益費には、建物の掃除や、エレベーターの点検の費用が含まれています。水道代は共益費に含まれますが、電気代とガス代は自分で払う必要があります。契約のときは、家賃一か月分の敷金と、一か月分の礼金をお預かりします。敷金は、退去するときに、部屋の修理が必要なければ全額返します。ペットを飼う場合は、事前に相談してください。無断で飼うと、契約を解除することがあります。","text_kana":"このへやのやちんはつきろくまんえんですが、べつにきょうえきひがごせんえんかかります。きょうえきひには、たてもののそうじや、エレベーターのてんけんのひようがふくまれています。すいどうだいはきょうえきひにふくまれますが、でんきだいとガスだいはじぶんではらうひつようがあります。けいやくのときは、やちんいっかげつぶんのしききんと、いっかげつぶんのれいきんをおあずかりします。しききんは、たいきょするときに、へやのしゅうりがひつようなければぜんがくかえします。ペットをかうばあいは、じぜんにそうだんしてください。むだんではかうと、けいやくをかいじょすることがあります。","text_zh":"这个房间房租每月六万日元，另外需五千日元公共区域费。公共区域费包含楼内清扫和电梯检查费用。水费包含在公共区域费里，但电费和燃气费需自己支付。签约时收取一个月房租的押金和一个月房租的礼金。押金在搬出时，如无需修房则全额退还。养宠物时请事先商量。擅自饲养可能被解除合同。","focus_zh":"「別に」=另外；「共益費に含まれる」与「自分で払う」要区分；「全額返します」有条件「修理が必要なければ」；「無断で」=擅自。","audio_text":"この部屋の家賃は月六万円ですが、別に共益費が五千円かかります。共益費には、建物の掃除や、エレベーターの点検の費用が含まれています。水道代は共益費に含まれますが、電気代とガス代は自分で払う必要があります。契約のときは、家賃一か月分の敷金と、一か月分の礼金をお預かりします。敷金は、退去するときに、部屋の修理が必要なければ全額返します。ペットを飼う場合は、事前に相談してください。無断で飼うと、契約を解除することがあります。","url":"","license":"original"},{"id":"M0091","kind":"listening","title":"大家と店子：共益費の値上げ","text_ja":"A：来月から、この建物の共益費が上がります。\nB：えっ、いくらになりますか。\nA：今まで五千円でしたが、来月から六千円になります。\nB：水道代は共益費に含まれますか。\nA：はい、水道代は含まれます。電気代とガス代は別です。\nB：わかりました。あのう、駐車場は使えますか。\nA：一台だけなら使えますが、月に三千円かかります。\nB：じゃあ、来月からお願いします。\nA：はい。来週、契約書をお持ちします。","text_kana":"A：らいげつから、このたてもののきょうえきひがあがります。\nB：えっ、いくらになりますか。\nA：いままでごせんでしたが、らいげつからろくせんえんになります。\nB：すいどうだいはきょうえきひにふくまれますか。\nA：はい、すいどうだいはふくまれます。でんきだいとガスだいはべつです。\nB：わかりました。あのう、ちゅうしゃじょうはつかえますか。\nA：いちだいだけならつかえますが、つきにさんぜんえんかかります。\nB：じゃあ、らいげつからおねがいします。\nA：はい。らいしゅう、けいやくしょをおもちします。","text_zh":"A：从下个月起，这栋楼的公共区域费要涨。\nB：诶，会变成多少？\nA：以前是五千，下个月起变六千。\nB：水费包含在公共区域费里吗？\nA：是的，水费包含。电费和燃气费另算。\nB：明白了。那个，能用停车场吗？\nA：一台的话可以用，但每月三千日元。\nB：那从下个月起拜托了。\nA：好的。下周带合同书来。","focus_zh":"人物关系是房东与租客。信息干扰：共益费从五千涨到六千；水道费包含在内，电费燃气费另付；停车每月三千。","audio_text":"A：来月から、この建物の共益費が上がります。\nB：えっ、いくらになりますか。\nA：今まで五千円でしたが、来月から六千円になります。\nB：水道代は共益費に含まれますか。\nA：はい、水道代は含まれます。電気代とガス代は別です。\nB：わかりました。あのう、駐車場は使えますか。\nA：一台だけなら使えますが、月に三千円かかります。\nB：じゃあ、来月からお願いします。\nA：はい。来週、契約書をお持ちします。","url":"","license":"original"}],"viz":{"day":80,"phase":"P6","new_count":0,"review_count":12,"question_count":8},"assessment":"final","lesson_core":[{"ja":"この部屋の家賃は月六万円ですが、別に共益費が五千円かかります。","kana":"このへやのやちんはつきろくまんえんですが、べつにきょうえきひがごせんえんかかります。","zh":"这个房间房租每月六万日元，另外需五千日元公共区域费。","note_zh":"「別に」=另外；「共益費に含まれる」与「自分で払う」要区分；「全額返します」有条件「修理が必要なければ」；「無断で」=擅自。","audio_text":"この部屋の家賃は月六万円ですが、別に共益費が五千円かかります。","origin":"material","source_id":"M0075"},{"ja":"共益費には、建物の掃除や、エレベーターの点検の費用が含まれています。","kana":"きょうえきひには、たてもののそうじや、エレベーターのてんけんのひようがふくまれています。","zh":"公共区域费包含楼内清扫和电梯检查费用。","note_zh":"「別に」=另外；「共益費に含まれる」与「自分で払う」要区分；「全額返します」有条件「修理が必要なければ」；「無断で」=擅自。","audio_text":"共益費には、建物の掃除や、エレベーターの点検の費用が含まれています。","origin":"material","source_id":"M0075"},{"ja":"水道代は共益費に含まれますが、電気代とガス代は自分で払う必要があります。","kana":"すいどうだいはきょうえきひにふくまれますが、でんきだいとガスだいはじぶんではらうひつようがあります。","zh":"水费包含在公共区域费里，但电费和燃气费需自己支付。","note_zh":"「別に」=另外；「共益費に含まれる」与「自分で払う」要区分；「全額返します」有条件「修理が必要なければ」；「無断で」=擅自。","audio_text":"水道代は共益費に含まれますが、電気代とガス代は自分で払う必要があります。","origin":"material","source_id":"M0075"}],"review_plan":[{"kid":"V0253","surface":"故障","kana":"こしょう","zh":"故障；出毛病","reason_zh":"这是预习建议（非 FSRS 到期项）：30 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":50,"next_hint_zh":"按课程间隔，大约 Day 110 再预习","planned_only":true},{"kid":"V0256","surface":"事故","kana":"じこ","zh":"事故；意外事件","reason_zh":"这是预习建议（非 FSRS 到期项）：30 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":50,"next_hint_zh":"按课程间隔，大约 Day 110 再预习","planned_only":true},{"kid":"V0210","surface":"機会","kana":"きかい","zh":"机会","reason_zh":"这是预习建议（非 FSRS 到期项）：30 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":50,"next_hint_zh":"按课程间隔，大约 Day 110 再预习","planned_only":true},{"kid":"V0254","surface":"操作","kana":"そうさ","zh":"操作（机器/界面）","reason_zh":"这是预习建议（非 FSRS 到
