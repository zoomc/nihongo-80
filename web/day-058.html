":"选出最贴切的副词（本想变好却相反）","options":["かえって","むしろ","せっかく","わざわざ"],"answer":"かえって","rationale":"「かえって」表『反倒、反而』，接与预期相反的结果；「むしろ」是比较后『宁可/倒不如』的取舍，不接这种反预期变化。「せっかく」「わざわざ」语义不通。","audio_text":"","rubric":"选 かえって 得 1 分，其余 0 分","difficulty":4},{"id":"Q0251","type":"listen","prompt_ja":"会話を聞いて、薬を飲んだあとどうなったか選んでください。","prompt_zh":"喝药之后结果如何？","options":["かえって気分が悪くなった","すっかり元気になった","頭痛だけ治った","眠れるようになった"],"answer":"かえって気分が悪くなった","rationale":"「かえって気分が悪くなって」＝与『本应变好』的预期相反、反倒变差，正是 V0198 的含义。医生因此建议「ゆっくり休んだほうがいい」。","audio_text":"顔色が悪いですよ。昨日から頭が痛くて、あまり眠れなかったんです。それは心配ですね。薬は飲みましたか。はい、でも、かえって気分が悪くなって…。そうですか。じゃあ、今日は無理をせず、ゆっくり休んだほうがいいですよ。","rubric":"选 かえって気分が悪くなった 得 1 分，其余 0 分","difficulty":4},{"id":"Q0275","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：随着说话机会增多，日语变好了（用「につれて」）","options":["日本語が","につれて","上手になりました","話す機会が増える"],"answer":"4,2,1,3","rationale":"「V辞書形＋につれて（随着…，G0077）」前项变化→后项变化（〜くなりました，G0035）。「増える」用辞书形，不用 た形。","audio_text":"","rubric":"编号序列为 4,2,1,3 得 1 分，其余 0 分","difficulty":5},{"id":"Q0289","type":"error_correct","prompt_ja":"重い荷物を、大丈夫な人に運んでもらいました。","prompt_zh":"改正「大丈夫／丈夫」的同形异义误用","options":[],"answer":"重い荷物を、丈夫な人に運んでもらいました。","rationale":"日语「大丈夫（だいじょうぶ）」＝没问题/不要紧，不能当形容词修饰『健壮的人』；「丈夫（じょうぶ）」＝结实、健壮。中文『丈夫』＝配偶、『大丈夫』＝男子汉，两词都不可照搬。","audio_text":"","rubric":"改为 丈夫な人 得 1 分，其余 0 分","difficulty":5},{"id":"Q0304","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『关于这次的手续，我想向窗口咨询一下。』（用「に関して」）","options":[],"answer":"","rationale":"「N＋に関して」（G0076）是比「について」（G0055，口语）更书面的『关于』，用于正式咨询；「に対して」是对某对象采取动作/态度，不表『关于』。「相談する」「手続き」对应 V0248/V0250。","audio_text":"","rubric":"①N＋に関して书面『关于』1 分；②区分について/に対して 1 分；③相談する・手続き用词与敬体自然 1 分","difficulty":5},{"id":"Q0322","type":"dialogue","prompt_ja":"あなた：（　）／上司：はい、いいですよ。もう一度説明しましょう。","prompt_zh":"向上司请求『能否再说明一次』，用最礼貌的说法。","options":[],"answer":"","rationale":"「〜ていただけませんか／もらえませんか」（G0073）是最礼貌的请求；て形接续要正确；对上司须加「すみませんが」铺垫并用敬体。","audio_text":"","rubric":"①〜ていただけませんか/もらえませんか 1 分；②て形接续正确 1 分；③すみませんが铺垫、敬体、对上司语气 1 分","difficulty":5}],"materials":[{"id":"M0046
