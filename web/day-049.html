"名詞 + ばかりか；動詞・い形 普通形 + ばかりか；な形・名詞 + な/である + ばかりか","example":"この店は安いばかりか、味も美味しいです。","usage":"前项已成立，后项进一步追加，常与「も／まで」呼应；后项多比前项程度更高。","explanation_zh":"意思是「不仅…而且…」；接续：名詞 + ばかりか；動詞・い形 普通形 + ばかりか；な形・名詞 + な/である + ばかりか（中文术语：名词 + ばかりか；动词・い形 简体 + ばかりか；な形・名词 + な/である + ばかりか）；用法：前项已成立，后项进一步追加，常与「も／まで」呼应；后项多比前项程度更高。","common_errors":[{"wrong":"英語のばかりか、中国語も話せます。","why":"名词接 ばかりか 不加 の；中文“不仅英语”直译加 の。","fix":"英語ばかりか、中国語も話せます。","learner":"zh"},{"wrong":"この店は安いばかりかで、味もいいです。","why":"ばかりか 后不接 で；中文“不仅便宜”直译加 で。","fix":"この店は安いばかりか、味もいいです。","learner":"zh"}],"compare":[{"id":"G0080","diff":"さえ 是“连…都”，强调极端；ばかりか 是“不仅…还…”，追加。"}],"examples":[{"ja":"この店は安いばかりか、味も美味しいです。","zh":"这家店不仅便宜，味道也好。","audio_text":"この店は安いばかりか、味も美味しいです。"},{"ja":"彼は仕事ばかりか、家事もよく手伝います。","zh":"他不仅工作，还经常帮忙做家务。","audio_text":"彼は仕事ばかりか、家事もよく手伝います。"}],"ko":"","ko_hint":"","caution":""},{"id":"G0080","pattern":"N(＋助詞) + さえ／こそ／すら；V ば形 前 + さえ…ば","meaning_zh":"甚至…／只要…就／正是…／连…都","connection":"さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ）","example":"忙しくて、昼ご飯を食べる時間さえありません。","usage":"さえ 举极端例表「连…都/甚至」；さえ…ば 表「只要满足这一项就够」；こそ 强调「正是」；すら 文言、更消极","explanation_zh":"意思是「甚至…／只要…就／正是…／连…都」；接续：さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ）（中文术语：さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ））；用法：さえ 举极端例表「连…都/甚至」；さえ…ば 表「只要满足这一项就够」；こそ 强调「正是」；すら 文言、更消极","common_errors":[{"wrong":"時間さえがありません。","why":"さえ 已取代 が/を，不再叠 が；中文「连时间都没有」直译保留 が 错","fix":"時間さえありません。","learner":"zh"},{"wrong":"これさえあるなら、大丈夫です。","why":"「只要…就」固定用 さえ…ば（条件形），不用 なら；中文「只要有就行」直译错","fix":"これさえあれば、大丈夫です。","learner":"zh"},{"wrong":"こそ／さえ／すら 可任意互换","why":"【疑点】三者语感与接续不同（こそ 强调、さえ 举极端、すら 偏文言消极），本条合并讲授，建议拆分二次核实，故标 needs_review","fix":"按语境分别使用：今こそ／時間さえ／名前すら","learner":"zh"}],"compare":[{"id":"G0004","diff":"も 是普通并列/类推；さえ 是举出极端一例「连…都」，语气更强"},{"id":"G0038","diff":"条件形 单句；さえ…ば 强调「仅此一项条件即可」"}],"examples":[{"ja":"忙しくて、昼ご飯を食べる時間さえありません。","zh":"忙得连吃午饭的时间都没有。","audio_text":"忙しくて、昼ご飯を食べる時間さえありません。"},{"ja":"これさえあれば、大丈夫です。","zh":"只要有这个就没问题。","audio_text":"これさえあれば、大丈夫です。"},{"ja":"今こそ頑張るときです。","zh":"现在正是努力的时候。","audio_text":"今こそ頑張るときです。"}],"ko":"-조차 / -야말로 / -마저；-기만 하면","ko_hint":"『甚至/连…都』≒ -조차/-마저、『正是…』≒ -야말로、『只要…就』≒ -기만 하면，可分层对照。","caution":"日语 さえ/こそ/すら 是三个不同系助词，韩语 -조차/-야말로/-마저 也三个但语气与搭配不同，不一一对应；さえ…ば 的『只要』须用 -기만 하면，别按 さえ 单独翻 조차；こそ 强调正是而非其他，韩语 야말로 也有但语域不同。"}],"kanji":[{"id":"K0134","char":"味","onyomi":["ミ"],"kunyomi":["あじ"],"meaning_zh":"味；味道；意味","zh_trap":"中文「味」wèi；日语 味 音读 ミ（意味 いみ）、训读 あじ（味道）；「意味」是「意思」，与「味道」无关，中文易按「味」猜成「滋味」，典型陷阱，不能靠汉字猜。","vocab_refs":["V0205"],"examples":[{"ja":"意味","kana":"いみ","zh":"意思；含义"}],"ko_hint":"韩语汉字词可参考：의미 / 뜻。日韩都表『意思/含义』，의미 是汉字词、뜻 是固有词。"},{"id":"K0108","char":"議","onyomi":["ギ"],"kunyomi":[],"meaning_zh":"议；议论；会议","zh_trap":"中文「议」yì；日语 議 音读 ギ，「会議」かいぎ「議論」ぎろん；简体「议」与「議」字形不同，须按 ギ 验证，此字无常用训读。","vocab_refs":["V0244"],"examples":[{"ja":"会議","kana":"かいぎ","zh":"会议"}],"ko_hint":"韩语汉字词可参考：회의。日韩汉字词同形同义（かいぎ／회의＝会议）。"}],"questions":[{"id":"Q0339","type":"mcq","prompt_ja":"「取引先」の意味として最も近いものを選んでください。","prompt_zh":"【言語知識】选出「取引先」最接近的中文意思。","options":["去对方公司出差","公司内部同事","交易对象；客户公司","商品的交货地址"],"answer":"交易对象；客户公司","rationale":"「取引先」是公司间有交易关系的客户/供应商，不是出差目的地，也不是公司内部同事；「納品先」才是交货地址。","audio_text":"","rubric":"选 交易对象；客户公司 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0340","type":"mcq","prompt_ja":"見積書をメールに___しました。","prompt_zh":"【言語知識】填入表示“附在邮件里”的词。","options":["返信","転送","確認","添付"],"answer":"添付","rationale":"「添付」是把文件附在邮件/文件上；「転送」是转发，「返信」是回复，「確認」是核对，均不表示附件。","audio_text":"","rubric":"选 添付 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0151","type":"translate","prompt_ja":"中译日：看起来要下雨。","prompt_zh":"日译样态 そう","options":[],"answer":"","rationale":"降る ます形词干 降り + そうです，主体用 が","audio_text":"","rubric":"①用ます形词干 降り 得 1 分；②用 そうです 得 1 分；③主体用 が 得 1 分","expected_production":"雨が降りそうです。","difficulty":5},{"id":"Q0152","type":"free_production","prompt_ja":"请用推测表达写一句明天的天气。","prompt_zh":"自由写作","options":[],"answer":"","rationale":"考查 かもしれません/そうです 等推测形的迁移","audio_text":"","rubric":"①使用推测形得 1 分；②接续正确得 1 分；③礼貌体收尾得 1 分","expected_production":"明日は雨かもしれません。","difficulty":5},{"id":"Q0153","type":"dialogue","prompt_ja":"A 说「空が暗いですね」，请用样态回应。","prompt_zh":"天气寒暄对话","options":[],"answer":"","rationale":"考查 そう 样态在对话中的运用","audio_text":"","rubric":"①用ます形词干 + そう 得 1 分；②主体用 が 得 1 分；③礼貌体 です 得 1 分","expected_production":"雨が降りそうです。","difficulty":5},{"id":"Q0154","type":"mcq","prompt_ja":"宿題を___なりません。","prompt_zh":"选出义务形的正确接续","options":["しなければ","しないば","しなくても","して"],"answer":"しなければ","rationale":"义务形是 ない形去ない + ければ + ならない：しなければならない","audio_text":"宿題をしなければなりません。","rubric":"选 しなければ 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0029","kind":"reading","title":"高いからといって","text_ja":"高いからといって、美味しいわけではありません。安い店でも、美味しい料理があります。","text_kana":"","text_zh":"贵并不一定就好吃。便宜的店里也有美味的菜。","focus_zh":"「高いからといって」是虽说贵，可并不…的转折铺垫；「美味しいわけではありません」＝并不是就好吃，别按字面读成没有道理。","audio_text":"高いからといって、美味しいわけではありません。安い店でも、美味しい料理があります。","url":"","license":"original"},{"id":"M0093","kind":"listening","title":"ホテルのフロントと客：チェックアウト","text_ja":"A：おはようございます。チェックアウトをお願いします。\nB：おはようございます。お部屋は何番ですか。\nA：三〇五号室です。\nB：三〇五号室ですね。通常のチェックアウトは十時ですが、今日は十一時まで大丈夫です。\nA：十一時までいいんですか。助かります。\nB：はい。ただ、朝食は九時半までですので、お早めにどうぞ。\nA：わかりました。あのう、空港までのバスは何時に出発しますか。\nB：十時半と十一時半の二本です。ご予約が必要ですか。\nA：いいえ、大丈夫です。ありがとうございます。","text_kana":"A：おはようございます。チェックアウトをおねがいします。\nB：おはようございます。おへやはなんばんですか。\nA：さんびゃくごごうしつです。\nB：さんびゃくごごうしつですね。つうじょうのチェックアウトはじゅうじですが、きょうはじゅういちじまでだいじょうぶです。\nA：じゅういちじまでいいんですか。たすかります。\nB：はい。ただ、ちょうしょくはくじはんまでですので、おはやめにどうぞ。\nA：わかりました。あのう、くうこうまでのバスはなんじにしゅっぱつしますか。\nB：じゅうじはんとじゅういちじはんのにほんです。ごよやくがひつようですか。\nA：いいえ、だいじょうぶです。ありがとうございます。","text_zh":"A：早上好。我要退房。\nB：早上好。您的房间是几号？\nA：305号房。\nB：305号房是吧。通常十点退房，但今天可以到十一点。\nA：可以到十一点吗？太好了。\nB：是的。不过早餐到九点半，请早点去。\nA：明白了。那个，去机场的巴士几点出发？\nB：十点半和十一点半两班。需要预约吗？\nA：不用，没关系。谢谢。","focus_zh":"人物关系是酒店前台与住客。信息干扰：通常十点退房，今天可延到十一点；早餐到九点半；机场巴士十点半和十一点半两班。","audio_text":"A：おはようございます。チェックアウトをお願いします。\nB：おはようございます。お部屋は何番ですか。\nA：三〇五号室です。\nB：三〇五号室ですね。通常のチェックアウトは十時ですが、今日は十一時まで大丈夫です。\nA：十一時までいいんですか。助かります。\nB：はい。ただ、朝食は九時半までですので、お早めにどうぞ。\nA：わかりました。あのう、空
