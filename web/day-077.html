<script type="application/json" id="nh80-day">{"day":77,"phase":"P6","theme":"说明解释｜说明解释","scene":"【说明解释】说明解释：在 weekly（说明解释｜说明解释）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出（素材：「気持ち」と「気分」の違い｜主题键：explanation｜对齐：review）","scene_tag":"说明解释","scene_topic_key":"explanation","scene_topic":"说明解释","topic_match":"review","material_topic_keys":["explanation","work"],"material_pair":"mixed_topic","can_do":"在 weekly（说明解释｜说明解释）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出","focus":["grammar","production"],"objectives":["能说出自己错在哪一类（忘了 / 记混 / 助词 / 变形 / 听错 / 没读懂）","能听懂 说明解释 里常出现的词，并说出大概意思","能不看提示，自己说出至少 1 句完整的日语","Can-do：在 weekly（说明解释｜说明解释）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出","本日评估 weekly：分项记录词汇/语法/阅读/听力/表达得分"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期项主动回忆，无提示优先"},{"min":10,"type":"new","desc":"当天新知识快速回顾（不新增超纲内容）"},{"min":5,"type":"interaction","desc":"短场景口头输出，保持表达能力训练"},{"min":30,"type":"assessment","desc":"合并执行当天唯一的 weekly，不叠加多套试卷"},{"min":5,"type":"feedback","desc":"归因、写档、生成下一日任务"}],"vocab":[],"grammar":[],"kanji":[],"questions":[{"id":"Q0348","type":"mcq","prompt_ja":"この店に来る___、必ずこれを注文します。","prompt_zh":"【言語知識】填入表示“每当…就…”的语法。","options":["うちに","ついでに","たびに","最中に"],"answer":"たびに","rationale":"「来るたびに」=每次来都…；「ついでに」是顺便，「うちに」是趁着，「最中に」是正在…时。","audio_text":"","rubric":"选 たびに 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0349","type":"mcq","prompt_ja":"銀行へ行く___、郵便局にも寄りました。","prompt_zh":"【言語知識】填入表示“顺便”的语法。","options":["うちに","ところで","たびに","ついでに"],"answer":"ついでに","rationale":"「行くついでに」=去银行时顺便去邮局；「たびに」是每次，「うちに」是趁着，「ところで」是即使/转话题。","audio_text":"","rubric":"选 ついでに 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0350","type":"mcq","prompt_ja":"暗くならない___、帰りましょう。","prompt_zh":"【言語知識】填入表示“趁还没…”的语法。","options":["たびに","最中に","うちに","ついでに"],"answer":"うちに","rationale":"「暗くならないうちに」=趁天还没黑；「最中に」是正在…时，「たびに」是每次，「ついでに」是顺便。","audio_text":"","rubric":"选 うちに 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0351","type":"mcq","prompt_ja":"会議の___、電話が鳴りました。","prompt_zh":"【言語知識】填入表示“正在开会时”的语法。","options":["たびに","ついでに","最中に","うちに"],"answer":"最中に","rationale":"「会議の最中に」=正在开会时；「うちに」是趁着，「ついでに」是顺便，「たびに」是每次。","audio_text":"","rubric":"选 最中に 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0352","type":"mcq","prompt_ja":"この店は安い___、味もいいです。","prompt_zh":"【言語知識】填入表示“不仅…而且…”的语法。","options":["ばかりか","ばかりだ","ばかりで","ばかりに"],"answer":"ばかりか","rationale":"「安いばかりか、味もいい」=不仅便宜，味道也好；「ばかりで」表“只有…”，「ばかりに」表“正因为…”（多负面），「ばかりだ」表“尽是…”。","audio_text":"","rubric":"选 ばかりか 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0353","type":"mcq","prompt_ja":"名前も分からないので、連絡の___がありません。","prompt_zh":"【言語知識】填入表示“无法联系”的正确形式。","options":["しよう","します","した","する"],"answer":"しよう","rationale":"「連絡のしようがない」=没法联系；「ようがない」接ます形去ます，する 变为 し，故为「しよう」。其余形式不合法。","audio_text":"","rubric":"选 しよう 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0045","kind":"reading","title":"「気持ち」と「気分」の違い","text_ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","text_kana":"","text_zh":"「気持ち」和「気分」是相近的词，用法略有不同。「気持ち」表示高兴、悲伤等心理状态或对对方的心意。而「気分」多指受身体状况或当场气氛影响的一时感受，如「気分が悪い」「気分を変えたい」。拿不准时，可想想是长期持续的心理状态，还是仅当下的一时感受。","focus_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","url":"","license":"original"},{"id":"M0088","kind":"listening","title":"同僚：説明会の資料部数","text_ja":"A：山田さん、明日の説明会の資料、何部コピーした？\nB：十部です。出席者は八人と聞いていたので。\nA：あ、それが、今日になって二人増えたんだ。\nB：じゃあ、十二部ですね。すぐに二部追加します。\nA：うん、お願い。あと、表紙の色は青でいい？\nB：青でお願いします。前回は赤だったので、今回は青にしましょう。\nA：わかった。それと、資料の最後に質問用の紙を入れておいて。\nB：質問用の紙ですね。白い紙でいいですか。\nA：白で大丈夫。ありがとう。","text_kana":"A：やまださん、あしたのせつめいかいのしりょう、なんぶコピーした？\nB：じゅうぶです。しゅっせきしゃははちにんときいていたので。\nA：あ、それが、きょうになってふたりふえたんだ。\nB：じゃあ、じゅうにぶですね。すぐににぶついかします。\nA：うん、おねがい。あと、ひょうしのいろはあおでいい？\nB：あおでおねがいします。ぜんかいはあかだったので、こんかいはあおにしましょう。\nA：わかった。それと、しりょうのさいごにしつもんようのかみをいれておいて。\nB：しつもんようのかみですね。しろいかみでいいですか。\nA：しろでだいじょうぶ。ありがとう。","text_zh":"A：山田，明天说明会的资料复印了几份？\nB：十份。因为听说出席者是八人。\nA：啊，那个，今天又增加了两个人。\nB：那就是十二份。马上再加两份。\nA：嗯，拜托。还有，封面用蓝色可以吗？\nB：请用蓝色。上次是红色，这次用蓝色吧。\nA：知道了。还有，资料最后放一张提问用纸。\nB：提问用纸是吧。白纸可以吗？\nA：白纸就行。谢谢。","focus_zh":"人物关系是同事。信息干扰：先按八名出席者复印十份，当天增加两人，最终十二份；表纸颜色从上次的红色改为蓝色。","audio_text":"A：山田さん、明日の説明会の資料、何部コピーした？\nB：十部です。出席者は八人と聞いていたので。\nA：あ、それが、今日になって二人増えたんだ。\nB：じゃあ、十二部ですね。すぐに二部追加します。\nA：うん、お願い。あと、表紙の色は青でいい？\nB：青でお願いします。前回は赤だったので、今回は青にしましょう。\nA：わかった。それと、資料の最後に質問用の紙を入れておいて。\nB：質問用の紙ですね。白い紙でいいですか。\nA：白で大丈夫。ありがとう。","url":"","license":"original"},{"id":"M0030","kind":"reading","title":"Irodori: Japanese for Life in Japan（国際交流基金・公式）","text_ja":"","text_kana":"","text_zh":"","focus_zh":"","audio_text":"","url":"https://www.irodori.jpf.go.jp/en/","license":"© 国際交流基金日本語教育センター / The Japan Foundation（Irodori 官方 Terms of Use：除私用与学校教育外不得复制或改变；公开派生教材须免费并注明出处；禁止商用。非标准 CC 许可，以官网 Copyright and usage guidelines 为准）"}],"viz":{"day":77,"phase":"P6","new_count":0,"review_count":12,"question_count":6},"assessment":"weekly","lesson_core":[{"ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。","kana":"","zh":"「気持ち」和「気分」是相近的词，用法略有不同。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。","origin":"material","source_id":"M0045"},{"ja":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。","kana":"","zh":"「気持ち」表示高兴、悲伤等心理状态或对对方的心意。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。","origin":"material","source_id":"M0045"},{"ja":"一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。","kana":"","zh":"而「気分」多指受身体状况或当场气氛影响的一时感受，如「気分が悪い」「気分を変えたい」。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く
