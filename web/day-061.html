。","confusables":["V0238"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0080","pattern":"N(＋助詞) + さえ／こそ／すら；V ば形 前 + さえ…ば","meaning_zh":"甚至…／只要…就／正是…／连…都","connection":"さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ）","example":"忙しくて、昼ご飯を食べる時間さえありません。","usage":"さえ 举极端例表「连…都/甚至」；さえ…ば 表「只要满足这一项就够」；こそ 强调「正是」；すら 文言、更消极","explanation_zh":"意思是「甚至…／只要…就／正是…／连…都」；接续：さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ）（中文术语：さえ/すら 取代 が・を 或接在助词后（にさえ／でさえ）；さえ…ば 用 条件形(ば)；こそ 强调主语/原因（〜からこそ））；用法：さえ 举极端例表「连…都/甚至」；さえ…ば 表「只要满足这一项就够」；こそ 强调「正是」；すら 文言、更消极","common_errors":[{"wrong":"時間さえがありません。","why":"さえ 已取代 が/を，不再叠 が；中文「连时间都没有」直译保留 が 错","fix":"時間さえありません。","learner":"zh"},{"wrong":"これさえあるなら、大丈夫です。","why":"「只要…就」固定用 さえ…ば（条件形），不用 なら；中文「只要有就行」直译错","fix":"これさえあれば、大丈夫です。","learner":"zh"},{"wrong":"こそ／さえ／すら 可任意互换","why":"【疑点】三者语感与接续不同（こそ 强调、さえ 举极端、すら 偏文言消极），本条合并讲授，建议拆分二次核实，故标 needs_review","fix":"按语境分别使用：今こそ／時間さえ／名前すら","learner":"zh"}],"compare":[{"id":"G0004","diff":"も 是普通并列/类推；さえ 是举出极端一例「连…都」，语气更强"},{"id":"G0038","diff":"条件形 单句；さえ…ば 强调「仅此一项条件即可」"}],"examples":[{"ja":"忙しくて、昼ご飯を食べる時間さえありません。","zh":"忙得连吃午饭的时间都没有。","audio_text":"忙しくて、昼ご飯を食べる時間さえありません。"},{"ja":"これさえあれば、大丈夫です。","zh":"只要有这个就没问题。","audio_text":"これさえあれば、大丈夫です。"},{"ja":"今こそ頑張るときです。","zh":"现在正是努力的时候。","audio_text":"今こそ頑張るときです。"}],"ko":"-조차 / -야말로 / -마저；-기만 하면","ko_hint":"『甚至/连…都』≒ -조차/-마저、『正是…』≒ -야말로、『只要…就』≒ -기만 하면，可分层对照。","caution":"日语 さえ/こそ/すら 是三个不同系助词，韩语 -조차/-야말로/-마저 也三个但语气与搭配不同，不一一对应；さえ…ば 的『只要』须用 -기만 하면，别按 さえ 单独翻 조차；こそ 强调正是而非其他，韩语 야말로 也有但语域不同。"}],"kanji":[{"id":"K0133","char":"意","onyomi":["イ"],"kunyomi":[],"meaning_zh":"意；意思；意见；注意","zh_trap":"中文「意」yì；日语 意 音读 イ，「意味」いみ 是「意思/含义」、「意見」いけん、「注意」ちゅうい；中文「意」单用少，日语「意」构成大量抽象词，须按 イ 验证，此字无常用训读。","vocab_refs":["V0205"],"examples":[{"ja":"意味","kana":"いみ","zh":"意思；含义"}],"ko_hint":"韩语汉字词可参考：의미 / 뜻。日韩都表『意思/含义』，의미 是汉字词、뜻 是固有词。"}],"questions":[{"id":"Q0222","type":"mcq","prompt_ja":"先生が辞書を ___ ました。大切に使います。","prompt_zh":"选出『老师给我』的正确敬语","options":["ください","さしあげ","いただき","もうし"],"answer":"ください","rationale":"先生（上位者）给『我』用尊敬语「くださる→くださいました」；「さしあげる/いただく/申す」是谦让语，主语须为自己一方。","audio_text":"","rubric":"选 ください 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0223","type":"mcq","prompt_ja":"先輩にコーヒーを ___、ありがとうございました。","prompt_zh":"选出『承蒙前辈给』的正确敬语","options":["いただいて","くださって","さしあげて","おっしゃって"],"answer":"いただいて","rationale":"自己『承蒙（先輩に）给』用谦让语「いただく」；「くださる」的主语应是给的人（先輩が…くださった），此处主语省略为自己，故用 いただいて；「さしあげる」方向相反。","audio_text":"","rubric":"选 いただいて 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0281","type":"error_correct","prompt_ja":"先生が私に辞書をさしあげました。","prompt_zh":"改正敬语方向（谦让语误用于上位者主语）","options":[],"answer":"先生が私に辞書をくださいました。","rationale":"「さしあげる」是谦让语（自己→上位者给），不能用于上位者做主语；先生给『我』要用尊敬语「くださる」。中文无敬语方向，极易混。","audio_text":"","rubric":"改为 くださいました 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0298","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『老师把这本辞典送给了我，我会好好珍惜。』","options":[],"answer":"","rationale":"中文『送给我』无敬语方向；日语给的人（先生）作主语用「くださる」（V0232 尊敬语）。若主语是『我』则用 いただく；「さしあげる」方向相反，不能用。","audio_text":"","rubric":"①上位者给我用くださる 1 分；②不用さしあげる/いただく错方向 1 分；③大切に使う与敬体自然收尾 1 分","expected_production":"先生がこの辞書をくださいました。大切に使います。","difficulty":5},{"id":"Q0301","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『部长好像已经回去了，我们下周再商量吧。』","options":[],"answer":"","rationale":"『好像』用 ようだ／らしい（G0044）推测，不用样态「そう」（接ます形词干，G0043）；对部長的『回去』须用尊敬表达「お帰りになった」。提议用「〜ませんか」（G0032）。","audio_text":"","rubric":"①对部長用尊敬表达 1 分；②〜ようだ/らしい推测 1 分；③〜ませんか提议与また・来週自然 1 分","expected_production":"部長はもうお帰りになったようですから、来週また相談しませんか。","difficulty":5},{"id":"Q0315","type":"free_production","prompt_ja":"","prompt_zh":"用「〜さえ…ば」（G0080）写一句话，表达『只要满足这一个条件就够了』。","options":[],"answer":"","rationale":"「N＋さえ／Vます形去ます＋さえ＋すれば…ば」＝只要…就；条件形变形要正确；不混用「こそ」（正是）「すら」（连…都）。可自然用「時間が足りる」（V0167）。","audio_text":"","rubric":"①〜さえ…ば『只要…就』1 分；②条件形/すれば变形正确 1 分；③こそ/すら不混用、语义自然 1 分","expected_production":"時間さえ足りれば、この仕事は今日中に終わります。","difficulty":5}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","tex
