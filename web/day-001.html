<script type="application/json" id="nh80-day">{"day":1,"phase":"P1","theme":"初次见面｜N は N です・私・さん","scene":"【初次见面】寒暄：用「N は N です」向对方介绍自己并确认对方姓名，全程不靠中文汉字猜读音（素材：朝のあいさつ）","scene_tag":"初次见面","can_do":"用「N は N です」向对方介绍自己并确认对方姓名，全程不靠中文汉字猜读音","focus":["listening","reading"],"objectives":["能说清「N は N です」用在什么场合、前面该怎么接","能分清 私、さん、こんにちは 和意思相近的词，别按中文硬套","能读准今天汉字的日语读音，不照中文读音猜","当天新词：私、さん、こんにちは（读音与用法都要验证，不靠汉字猜义）","当天句型：N は N です，须说出接续条件","当天汉字：日、月、火，音读/训读各给一例","Can-do：用「N は N です」向对方介绍自己并确认对方姓名，全程不靠中文汉字猜读音","本日评估 diagnostic：分项记录词汇/语法/阅读/听力/表达得分"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期项主动回忆，无提示优先"},{"min":10,"type":"new","desc":"当天新知识快速回顾（不新增超纲内容）"},{"min":5,"type":"interaction","desc":"短场景口头输出，保持表达能力训练"},{"min":30,"type":"assessment","desc":"合并执行当天唯一的 diagnostic，不叠加多套试卷"},{"min":5,"type":"feedback","desc":"归因、写档、生成下一日任务"}],"vocab":[{"id":"V0001","surface":"私","kana":"わたし","romaji":"watashi","pos":"名詞/代名詞","meaning_zh":"我","jlpt":"N5","examples":[{"ja":"私は学生です。","zh":"我是学生。","audio_text":"私は学生です。"}],"notes_for_zh":"中文「我」男女通用且可随便用；日语「私(わたし)」偏正式/中性，男性随意场合多用「僕」「俺」，自称别读成中文 sī。","confusables":["V0002"],"ko":"저 / 나","ko_hint":"日语『私』不分谦让/平称，韩语 저（对长辈谦让）与 나（对朋友平称）要分场合；中文『私』读 sī＝私人，是中日同形异义。","caution":"저/나 按对象选，日语一律 私；中文『私』≠日语『我』，别按中文猜；韩语还有 제가/내가 缩约，日语没有对等变形。"},{"id":"V0003","surface":"さん","kana":"さん","romaji":"san","pos":"名詞/接尾辞","meaning_zh":"…先生／…小姐（敬称）","jlpt":"N5","examples":[{"ja":"田中さんは先生です。","zh":"田中是老师。","audio_text":"田中さんは先生です。"}],"notes_for_zh":"「さん」不能接在自己名字后做自我介绍（不说「私は李さんです」）；中文「先生/小姐」可自称，日语忌讳。","confusables":[],"ko":"씨","ko_hint":"都接在人名后作敬称（田中さん／김민수 씨），都不能用于自己，概念可对照。","caution":"さん 多接姓、씨 多接全名或名字，位置不同；日语『先生』本身是敬称、不能再加 さん，韩语 선생님 同理但规则不同；中文『我是李先生』日语绝不能说 私は李さんです。"},{"id":"V0004","surface":"こんにちは","kana":"こんにちは","romaji":"konnichiwa","pos":"感動詞","meaning_zh":"你好（白天问候）","jlpt":"N5","examples":[{"ja":"こんにちは、元気ですか。","zh":"你好，你好吗？","audio_text":"こんにちは、元気ですか。"}],"notes_for_zh":"末尾「は」读 wa 不读 ha，别写成「こんにちわ」；只用于白天见面，早晨/晚上要换别的说法。","confusables":["V0005"],"ko":"안녕하세요","ko_hint":"都作白天/通用问候；韩语 안녕하세요 早晚都能用。","caution":"日语分 おはようございます／こんにちは／こんばんは 三段，韩语一句 안녕하세요 通吃，别一天到晚只对应一句；こんにちは 的 は 读 wa 不读 ha，且是固定寒暄语、不是『今天』。"},{"id":"V0006","surface":"おはようございます","kana":"おはようございます","romaji":"ohayougozaimasu","pos":"感動詞","meaning_zh":"早上好（敬体）","jlpt":"N5","examples":[{"ja":"おはようございます。","zh":"早上好。","audio_text":"おはようございます。"}],"notes_for_zh":"对同辈简说「おはよう」即可；「ございます」是丁寧語，对朋友全套照搬会显得生分。","confusables":["V0004"],"ko":"안녕하세요 / 좋은 아침입니다","ko_hint":"早上问候可对照 안녕하세요（韩语早上也说这句）。","caution":"韩语 좋은 아침입니다 是较直译的说法、日常不如 안녕하세요 自然；日语 おはようございます 对上级/不熟的人用、朋友间只说 おはよう，韩语无この层级差，别一律翻成正式形。"},{"id":"V0007","surface":"ありがとうございます","kana":"ありがとうございます","romaji":"arigatougozaimasu","pos":"感動詞","meaning_zh":"谢谢（敬体）","jlpt":"N5","examples":[{"ja":"ありがとうございます。","zh":"谢谢。","audio_text":"ありがとうございます。"}],"notes_for_zh":"事情已办完用过去式「ありがとうございました」；中文「谢谢」不分时态，日语要分。","confusables":["V0008"],"ko":"감사합니다 / 고맙습니다","ko_hint":"都表『谢谢』的礼貌体，可对照。","caution":"日语 ありがとう（简体）/ありがとうございます（礼貌）与韩语 고마워(반말)/감사합니다(하십시오체) 层级不对等；감사합니다 偏正式、日常更常说 고마워요，别一律翻 감사합니다。"},{"id":"V0008","surface":"すみません","kana":"すみません","romaji":"sumimasen","pos":"感動詞","meaning_zh":"对不起；劳驾／借过","jlpt":"N5","examples":[{"ja":"すみません、駅はどこですか。","zh":"劳驾，车站在哪？","audio_text":"すみません、駅はどこですか。"}],"notes_for_zh":"一词三用：道歉、向陌生人搭话（相当于 Excuse me）、轻微谢意；中文「对不起」不含「劳驾」义，叫人时别用「ごめんなさい」。","confusables":["V0007"],"ko":"죄송합니다 / 실례합니다","ko_hint":"兼『对不起』与『劳驾/借过』两义：道歉≒죄송합니다、招呼≒실례합니다，可分流对照。","caution":"一个日语词对应韩语两个词，别一律翻 죄송합니다；问路、叫人时是劳驾不是道歉；韩语 잠깐만요 也表借过一下，语用边界不同。"}],"grammar":[{"id":"G0001","pattern":"N は N です","meaning_zh":"…是…","connection":"名詞 + は + 名詞 + です","example":"私は学生です。","usage":"判断句，介绍身份/事物，礼貌体","explanation_zh":"意思是「…是…」；接续：名詞 + は + 名詞 + です（中文术语：名词 + は + 名词 + です）；用法：判断句，介绍身份/事物，礼貌体","common_errors":[{"wrong":"私は学生だ。","why":"「だ」是简体，与句末礼貌体混用；中文「是」没有敬简之分","fix":"私は学生です。","learner":"zh"},{"wrong":"私は 学生 です（は 读 ha）","why":"主题「は」读 wa 不读 ha，中文母语者常按拼音读成 ha","fix":"私は学生です。（は 读 wa）","learner":"zh"}],"compare":[],"examples":[{"ja":"私は学生です。","zh":"我是学生。","audio_text":"私は学生です。"},{"ja":"これは本です。","zh":"这是书。","audio_text":"これは本です。"}],"ko":"N 은/는 N 입니다（正式）/ 이에요（日常）","ko_hint":"都是 SOV、助词后置、句末要变礼貌体，可整句平移加速；は 与 은/는 都提示话题，です 与 입니다 都落在句末。","caution":"は 是『主题』不是『主语』：象は鼻が長い 里 は 提示话题、が 才是主语，コーヒーが好き 的 が 标喜欢对象、韩语反而说 커피를 좋아해요 用 을/를；です 与 입니다/이에요 语体层级不同，日常更常说 이에요，别一律翻成 입니다；は 写 は 读 wa、不随词变形，은/는 要按收音选。"}],"kanji":[{"id":"K0001","char":"日","onyomi":["ニチ","ジツ"],"kunyomi":["ひ","か"],"meaning_zh":"太阳；日子；日本","zh_trap":"中文读 rì；日语「日本」にほん/にっぽん、「三日」みっか、「日曜日」にちようび，音读训读随词变，不可按中文音推。","vocab_refs":["V0023","V0024","V0029","V0037"],"examples":[{"ja":"今日","kana":"きょう","zh":"今天"},{"ja":"明日","kana":"あした","zh":"明天"},{"ja":"毎日","kana":"まいにち","zh":"每天"},{"ja":"日曜日","kana":"にちようび","zh":"星期日"}],"ko_hint":"韩语汉字词可参考：오늘。日语『今日』特殊训读 きょう、韩语 오늘（固有词）＝今天；顺带记住 こんにちは 里读 こんにち，同一汉字读法随词变。"},{"id":"K0002","char":"月","onyomi":["ゲツ","ガツ"],"kunyomi":["つき"],"meaning_zh":"月亮；月份","zh_trap":"中文读 yuè；日语「月曜日」げつようび 音读 げつ，「月」单用「月亮」训读 つき；「一月」いちがつ 读 がつ 不读 げつ。","vocab_refs":["V0031"],"examples":[{"ja":"月曜日","kana":"げつようび","zh":"星期一"}],"ko_hint":"韩语汉字词可参考：월요일。日韩同用七曜体系（月曜日／월요일＝星期一），汉字词一一对应，可成组记。"},{"id":"K0003","char":"火","onyomi":["カ"],"kunyomi":["ひ"],"meaning_zh":"火；星期二","zh_trap":"中文读 huǒ；日语「火」训读 ひ（火事 かじ 音读 カ）、「火曜日」かようび；中文「火」无「星期」义，日语七曜借自行星名。","vocab_refs":["V0032"],"examples":[{"ja":"火曜日","kana":"かようび","zh":"星期二"}],"ko_hint":""}],"questions":[{"id":"Q0009","type":"dialogue","prompt_ja":"初次见面，对方说「はじめまして」，请回应并自我介绍。","prompt_zh":"补全问候对话中的应答","options":[],"answer":"","rationale":"考查判断句在问候对话中的实际运用","audio_text":"","rubric":"①得体回应问候得 1 分；②用「私は〜です」报出姓名或身份得 1 分；③句末保持礼貌体得 1 分","expected_production":"はじめまして。私はリンです。よろしくお願いします。","difficulty":1},{"id":"Q0181","type":"mcq","prompt_ja":"私___学生です。","prompt_zh":"选出正确的主题助词","options":["は","が","を","に"],"answer":"は","rationale":"主题用 は（读 wa）；中文「我」后无对应助词，中国学习者常漏填或误用 が。","audio_text":"私は学生です。","rubric":"选 は 得 1 分，其余 0 分","expected_production":"","difficulty":1},{"id":"Q0182","type":"fill","prompt_ja":"私は学生___。","prompt_zh":"补全礼貌体判断句句末","options":[],"answer":"です","rationale":"礼貌体判断句句末是 で 面。我是小林。是学生。我学习日语。请多关照。","focus_zh":"「日本語を勉強します」的「勉強」是学习、不是中文「勉强」；「学生です」前面省掉了「私は」，日语话题清楚时常省略主语。","audio_text":"はじめまして。私はリンです。学生です。日本語を勉強します。よろしくお願いします。","url":"","license":"original"}],"viz":{"day":1,"phase":"P1","new_count":10,"review_count":0,"question_count":8},"assessment":"diagnostic","lesson_core":[{"ja":"おはようございます。","kana":"","zh":"早上好。","note_zh":"「今日は」的「は」是主题助词、读 wa 不读 ha；「今日」在这里是特殊训读 きょう，别按「こんにちは」里的 こんにち 类推。","audio_text":"おはようございます。"},{"ja":"今日はいい天気です。","kana":"きょうはいいてんきです。","zh":"今天天气很好。","note_zh":"「今日は」的「は」是主题助词、读 wa 不读 ha；「今日」在这里是特殊训读 きょう，别按「こんにちは」里的 こんにち 类推。","audio_text":"今日はいい天気です。"},{"ja":"私は学生です。","kana":"","zh":"我是学生。","note_zh":"「だ」是简体，与句末礼貌体混用；中文「是」没有敬简之分","audio_text":"私は学生です。"}],"review_plan":[],"teaching_notes":["记住：「だ」是简体，与句末礼貌体混用；中文「是」没有敬简之分","注意：主题「は」读 wa 不读 ha，中文母语者常按拼音读成 ha","容易错：中文「我」男女通用且可随便用；日语「私(わたし)」偏正式/中性，男性随意场合多用「僕」「俺」，自称别读成中文 sī。","小提醒：「さん」不能接在自己名字后做自我介绍（不说「私は李さんです」）；中文「先生/小姐」可自称，日语忌讳。"],"ko_analogy":{"grammar":[{"match":"G0001","pattern":"N は N です","ko":"N 은/는 N 입니다（正式）/ 이에요（日常）","hint_zh":"都是 SOV、助词后置、句末要变礼貌体，可整句平移加速；は 与 은/는 都提示话题，です 与 입니다 都落在句末。","caution":"は 是『主题』不是『主语』：象は鼻が長い 里 は 提示话题、が 才是主语，コーヒーが好き 的 が 标喜欢对象、韩语反而说 커피를 좋아해요 用 을/를；です 与 입니다/이에요 语体层级不同，日常更常说 이에요，别一律翻成 입니다；は 写 は 读 wa、不随词变形，은/는 要按收音选。"}],"vocab":[{"match":"V0001","surface":"私","ko":"저 / 나","hint_zh":"日语『私』不分谦让/平称，韩语 저（对长辈谦让）与 나（对朋友平称）要分场合；中文『私』读 sī＝私人，是中日同形异义。","caution":"저/나 按对象选，日语一律 私；中文『私』≠日语『我』，别按中文猜；韩语还有 제가/내가 缩约，日语没有对等变形。"},{"match":"V0003","surface":"さん","ko":"씨","hint_zh":"都接在人名后作敬称（田中さん／김민수 씨），都不能用于自己，概念可对照。","caution":"さん 多接姓、씨 多接全名或名字，位置不同；日语『先生』本身是敬称、不能再加 さん，韩语 선생님 同理但规则不同；中文『我是李先生』日语绝不能说 私は李さんです。"},{"match":"V0004","surface":"こんにちは","ko":"안녕하세요","hint_zh":"都作白天/通用问候；韩语 안녕하세요 早晚都能用。","caution":"日语分 おはようございます／こんにちは／こんばんは 三段，韩语一句 안녕하세요 通吃，别一天到晚只对应一句；こんにちは 的 は 读 wa 不读 ha，且是固定寒暄语、不是『今天』。"},{"match":"V0006","surface":"おはようございます","ko":"안녕하세요 / 좋은 아침입니다","hint_zh":"早上问候可对照 안녕하세요（韩语早上也说这句）。","caution":"韩语 좋은 아침입니다 是较直译的说法、日常不如 안녕하세요 自然；日语 おはようございます 对上级/不熟的人用、朋友间只说 おはよう，韩语无この层级差，别一律翻成正式形。"},{"match":"V0007","surface":"ありがとうございます","ko":"감사합니다 / 고맙습니다","hint_zh":"都表『谢谢』的礼貌体，可对照。","caution":"日语 ありがとう（简体）/ありがとうございます（礼貌）与韩语 고마워(반말)/감사합니다(하십시오체) 层级不对等；감사합니다 偏正式、日常更常说 고마워요，别一律翻 감사합니다。"},{"match":"V0008","surface":"すみません","ko":"죄송합니다 / 실례합니다","hint_zh":"兼『对不起』与『劳驾/借过』两义：道歉≒죄송합니다、招呼≒실례합니다，可分流对照。","caution":"一个日语词对应韩语两个词，别一律翻 죄송합니다；问路、叫人时是劳驾不是道歉；韩语 잠깐만요 也表借过一下，语用边界不同。"}]}}</script>
