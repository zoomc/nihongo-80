swer":"申請書に記入する","rationale":"「まず、この申請書にご記入ください」是指示。照片客人已「持ってきました」，且职员说「お持ちいただければ結構です」＝不必新拍（V0191 的『不用了』义）。","audio_text":"すみません、在留カードの更新の手続きをしたいのですが。はい。まず、この申請書にご記入ください。写真が一枚必要です。写真は持ってきました。ここで撮らなければなりませんか。いいえ、お持ちいただければ結構ですよ。","rubric":"选 申請書に記入する 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0252","type":"listen","prompt_ja":"会話を聞いて、新しい企画が今日どうなったか選んでください。","prompt_zh":"新提案今天结果如何？","options":["まだ決まっていない","採用が決まった","中止になった","部長が反対した"],"answer":"まだ決まっていない","rationale":"「持ち帰って検討するように」「来週もう一度相談しましょう」＝结论留待下次（G0065 决定的是再议，不是采纳/中止）。「おっしゃっていました」是 V0236 尊敬语。","audio_text":"佐藤さん、さっきの会議、部長は何とおっしゃっていましたか。新しい企画については、一度持ち帰って検討するようにと。ということは、今日は決まらないんですね。ええ、来週もう一度相談しましょう。","rubric":"选 まだ決まっていない 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0254","type":"listen","prompt_ja":"ニュースを聞いて、主な内容を選んでください。","prompt_zh":"这条新闻的主要内容是什么？","options":["メーカーが海外に工場を作ると発表した","工場が事故で止まった","給料が上がると決まった","新製品が売れなくなった"],"answer":"メーカーが海外に工場を作ると発表した","rationale":"开头「〜と発表しました」是主旨。后半「雇用への影響が心配」「研究も続ける」是附带信息；事故、加薪、滞销都不是本文内容，不能附加文中没有的信息。","audio_text":"次は経済のニュースです。大手の電機メーカーが、来月から新しい工場を海外に作ると発表しました。国内の雇用への影響が心配されますが、会社側は「新しい技術の研究も続ける」と説明しています。","rubric":"选 メーカーが海外に工場を作ると発表した 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","text_ja":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","text_kana":"","text_zh":"喜好因人而异。对我来说日语很难。我们来聊聊日语吧。","focus_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","url":"","license":"original"},{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが書けるようになりました。とても便利です。","text_kana":"","text_zh":"已经能用电脑写日语邮件了。非常方便。","focus_zh":"「書けるようになりました」表从不会到会的变化；「パソコンで」的「で」表工具手段用电脑，不是动作场所。","audio_text":"パソコンで日本語のメールが書けるようになりました。とても便利です。","url":"","license":"original"}],"viz":{"day":66,"phase":"P5","new_count":0,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":
