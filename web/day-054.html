<script type="application/json" id="nh80-day">{"day":54,"phase":"P4","theme":"数据说明｜普通形 + わけが ない / V辞書形 + わけには いかない・普通形 + と は 限らない・変える","scene":"【数据说明】预订：用 変える、会議、報告 描述趋势与例外，并回答「为什么」的追问（素材：予約の人数変更の返信メール）","scene_tag":"数据说明","can_do":"用 変える、会議、報告 描述趋势与例外，并回答「为什么」的追问","focus":["reading","listening"],"objectives":["能分清「这是事实」和「这是我猜的」，不把猜测说成肯定","能说出自己错在哪一类（忘了 / 记混 / 助词 / 变形 / 听错 / 没读懂）","能听懂 预订 里常出现的词，并说出大概意思","当天新词：変える、会議、報告（读音与用法都要验证，不靠汉字猜义）","当天句型：普通形 + わけが ない / V辞書形 + わけには いかない、普通形 + と は 限らない，须说出接续条件","当天汉字：技、術，音读/训读各给一例","Can-do：用 変える、会議、報告 描述趋势与例外，并回答「为什么」的追问"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【数据说明】预订：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0242","surface":"変える","kana":"かえる","romaji":"kaeru","pos":"動詞/一段","meaning_zh":"改变（他动）","jlpt":"N3","examples":[{"ja":"予定を変えました。","zh":"改了计划。","audio_text":"予定を変えました。"}],"notes_for_zh":"「変える」一段他动词，“改变（宾语用 を）”，自动词「変わる」かわる（が）；与「直す」なおす（改正错误/修理）不同——“改时间/改计划”用 変える，“改错字”用 直す，中文「改」一字日语须分；「変」ヘン/かえる 不可按中文 biàn 推。","confusables":["V0158"],"ko":"","ko_hint":"","caution":""},{"id":"V0244","surface":"会議","kana":"かいぎ","romaji":"kaigi","pos":"名詞/サ変","meaning_zh":"会议","jlpt":"N3","examples":[{"ja":"午後から会議があります。","zh":"下午开始有会议。","audio_text":"午後から会議があります。"}],"notes_for_zh":"「会議」かいぎ 名词/サ変，「会議がある／会議を開く／会議に出る」；中文“开会”日语说「会議をする／会議がある」，“出席会议”用 に（会議に出る）不说 を；韩语 회의 同源可帮记，但不能靠汉字猜助词；「会」カイ、「議」ギ 不可按中文 huì/yì 推。","confusables":[],"ko":"회의","ko_hint":"日韩汉字词同形同义（かいぎ／회의＝会议）。","caution":"かいぎ ≠ hoeui 读音不同；会議をする≒회의하다/회의를 하다，韩语更常加 하다，别照日语 する 套。"},{"id":"V0247","surface":"報告","kana":"ほうこく","romaji":"houkoku","pos":"名詞/サ変","meaning_zh":"报告；汇报","jlpt":"N3","examples":[{"ja":"上司に結果を報告します。","zh":"向上司汇报结果。","audio_text":"上司に結果を報告します。"}],"notes_for_zh":"「報告」ほうこく 名词/サ変，「人に〜を報告する」对象用 に、内容用 を；与「説明」（解释清楚）不同：報告 是“向上/向组织汇报”；中文“一份报告”日语多用「レポート」；「報」ホウ、「告」コク 不可按中文 bào/gào 推。","confusables":["V0170"],"ko":"보고(하다)","ko_hint":"日韩汉字词同形同义（ほうこく／보고＝报告）。","caution":"ほうこく ≠ bogo 读音不同；報告する≒보고하다，但日语『ご報告いたします』的谦让语韩语要靠 드리다，别套成 보고합니다 了事。"},{"id":"V0248","surface":"相談","kana":"そうだん","romaji":"soudan","pos":"名詞/サ変","meaning_zh":"商量；咨询","jlpt":"N3","examples":[{"ja":"先生に進路を相談します。","zh":"找老师商量升学去向。","audio_text":"先生に進路を相談します。"}],"notes_for_zh":"「相談」そうだん 名词/サ変，「人に〜を相談する／人と相談する」：对象用 に（向谁）或 と（和谁），内容用 を；中文“跟老师商量”用 に/と 不能漏；「相」ソウ、「談」ダン 不可按中文 xiāng/tán 推；韩语 상담 同源可帮记，但不能靠汉字猜助词。","confusables":[],"ko":"상담(하다)","ko_hint":"日韩汉字词形近义近（そうだん／상담＝商量/咨询）。","caution":"そうだん ≠ sangdam 读音不同；【注意】中文母语者易把『相談』理解成互相谈话，其实日语是向人请教/商量，中文『商量』不完全对等；韩语 상담 偏咨询/辅导，别按中文『聊天』套。"}],"grammar":[{"id":"G0071","pattern":"普通形 + わけが ない / V辞書形 + わけには いかない","meaning_zh":"不可能…／不能…、不好…","connection":"普通形 + わけがない（强烈否定可能性）；辞書形 + わけにはいかない（因情理/规则不能做）","example":"彼がそんなことを言うわけがありません。","usage":"わけがない 是「绝无可能」；わけにはいかない 是「（道理上）不能这么做」，两形意义不同勿混","explanation_zh":"意思是「不可能…／不能…、不好…」；接续：普通形 + わけがない（强烈否定可能性）；辞書形 + わけにはいかない（因情理/规则不能做）（中文术语：简体 + わけがない（强烈否定可能性）；辞书形 + わけにはいかない（因情理/规则不能做））；用法：わけがない 是「绝无可能」；わけにはいかない 是「（道理上）不能这么做」，两形意义不同勿混","common_errors":[{"wrong":"彼が来るわけがないです。","why":"「わけがない」是断定语，不加 です；礼貌用 わけがありません；中文「不可能」直译错","fix":"彼が来るわけがありません。","learner":"zh"},{"wrong":"病気だから、休むわけがありません。","why":"想说「不能不休息」应用 わけにはいかない；わけがない 是「不可能休息」，中文「不能」直译混淆两形","fix":"病気だから、休まないわけにはいきません。","learner":"zh"}],"compare":[{"id":"G0053","diff":"わけではない 是「并非…」部分否定；わけがない 是「绝不可能」全盘否定"},{"id":"G0070","diff":"に違いない 肯定推断；わけがない 否定推断，二者反向"}],"examples":[{"ja":"彼がそんなことを言うわけがありません。","zh":"他不可能说那种话。","audio_text":"彼がそんなことを言うわけがありません。"},{"ja":"明日試験があるので、遊びに行くわけにはいきません。","zh":"明天有考试，不能去玩。","audio_text":"明日試験があるので、遊びに行くわけにはいきません。"}],"ko":"-(으)ㄹ 리가 없다 / -(으)ㄹ 수가 없다·-(으)ㄹ 수 없다","ko_hint":"『不可能…』≒ -(으)ㄹ 리가 없다、『不能/不好…』≒ -(으)ㄹ 수 없다，可对照。","caution":"わけがない 是不可能（推断）、わけにはいかない 是不能做（情理上不允许），意思差很大，韩语 리가 없다/수 없다 也分，但别把两条都翻成一个；わけ 的本义（道理/结论）韩语没有对等词。"},{"id":"G0072","pattern":"普通形 + と は 限らない","meaning_zh":"未必…；不一定…；不见得…","connection":"動詞・い形 普通形 / 名詞・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应","example":"高いものが必ずしも良いとは限りません。","usage":"否定「一概如此」，修正以偏概全；礼貌体 とは 限りません","explanation_zh":"意思是「未必…；不一定…；不见得…」；接续：動詞・い形 普通形 / 名詞・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应（中文术语：动词・い形 简体 / 名词・な形（＋だ 常省）+ とは 限らない；常与 必ずしも／すべて／〜からといって 呼应）；用法：否定「一概如此」，修正以偏概全；礼貌体 とは 限りません","common_errors":[{"wrong":"安いとは限らないです。","why":"「限らない」已含否定，不加 です；礼貌用 限りません；中文「不一定」直译加 です 错","fix":"安いとは限りません。","learner":"zh"},{"wrong":"学生だとは限りません。","why":"名词/な形 接 とは限らない 通常去掉 だ（学生とは限りません）；中文直译保留 だ 错","fix":"学生とは限りません。","learner":"zh"}],"compare":[{"id":"G0053","diff":"わけではない 否定某个具体命题「并非…」；とは限らない 否定「总是如此」的普遍化"},{"id":"G0071","diff":"わけがない 是「绝无可能」；とは限らない 是「不一定」，留有余地"}],"examples":[{"ja":"高いものが必ずしも良いとは限りません。","zh":"贵的东西未必就好。","audio_text":"高いものが必ずしも良いとは限りません。"},{"ja":"先生だからといって、何でも知っているとは限りません。","zh":"虽说是老师，也未必什么都懂。","audio_text":"先生だからといって、何でも知っているとは限りません。"}],"ko":"반드시 -는 것은 아니다 / -(으)란 법은 없다","ko_hint":"『未必…／不一定…』≒ 반드시 -는 것은 아니다，部分否定可对照。","caution":"とは 限らない 的 と 是引用、は 是提示，韩语 -는 것은 아니다/-란 법은 없다 结构不同源；它否定的是必然而非全部，别和 わけではない（G0053 部分否定）混，两者韩语都可能翻 -는 것은 아니다，要靠日语区分。"}],"kanji":[{"id":"K0120","char":"技","onyomi":["ギ"],"kunyomi":["わざ"],"meaning_zh":"技；技能；技术","zh_trap":"中文「技」jì；日语 技 音读 ギ（技術 ぎじゅつ）、训读 わざ（技）；「技術」是「技术」，与中文义近但读音完全不同，须按 ギ 验证，不能按中文 jì 推。","vocab_refs":["V0252"],"examples":[{"ja":"技術","kana":"ぎじゅつ","zh":"技术"}],"ko_hint":""},{"id":"K0121","char":"術","onyomi":["ジュツ"],"kunyomi":[],"meaning_zh":"术；技术；手术；算术","zh_trap":"中文「术」shù；日语 術 音读 ジュツ（技術 ぎじゅつ、手術 しゅじゅつ，入声 -ツ）；简体「术」与「術」字形差异大，不可按中文形推，此字无常用训读。","vocab_refs":["V0252"],"examples":[{"ja":"技術","kana":"ぎじゅつ","zh":"技术"}],"ko_hint":""}],"questions":[{"id":"Q0219","type":"mcq","prompt_ja":"明日の会議の資料は用意しました。___、来週の出張の件ですが…","prompt_zh":"选出用于转换话题的接续词","options":["ところで","そのため","それとも","そのうえ"],"answer":"ところで","rationale":"「ところで」用于『对了/话说回来』转入新话题；其余三项分别表因果、选择、累加，不具备转话题功能。","audio_text":"","rubric":"选 ところで 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0229","type":"fill","prompt_ja":"会議の資料は、もう ___ てありますから、ご安心ください。","prompt_zh":"填入使「〜てあります」成立的形式","options":[],"answer":"用意し","rationale":"「N が Vて ある」表人为事先做好并留下结果（G0056）；サ変「用意する」て形为「用意して」，去掉「てあります」填「用意し」。原本的「を」改由「は/が」提示。","audio_text":"","rubric":"填 用意し 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0230","type":"fill","prompt_ja":"明日の会議に部長が出席する ___ 、まだ分かりません。","prompt_zh":"填入表示『是否』的表达","options":[],"answer":"かどうか","rationale":"「普通形＋かどうか」＝『是否…』（G0058）；名词/な形词干直接接、不加 だ。中文『是否』常错加成「か」或「だ」。","audio_text":"","rubric":"填 かどうか 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0239","type":"fill","prompt_ja":"ちょうど今から会議を ___ ところです。少々お待ちください。","prompt_zh":"填入「〜ところだ（正要）」前的动词形","options":[],"answer":"始める","rationale":"「V辞書形＋ところだ」＝正要做…（G0069）；「Vている＋ところだ」是正在做，「Vた＋ところだ」是刚做完。此处「今から」用辞书形「始める」。","audio_text":"","rubric":"填 始める 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0246","type":"listen","prompt_ja":"電話を聞いて、客が希望している部屋を選んでください。","prompt_zh":"客人希望要什么样的房间？","options":["駅が見える部屋","安い部屋","二つ並んだ部屋","禁煙の部屋"],"answer":"駅が見える部屋","rationale":"客人明确说「できれば駅が見える部屋をお願いします」。人数与晚数是「二人で一泊」，但问题问的是对房间的希望，不能答成人数/价格。","audio_text":"はい、さくらホテルでございます。明日の夜、部屋を予約したいのですが。かしこまりました。何名様で、何泊でしょうか。二人で一泊です。できれば駅が見える部屋をお願いします。少々お待ちください。確認いたします。","rubric":"选 駅が見える部屋 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0263","type":"read","prompt_ja":"いつもご利用ありがとうございます。改装工事のため、来週の月曜日から水曜日まで、当店は臨時休業とさせていただきます。木曜日からは、これまでより一時間早い朝九時に開店し、夜は同じく二十時まで営業します。ご迷惑をおかけしますが、よろしくお願いいたします。","prompt_zh":"周四以后，变化的是什么？","options":["開店時間","閉店時間","休業する曜日","店の場所"],"answer":"開店時間","rationale":"「朝九時に開店」（原为十时）＝开店时间提前；「夜は同じく二十時まで」＝闭店不变。临时休业是周一至周三，不含周四以后；场所无记述。","audio_text":"","rubric":"选 開店時間 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0041","kind":"reading","title":"予約の人数変更の返信メール","text_ja":"先日はご予約をありがとうございました。ご連絡いただいた人数の変更、二名から三名へ承知いたしました。お席はそのままご用意しておきます。なお、当日のご到着が午後六時を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。二十時までお取りしておきます。／さくら食堂","text_kana":"","text_zh":"感谢您此前的预约。已收到人数由两位改为三位的通知。席位照旧为您预留。另外，若当天抵达时间超过下午六点，麻烦请联系我们一次。座位将保留至二十点。／樱花食堂。","focus_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"先日はご予約をありがとうございました。ご連絡いただいた人数の変更、二名から三名へ承知いたしました。お席はそのままご用意しておきます。なお、当日のご到着が午後六時を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。二十時までお取りしておきます。／さくら食堂","url":"","license":"original"},{"id":"M0054","kind":"listening","title":"パソコンの故障のサポート電話","text_ja":"お客様サポートセンターです。パソコンの調子がおかしいんです。朝から急に画面が消えて、何度操作しても動きません。それでは、一度電源を切って、十分ほど待ってから入れ直していただけますか。わかりました。やってみます。","text_kana":"","text_zh":"这里是客户服务中心。我的电脑有点不对劲。早上开始屏幕突然黑掉，怎么操作都没反应。那么请您先关掉电源，等十分钟左右再重新开机好吗？好的。我试试。","focus_zh":"「入れ直していただけますか」是客服请用户能否麻烦您重试的客气请求；「調子がおかしいんです」的「んです」带情况是…的说明语气。","audio_text":"お客様サポートセンターです。パソコンの調子がおかしいんです。朝から急に画面が消えて、何度操作しても動きません。それでは、一度電源を切って、十分ほど待ってから入れ直していただけますか。わかりました。やってみます。","url":"","license":"original"}],"viz":{"day":54,"phase":"P4","new_count":8,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"先日はご予約をありがとうございました。","kana":"","zh":"感谢您此前的预约。","note_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"先日はご予約をありがとうございました。"},{"ja":"ご連絡いただいた人数の変更、二名から三名へ承知いたしました。","kana":"","zh":"已收到人数由两位改为三位的通知。","note_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"ご連絡いただいた人数の変更、二名から三名へ承知いたしました。"},{"ja":"彼がそんなことを言うわけがありません。","kana":"","zh":"他不可能说那种话。","note_zh":"「わけがない」是断定语，不加 です；礼貌用 わけがありません；中文「不可能」直译错","audio_text":"彼がそんなことを言うわけがありません。"}],"review_plan":[{"kid":"V0234","surface":"いらっしゃる","kana":"いらっしゃる","zh":"在/去/来（尊敬语）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":53,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"V0239","surface":"遠慮","kana":"えんりょ","zh":"客气；顾虑；谢绝","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":53,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"V0240","surface":"見つける","kana":"みつける","zh":"找到（他动）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":53,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"G0070","surface":"普通形 + に 違いない","kana":"","zh":"一定是…；肯定…（强烈推断）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":53,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"K0119","surface":"請","kana":"","zh":"请；请求；申请","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":53,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"V0224","surface":"残念","kana":"ざんねん","zh":"遗憾；可惜","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":52,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"V0227","surface":"嬉しい","kana":"うれしい","zh":"高兴；开心","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":52,"next_hint_zh":"大约 Day 55 再回顾"},{"kid":"V0231","surface":"いただく","kana":"いただく","zh":"承蒙给予；吃/喝（谦让语）","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":52,"next_hint_zh":"大约 Day 55 再回顾"}],"teaching_notes":["记住：「わけがない」是断定语，不加 です；礼貌用 わけがありません；中文「不可能」直译错","注意：想说「不能不休息」应用 わけにはいかない；わけがない 是「不可能休息」，中文「不能」直译混淆两形","容易错：「限らない」已含否定，不加 です；礼貌用 限りません；中文「不一定」直译加 です 错","小提醒：名词/な形 接 とは限らない 通常去掉 だ（学生とは限りません）；中文直译保留 だ 错"],"ko_analogy":{"grammar":[{"match":"G0071","pattern":"普通形 + わけが ない / V辞書形 + わけには いかない","ko":"-(으)ㄹ 리가 없다 / -(으)ㄹ 수가 없다·-(으)ㄹ 수 없다","hint_zh":"『不可能…』≒ -(으)ㄹ 리가 없다、『不能/不好…』≒ -(으)ㄹ 수 없다，可对照。","caution":"わけがない 是不可能（推断）、わけにはいかない 是不能做（情理上不允许），意思差很大，韩语 리가 없다/수 없다 也分，但别把两条都翻成一个；わけ 的本义（道理/结论）韩语没有对等词。"},{"match":"G0072","pattern":"普通形 + と は 限らない","ko":"반드시 -는 것은 아니다 / -(으)란 법은 없다","hint_zh":"『未必…／不一定…』≒ 반드시 -는 것은 아니다，部分否定可对照。","caution":"とは 限らない 的 と 是引用、は 是提示，韩语 -는 것은 아니다/-란 법은 없다 结构不同源；它否定的是必然而非全部，别和 わけではない（G0053 部分否定）混，两者韩语都可能翻 -는 것은 아니다，要靠日语区分。"}],"vocab":[{"match":"V0244","surface":"会議","ko":"회의","hint_zh":"日韩汉字词同形同义（かいぎ／회의＝会议）。","caution":"かいぎ ≠ hoeui 读音不同；会議をする≒회의하다/회의를 하다，韩语更常加 하다，别照日语 する 套。"},{"match":"V0247","surface":"報告","ko":"보고(하다)","hint_zh":"日韩汉字词同形同义（ほうこく／보고＝报告）。","caution":"ほうこく ≠ bogo 读音不同；報告する≒보고하다，但日语『ご報告いたします』的谦让语韩语要靠 드리다，别套成 보고합니다 了事。"},{"match":"V0248","surface":"相談","ko":"상담(하다)","hint_zh":"日韩汉字词形近义近（そうだん／상담＝商量/咨询）。","caution":"そうだん ≠ sangdam 读音不同；【注意】中文母语者易把『相談』理解成互相谈话，其实日语是向人请教/商量，中文『商量』不完全对等；韩语 상담 偏咨询/辅导，别按中文『聊天』套。"}]}}</script>
