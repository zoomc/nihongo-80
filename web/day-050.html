ce":"機会","kana":"きかい","romaji":"kikai","pos":"名詞","meaning_zh":"机会","jlpt":"N3","examples":[{"ja":"話す機会がありません。","zh":"没有说话的机会。","audio_text":"話す機会がありません。"}],"notes_for_zh":"「機会」きかい 名词，「〜の機会／〜する機会／機会があれば」；与「チャンス」近义但偏书面；「機」キ、「会」カイ 不可按中文 jī/huì 推；注意与「機械」きかい（机器）同音异义，听力易混。","confusables":[],"ko":"기회","ko_hint":"日韩汉字词同形同义（きかい／기회＝机会）。","caution":"きかい ≠ gihoe 读音不同；【注意】同音陷阱：日语 機械（きかい）＝机器、韩语 기계，与 機会/기회 同音却义不同，别混。"},{"id":"V0254","surface":"操作","kana":"そうさ","romaji":"sousa","pos":"名詞/サ変","meaning_zh":"操作（机器/界面）","jlpt":"N3","examples":[{"ja":"この機械は操作が簡単です。","zh":"这台机器操作很简单。","audio_text":"この機械は操作が簡単です。"}],"notes_for_zh":"「操作」そうさ 名词/サ変，「〜を操作する／操作が簡単だ」；中文“操作”义近，但日语多用于机械/系统，不说「人を操作する」（那是 操る／操縦）；「操」ソウ、「作」サク/サ，此词 作 读 サ，一字多音须验证；韩语 조작 同源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0279","surface":"出張","kana":"しゅっちょう","romaji":"shucchou","pos":"名詞/サ変","meaning_zh":"出差","jlpt":"N3","examples":[{"ja":"来週、大阪へ出張します。","zh":"下周去大阪出差。","audio_text":"来週、大阪へ出張します。"}],"notes_for_zh":"中文无“出张”一词；「出張」是因公去外地；读 しゅっちょう（促音），不是 しゅちょう。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0289","surface":"対象","kana":"たいしょう","romaji":"taishou","pos":"名詞","meaning_zh":"对象；适用对象","jlpt":"N3","examples":[{"ja":"この講座の対象は中学生です。","zh":"这个讲座的对象是初中生。","audio_text":"この講座の対象は中学生です。"}],"notes_for_zh":"中文“对象”可指恋人或目标，日语「対象」是制度/调查的适用对象；「〜が対象です」。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0290","surface":"条件","kana":"じょうけん","romaji":"jouken","pos":"名詞","meaning_zh":"条件","jlpt":"N3","examples":[{"ja":"応募の条件を確認しました。","zh":"确认了报名条件。","audio_text":"応募の条件を確認しました。"}],"notes_for_zh":"「条件」是申请/合同的前提；「条件を満たす／条件を確認する」；中文“条件”也可指“状况”，日语多用「状況」。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0293","surface":"家賃","kana":"やちん","romaji":"yachin","pos":"名詞","meaning_zh":"房租","jlpt":"N3","examples":[{"ja":"家賃は毎月二十五日に払います。","zh":"房租每月25日支付。","audio_text":"家賃は毎月二十五日に払います。"}],"notes_for_zh":"中文无“家赁”通用说法；日语「家賃」=房租；读 やちん，不是 かちん。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0085","pattern":"普通形 + 一方(で) / 反面 / 代わりに","meaning_zh":"一方面…另一方面…／…但另一方面／取而代之、作为交换","connection":"動詞・い形 普通形 / な形・名詞 である + 一方(で)・反面；名詞＋の・普通形 + 代わりに","example":"この仕事は給料が高い一方で、残業も多いです。","usage":"一方で 并列同一事物的两面（可同褒贬）；反面 强调「反面/弊端」；代わりに 是替代或交换条件","explanation_zh":"意思是「一方面…另一方面…／…但另一方面／取而代之、作为交换」；接续：動詞・い形 普通形 / な形・名詞 である + 一方(で)・反面；名詞＋の・普通形 + 代わりに（中文术语：动词・い形 简体 / な形・名词 である + 一方(で)・反面；名词＋の・简体 + 代わりに）；用法：一方で 并列同一事物的两面（可同褒贬）；反面 强调「反面/弊端」；代わりに 是替代或交换条件","common_errors":[{"wrong":"便利だ一方で、費用がかかります。","why":"な形/名词 接 一方で 用 便利な／である，不用 だ；中文「方便一方面」直译保留 だ 错","fix":"便利な一方で、費用がかかります。","learner":"zh"},{"wrong":"給料が高い反面で、やりがいもあります。","why":"反面 本身已含「反面」，不叠 で（高い反面、…）；且后项多接负面，中文「另一方面」直译混褒贬","fix":"給料が高い反面、残業が多いです。","learner":"zh"}],"compare":[{"id":"G0075","diff":"のに 是逆接转折（意外/不满）；一方で/反面 是并列两面，不含意外情绪"},{"id":"G0037","diff":"から/ので 因果顺接；一方で 是并列对照，不表因果"}],"examples":[{"ja":"この仕事は給料が高い一方で、残業も多いです。","zh":"这工作工资高，另一方面加班也多。","audio_text":"この仕事は給料が高い一方で、残業も多いです。"},{"ja":"便利な反面、費用がかかります。","zh":"方便是方便，反面花费也高。","audio_text":"便利な反面、費用がかかります。"}],"ko":"-는 한편(으로)·-는 반면(에) / -대신(에)","ko_hint":"『一方面…另一方面』≒ -는 한편/반면、『…但另一方面』≒ -는 반면、『取而代之/作为交换』≒ -대신，可成组对照。","caution":"日语 一方で/反面 都表对照但 一方で 还能表同时进行，韩语 한편/반면 分工不完全一致；代わりに 还表代替/补偿，韩语 -대신 也有但语感不同；三者别一律翻 -반면。"},{"id":"G0066","pattern":"V辞書形 / Vない形 + ことが ある","meaning_zh":"有时会…／有时不…（泛指倾向）","connection":"動詞 辞書形／ない形 + ことが ある；ある 可变形（ことがあります／あった）","example":"忙しくて、昼ご飯を忘れることがあります。","usage":"表示偶尔发生、有时会那样；与 〜たことがある（G0042，曾经做过）时态语义都不同","explanation_zh":"意思是「有时会…／有时不…（泛指倾向）」；接续：動詞 辞書形／ない形 + ことが ある；ある 可变形（ことがあります／あった）（中文术语：动词 辞书形／ない形 + ことが ある；ある 可变形（ことがあります／あった））；用法：表示偶尔发生、有时会那样；与 〜たことがある（G0042，曾经做过）时态语义都不同","common_errors":[{"wrong":"北海道へ行ったことがあります。（想说有时会去）","why":"「有时会去」须用 辞书形 行くことがある；たことがある 是「去过」，中文「有时」直译易混","fix":"北海道へ行くことがあります。","learner":"zh"},{"wrong":"忘れることがありますでした。","why":"「あります」已含礼貌体，不能再叠 でした；中文无时态变化易堆敬体","fix":"忘れることがありました。","learner":"zh"}],"compare":[{"id":"G0042","diff":"〜たことがある 是「曾经做过（至今为止的经验）」用 た形；〜ことがある 是「有时会（习惯/倾向）」用 辞书形"}],"examples":[{"ja":"忙しくて、昼ご飯を忘れることがあります。","zh":"忙起来有时会忘了吃午饭。","audio_text":"忙しくて、昼ご飯を忘れることがあります。"},{"ja":"彼はたまに遅刻することがあります。","zh":"他偶尔会迟到。","audio_text":"彼はたまに遅刻することがあります。"}],"ko":"-(으)ㄹ 때가 있다 / -기도 하다 / -지 않을 때가 있다","ko_hint":"『有时会…／有时不…』≒ -(으)ㄹ 때가 있다，泛指倾向可对照（与 G0042 经历不同）。","caution":"日语用辞书形＝有时、た形＝曾经（G0042），只差动词形，韩语 -(으)ㄹ 때가 있다/-(으)ㄴ 적이 있다 是两套，别把两条都翻成 있다；ことがある 的 がある 不表存在某物，别套 있다。"}],"kanji":[{"id":"K0122","char":"故","onyomi":["コ"],"kunyomi":["ゆえ"],"meaning_zh":"故；原因；旧；故障","zh_trap":"中文「故」gù（故事/原因/旧的）；日语「故障」こしょう 是「故障/出毛病」，中文易按「故事/故意」误解；音读 コ、训读 ゆえ（故に），不能靠汉字猜词。","vocab_refs":["V0253"],"examples":[{"ja":"故障","kana":"こしょう","zh":"故障；出毛病"}],"ko_hint":""},{"id":"K0123","char":"障","onyomi":["ショウ"],"kunyomi":["さわる"],"meaning_zh":"障；障碍；故障","zh_trap":"中文「障」zhàng；日语 障 音读 ショウ，「故障」こしょう「障害」しょうがい；「故障」与中文同形同义（少数一致），但「障害」しょうがい 是「障碍/残疾」，不能一律按中文推。","vocab_refs":["V0253"],"examples":[{"ja":"故障","kana":"こしょう","zh":"故障；出毛病"}],"ko_hint":""}],"questions":[{"id":"Q0318","type":"free_production","prompt_ja":"","prompt_zh":"用「V辞書形＋ことが ある」（G0066）写一句话，说明自己『有时会…』的习惯；注意别写成『曾经做过』。","options":[],"answer":"","rationale":"「V辞書形＋ことがある」＝有时会（泛指倾向，G0066）；「Vた形＋ことがある」＝曾经做过（G0042）。两者只差动词形，中文母语者极易混；可配 時々／忙しいとき 等。","audio_text":"","rubric":"①用辞书形而非た形（区分 G0042）1 分；②ことがある表泛指倾向 1 分；③频率副词/时间语境与句子自然 1 分","expected_production":"忙しいときは、昼ご飯を忘れることがあります。","difficulty":4},{"id":"Q0395","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，何で大阪へ行きますか。","options":["新幹線","飛行機","車","バス"],"answer":"飛行機","rationale":"A 以为坐新干线，B 说部长要求改坐飞机；理由是对方工厂在机场附近。最终交通工具是飞机。","audio_text":"A：来週の大阪出張、新幹線で行くよね。\nB：それが、部長から飛行機にしろと言われたんだ。","rubric":"选 飛行機 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0155","type":"fill","prompt_ja":"明日は来___いいです。（不来也行）","prompt_zh":"填入表「不做也可以」的接续","options":[],"answer":"なくても","rationale":"ない形 来ない → 来なくて + も + いい，不是 来ないでも","audio_text":"","rubric":"填 なくても 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0156","type":"listen","prompt_ja":"听录音，写出听到的整句。","prompt_zh":"听写整句","options":[],"answ
