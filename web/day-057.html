<script type="application/json" id="nh80-day">{"day":57,"phase":"P4","theme":"意见讨论｜Nの / Vている + 最中に（だ）・Vた形 + ところで・恥ずかしい","scene":"【意见讨论】意见讨论：读一段意见讨论，用「Nの / Vている + 最中に（だ）」说明两种看法的差异和自己的立场（素材：人によって違います｜主题键：discussion｜对齐：exact）","scene_tag":"意见讨论","scene_topic_key":"discussion","scene_topic":"意见讨论","topic_match":"exact","material_topic_keys":["discussion","work"],"material_pair":"mixed_topic","can_do":"读一段意见讨论，用「Nの / Vている + 最中に（だ）」说明两种看法的差异和自己的立场","focus":["grammar","production"],"objectives":["能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","能从一小段通知或短文里找出主要意思，并说出一句依据","能把今天学的说法用到一个新场景，而不是只背原句","当天新词：恥ずかしい、看病、遠慮（读音与用法都要验证，不靠汉字猜义）","当天句型：Nの / Vている + 最中に（だ）、Vた形 + ところで，须说出接续条件","当天汉字：操、作，音读/训读各给一例","Can-do：读一段意见讨论，用「Nの / Vている + 最中に（だ）」说明两种看法的差异和自己的立场"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【意见讨论】意见讨论：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0229","surface":"恥ずかしい","kana":"はずかしい","romaji":"hazukashii","pos":"い形容詞","meaning_zh":"害羞；难为情；惭愧","jlpt":"N3","examples":[{"ja":"間違えて恥ずかしかったです。","zh":"弄错了，很不好意思。","audio_text":"間違えて恥ずかしかったです。"}],"notes_for_zh":"「恥ずかしい」はずかしい い形容詞，“害羞/丢脸”；与「恥」はじ（名词）、「照れ臭い」てれくさい 词类不同；中文“不好意思”日语须按语境选（道歉用 すみません），不能一律直译；い形变形；「恥」チ/はじ 训读不能靠猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0259","surface":"看病","kana":"かんびょう","romaji":"kanbyou","pos":"名詞/サ変","meaning_zh":"护理；照料病人","jlpt":"N3","examples":[{"ja":"母が入院して、看病しています。","zh":"妈妈住院了，我在护理她。","audio_text":"母が入院して、看病しています。"}],"notes_for_zh":"中日同形异义最典型：中文「看病」kànbìng 是“病人去就诊 / 医生诊治”，日语「看病」かんびょう 是“护理、照料病人”，主客完全颠倒，绝不能靠汉字猜词；「病人を看病する／看病に行く」；与「世話」せわ 近义但专指病人；「看」カン（看護 かんご）、「病」ビョウ 不可按中文 kàn/bìng 推。","confusables":["V0189"],"ko":"","ko_hint":"","caution":""},{"id":"V0239","surface":"遠慮","kana":"えんりょ","romaji":"enryo","pos":"名詞/サ変","meaning_zh":"客气；顾虑；谢绝","jlpt":"N3","examples":[{"ja":"どうぞ遠慮なく召し上がってください。","zh":"请别客气，尽管吃。","audio_text":"どうぞ遠慮なく召し上がってください。"}],"notes_for_zh":"「遠慮」えんりょ 名词/サ変，「遠慮する／遠慮なく／ご遠慮ください」；别人劝食时「遠慮します」是“我就不客气（谢绝）了”，与中文“不客气”（接受）容易反解——典型语用陷阱；「遠」エン、「慮」リョ 不可按中文 yuǎn/lǜ 推。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0240","surface":"見つける","kana":"みつける","romaji":"mitsukeru","pos":"動詞/一段","meaning_zh":"找到（他动）","jlpt":"N3","examples":[{"ja":"鍵を見つけました。","zh":"找到钥匙了。","audio_text":"鍵を見つけました。"}],"notes_for_zh":"「見つける」一段他动词，“（有意搜寻而）找到”，宾语用 を；自动词「見つかる」用 が（鍵が見つかった）；中文“找到”无自他之分，日语「鍵を見つける」vs「鍵が見つかる」必须分——中文母语者高频错；复合自他对，不能靠汉字猜。","confusables":["V0241"],"ko":"","ko_hint":"","caution":""},{"id":"V0242","surface":"変える","kana":"かえる","romaji":"kaeru","pos":"動詞/一段","meaning_zh":"改变（他动）","jlpt":"N3","examples":[{"ja":"予定を変えました。","zh":"改了计划。","audio_text":"予定を変えました。"}],"notes_for_zh":"「変える」一段他动词，“改变（宾语用 を）”，自动词「変わる」かわる（が）；与「直す」なおす（改正错误/修理）不同——“改时间/改计划”用 変える，“改错字”用 直す，中文「改」一字日语须分；「変」ヘン/かえる 不可按中文 biàn 推。","confusables":["V0158"],"ko":"","ko_hint":"","caution":""},{"id":"V0247","surface":"報告","kana":"ほうこく","romaji":"houkoku","pos":"名詞/サ変","meaning_zh":"报告；汇报","jlpt":"N3","examples":[{"ja":"上司に結果を報告します。","zh":"向上司汇报结果。","audio_text":"上司に結果を報告します。"}],"notes_for_zh":"「報告」ほうこく 名词/サ変，「人に〜を報告する」对象用 に、内容用 を；与「説明」（解释清楚）不同：報告 是“向上/向组织汇报”；中文“一份报告”日语多用「レポート」；「報」ホウ、「告」コク 不可按中文 bào/gào 推。","confusables":["V0170"],"ko":"보고(하다)","ko_hint":"日韩汉字词同形同义（ほうこく／보고＝报告）。","caution":"ほうこく ≠ bogo 读音不同；報告する≒보고하다，但日语『ご報告いたします』的谦让语韩语要靠 드리다，别套成 보고합니다 了事。"},{"id":"V0248","surface":"相談","kana":"そうだん","romaji":"soudan","pos":"名詞/サ変","meaning_zh":"商量；咨询","jlpt":"N3","examples":[{"ja":"先生に進路を相談します。","zh":"找老师商量升学去向。","audio_text":"先生に進路を相談します。"}],"notes_for_zh":"「相談」そうだん 名词/サ変，「人に〜を相談する／人と相談する」：对象用 に（向谁）或 と（和谁），内容用 を；中文“跟老师商量”用 に/と 不能漏；「相」ソウ、「談」ダン 不可按中文 xiāng/tán 推；韩语 상담 同源可帮记，但不能靠汉字猜助词。","confusables":[],"ko":"상담(하다)","ko_hint":"日韩汉字词形近义近（そうだん／상담＝商量/咨询）。","caution":"そうだん ≠ sangdam 读音不同；【注意】中文母语者易把『相談』理解成互相谈话，其实日语是向人请教/商量，中文『商量』不完全对等；韩语 상담 偏咨询/辅导，别按中文『聊天』套。"}],"grammar":[{"id":"G0089","pattern":"Nの / Vている + 最中に（だ）","meaning_zh":"正在…的时候（突然…）","connection":"名詞 + の + 最中に；動詞ている + 最中に；句末可 最中だ","example":"会議の最中に、電話が鳴りました。","usage":"强调某动作/状态正进行到一半时，发生了另一件事，后项常是打扰或意外。","explanation_zh":"意思是「正在…的时候（突然…）」；接续：名詞 + の + 最中に；動詞ている + 最中に；句末可 最中だ（中文术语：名词 + の + 最中に；动词ている + 最中に；句末可 最中だ）；用法：强调某动作/状态正进行到一半时，发生了另一件事，后项常是打扰或意外。","common_errors":[{"wrong":"会議の最中を、電話が鳴りました。","why":"最中 后接时间点用 に，不用 を；中文“在会议中”直译成 を。","fix":"会議の最中に、電話が鳴りました。","learner":"zh"},{"wrong":"会議の最中にで、電話が鳴りました。","why":"最中に 后不接 で；中文“在…当中”直译加 で。","fix":"会議の最中に、電話が鳴りました。","learner":"zh"}],"compare":[{"id":"G0027","diff":"ている 只表进行；最中に 强调“正做到一半”且后项打断。"}],"examples":[{"ja":"会議の最中に、電話が鳴りました。","zh":"正在开会时电话响了。","audio_text":"会議の最中に、電話が鳴りました。"},{"ja":"ご飯の最中に、突然停電しました。","zh":"正吃饭时突然停电了。","audio_text":"ご飯の最中に、突然停電しました。"}],"ko":"","ko_hint":"","caution":""},{"id":"G0090","pattern":"Vた形 + ところで","meaning_zh":"即使…也（不会有预期结果）","connection":"動詞た形 + ところで；后项多为否定或无意义的结果","example":"今更謝ったところで、間に合いません。","usage":"表示即使前项成立，后项也不会改变；常与「無駄だ／変わらない／〜ない」呼应。","explanation_zh":"意思是「即使…也（不会有预期结果）」；接续：動詞た形 + ところで；后项多为否定或无意义的结果（中文术语：动词た形 + ところで；后项多为否定或无意义的结果）；用法：表示即使前项成立，后项也不会改变；常与「無駄だ／変わらない／〜ない」呼应。","common_errors":[{"wrong":"何度説明するところで、彼は理解しないでしょう。","why":"ところで（即使）接た形，不接辞书形；中文“即使说明”直译用原形。","fix":"何度説明したところで、彼は理解しないでしょう。","learner":"zh"},{"wrong":"今更謝るたところで、間に合いません。","why":"た形是「謝った」，不是「謝るた」；中文按原形硬加た。","fix":"今更謝ったところで、間に合いません。","learner":"zh"}],"compare":[{"id":"G0075","diff":"のに 是“明明…却”带不满；ところで 是“即使…也没用”，后项多否定。"}],"examples":[{"ja":"今更謝ったところで、間に合いません。","zh":"事到如今再道歉也来不及了。","audio_text":"今更謝ったところで、間に合いません。"},{"ja":"何度説明したところで、彼は分からないでしょう。","zh":"即使说明多少次，他也不会明白吧。","audio_text":"何度説明したところで、彼は分からないでしょう。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0124","char":"操","onyomi":["ソウ"],"kunyomi":["あやつる"],"meaning_zh":"操；操作；操弄","zh_trap":"中文「操」cāo；日语 操 音读 ソウ（操作 そうさ）、训读 あやつる（操る）；「操作」是「操作（机器）」，中文「操」另有粗俗义，日语无，不能按中文义域推。","vocab_refs":["V0254"],"examples":[{"ja":"操作","kana":"そうさ","zh":"操作（机器/界面）"}],"ko_hint":""},{"id":"K0125","char":"作","onyomi":["サク","サ"],"kunyomi":["つくる"],"meaning_zh":"作；制作；作品；操作","zh_trap":"中文「作」zuò/zuō；日语 作 音读 サク（作文 さくぶん）/サ（作業 さぎょう、操作 そうさ 中读 サ）、训读 つくる（作る）；一字多音须逐词验证，不能按中文 zuò 推。","vocab_refs":["V0254"],"examples":[{"ja":"操作","kana":"そうさ","zh":"操作（机器/界面）"}],"ko_hint":""}],"questions":[{"id":"Q0226","type":"mcq","prompt_ja":"「どうぞたくさん食べてください」「すみません、甘いものは ___ します」","prompt_zh":"选出表示委婉谢绝的词","options":["満足","感動","安心","遠慮"],"answer":"遠慮","rationale":"「〜は遠慮します」是委婉谢绝『…就不吃了/我就不领了』的固定说法；「安心/満足/感動」语义不通。中文『远虑』无此义，属同形异义陷阱。","audio_text":"","rubric":"选 遠慮 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0243","type":"listen","prompt_ja":"会話を聞いて、二人の関係を答えてください。","prompt_zh":"说话的两人是什么关系？","options":["医者と患者","兄弟","部長と部下","店員と客"],"answer":"部長と部下","rationale":"「部長」这一称呼，以及「用意して／お送りします」「増やしていただけませんか」的敬语方向，说明是上司（部长）与部下；请求由部长发向部下。","audio_text":"田中さん、明日の会議の資料はもうできていますか。はい、部長。夕方までに用意して、メールでお送りします。ありがとう。実は取引先が急に来ることになったので、資料を一枚増やしていただけませんか。分かりました。追加します。","rubric":"选 部長と部下 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0246","type":"listen","prompt_ja":"電話を聞いて、客が希望している部屋を選んでください。","prompt_zh":"客人希望要什么样的房间？","options":["駅が見える部屋","二つ並んだ部屋","安い部屋","禁煙の部屋"],"answer":"駅が見える部屋","rationale":"客人明确说「できれば駅が見える部屋をお願いします」。人数与晚数是「二人で一泊」，但问题问的是对房间的希望，不能答成人数/价格。","audio_text":"はい、さくらホテルでございます。明日の夜、部屋を予約したいのですが。かしこまりました。何名様で、何泊でしょうか。二人で一泊です。できれば駅が見える部屋をお願いします。少々お待ちください。確認いたします。","rubric":"选 駅が見える部屋 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0257","type":"read","prompt_ja":"件名：明日の会議について／田中様　お疲れさまです。佐藤です。明日の会議ですが、開始時間を十時から十一時に変更いたしました。資料は今日中にメールでお送りします。お忙しいところ恐れ入りますが、ご確認のほどよろしくお願いいたします。","prompt_zh":"这封邮件的主要事项是什么？","options":["会議の開始時間が変わったこと","会議が中止になったこと","資料が作れなかったこと","佐藤が休むこと"],"answer":"会議の開始時間が変わったこと","rationale":"「十時から十一時に変更いたしました」是用件（G0065 主观决定的结果用于告知）。资料是「今日中に送る」（会发），中止、缺席均无记述。","audio_text":"","rubric":"选 会議の開始時間が変わったこと 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0263","type":"read","prompt_ja":"いつもご利用ありがとうございます。改装工事のため、来週の月曜日から水曜日まで、当店は臨時休業とさせていただきます。木曜日からは、これまでより一時間早い朝九時に開店し、夜は同じく二十時まで営業します。ご迷惑をおかけしますが、よろしくお願いいたします。","prompt_zh":"周四以后，变化的是什么？","options":["店の場所","開店時間","休業する曜日","閉店時間"],"answer":"開店時間","rationale":"「朝九時に開店」（原为十时）＝开店时间提前；「夜は同じく二十時まで」＝闭店不变。临时休业是周一至周三，不含周四以后；场所无记述。","audio_text":"","rubric":"选 開店時間 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0319","type":"free_production","prompt_ja":"","prompt_zh":"假设你是新职员，用「〜て ほしい」（G0060）和「説明／操作／連絡」中至少一个词，写一句希望前辈做的事。","options":[],"answer":"","rationale":"「N に Vて ほしい」动作主体用 に（G0060）；后辈对前辈须用礼貌体并加铺垫（先輩、すみませんが…）；恰当使用至少一个给定 N3/N4 词。","audio_text":"","rubric":"①N に Vてほしい且主体用に 1 分；②恰用至少一个给定词 1 分；③礼貌体、符合后辈对前辈语气 1 分","expected_production":"先輩、この機械の操作をもう一度説明してほしいのですが。","difficulty":4}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","text_ja":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","text_kana":"","text_zh":"喜好因人而异。对我来说日语很难。我们来聊聊日语吧。","focus_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","url":"","license":"original"},{"id":"M0085","kind":"listening","title":"取引先と担当者：納品日の変更","text_ja":"A：山川商事の佐藤です。パンフレットの納品日の件でお電話しました。\nB：みなみ営業部の鈴木です。取引先の佐藤さまですね。いつもお世話になっております。\nA：こちらこそお世話になっております。納品は金曜日でお願いしていましたが。\nB：はい。ただ、あいにく金曜日はトラックが足りません。\nA：では、木曜日に変更できますか。\nB：木曜日の午前中でしたら、お届けできます。\nA：助かります。午前十時ごろに会場へお願いします。\nB：承知しました。念のため、前日にご連絡いたします。","text_kana":"A：やまかわしょうじのさとうです。パンフレットののうひんびのけんでおでんわしました。\nB：みなみえいぎょうぶのすずきです。とりひきさきのさとうさまですね。いつもおせわになっております。\nA：こちらこそおせわになっております。のうひんはきんようびでおねがいしていましたが。\nB：はい。ただ、あいにくきんようびはトラックがたりません。\nA：では、もくようびにへんこうできますか。\nB：もくようびのごぜんちゅうでしたら、おとどけできます。\nA：たすかります。ごぜんじゅうじごろにかいじょうへおねがいします。\nB：しょうちしました。ねんのため、ぜんじつにごれんらくいたします。","text_zh":"A：我是山川商事的佐藤。为宣传册交货日的事打电话来。\nB：我是南营业部的铃木。是客户方的佐藤先生吧。一直承蒙关照。\nA：彼此彼此。交货原本拜托安排在周五。\nB：是的。只是不巧周五货车不够。\nA：那么能改到周四吗？\nB：周四上午的话可以送到。\nA：帮大忙了。请上午十点左右送到会场。\nB：知道了。为保险起见，前一天会联系您。","focus_zh":"人物关系是客户公司与供货方负责人。信息干扰：原定周五，因货车不足改为周四上午；交货地点是会场。","audio_text":"A：山川商事の佐藤です。パンフレットの納品日の件でお電話しました。\nB：みなみ営業部の鈴木です。取引先の佐藤さまですね。いつもお世話になっております。\nA：こちらこそお世話になっております。納品は金曜日でお願いしていましたが。\nB：はい。ただ、あいにく金曜日はトラックが足りません。\nA：では、木曜日に変更できますか。\nB：木曜日の午前中でしたら、お届けできます。\nA：助かります。午前十時ごろに会場へお願いします。\nB：承知しました。念のため、前日にご連絡いたします。","url":"","license":"original"}],"viz":{"day":57,"phase":"P4","new_count":11,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"人によって好きなものが違います。","kana":"","zh":"喜好因人而异。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。","origin":"material","source_id":"M0023"},{"ja":"私にとって、日本語は難しいです。","kana":"","zh":"对我来说日语很难。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"私にとって、日本語は難しいです。","origin":"material","source_id":"M0023"},{"ja":"日本語について話しましょう。","kana":"","zh":"我们来聊聊日语吧。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"日本語について話しましょう。","origin":"material","source_id":"M0023"}],"review_plan":[{"kid":"V0194","surface":"すっかり","kana":"すっかり","zh":"完全；全然（状态全变）","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":56,"next_hint_zh":"按课程间隔，大约 Day 58 再预习","planned_only":true},{"kid":"V0225","surface":"感動","kana":"かんどう","zh":"感动","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":56,"next_hint_zh":"按课程间隔，大约 Day 58 再预习","planned_only":true},{"kid":"V0221","surface":"満足","kana":"まんぞく","zh":"满足；满意","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":56,"next_hint_zh":"按课程间隔，大约 Day 58 再预习","planned_only":true},{"kid":"V0223","surface":"不安","kana":"ふあん","zh":"不安；担心","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":56,"next_hint_zh":"按课程间隔，大约 Day 58 再预习","planned_only":true},{"kid":"V0224","surface":"残念","kana":"ざんねん","zh":"遗憾；可惜","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":56,"next_hint_zh":"按课程间隔，大约 Day 58 再预习","planned_only":true},{"kid":"V0227","surface":"嬉しい","kana":"うれしい","zh":"高兴；开心","reason_zh":"这是预习建
