<script type="application/json" id="nh80-day">{"day":79,"phase":"P6","theme":"医院问诊｜医院问诊","scene":"【医院问诊】医院问诊：在医院问诊中用「普通形 + はずがない」说明症状从何时开始、如何变化，并复述医嘱（素材：睡眠と生活習慣｜主题键：health｜对齐：review）","scene_tag":"医院问诊","scene_topic_key":"health","scene_topic":"医院问诊","topic_match":"review","material_topic_keys":["health","health"],"material_pair":"same_topic","can_do":"在医院问诊中用「普通形 + はずがない」说明症状从何时开始、如何变化，并复述医嘱","focus":["reading","listening"],"objectives":["能分清 当天新词 和意思相近的词，别按中文硬套","能读准今天汉字的日语读音，不照中文读音猜","能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","Can-do：在医院问诊中用「普通形 + はずがない」说明症状从何时开始、如何变化，并复述医嘱"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【医院问诊】医院问诊：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[],"grammar":[],"kanji":[],"questions":[{"id":"Q0364","type":"mcq","prompt_ja":"来月から営業部に来る後藤さんへ。今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。丸井商店は、毎月二十五日までに注文の確認をしないと、次の月の納品が遅れます。北川工業は、担当者が先月変わったばかりなので、こちらから連絡したほうがいいでしょう。引き継ぎの資料は、共有フォルダーの「営業引継ぎ」に入れてあります。分からないことがあったら、遠慮なく聞いてください。来週の月曜日に、一時間ほど時間を取って、一緒に確認しましょう。","prompt_zh":"【読解】根据第3句，丸井商店について気をつけることはどれですか。","options":["北川工業に連絡する","毎週月曜日に担当者を変える","毎月25日までに注文の確認をする","納品をわざと遅らせる"],"answer":"毎月25日までに注文の確認をする","rationale":"第3句「毎月二十五日までに注文の確認をしないと、次の月の納品が遅れます」=必须在25日前确认订单。其余是曲解。","audio_text":"","rubric":"选 毎月25日までに注文の確認をする 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0365","type":"mcq","prompt_ja":"今年、この町を訪れた観光客は、去年より二割増えました。特に、週末に開かれる朝市を見に来る人が多く、地元の野菜や加工品がよく売れています。一方で、観光客の車が増えたことで、住民からは「道が混みすぎる」という声も上がっています。町は来月から、中心部に限って車の進入を制限し、代わりに無料のバスを走らせる方針です。商店の店主からは賛成の声がある一方、車で来る客が減ることを心配する声もあります。町は来月、住民説明会を開く予定です。","prompt_zh":"【読解】根据第4句，町が来月から行うことはどれですか。","options":["朝市を中止する","すべての車の進入を禁止する","中心部の車の進入を制限し、無料バスを走らせる","駐車場をすべて無料にする"],"answer":"中心部の車の進入を制限し、無料バスを走らせる","rationale":"第4句「中心部に限って車の進入を制限し、代わりに無料のバスを走らせる」=仅限中心部限制车辆，替代开通免费公交。不是全面禁止，也没说停早市。","audio_text":"","rubric":"选 中心部の車の進入を制限し、無料バスを走らせる 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0367","type":"mcq","prompt_ja":"夏の暑い日は、熱中症の予防に注意が必要です。熱中症は、屋外だけでなく、風の通らない室内でも起こります。のどが渇いたと感じたときには、すでに体の水分が足りなくなっていることが多いので、時間を決めてこまめに水を飲みましょう。汗をたくさんかいた日は、水だけでなく、塩分も一緒に取ることが大切です。朝から頭が痛い、気分が悪いと感じたら、無理をせず、涼しい場所で休んでください。それでもよくならないときは、すぐに病院へ行きましょう。","prompt_zh":"【読解】根据第3句，のどが渇いたと感じたとき、体はどうなっていることが多いですか。","options":["水分が十分にある","塩分が多すぎる","熱中症が治っている","すでに水分が足りなくなっている"],"answer":"すでに水分が足りなくなっている","rationale":"第3句「すでに体の水分が足りなくなっていることが多い」=感到口渴时往往已经缺水。不是水分充足或已恢复。","audio_text":"","rubric":"选 すでに水分が足りなくなっている 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0374","type":"mcq","prompt_ja":"図書館の利用カードの有効期限は、発行から三年です。期限を過ぎると、本を借りることができなくなりますので、更新の手続きをしてください。更新には、現在使っているカードと、住所が分かる書類が必要です。住所が変わった方は、新しい住所を届け出てから、更新してください。手続きは、中央図書館のほか、駅前の分館でもできます。混雑を避けたい方は、平日の午前中に来ることをおすすめします。カードの再発行には、三百円かかります。","prompt_zh":"【読解】根据第4句，引っ越して住所が変わった人はどうすればいいですか。","options":["300円払って再発行する","新しい住所を届け出てから更新する","カードを新規に作る","古い住所のまま更新する"],"answer":"新しい住所を届け出てから更新する","rationale":"第4句「新しい住所を届け出てから、更新してください」=先申报新住址再更新。不是旧地址更新、新办或补办。补办300日元是第7句。","audio_text":"","rubric":"选 新しい住所を届け出てから更新する 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0376","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，部下は念のため何部用意しますか。","options":["13部","15部","10部","12部"],"answer":"15部","rationale":"部长要13部（12人+1），田中回答「念のため、十五部用意しておきます」。问“念のため”即15部，不是13部。","audio_text":"A：出席者は十二人なので、十三部お願いします。\nB：十三部ですね。念のため、十五部用意しておきます。","rubric":"选 15部 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0384","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，手伝いはいつになりましたか。","options":["日曜日の午後","土曜日の午前9時","日曜日の朝","土曜日の夕方6時ごろ"],"answer":"土曜日の夕方6時ごろ","rationale":"周六上午→看牙改周日→周日房东来→最后定周六傍晚，A 问六点左右，B 同意。","audio_text":"B：あ、ごめん。土曜日は昼から歯医者だった。日曜日でもいい？\nA：日曜日は大家さんが来るから、午後は無理なんだ。\nB：じゃあ、土曜日の夕方ならどう？　歯医者が終わってから行くよ。\nA：助かる。六時ごろでいい？\nB：うん。軽トラックは借りたの？","rubric":"选 土曜日の夕方6時ごろ 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0065","kind":"reading","title":"睡眠と生活習慣","text_ja":"睡眠不足が続くと、仕事や勉強の能率が下がるだけでなく、体の免疫力も弱くなります。成人の場合、六時間から八時間の睡眠が目安とされていますが、時間よりも大切なのは、毎日ほぼ同じ時刻に寝て、同じ時刻に起きることです。寝る前にスマートフォンを見ると、脳が起きたままと感じて、眠りにくくなることがあります。どうしても眠れないときは、無理に布団に入らず、部屋を暗くして軽くストレッチをするのも一つの方法です。昼寝をするなら、三十分以内にするとよいでしょう。","text_kana":"すいみんぶそくがつづくと、しごとやべんきょうののうりつがさがるだけでなく、からだのめんえきりょくもよわくなります。せいじんのばあい、ろくじかんからはちじかんのすいみんがめやすとされていますが、じかんよりもたいせつなのは、まいにちほぼおなじじこくにねて、おなじじこくにおきることです。ねるまえにスマートフォンをみると、のうがおきたままとかんじて、ねむりにくくなることがあります。どうしてもねむれないときは、むりにふとんにはいらず、へやをくらくしてかるくストレッチをするのもひとつのほうほうです。ひるねをするなら、さんじゅっぷんいないにするとよいでしょう。","text_zh":"持续睡眠不足，不仅工作学习效率下降，身体免疫力也会变弱。成年人一般以六到八小时睡眠为目标，但比时长更重要的是每天几乎同一时间睡、同一时间起。睡前看手机会让大脑感觉还醒着，有时更难入睡。实在睡不着时，不要硬躺进被子，把房间调暗做点轻度拉伸也是一种办法。如果要午睡，最好控制在三十分钟以内。","focus_zh":"「目安」是参考标准不是硬性规定；「時間よりも大切なのは…ことです」重点在规律；「眠りにくくなることがあります」是“有可能”，不是必然。","audio_text":"睡眠不足が続くと、仕事や勉強の能率が下がるだけでなく、体の免疫力も弱くなります。成人の場合、六時間から八時間の睡眠が目安とされていますが、時間よりも大切なのは、毎日ほぼ同じ時刻に寝て、同じ時刻に起きることです。寝る前にスマートフォンを見ると、脳が起きたままと感じて、眠りにくくなることがあります。どうしても眠れないときは、無理に布団に入らず、部屋を暗くして軽くストレッチをするのも一つの方法です。昼寝をするなら、三十分以内にするとよいでしょう。","url":"","license":"original"},{"id":"M0090","kind":"listening","title":"医者と患者：薬の回数","text_ja":"A：今日はどうしましたか。\nB：昨日から喉が痛くて、少し熱もあります。\nA：熱は何度ですか。\nB：三十七度八分です。\nA：風邪ですね。お薬を処方します。一日二回、朝と晩に飲んでください。\nB：一日二回ですね。\nA：あ、すみません。この薬は一日三回です。昼にも飲んでください。\nB：三回ですね。食後ですか。\nA：はい、食べた後でお願いします。三日分出します。\nB：わかりました。ありがとうございます。","text_kana":"A：きょうはどうしましたか。\nB：きのうからのどがいたくて、すこしねつもあります。\nA：ねつはなんどですか。\nB：さんじゅうななどはちぶです。\nA：かぜですね。おくすりをしょほうします。いちにちにかい、あさとばんにのんでください。\nB：いちにちにかいですね。\nA：あ、すみません。このくすりはいちにちさんかいです。ひるにものんでください。\nB：さんかいですね。しょくごですか。\nA：はい、たべたあとでおねがいします。みっかぶんだします。\nB：わかりました。ありがとうございます。","text_zh":"A：今天怎么了？\nB：昨天开始喉咙痛，还有点发烧。\nA：烧到多少度？\nB：三十七度八分。\nA：是感冒。给你开药。一天两次，早晚服用。\nB：一天两次是吧。\nA：啊，抱歉。这个药是一天三次。中午也要吃。\nB：三次是吧。饭后吗？\nA：是的，请饭后吃。开三天量。\nB：明白了。谢谢。","focus_zh":"人物关系是医生与患者。信息干扰：医生先说一日两次，马上更正为一日三次；药是三天分，饭后服用。","audio_text":"A：今日はどうしましたか。\nB：昨日から喉が痛くて、少し熱もあります。\nA：熱は何度ですか。\nB：三十七度八分です。\nA：風邪ですね。お薬を処方します。一日二回、朝
