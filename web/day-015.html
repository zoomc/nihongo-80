0110","surface":"なる","kana":"なる","romaji":"naru","pos":"動詞/五段","meaning_zh":"变成；成为","jlpt":"N5","examples":[{"ja":"医者になりました。","zh":"当上医生了。","audio_text":"医者になりました。"}],"notes_for_zh":"自动词，前接 名詞/な形+に、い形+く（〜くなる）；「する」是他动词表人为改变，中文「变/使…变」不分自他，日语 なる/する 要分。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0112","surface":"書く","kana":"かく","romaji":"kaku","pos":"動詞/五段","meaning_zh":"写","jlpt":"N5","examples":[{"ja":"名前を書いてください。","zh":"请写名字。","audio_text":"名前を書いてください。"}],"notes_for_zh":"五段：書きます／書いて（い音便）／書いた；「書く」用 を 标内容，中文「写」可不带对象，日语及物动词通常要宾语。","confusables":["V0113"],"ko":"쓰다","ko_hint":"『写』日语 書く、韩语 쓰다；【注意】显式警告：日语『手紙 てがみ』＝书信，韩语『信』是 편지、不是这个汉字词，中文『手纸』＝卫生纸 → 三方都不同。","caution":"かく ≠ 쓰다 来源不同；『手紙を書きます』＝写信、不是写手纸；韩语没有可套的同形汉字词，别造词。"}],"grammar":[{"id":"G0020","pattern":"て形","meaning_zh":"动词て形（连接/中顿/请求基础）","connection":"五段音便（って/んで/いて/いで/して）；一段 去る+て；カ変 来て；サ変 して","example":"本を読んでいます。","usage":"表中顿、并列、请求（てください）、进行（ている）等","explanation_zh":"意思是「动词て形（连接/中顿/请求基础）」；接续：五段音便（って/んで/いて/いで/して）；一段 去る+て；カ変 来て；サ変 して（中文术语：五段音便（って/んで/いて/いで/して）；一段 去る+て；カ変 来て；サ変 して）；用法：表中顿、并列、请求（てください）、进行（ている）等","common_errors":[{"wrong":"行くて。","why":"「行く」是促音便例外：行って；不是 い音便 行いて","fix":"行って。","learner":"zh"},{"wrong":"食べって。","why":"一段动词去 る + て；促音便只用于五段","fix":"食べて。","learner":"zh"},{"wrong":"飲みて。","why":"む 结尾是拨音便 飲んで，不是 飲みて","fix":"飲んで。","learner":"zh"}],"compare":[],"examples":[{"ja":"本を読んでいます。","zh":"正在读书。","audio_text":"本を読んでいます。"},{"ja":"食べてください。","zh":"请吃。","audio_text":"食べてください。"}],"ko":"-고 / -아서·아/어 / -(으)ㄴ데（按义选，不单一）","ko_hint":"て形表连接/中顿/并列，韩语用连接语尾，『动词连用形接后续』的结构意识可借。","caution":"て形一个形式对应韩语 -고(并列)、-아서(顺接/原因)、-아/어(连接)、-고 나서(先后) 多个语尾，无一一对等；て形还能引出 ください/いる/みる 等补助动词，韩语要换整个结构，硬套 -고 会错。"},{"id":"G0021","pattern":"た形（普通过去）","meaning_zh":"动词た形（简体过去）","connection":"て形 的 て/で → た/だ","example":"昨日、映画を見た。","usage":"简体过去；用于 たり、たことがある、たら 等；ます形过去是 ました（另一套）","explanation_zh":"意思是「动词た形（简体过去）」；接续：て形 的 て/で → た/だ（中文术语：て形 的 て/で → た/だ）；用法：简体过去；用于 たり、たことがある、たら 等；ます形过去是 ました（另一套）","common_errors":[{"wrong":"昨日、映画を見ました。（简体文中）","why":"
