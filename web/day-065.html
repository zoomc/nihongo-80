<script type="application/json" id="nh80-day">{"day":65,"phase":"P4","theme":"手续办理｜普通形 + はずがない・悩み・悲しい","scene":"【手续办理】手续办理：在手续办理窗口用「普通形 + はずがない」问清所需材料、办理顺序和领取时间（素材：住民票の写しの取り方｜主题键：procedure｜对齐：exact）","scene_tag":"手续办理","scene_topic_key":"procedure","scene_topic":"手续办理","topic_match":"exact","material_topic_keys":["procedure","procedure"],"material_pair":"same_topic","can_do":"在手续办理窗口用「普通形 + はずがない」问清所需材料、办理顺序和领取时间","focus":["production","grammar"],"objectives":["能分清 悩み、悲しい、申す 和意思相近的词，别按中文硬套","能读准今天汉字的日语读音，不照中文读音猜","能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","当天新词：悩み、悲しい、申す（读音与用法都要验证，不靠汉字猜义）","当天句型：普通形 + はずがない，须说出接续条件","当天汉字：情，音读/训读各给一例","Can-do：在手续办理窗口用「普通形 + はずがない」问清所需材料、办理顺序和领取时间"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【手续办理】手续办理：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0226","surface":"悩み","kana":"なやみ","romaji":"nayami","pos":"名詞","meaning_zh":"烦恼；苦恼","jlpt":"N3","examples":[{"ja":"進路の悩みを相談します。","zh":"商量升学/出路的烦恼。","audio_text":"進路の悩みを相談します。"}],"notes_for_zh":"「悩み」なやみ 名词，来自动词「悩む」なやむ 连用形名词化；「〜に悩む／悩みがある／悩みを打ち明ける」；「悩む」是五段自动词，对象用 に（進路に悩む），不说「進路を悩む」；汉字「悩」ノウ/なやむ，不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0228","surface":"悲しい","kana":"かなしい","romaji":"kanashii","pos":"い形容詞","meaning_zh":"悲伤；难过","jlpt":"N3","examples":[{"ja":"別れは悲しいです。","zh":"离别令人难过。","audio_text":"別れは悲しいです。"}],"notes_for_zh":"「悲しい」かなしい い形容詞，与「寂しい」さびしい（寂寞）分工，中文“难过”两词都译，日语须分；变形「悲しくない／悲しかった／悲しくて」；「悲」音读 ヒ、训读 かなしい，不能按中文 bēi 推。","confusables":["V0227"],"ko":"","ko_hint":"","caution":""},{"id":"V0238","surface":"申す","kana":"もうす","romaji":"mousu","pos":"動詞/五段","meaning_zh":"说；叫做（谦让语）","jlpt":"N3","examples":[{"ja":"田中と申します。よろしくお願いします。","zh":"我姓田中，请多关照。","audio_text":"田中と申します。よろしくお願いします。"}],"notes_for_zh":"「申す」もうす 五段，「言う」的谦让语，主语是“我/我方”；自我介绍固定「〜と申します」（比 〜と言います 更谦）；与尊敬「おっしゃる」相对，「申し上げる」更谦；中文“我叫…”日语用 と 引用，不能直译 は。","confusables":["V0236"],"ko":"","ko_hint":"","caution":""},{"id":"V0241","surface":"見つかる","kana":"みつかる","romaji":"mitsukaru","pos":"動詞/五段","meaning_zh":"被找到；（东西）找到了（自动）","jlpt":"N3","examples":[{"ja":"無くした時計が見つかりました。","zh":"丢的表找到了。","audio_text":"無くした時計が見つかりました。"}],"notes_for_zh":"「見つかる」五段自动词，“被找到/（东西）找到了”，主语用 が；与他动词「見つける」成对，中文“找到了”直译成 を 見つける 虽可，但「財布が見つかった」不能用 を；另有“被（人）发现”义（見つかって怒られた）；不能靠汉字猜自他。","confusables":["V0240"],"ko":"","ko_hint":"","caution":""},{"id":"V0246","surface":"給料","kana":"きゅうりょう","romaji":"kyuuryou","pos":"名詞","meaning_zh":"工资；薪水","jlpt":"N3","examples":[{"ja":"給料が上がりました。","zh":"工资涨了。","audio_text":"給料が上がりました。"}],"notes_for_zh":"「給料」きゅうりょう 名词，「給料が出る／上がる／もらう」；与「給与」きゅうよ、「賃金」ちんぎん 近义，日常最常用 給料；中日不能靠汉字猜：中文“给料”易误解为“发材料”；「給」キュウ、「料」リョウ 不可按中文 gěi/liào 推；韩语 급료 少用（월급 更常见），说明不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0299","surface":"共益費","kana":"きょうえきひ","romaji":"kyouekihi","pos":"名詞","meaning_zh":"公共区域费；物业公摊费","jlpt":"N3","examples":[{"ja":"共益費は五千円です。","zh":"公共区域费是5000日元。","audio_text":"共益費は五千円です。"}],"notes_for_zh":"日本租房每月另付的公共区域维护费；「共益費込み」表示含在房租里；读 きょうえきひ。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0230","surface":"羨ましい","kana":"うらやましい","romaji":"urayamashii","pos":"い形容詞","meaning_zh":"羡慕","jlpt":"N3","examples":[{"ja":"彼の語学力が羨ましいです。","zh":"羡慕他的语言能力。","audio_text":"彼の語学力が羨ましいです。"}],"notes_for_zh":"「羨ましい」うらやましい い形容詞，对象用 が（〜が羨ましい）；中文“羡慕某人”日语不说「彼を羨ましい」，须用 が——助词易错；与「妬ましい」ねたましい（嫉妒）语感不同；汉字「羨」セン/うらやむ 笔画多且训读不能靠猜。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0096","pattern":"普通形 + はずがない","meaning_zh":"不可能…；理应不会…","connection":"動詞・い形 普通形 + はずがない；な形・名詞 + な/である + はずがない","example":"彼が約束を忘れるはずがありません。","usage":"根据事实/常识强烈否定某可能性；比单纯「ない」更有推断依据。","explanation_zh":"意思是「不可能…；理应不会…」；接续：動詞・い形 普通形 + はずがない；な形・名詞 + な/である + はずがない（中文术语：动词・い形 简体 + はずがない；な形・名词 + な/である + はずがない）；用法：根据事实/常识强烈否定某可能性；比单纯「ない」更有推断依据。","common_errors":[{"wrong":"彼が来るはずがないでした。","why":"はずがない 是现在否定，过去用「はずがありませんでした／はずがなかったです」；ないでした 不合法。","fix":"彼が来るはずがありませんでした。","learner":"zh"},{"wrong":"彼が来るはずがなくです。","why":"なくです 不合法；否定句末用 ありません／ない。","fix":"彼が来るはずがありません。","learner":"zh"}],"compare":[{"id":"G0053","diff":"はずだ 是“应该会”；はずがない 是其强否定。"},{"id":"G0071","diff":"わけがない 近义，但 はずがない 更强调“按情理推断”。"}],"examples":[{"ja":"彼が約束を忘れるはずがありません。","zh":"他不可能忘记约定。","audio_text":"彼が約束を忘れるはずがありません。"},{"ja":"電車が止まっているので、今到着するはずがありません。","zh":"电车停了，现在不可能到达。","audio_text":"電車が止まっているので、今到着するはずがありません。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0139","char":"情","onyomi":["ジョウ"],"kunyomi":["なさけ"],"meaning_zh":"情；感情；信息；情况","zh_trap":"中文「情」qíng；日语 情 音读 ジョウ（情報 じょうほう、事情 じじょう）、训读 なさけ（情け）；「情報」是「信息」，中文「情报」多指机密情报，义域不同，不可按中文猜。","vocab_refs":["V0217"],"examples":[{"ja":"情報","kana":"じょうほう","zh":"信息；资讯"}],"ko_hint":""}],"questions":[{"id":"Q0220","type":"mcq","prompt_ja":"なくした鍵が、かばんの中で ___。","prompt_zh":"选出正确动词形式（自他动词之别）","options":["見つけました","見つけています","見つかりたいです","見つかりました"],"answer":"見つかりました","rationale":"「見つかる」是自动词，主语是被找到的东西（鍵が）；「見つける」是他动词，主语须是人（私が鍵を見つけた）。中文『找到了』主客易混。","audio_text":"","rubric":"选 見つかりました 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0258","type":"read","prompt_ja":"【ニュース】大型の台風が近づいており、明日の午後から西日本で雨と強い風が予想されています。交通機関への影響も心配されるため、各鉄道会社は、明日の一部の列車を運休すると発表しました。最新の情報は、各社のホームページで確認できます。","prompt_zh":"与报道内容相符的是哪一项？","options":["すべての電車が止まる","台風はもう去った","一部の列車が運休になる","明日は晴れて暑くなる"],"answer":"一部の列車が運休になる","rationale":"「一部の列車を運休すると発表」。「すべて」是扩大化，「晴れ」「去った」与本文相反。注意「〜すると発表しました」与「運休になる」的替换表达。","audio_text":"","rubric":"选 一部の列車が運休になる 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0307","type":"free_production","prompt_ja":"","prompt_zh":"用「〜一方で／反面」（G0085）写一句话，同时说出你的工作或学习的一个优点和一个缺点。","options":[],"answer":"","rationale":"「一方で」并列同一事物的两面、不含意外情绪（对比 G0075 のに）；前项用普通形，な形/名词用 便利な／である，不用 だ。","audio_text":"","rubric":"①使用〜一方で/反面并列两面 1 分；②前项普通形、后项为对照内容且不用だ 1 分；③内容具体、句子自然非逐字直译 1 分","expected_production":"この仕事は給料が高い一方で、残業も多くて大変です。","difficulty":4},{"id":"Q0327","type":"dialogue","prompt_ja":"客：明日の予約、取れていますか。／店員：（　）","prompt_zh":"作为店员，用「〜かどうか」表示『我现在确认一下是否…』。","options":[],"answer":"","rationale":"「普通形＋かどうか」（G0058）作确认的宾语从句；用「確認する／調べる」（V0162）；「少々お待ちください」＋「確認いたします」（V0238 谦让）等待客敬语。","audio_text":"","rubric":"①普通形＋かどうか 1 分；②用確認する/調べる 1 分；③少々お待ちください与谦让语自然 1 分","expected_production":"少々お待ちください。予約が入っているかどうか、確認いたします。","difficulty":4},{"id":"Q0342","type":"mcq","prompt_ja":"「敷金」の説明として正しいものを選んでください。","prompt_zh":"【言語知識】选出对「敷金」的正确说明。","options":["每月支付的房租","不退还给租客的礼金","每月的公共区域费","押金，退租时扣除修缮费后可能退还"],"answer":"押金，退租时扣除修缮费后可能退还","rationale":"「敷金」是押金，退租时用于修缮，剩余可退；「礼金」不退，「家賃」是房租，「共益費」是公共区域费。","audio_text":"","rubric":"选 押金，退租时扣除修缮费后可能退还 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0343","type":"mcq","prompt_ja":"「共益費」の意味として最も近いものを選んでください。","prompt_zh":"【言語知識】选出「共益費」最接近的中文意思。","options":["水电费合计","公共区域费；物业公摊费","固定资产税","中介手续费"],"answer":"公共区域费；物业公摊费","rationale":"「共益費」是楼内公共区域维护费，可能含水费但不等于水电费合计；中介费是「手数料」，固定资产税是「固定資産税」。","audio_text":"","rubric":"选 公共区域费；物业公摊费 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0064","kind":"reading","title":"住民票の写しの取り方","text_ja":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。申請書に名前と住所を書き、本人確認の書類を見せてください。運転免許証やマイナンバーカードがあれば、一つの書類で足ります。手数料は一通三百円で、現金またはキャッシュレスで払えます。代理人が来る場合は、本人が書いた委任状と、代理人の本人確認の書類も必要です。郵送を希望する方は、返信用の封筒を入れてください。平日の午後五時までに受け付けた分は、その日のうちに発行できます。","text_kana":"じゅうみんひょうのうつしがひつようなかたは、しやくしょいっかいのまどぐちでおもとめください。しんせいしょになまえとじゅうしょをかき、ほんにんかくにんのしょるいをみせてください。うんてんめんきょしょうやマイナンバーカードがあれば、ひとつのしょるいでたります。てすうりょうはいっつうさんびゃくえんで、げんきんまたはキャッシュレスではらえます。だいりにんがくるばあいは、ほんにんがかいたいにんじょうと、だいりにんのほんにんかくにんのしょるいもひつようです。ゆうそうをきぼうするかたは、へんしんようのふうとうをいれてください。へいじつのごごごじまでにうけつけたぶんは、そのひのうちにはっこうできます。","text_zh":"需要居民票复印件的人，请到市政府一楼窗口办理。请在申请书上写姓名和住址，并出示身份证明文件。有驾照或个人编号卡的话，一份文件就够。手续费每份三百日元，可用现金或无现金支付。代理人来办理时，还需要本人写的委托书和代理人的身份证明。希望邮寄的人，请附上回邮信封。工作日五点前受理的，当天即可签发。","focus_zh":"「写し」是复印件不是原件；「一通」是“一份”；代理人办理需要本人委任状和代理人证件，本人证件不是必须。","audio_text":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。申請書に名前と住所を書き、本人確認の書類を見せてください。運転免許証やマイナンバーカードがあれば、一つの書類で足ります。手数料は一通三百円で、現金またはキャッシュレスで払えます。代理人が来る場合は、本人が書いた委任状と、代理人の本人確認の書類も必要です。郵送を希望する方は、返信用の封筒を入れてください。平日の午後五時までに受け付けた分は、その日のうちに発行できます。","url":"","license":"original"},{"id":"M0087","kind":"listening","title":"窓口職員と住民：転居届","text_ja":"A：すみません、引っ越しの届けを出したいのですが。\nB：はい。新しい住所が分かる書類はお持ちですか。\nA：住民票の写しを持ってきました。\nB：ありがとうございます。あ、こちらは古い住所のものですね。\nA：えっ、そうですか。新しい住所のものが必要ですか。\nB：はい。それと、本人確認の書類もお願いします。\nA：運転免許証なら持っています。\nB：結構です。では、この用紙に新しい住所と名前を書いてください。\nA：はい。あのう、印鑑は必要ですか。\nB：今回は必要ありません。署名で大丈夫です。","text_kana":"A：すみません、ひっこしのとどけをだしたいのですが。\nB：はい。あたらしいじゅうしょがわかるしょるいはおもちですか。\nA：じゅうみんひょうのうつしをもってきました。\nB：ありがとうございます。あ、こちらはふるいじゅうしょのものですね。\nA：えっ、そうですか。あたらしいじゅうしょのものがひつようですか。\nB：はい。それと、ほんにんかくにんのしょるいもおねがいします。\nA：うんてんめんきょしょうならもっています。\nB：けっこうです。では、このようしにあたらしいじゅうしょとなまえをかいてください。\nA：はい。あのう、いんかんはひつようですか。\nB：こんかいはひつようありません。しょめいでだいじょうぶです。","text_zh":"A：您好，我想提交搬家申报。\nB：好的。您带能证明新住址的文件了吗？\nA：我带了居民票复印件。\nB：谢谢。啊，这是旧住址的吧。\nA：诶，是吗？需要新住址的吗？\nB：是的。另外还需要身份证明文件。\nA：驾照我带着。\nB：可以。那么请在这张表上写新住址和姓名。\nA：好的。那个，需要印章吗？\nB：这次不需要。签名就可以。","focus_zh":"人物关系是市政府窗口职员与居民。信息干扰：居民带了旧住址的住民票，被指出需要新住址的；最后确认不需要印章。","audio_text":"A：すみません、引っ越しの届けを出したいのですが。\nB：はい。新しい住所が分かる書類はお持ちですか。\nA：住民票の写しを持ってきました。\nB：ありがとうございます。あ、こちらは古い住所のものですね。\nA：えっ、そうですか。新しい住所のものが必要ですか。\nB：はい。それと、本人確認の書類もお願いします。\nA：運転免許証なら持っています。\nB：結構です。では、この用紙に新しい住所と名前を書いてください。\nA：はい。あのう、印鑑は必要ですか。\nB：今回は必要ありません。署名で大丈夫です。","url":"","license":"original"},{"id":"M0080","kind":"reading","title":"図書館カードの更新","text_ja":"図書館の利用カードの有効期限は、発行から三年です。期限を過ぎると、本を借りることができなくなりますので、更新の手続きをしてください。更新には、現在使っているカードと、住所が分かる書類が必要です。住所が変わった方は、新しい住所を届け出てから、更新してください。手続きは、中央図書館のほか、駅前の分館でもできます。混雑を避けたい方は、平日の午前中に来ることをおすすめします。カードの再発行には、三百円かかります。","text_kana":"としょかんのりようカードのゆうこうきげんは、はっこうからさんねんです。きげんをすぎると、ほんをかりることができなくなりますので、こうしんのてつづきをしてください。こうしんには、げんざいつかっているカードと、じゅうしょがわかるしょるいがひつようです。じゅうしょがかわったかたは、あたらしいじゅうしょをとどけでてから、こうしんしてください。てつづきは、ちゅうおうとしょかんのほか、えきまえのぶんかんでできます。こんざつをさけたいかたは、へいじつのごぜんちゅうにくることをおすすめします。カードのさいはっこうには、さんびゃくえんかかります。","text_zh":"图书馆使用卡的有效期是自发行起三年。过期后无法借书，请办理更新手续。更新需要现在使用的卡和能证明住址的文件。住址变更的人，请先申报新住址再更新。手续除中央图书馆外，也可在站前分馆办理。想避开拥挤的人，建议平日上午来。补办卡需三百日元。","focus_zh":"「有効期限」=有效期；「更新」不是“更新软件”；「届け出てから」是先申报再办；「再発行」是补办。","audio_text":"図書館の利用カードの有効期限は、発行から三年です。期限を過ぎると、本を借りることができなくなりますので、更新の手続きをしてください。更新には、現在使っているカードと、住所が分かる書類が必要です。住所が変わった方は、新しい住所を届け出てから、更新してください。手続きは、中央図書館のほか、駅前の分館でもできます。混雑を避けたい方は、平日の午前中に来ることをおすすめします。カードの再発行には、三百円かかります。","url":"","license":"original"}],"viz":{"day":65,"phase":"P4","new_count":9,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。","kana":"じゅうみんひょうのうつしがひつようなかたは、しやくしょいっかいのまどぐちでおもとめください。","zh":"需要居民票复印件的人，请到市政府一楼窗口办理。","note_zh":"「写し」是复印件不是原件；「一通」是“一份”；代理人办理需要本人委任状和代理人证件，本人证件不是必须。","audio_text":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。","origin":"material","source_id":"M0064"},{"ja":"申請書に名前と住所を書き、本人確認の書類を見せてください。","kana":"しんせいしょになまえとじゅうしょをかき、ほんにんかくにんのしょるいをみせてください。","zh":"请在申请书上写姓名和住址，并出示身份证明文件。","note_zh":"「写し」是复印件不是原件；「一通」是“一份”；代理人办理需要本人委任状和代理人证件，本人证件不是必须。","audio_text":"申請書に名前と住所を書き、本人確認の書類を見せてください。","origin":"material","source_id":"M0064"},{"ja":"運転免許証やマイナンバーカードがあれば、一つの書類で足ります。","kana":"うんてんめんきょしょうやマイナンバーカードがあれば、ひとつのしょるいでたります。","zh":"有驾照或个人编号卡的话，一份文件就够。","note_zh":"「写し」是复印件不是原件；「一通」是“一份”；代理人办理需要本人委任状和代理人证件，本人证件不是必须。","audio_text":"運転免許証やマイナンバーカードがあれば、一つの書類で足ります。","origin":"material","source_id":"M0064"}],"review_plan":[{"kid":"V0197","surface":"せっかく","kana":"せっかく","zh":"好不容易；特意；难得","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":64,"next_hint_zh":"按课程间隔，大约 Day 66 再预习","planned_only":true},{"kid":"V0198","surface":"かえって","kana":"かえって","zh":"反倒；反而","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":64,"next_hint_zh":"按课程间隔，大约 Day 66 再预习","planned_only":true},{"kid":"V0199","surface":"むしろ","kana":"むしろ","zh":"宁可；莫如；倒不如","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":64,"next_hint_zh":"按课程间隔，大约 Day 66 再预习","planned_only":true},{"kid":"V0201","surface":"それとも","kana":"それとも","zh":"还是；或者（选择疑问）","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":64
