に)","meaning_zh":"基于…／以…为依据／按照…","connection":"名詞 + に基づいて（依据资料/规则/数据）；名詞 + をもとに（以…为素材/基础）；名詞 + どおり(に)（照原样、按预定）","example":"調査結果に基づいて、報告書を作成しました。","usage":"书面；に基づいて 偏「依据权威来源」，をもとに 偏「以…为材料加工」，どおり 偏「不改动地照做」","explanation_zh":"意思是「基于…／以…为依据／按照…」；接续：名詞 + に基づいて（依据资料/规则/数据）；名詞 + をもとに（以…为素材/基础）；名詞 + どおり(に)（照原样、按预定）（中文术语：名词 + に基づいて（依据资料/规则/数据）；名词 + をもとに（以…为素材/基础）；名词 + どおり(に)（照原样、按预定））；用法：书面；に基づいて 偏「依据权威来源」，をもとに 偏「以…为材料加工」，どおり 偏「不改动地照做」","common_errors":[{"wrong":"資料に基づいてに書きました。","why":"に基づいて 已含 に，不再叠 に；中文「基于资料」直译叠加助词错","fix":"資料に基づいて書きました。","learner":"zh"},{"wrong":"アンケート結果をに基づいて改善します。","why":"に基づいて 前用 に（結果に基づいて），もとに 才用 を；中文「以…为基础」直译混了 を 与 に","fix":"アンケート結果に基づいて改善します。","learner":"zh"}],"compare":[{"id":"G0055","diff":"によって 表原因/手段；に基づいて 表「以…为根据/来源」"},{"id":"G0077","diff":"に伴って 是伴随变化；に基づいて 是静态依据，无变化义"}],"examples":[{"ja":"調査結果に基づいて、報告書を作成しました。","zh":"依据调查结果写成了报告。","audio_text":"調査結果に基づいて、報告書を作成しました。"},{"ja":"予定どおりに、会議を始めます。","zh":"按预定开始会议。","audio_text":"予定どおりに、会議を始めます。"}],"ko":"-에 근거해(서) / -(으)ㄹ 바탕으로 / -대로","ko_hint":"『基于…／以…为依据／按照…』≒ -에 근거해/-바탕으로/-대로，可成组对照。","caution":"基于/依据/按照三义在韩语是 -근거해/-바탕으로/-대로 三套，日语 に/を/どおり 也不同格，别逐字拼；どおり 接名词后（予定どおり）韩语 -대로 也接名词、这条较近，但 に基づいて 的 に 不是 G0009 的 에。"}],"kanji":[{"id":"K0129","char":"転","onyomi":["テン"],"kunyomi":["ころぶ"],"meaning_zh":"转；转动；摔倒；调职","zh_trap":"中文「转」zhuǎn/zhuàn；日语 転 音读 テン（運転 うんてん）、训读 ころぶ（転ぶ 摔倒）；简体「转」与「転」不同，「運転」驾驶 ≠ 中文「运转」，不能靠汉字猜。","vocab_refs":["V0257"],"examples":[{"ja":"運転","kana":"うんてん","zh":"驾驶；开车"}],"ko_hint":""},{"id":"K0130","char":"入","onyomi":["ニュウ"],"kunyomi":["はいる","いれる"],"meaning_zh":"入；进入；放入；住院","zh_trap":"中文「入」rù；日语 入 音读 ニュウ（入院 にゅういん）、训读 はいる（自動）/いれる（他動）；「入院」住院 ≠ 中文「进入医院」字面，且 ニュウ 不可按中文 rù 推，自他两读要分。","vocab_refs":["V0258"],"examples":[{"ja":"入院","kana":"にゅういん","zh":"住院"}],"ko_hint":""}],"questions":[{"id":"Q0255","type":"listen","prompt_ja":"会話を聞いて、先週お店に行った人の感想を選んでください。","prompt_zh":"第二个人（上周去过的）感想是哪一个？","options":["待たされて残念だった","味に満足した","値段が安いと思った","対応が早かった"],"answer":"待たされて残念だった","rationale":"第二个人说「混んでいて長く待たされた」「それは残念だったね」。『味に満足』『値段が高い』是第一个人的话，注意不要张冠李戴（考人物与发言归属）。","audio_text":"新しい食堂、どうだった？値段は少し高かったけど、味にはとても満足したよ。そう？私は先週行って、店が混んでいて長く待たされたの。それは残念だったね。そのうえ、私のときは店員の対応も遅くてね。じゃあ、評価が分かれるね。","rubric":"选 待たされて残念だった 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0218","type":"mcq","prompt_ja":"コーヒーにしますか、___ 紅茶にしますか。","prompt_zh":"选出用于二者选一的接续词","options":["それとも","そのうえ","それでも","そのため"],"answer":"それとも","rationale":"「A か、それとも B か」表『还是/或者』的选择疑问；「そのうえ」累加、「それでも」转折、「そのため」因果，都不能连接两个选项。","audio_text":"","rubric":"选 それとも 得 1 分，其余 0 分","expected_production":"","difficulty":3},{"id":"Q0316","type":"free_production","prompt_ja":"","prompt_zh":"用「〜に 基づいて／〜どおりに」（G0078）写一句话，说明『按资料或说明做』。","options":[],"answer":"","rationale":"「に基づいて」依据资料/规则/数据，「をもとに」以…为素材，「どおりに」按照…；三者依据感不同，宾语助词要正确。","audio_text":"","rubric":"①に基づいて/をもとに/どおりに 依据表达 1 分；②区分に基づいて与をもとに 1 分；③宾语助词与句子自然 1 分","expected_production":"この報告は、昨日の会議の内容に基づいて書きました。","difficulty":5},{"id":"Q0325","type":"dialogue","prompt_ja":"友達：せっかく作ったケーキ、どうだった？／あなた：（　）","prompt_zh":"用「〜のに」表达『明明特意做了，却…』的遗憾。","options":[],"answer":"","rationale":"「〜のに」（G0075）逆接、含遗憾；「せっかく／わざわざ」（V0197/V0196）用词；后项与预期相反，可配「〜てしまった」（G0051）。","audio_text":"","rubric":"①〜のに逆接 1 分；②せっかく/わざわざ用词 1 分；③后项与预期相反、含遗憾语气 1 分","expected_production":"せっかく作ったのに、弟が全部食べてしまったんです。","difficulty":5},{"id":"Q0326","type":"dialogue","prompt_ja":"後輩：部長はもう帰りましたか。／あなた：（　）","prompt_zh":"用「〜ようです／〜そうです」礼貌地推测或转述『好像已经回去了』。","options":[],"answer":"","rationale":"「〜ようだ／らしい／そうです」（G0044/G0043）推测或传闻；对部長须用尊敬表达（お帰りになった，V0234）；不断言、语气委婉。","audio_text":"","rubric":"①〜ようだ/らしい/そうです 1 分；②对部長用尊敬表达 1 分；③不断言、语气委婉 1 分","expected_production":"さっき荷物を持って出られたので、もうお帰りになったようです。","difficulty":5},{"id":"Q0329","type":"dialogue","prompt_ja":"同僚：この時間に電車が来るかな。／あなた：（　）","prompt_zh":"用「〜わけが ない」或「〜はずだ」回应，说出有把握的判断（如『刚出事故，不可能来』）。","options":[],"answer":"","rationale":"「わけがない」（不可能，G0071）／「はずだ」（应该，G0053）；给出合理依据（事故 V0256／時刻表どおり G0078）；语气自然、不与といえない等矛盾。","audio_text":"","rubric":"①わけがない/はずだ 1 分；②给出合理依据（事故/時刻表）1 分；③语气自然、不矛盾 1 分","expected_production":"さっき事故があったから、もう来るわけがないよ。","difficulty":5}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","text_ja":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","text_kana":"","text_zh":"喜好因人而异。对我来说日语很难。我们来聊聊日语吧。","focus_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","url":"","license":"original"},{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが書けるようになりました。とても便利です。","text_kana":"","text_zh":"已经能用电脑写日语邮件了。非常方便。","focus_zh":"「書けるようになりました」表从不会到会的变化；「パソコンで」的「で」表工具手段用电脑，不是动作场所。","audio_text":"パソコンで日本語のメールが書けるようになりました。とても便利です。","url":"","license":"original"}],"viz":{"day":59,"phase":"P4","new_count":6,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"人によって好きなものが違います。","kana":"","zh":"喜好因人而异。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。"},{"ja":"私にとって、日本語は難しいです。","kana":"","zh":"对我来说日语很难。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"私にとって、日本語は難しいです。"},{"ja":"調査結果に基づいて、報告書を作成しました。","kana":"","zh":"依据调查结果写成了报告。","note_zh":"に基づいて 已含 に，不再叠 に；中文「基于资料」直译叠加助词错","audio_text":"調査結果に基づいて、報告書を作成しました。"}],"review_plan":[{"kid":"V0198","surface":"かえって","kana":"かえって","zh":"反倒；反而","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"V0199","surface":"むしろ","kana":"むしろ","zh":"宁可；莫如；倒不如","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"V0201","surface":"それとも","kana":"それとも","zh":"还是；或者（选择疑问）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"V0202","surface":"そのうえ","kana":"そのうえ","zh":"加之；而且","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"G0076","surface":"N + に 対して / に 関して","kana":"","zh":"对…（针对对象/对比）／关于…（书面）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"G0077","surface":"N / V辞書形 + に 伴って / に つれて / に 従って","kana":"","zh":"随着…（前项变化，后项也跟着变化）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"K0127","surface":"滞","kana":"","zh":"滞；停滞；滞留","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"},{"kid":"K0128","surface":"運","kana":"","zh":"运；搬运；运气；驾驶","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":58,"next_hint_zh":"大约 Day 60 再回顾"}],"teaching_notes":["记住：に基づいて 已含 に，不再叠 に；中文「基于资料」直译叠加助词错","注意：に基づいて 前用 に（結果に基づいて），もとに 才用 を；中文「以…为基础」直译混了 を 与 に","容易错：「それでも」接続詞“尽管如此/即便那样”，逆接，常配前句不利条件；与「しかし」近义但更强调“在前述条件下仍…”；中文“即使这样”直译可；不能靠汉字猜。","小提醒：「状態」じょうたい 名词，“（事物/身体）状态”，与「状況」（外部局面）分工；中文“状态/情况”常混，日语须分；「態」タイ 不可按中文 tài 推；"],"ko_analogy":{"grammar":[{"match":"G0078","pattern":"N + に 基づいて / を もとに / どおり(に)","ko":"-에 근거해(서) / -(으)ㄹ 바탕으로 / -대로","hint_zh":"『基于…／以…为依据／按照…』≒ -에 근거해/-바탕으로/-대로，可成组对照。","caution":"基于/依据/按照三义在韩语是 -근거해/-바탕으로/-대로 三套，日语 に/を/どおり 也不同格，别逐字拼；どおり 接名词后（予定どおり）韩语 -대로 也接名词、这条较近，但 に基づいて 的 に 不是 G0009 的 에。"}],"vocab":[]}}</script>
