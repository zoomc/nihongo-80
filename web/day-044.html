起来（趋势）；去…再来／…过来（移动）」；接续：動詞 て形 + いく／くる；いく・くる 按五段/カ変变形（ていきます／てきました）（中文术语：动词 て形 + いく／くる；いく・くる 按五段/カ変变形（ていきます／てきました））；用法：空间：做完某动作后去/来；时间：状态从现在向将来（いく）或从过去向现在（くる）变化","common_errors":[{"wrong":"これから勉強しています。","why":"中文「学下去」易误用 ている；向将来延续应用 〜ていく","fix":"これからも勉強していきます。","learner":"zh"},{"wrong":"雨が降っていきました。","why":"「下起雨来（到现在）」方向是 〜てくる 而非 ていく；中文「起来了」不区分方向","fix":"雨が降ってきました。","learner":"zh"}],"compare":[{"id":"G0027","diff":"ている 表状态持续/进行；ていく・てくる 表变化趋势或动作方向"}],"examples":[{"ja":"これからも日本語を勉強していきます。","zh":"今后也会继续学下去。","audio_text":"これからも日本語を勉強していきます。"},{"ja":"雨が降ってきました。","zh":"下起雨来了。","audio_text":"雨が降ってきました。"}],"ko":"-아/어 가다 / 오다（趋势·移动）","ko_hint":"『…下去／…起来』≒ -아/어 가다/오다，补助动词表趋势，可对照（难得贴近）。","caution":"日语 ていく/てくる 兼时间趋势与空间移动去/来两义，韩语 가다/오다 也兼两义但使用频率与搭配不同；てくる 还表出现/刚开始（雨が降ってきた），韩语要用 -기 시작하다/나타나다，别一律 오다。"}],"kanji":[{"id":"K0101","char":"公","onyomi":["コウ"],"kunyomi":["おおやけ"],"meaning_zh":"公；公共；官方","zh_trap":"中文「公」gōng；日语 公 音读 コウ，「公園」こうえん「公共」こうきょう；中文「公」无 コウ 音对应，须验证；训读 おおやけ（公家/公开）与中文义略偏。","vocab_refs":["V0046"],"examples":[{"ja":"公園","kana":"こうえん","zh":"公园"}],"ko_hint":""}],"questions":[{"id":"Q0242","type":"fill","prompt_ja":"日本に住みながら、これからも日本語を勉強して ___ たいです。","prompt_zh":"填入「〜て いく／くる」表示趋势","options":[],"answer":"いき","rationale":"「Vて＋いく」＝（从现在）持续…下去；「Vて＋くる」是『…到现在/…过来』（G0057）。此处「これからも」表今后持续，用「いき」，接 たい 成「勉強していきたい」。","audio_text":"","rubric":"填 いき 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0073","type":"mcq","prompt_ja":"部屋に猫___います。","prompt_zh":"选出存在主体的助词","options":["を","は","に","が"],"answer":"が","rationale":"存在主体用 が；场所已在「部屋に」，宾语 を 错","audio_text":"部屋に猫がいます。","rubric":"选 が 得 1 分，其余 0 分","expected_production":"","difficulty":3},{"id":"Q0074","type":"fill","prompt_ja":"机の上に本___あります。","prompt_zh":"填入无生命存在句的助词","options":[],"answer":"が","rationale":"无生命存在用 ある，主体用 が","audio_text":"","rubric":"填 が 得 1 分，其余 0 分","expected_production":"","difficulty":3},{"id":"Q0075","type":"listen","prompt_ja":"听录音，写出听到的整句。","prompt_zh":"听写整句","options":[],"answer":"駅の前に店があります","rationale":"駅の前 表
