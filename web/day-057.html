"普通形 + のに（な形・名詞 は 〜な のに）","meaning_zh":"明明…却…；…却（意外、不满、遗憾）","connection":"動詞・い形 普通形 + のに；な形・名詞 + な + のに；后项是与预期相反的结果","example":"たくさん勉強したのに、合格できませんでした。","usage":"逆接，带说话人意外/责备/遗憾情绪；比 が/けど 情绪强","explanation_zh":"意思是「明明…却…；…却（意外、不满、遗憾）」；接续：動詞・い形 普通形 + のに；な形・名詞 + な + のに；后项是与预期相反的结果（中文术语：动词・い形 简体 + のに；な形・名词 + な + のに；后项是与预期相反的结果）；用法：逆接，带说话人意外/责备/遗憾情绪；比 が/けど 情绪强","common_errors":[{"wrong":"高いのにを買いました。","why":"「のに」后不再接 を 等格助词提示前项；中文「虽然贵」直译叠加助词错","fix":"高いのに買いました。","learner":"zh"},{"wrong":"日曜日だのに、働きます。","why":"名词/な形 接 のに 用 な（日曜日なのに），不用 だ；中文「是周日却」直译保留 だ 错","fix":"日曜日なのに、働きます。","learner":"zh"}],"compare":[{"id":"G0037","diff":"から/ので 是顺接原因（因为…所以）；のに 是逆接转折（虽然…却），方向相反"}],"examples":[{"ja":"たくさん勉強したのに、合格できませんでした。","zh":"明明学了很多却没考上。","audio_text":"たくさん勉強したのに、合格できませんでした。"},{"ja":"今日は日曜日なのに、仕事に行きます。","zh":"明明是周日却要去上班。","audio_text":"今日は日曜日なのに、仕事に行きます。"}],"ko":"-(으)ㄴ/는데(도) / -건만 / -았/었는데도","ko_hint":"『明明…却…』≒ -(으)ㄴ/는데도，逆接带意外/不满，可对照。","caution":"のに 带强烈意外、不满、遗憾，韩语 -는데도 偏中性转折、语气弱一截，要用 -건만/-(으)ㄹ 텐데 补情绪；な形・名词后日语要插 な（静かなのに），韩语 -인데도 也变，但别把 のに 的 の 当成名词化套 것。"}],"kanji":[{"id":"K0126","char":"渋","onyomi":["ジュウ"],"kunyomi":["しぶい"],"meaning_zh":"涩；涩滞；不流畅","zh_trap":"中文「涩」sè；日语 渋 音读 ジュウ（渋滞 じゅうたい）、训读 しぶい（渋い）；「渋滞」是「堵车/拥堵」，与中文「涩」义远，典型不能靠汉字猜词；简体「涩」与「渋」不同。","vocab_refs":["V0255"],"examples":[{"ja":"渋滞","kana":"じゅうたい","zh":"堵车；拥堵"}],"ko_hint":""}],"questions":[{"id":"Q0214","type":"mcq","prompt_ja":"___ 作った料理だから、冷めないうちに食べてください。","prompt_zh":"选出最贴切的副词（别辜负难得的成果）","options":["せっかく","わざわざ","かえって","そろそろ"],"answer":"せっかく","rationale":"「せっかく」表『好不容易/特意做了，别浪费』，与「冷めないうちに食べて」呼应；「わざわざ」多修饰专程的移动或麻烦动作，不修饰成果。","audio_text":"","rubric":"选 せっかく 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0215","type":"mcq","prompt_ja":"忙しいのに、駅まで ___ 送ってくれてありがとう。","prompt_zh":"选出最贴切的副词（专程做本不必做的事）","options":["わざわざ","せっかく","かえって","むしろ"],"answer":"わざわざ","rationale":"「わざわざ」表『特意/专程』做本可不做的事，与「駅まで送ってくれて」呼应；「せっかく」多接难得的成果或机会，不能修饰这种专程动作。","audio_text":"","rubric":"选 わざわざ 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0274","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：明明好不容易约好了，却没来（用「のに」）","options":["来ませんでした","せっかく","のに","約束した"],"answer":"2,4,3,1","rationale":"「せっかく」（好不容易，V0197）→「Vた形＋のに」（逆接，意外/遗憾，G0075）→ 后项与预期相反。中文『明明约好了』直译易把 のに 放句首。","audio_text":"","rubric":"编号序列为 2,4,3,1 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0296","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『明明特意来接我，我却没赶上电车，真遗憾。』","options":[],"answer":"","rationale":"『特意』用 わざわざ（V0196），不用 せっかく（多修饰难得的成果）；『来接我』是「迎えに来てくれた」（G0052 别人给我做）；『却』用 のに 带遗憾（G0075），から/ので 只表因果。","audio_text":"","rubric":"①〜てくれた方向正确 1 分；②〜のに逆接遗憾语气 1 分；③わざわざ・残念・間に合わない用词与整体自然度 1 分","expected_production":"わざわざ迎えに来てくれたのに、電車に間に合わなくて、残念です。","difficulty":5},{"id":"Q0303","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『为了不迟到，我决定比平时早一小时出门。』","options":[],"answer":"","rationale":"『为了不…』用「Vない形＋ように（する）」（G0064），不用「ために」（ため 前多接意志动词表目的，G0074）；『决定』用 ことにした（G0065，自己主观决定），ことになった 是客观结果；「家を出る」用 を。","audio_text":"","rubric":"①Vない形＋ように（する）『设法不…』1 分；②〜ことにする主观决定 1 分；③〜より比较、一時間早く与助词「を」正确 1 分","expected_production":"遅れないように、いつもより一時間早く家を出ることにしました。","difficulty":5},{"id":"Q0309","type":"free_production","prompt_ja":"","prompt_zh":"用「〜わけには いかない」（G0071）写一句话，说明一件『虽想做但因情理不能做』的事。","options":[],"answer":"","rationale":"「V辞書形＋わけには いかない」＝因情理/常识不能；须与「わけが ない」（不可能，G0071）区分，后者是否定可能性。","audio_text":"","rubric":"①V辞書形＋わけにはいかない 1 分；②区分わけがない 1 分；③语境含不情愿、句子自然 1 分","expected_production":"明日は大事な会議があるので、今日は早く帰るわけにはいきません。","difficulty":5}],"materials":[{"id":"M0045","kind":"reading","title":"「気持ち」と「気分」の違い","text_ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","text_kana":"","text_zh":"「気持ち」和「気分」是相近的词，用法略有不同。「気持ち」表示高兴、悲伤等心理状态或对对方的心意。而「気分」多指受身体状况或当场气氛影响的一时感受，如「気分が悪い」「気分を変えたい」。拿不准时，可想想是长期持续的心理状态，还是仅当下的一时感受。","focus_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。一方、『気分』は体の調子や、その場の空気に左右される一時的な感じを指すことが多く、『気分が悪い』『気分を変えたい』のように使います。どちらを使うか迷ったら、長く続く心の状態か、そのときだけの感じかで考えてみるとよいでしょう。","url":"","license":"original"},{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが書けるようになりました。とても便利です。","text_kana":"","text_zh":"已经能用电脑写日语邮件了。非常方便。","focus_zh":"「書けるようになりました」表从不会到会的变化；「パソコンで」的「で」表工具手段用电脑，不是动作场所。","audio_text":"パソコンで日本語のメールが書けるようになりました。とても便利です。","url":"","license":"original"}],"viz":{"day":57,"phase":"P4","new_count":5,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。","kana":"","zh":"「気持ち」和「気分」是相近的词，用法略有不同。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』と『気分』はよく似た言葉ですが、使い方が少し違います。"},{"ja":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。","kana":"","zh":"「気持ち」表示高兴、悲伤等心理状态或对对方的心意。","note_zh":"「気持ち」偏长久的心理状态或对对方的心意，「気分」偏受身体/当场气氛影响的一时感受；拿不准时看是一直的心情还是这会儿的感觉。","audio_text":"『気持ち』は、うれしい・悲しいといった心の状態や、相手に対する思いを表します。"},{"ja":"たくさん勉強したのに、合格できませんでした。","kana":"","zh":"明明学了很多却没考上。","note_zh":"「のに」后不再接 を 等格助词提示前项；中文「虽然贵」直译叠加助词错","audio_text":"たくさん勉強したのに、合格できませんでした。"}],"review_plan":[{"kid":"V0257","surface":"運転","kana":"うんてん","zh":"驾驶；开车","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"V0260","surface":"記事","kana":"きじ","zh":"报道；文章；条目","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"V0193","surface":"だいぶ","kana":"だいぶ","zh":"相当（含变化）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"V0194","surface":"すっかり","kana":"すっかり","zh":"完全；全然（状态全变）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"G0074","surface":"V辞書形 + ため(に) / 普通形・N の + ため(に)","kana":"","zh":"为了…（目的）／因为…、由于…（原因）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"K0124","surface":"操","kana":"","zh":"操；操作；操弄","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"K0125","surface":"作","kana":"","zh":"作；制作；作品；操作","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":56,"next_hint_zh":"大约 Day 58 再回顾"},{"kid":"V0250","surface":"手続き","kana":"てつづき","zh":"手续；程序","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":55,"next_hint_zh":"大约 Day 58 再回顾"}],"teaching_notes":["记住：「のに」后不再接 を 等格助词提示前项；中文「虽然贵」直译叠加助词错","注意：名词/な形 接 のに 用 な（日曜日なのに），不用 だ；中文「是周日却」直译保留 だ 错","容易错：「しっかり」副词“牢牢地/扎实地/振作”，常配「勉強する／掴まる／しっかりした作り」；与「すっかり」（完全）形近义异须分辨；无汉字，不能靠汉字猜词。","小提醒：「わざわざ」副词“特意/专程（特地做，常含不必如此）”，多配授受「てくださる／てくれる」表感谢；与「せっかく」（难得的机会，多含惋惜/别浪费）语感方向不同；"],"ko_analogy":{"grammar":[{"match":"G0075","pattern":"普通形 + のに（な形・名詞 は 〜な のに）","ko":"-(으)ㄴ/는데(도) / -건만 / -았/었는데도","hint_zh":"『明明…却…』≒ -(으)ㄴ/는데도，逆接带意外/不满，可对照。","caution":"のに 带强烈意外、不满、遗憾，韩语 -는데도 偏中性转折、语气弱一截，要用 -건만/-(으)ㄹ 텐데 补情绪；な形・名词后日语要插 な（静かなのに），韩语 -인데도 也变，但别把 のに 的 の 当成名词化套 것。"}],"vocab":[]}}</script>
