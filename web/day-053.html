<script type="application/json" id="nh80-day">{"day":53,"phase":"P4","theme":"旅行安排｜N + に 対して / に 関して・N / V辞書形 + に 伴って / に つれて / に 従って・かなり","scene":"【旅行安排】旅行：用「N + に 対して / に 関して」说明旅行的行程变化、原因和替代方案（素材：雨のせいで｜主题键：travel｜对齐：exact）","scene_tag":"旅行安排","scene_topic_key":"travel","scene_topic":"旅行","topic_match":"exact","material_topic_keys":["travel","travel"],"material_pair":"same_topic","can_do":"用「N + に 対して / に 関して」说明旅行的行程变化、原因和替代方案","focus":["vocabulary","kanji"],"objectives":["能从一小段通知或短文里找出主要意思，并说出一句依据","能把今天学的说法用到一个新场景，而不是只背原句","能分清「这是事实」和「这是我猜的」，不把猜测说成肯定","当天新词：かなり、ところで、そのため（读音与用法都要验证，不靠汉字猜义）","当天句型：N + に 対して / に 関して、N / V辞書形 + に 伴って / に つれて / に 従って，须说出接续条件","当天汉字：給、報，音读/训读各给一例","Can-do：用「N + に 対して / に 関して」说明旅行的行程变化、原因和替代方案"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【旅行安排】旅行：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0192","surface":"かなり","kana":"かなり","romaji":"kanari","pos":"副詞","meaning_zh":"相当；颇为","jlpt":"N3","examples":[{"ja":"今日はかなり寒いです。","zh":"今天相当冷。","audio_text":"今日はかなり寒いです。"}],"notes_for_zh":"「かなり」副词“相当/颇为”，偏客观静态程度，修饰形容词/动词；与「だいぶ」（多含“变化后比之前…”）、「とても」（很）语感不同；中文“相当”可直译但日语「かなり」不用于敬语寒暄；无汉字，不能靠汉字猜。","confusables":["V0193"],"ko":"","ko_hint":"","caution":""},{"id":"V0200","surface":"ところで","kana":"ところで","romaji":"tokorode","pos":"接続詞","meaning_zh":"对了；话说回来（转话题）","jlpt":"N3","examples":[{"ja":"ところで、明日の予定は？","zh":"对了，明天安排是什么？","audio_text":"ところで、明日の予定は？"}],"notes_for_zh":"「ところで」接続詞“对了/话说回来（转换话题）”，放句首接新话题；与语法「〜ところだ／〜たところ」（G0069）同形但功能完全不同；中文“对了”可直译但别写句末；ところ 写作「所」时是名词“场所”，不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0204","surface":"そのため","kana":"そのため","romaji":"sonotame","pos":"接続詞","meaning_zh":"因此；为此","jlpt":"N3","examples":[{"ja":"渋滞でした。そのため、遅れました。","zh":"堵车了，因此迟到了。","audio_text":"渋滞でした。そのため、遅れました。"}],"notes_for_zh":"「そのため（に）」表“因此/为此”，作接续词放句首；与「〜ために」（目的/原因，G0074）同形易混，作「そのために＋动词」又带目的/原因义。【疑点】接续词与副词/目的用法的词性边界、是否属标准 N3 词条建议二次核实，故标 needs_review；「為」训读 ため，非音读，不能靠汉字猜。","confusables":["V0202"],"ko":"","ko_hint":"","caution":""},{"id":"V0206","surface":"理由","kana":"りゆう","romaji":"riyuu","pos":"名詞","meaning_zh":"理由；缘由","jlpt":"N3","examples":[{"ja":"遅刻した理由を説明してください。","zh":"请说明迟到的理由。","audio_text":"遅刻した理由を説明してください。"}],"notes_for_zh":"「理由」りゆう 名词，“（主观）理由/依据”，「〜の理由／〜理由で／〜という理由」；与「原因」げんいん（客观致因）分工，中文常混日语须分；韩语 이유 同源可帮记音读，但不能靠汉字猜日语搭配；「由」音读 ユ/ユウ（理由 りゆう），不可按中文 yóu 推。","confusables":["V0207"],"ko":"이유","ko_hint":"日韩汉字词同形同义（りゆう／이유＝理由）。","caution":"りゆう ≠ iyu 读音不同；日语 理由 与 原因 有主观理由 vs 客观原因的分工，韩语 이유/원인 也分但边界不同，别一律翻 이유。"},{"id":"V0207","surface":"原因","kana":"げんいん","romaji":"genin","pos":"名詞","meaning_zh":"原因（客观）","jlpt":"N3","examples":[{"ja":"事故の原因を調べています。","zh":"正在调查事故原因。","audio_text":"事故の原因を調べています。"}],"notes_for_zh":"「原因」げんいん 名词，“（客观）原因”，「〜の原因／原因は〜だ／〜が原因で」；与「理由」（动机/依据）分工，中文常混日语须分；韩语 원인 同源可帮记，但不能靠汉字猜；「原」ゲン、「因」イン 不可按中文 yuán/yīn 推。","confusables":["V0206"],"ko":"","ko_hint":"","caution":""},{"id":"V0208","surface":"結果","kana":"けっか","romaji":"kekka","pos":"名詞","meaning_zh":"结果","jlpt":"N3","examples":[{"ja":"調査の結果、原因が分かりました。","zh":"调查的结果，弄清了原因。","audio_text":"調査の結果、原因が分かりました。"}],"notes_for_zh":"「結果」けっか 名词/接続，“结果”，「〜の結果／その結果／〜た結果」；也可作接续词「その結果」；中日同形义近但读 けっか（促音），不可按中文 jiéguǒ 推音；韩语 결과 同源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0209","surface":"目的","kana":"もくてき","romaji":"mokuteki","pos":"名詞","meaning_zh":"目的","jlpt":"N3","examples":[{"ja":"留学の目的は日本語を学ぶことです。","zh":"留学目的是学日语。","audio_text":"留学の目的は日本語を学ぶことです。"}],"notes_for_zh":"「目的」もくてき 名词，「〜の目的／〜を目的とする／〜目的で」；与「〜ため(に)」（G0074 目的用法）同义不同词类；中日同形义近但「的」音读 テキ（入声 -キ），不可按中文 mùdì 推；韩语 목적 同源可帮记，但不能靠汉字猜搭配。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0211","surface":"経験","kana":"けいけん","romaji":"keiken","pos":"名詞/サ変","meaning_zh":"经验；经历","jlpt":"N3","examples":[{"ja":"海外で働いた経験があります。","zh":"有在海外工作过的经历。","audio_text":"海外で働いた経験があります。"}],"notes_for_zh":"「経験」けいけん 名词/サ変，「〜した経験がある／経験を積む／経験が豊富だ」；与「〜たことがある」（G0042）语义呼应但词类不同；中日同形义近，「経」ケイ、「験」ケン 不可按中文 jīng/yàn 推；韩语 경험 同源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0076","pattern":"N + に 対して / に 関して","meaning_zh":"对…（针对对象/对比）／关于…（书面）","connection":"名詞 + に対して（动作/态度的对象，或「与此相对」的对比）；名詞 + に関して（＝について 的书面语）","example":"先生に対して失礼なことを言いました。","usage":"に対して 后接对人/物的动作、态度或对比；に関して 多用于正式文书、新闻","explanation_zh":"意思是「对…（针对对象/对比）／关于…（书面）」；接续：名詞 + に対して（动作/态度的对象，或「与此相对」的对比）；名詞 + に関して（＝について 的书面语）（中文术语：名词 + に対して（动作/态度的对象，或「与此相对」的对比）；名词 + に関して（＝について 的书面语））；用法：に対して 后接对人/物的动作、态度或对比；に関して 多用于正式文书、新闻","common_errors":[{"wrong":"先生に対してに失礼しました。","why":"に対して 已含 に，不再叠 に；中文「对老师」直译叠加助词错","fix":"先生に対して失礼しました。","learner":"zh"},{"wrong":"環境問題について対して議論します。","why":"「关于…讨论」用 について/に関して 即可，叠 に対して 语义混乱；中文「对…关于」直译堆砌","fix":"環境問題に関して議論します。","learner":"zh"}],"compare":[{"id":"G0055","diff":"について 是「关于（内容）」口语通用；に関して 更书面；に対して 是「朝向对象/对比」不是谈内容"},{"id":"G0009","diff":"に 只标对象；に対して 强调「针对该对象采取行动/态度」"}],"examples":[{"ja":"先生に対して失礼なことを言いました。","zh":"对老师说了失礼的话。","audio_text":"先生に対して失礼なことを言いました。"},{"ja":"この問題に関して、後ほど報告します。","zh":"关于这个问题稍后汇报。","audio_text":"この問題に関して、後ほど報告します。"}],"ko":"-에 대해(서)·-에 반해(서) / -에 관해(서)","ko_hint":"『对…（针对/对比）』≒ -에 대해、-에 반해，『关于…（书面）』≒ -에 관해，可对照书面表达。","caution":"に対して 兼针对对象与与…相比/相反两义，韩语 -에 대해/-에 반해 要分，不能一个词套；に関して 比 について 更书面，韩语 -에 관하여 也书面，但两者语域差不一一对应；に 在这里也不是简单的 에。"},{"id":"G0077","pattern":"N / V辞書形 + に 伴って / に つれて / に 従って","meaning_zh":"随着…（前项变化，后项也跟着变化）","connection":"名詞 + に／動詞 辞書形 + に + 伴って・つれて・従って；后项须是变化动词（増える／変わる／高くなる 等）","example":"気温が上がるにつれて、売上が増えます。","usage":"书面，表伴随变化；につれて/に従って 偏比例变化，に伴って 偏伴随发生（常带同时性）","explanation_zh":"意思是「随着…（前项变化，后项也跟着变化）」；接续：名詞 + に／動詞 辞書形 + に + 伴って・つれて・従って；后项须是变化动词（増える／変わる／高くなる 等）（中文术语：名词 + に／动词 辞书形 + に + 伴って・つれて・従って；后项须是变化动词（増える／変わる／高くなる 等））；用法：书面，表伴随变化；につれて/に従って 偏比例变化，に伴って 偏伴随发生（常带同时性）","common_errors":[{"wrong":"気温が上がるにつれて、ビールがおいしいです。","why":"后项须是变化（増える／高くなる），静态形容词 おいしい 不接；中文「随着…很…」直译错","fix":"気温が上がるにつれて、ビールが売れるようになります。","learner":"zh"},{"wrong":"気温の上がるにつれて","why":"につれて 前接动词用 辞书形（上がる），名词才用 気温の上昇に；中文「气温的升高」直译混名词化","fix":"気温が上がるにつれて、…","learner":"zh"}],"compare":[{"id":"G0055","diff":"によって 表「因…而（因果/手段/被动主体）」；に伴って 表「随着…同步变化」"},{"id":"G0035","diff":"〜くなる/に なる 是结果变化本身；に伴って 是把两个变化连起来的接续"}],"examples":[{"ja":"気温が上がるにつれて、売上が増えます。","zh":"随着气温升高，销量增加。","audio_text":"気温が上がるにつれて、売上が増えます。"},{"ja":"技術の進歩に伴って、仕事のやり方が変わりました。","zh":"随着技术进步，工作方式变了。","audio_text":"技術の進歩に伴って、仕事のやり方が変わりました。"}],"ko":"-에 따라(서) / -(으)ㅁ에 따라 / -에 맞춰","ko_hint":"『随着…（前项变后项也变）』≒ -에 따라(서)，可对照。","caution":"日语三个近义表达在伴随/比例/遵从上有细微差，韩语主要 -에 따라 一个，不能一一对应；従って 还表按照（指示），韩语要用 -에 따라/-대로，别一律 -에 따라。"}],"kanji":[{"id":"K0111","char":"給","onyomi":["キュウ"],"kunyomi":[],"meaning_zh":"给；供给；薪资","zh_trap":"中文「给」gěi/jǐ；日语 給 音读 キュウ，「給料」きゅうりょう 是「工资」；简体「给」与「給」不同，中文「给料」易误解为「发放材料」，不能靠汉字猜词。","vocab_refs":["V0246"],"examples":[{"ja":"給料","kana":"きゅうりょう","zh":"工资；薪水"}],"ko_hint":""},{"id":"K0112","char":"報","onyomi":["ホウ"],"kunyomi":["むくいる"],"meaning_zh":"报；报告；报答；信息","zh_trap":"中文「报」bào；日语 報 音读 ホウ，「報告」ほうこく 汇报、「情報」じょうほう 信息（≠中文「情报」多指间谍情报）；简体「报」与「報」不同，不能按中文义域推。","vocab_refs":["V0247","V0217"],"examples":[{"ja":"報告","kana":"ほうこく","zh":"报告；汇报"},{"ja":"情報","kana":"じょうほう","zh":"信息；资讯"}],"ko_hint":"韩语汉字词可参考：보고(하다)。日韩汉字词同形同义（ほうこく／보고＝报告）。"}],"questions":[{"id":"Q0236","type":"fill","prompt_ja":"習慣が続くように、日記を ___ ことにしました。","prompt_zh":"填入「〜ことに する」前的动词形","options":[],"answer":"続ける","rationale":"「V辞書形＋ことに する」＝（自己主观）决定…（G0065）；用辞书形「続ける」。「ことになる」是客观决定/自然结果，主语非自己决定。","audio_text":"","rubric":"填 続ける 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0269","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：为了升学而学日语（用「ために」）","options":["日本語を","ために","勉強しています","進学する"],"answer":"4,2,1,3","rationale":"「V辞書形＋ために（目的）」在前，后接「〜を勉強しています」（G0074）；目的从句置于主句之前。","audio_text":"","rubric":"编号序列为 4,2,1,3 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0383","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，Aは何時ごろ会場に届けるよう頼みましたか。","o
