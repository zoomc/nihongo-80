:"危険を感じたら、直ちに避難してください。"}],"notes_for_zh":"「直ちに」是正式“立即”，多用于通知/规则；口语「すぐ」；中文无“直ち”一词。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0338","surface":"次第に","kana":"しだいに","romaji":"shidaini","pos":"副詞","meaning_zh":"逐渐","jlpt":"N3","examples":[{"ja":"次第に日が長くなりました。","zh":"白天逐渐变长了。","audio_text":"次第に日が長くなりました。"}],"notes_for_zh":"「次第に」是逐渐变化，书面；口语「だんだん」；中文“次第”是次序，日语「次第」しだい 另有“取决于”用法，勿混。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0193","surface":"だいぶ","kana":"だいぶ","romaji":"daibu","pos":"副詞","meaning_zh":"相当（含变化）","jlpt":"N3","examples":[{"ja":"病気はだいぶ良くなりました。","zh":"病好得差不多了。","audio_text":"病気はだいぶ良くなりました。"}],"notes_for_zh":"「だいぶ」副词“相当（与过去相比变化大）”，常配「〜くなる／〜になった」；与「かなり」（静态程度）语感不同，中文“相当”直译常丢“变化”义；无汉字，不能靠汉字猜。","confusables":["V0192"],"ko":"","ko_hint":"","caution":""},{"id":"V0195","surface":"しっかり","kana":"しっかり","romaji":"shikkari","pos":"副詞","meaning_zh":"牢牢地；扎实地；振作","jlpt":"N3","examples":[{"ja":"しっかり勉強してください。","zh":"请扎扎实实地学。","audio_text":"しっかり勉強してください。"}],"notes_for_zh":"「しっかり」副词“牢牢地/扎实地/振作”，常配「勉強する／掴まる／しっかりした作り」；与「すっかり」（完全）形近义异须分辨；无汉字，不能靠汉字猜词。","confusables":["V0194"],"ko":"","ko_hint":"","caution":""},{"id":"V0196","surface":"わざわざ","kana":"わざわざ","romaji":"wazawaza","pos":"副詞","meaning_zh":"特意；专程","jlpt":"N3","examples":[{"ja":"わざわざ来てくださってありがとうございます。","zh":"谢谢您特意前来。","audio_text":"わざわざ来てくださってありがとうございます。"}],"notes_for_zh":"「わざわざ」副词“特意/专程（特地做，常含不必如此）”，多配授受「てくださる／てくれる」表感谢；与「せっかく」（难得的机会，多含惋惜/别浪费）语感方向不同；无汉字，不能靠汉字猜。","confusables":["V0197"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0088","pattern":"V辞書形 / Vない形 / い形 / な形な + うちに","meaning_zh":"趁着…；在…期间（不知不觉）…","connection":"動詞辞書形 + うちに；動詞ない形 + ないうちに；い形 + うちに；な形 + なうちに；名詞 + のうちに","example":"若いうちに、いろいろな経験をしたほうがいいです。","usage":"表示在前项状态持续期间做后项；「〜ないうちに」=趁还没…；也可表示不知不觉发生变化。","explanation_zh":"意思是「趁着…；在…期间（不知不觉）…」；接续：動詞辞書形 + うちに；動詞ない形 + ないうちに；い形 + うちに；な形 + なうちに；名詞 + のうちに（中文术语：动词辞书形 + うちに；动词ない形 + ないうちに；い形 + うちに；な形 + なうちに；名词 + のうちに）；用法：表示在前项状态持续期间做后项；「〜ないうちに」=趁还没…；也可表示不知不觉发生变化。","common_errors":[{"wrong":"暗いないうちに、帰りましょう。","why":"い形「暗い」的否定是「暗くない」，不能直接加 ない；中文“还没黑”直译错。","fix":"暗くならないうちに、帰りましょう。","learner":"zh"},{"wrong":"若いのうちに、経験を積みましょう。","why":"い形后接 うちに 不加 の；の 只接名词。","fix":"若いうちに、経験を積みましょう。","learner":"zh"}],"compare":[{"id":"G0030","diff":"ながら 是同时进行两个动作；うちに 是趁某状态尚未改变时做后项。"}],"examples":[{"ja":"若いうちに、いろいろな経験をしたほうがいいです。","zh":"趁年轻应该多积累各种经验。","audio_text":"若いうちに、いろいろな経験をしたほうがいいです。"},{"ja":"忘れないうちに、メモしてください。","zh":"趁还没忘，请记下来。","audio_text":"忘れないうちに、メモしてください。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0137","char":"可","onyomi":["カ"],"kunyomi":[],"meaning_zh":"可；可能；许可","zh_trap":"中文「可」kě 作能愿动词；日语 可 音读 カ（可能 かのう、不可 ふか），是构词成分；「可能」是「可能」，中文「可」不能直接套日语词性，此字无常用训读。","vocab_refs":["V0212"],"examples":[{"ja":"可能性","kana":"かのうせい","zh":"可能性"}],"ko_hint":""}],"questions":[{"id":"Q0215","type":"mcq","prompt_ja":"忙しいのに、駅まで ___ 送ってくれてありがとう。","prompt_zh":"选出最贴切的副词（专程做本不必做的事）","options":["むしろ","せっかく","わざわざ","かえって"],"answer":"わざわざ","rationale":"「わざわざ」表『特意/专程』做本可不做的事，与「駅まで送ってくれて」呼应；「せっかく」多接难得的成果或机会，不能修饰这种专程动作。","audio_text":"","rubric":"选 わざわざ 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0248","type":"listen","prompt_ja":"会話を聞いて、李さんの今の気持ちを選んでください。","prompt_zh":"小李现在的心情是哪一种？","options":["満足","嬉しい","不安","残念"],"answer":"不安","rationale":"本人明说「少し不安です」。「来るはず」是 G0053 的推断、对方的「きっと大丈夫」是安慰，都不是李さん本人的心情。","audio_text":"李さん、就職活動はどう？先週、ある会社の面接を受けたんです。結果はまだですか。ええ、来週までに連絡が来るはずですが、まだなので少し不安です。きっと大丈夫ですよ。しっかり準備していましたから。","rubric":"选 不安 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0253","type":"listen","prompt_ja":"会話を聞いて、二人が明日どうすることにしたか選んでください。","prompt_zh":"两人决定明天怎么办？","options":["ハイキングを延期する","雨でも行く","場所だけ変える","中止して二度としない"],"answer":"ハイキングを延期する","rationale":"「行くのを来週に延ばすことにした」＝延期（G0065）。不是中止，而是挪到下周；理由是雨（V0096）。","audio_text":"もしもし、明日のハイキングのことだけど、天気予報が変わってね。うん、雨だって聞いたよ。そうなんだ。それで、行くのを来週に延ばすことにしたんだ。ごめん、わざわざ準備してくれたのに。ううん、大丈夫。連絡してくれて助かったよ。","rubric":"选 ハイキングを延期する 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0177","type":"error_correct","prompt_ja":"私について、日本語は難しいです。","prompt_zh":"改错：について/にとって 混淆","options":[],"answer":"私にとって、日本語は難しいです。","rationale":"「对…来说」用 にとって，について 是「关于」，中文「对」易混","audio_text":"","rubric":"改为 にとって 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0178","type":"translate","prompt_ja":"中译日：对我来说日语很难。","prompt_zh":"日译 にとって","options":[],"answer":"","rationale":"にとって 表评价立场，后接 は + い形容词谓语","audio_text":"","rubric":"①用 にとって 得 1 分；②主题用 は 得 1 分；③い形容词 + です 得 1 分","expected_production":"私にとって、日本語は難しいです。","difficulty":5},{"id":"Q0179","type":"free_production","prompt_ja":"请用 について 写一句想谈论的主题。","prompt_zh":"自由写作","options":[],"answer":"","rationale":"考查 について 表「关于」的迁移","audio_text":"","rubric":"①用 について 得 1 分；②主题名词正确得 1 分；③用 話します 等收尾得 1 分","expected_production":"日本語について話します。","difficulty":5}],"materials":[{"id":"M0038","kind":"reading","title":"台風と交通のニュース","text_ja":"【ニュース】大型の台風が近づいています。気象庁によると、あすの午後から西日本では雨と強い風が強まり、海や山では危ない状態になる恐れがあります。鉄道会社は、雨や風の影響で、あすの一部の列車を運休することにしたと発表しました。最新の情報は、各社のホームページで確認できます。","text_kana":"","text_zh":"【新闻】大型台风正在逼近。据气象厅，明天午后起西日本雨势和风力增强，海边和山区可能出现危险状况。各铁路公司宣布，受风雨影响，明天部分列车停运。最新信息可在各公司官网查询。","focus_zh":"「気象庁によると」＝据气象厅标消息来源；「恐れがあります」是恐怕会出现…的书面负面预测，日常口语少用。","audio_text":"【ニュース】大型の台風が近づいています。気象庁によると、あすの午後から西日本では雨と強い風が強まり、海や山では危ない状態になる恐れがあります。鉄道会社は、雨や風の影響で、あすの一部の列車を運休することにしたと発表しました。最新の情報は、各社のホームページで確認できます。","url":"","license":"original"},{"id":"M0052","kind":"listening","title":"就職活動についての友人との会話","text_ja":"李さん、就職活動はどう？先週、ある会社の面接を受けたんです。結果はもう来ましたか。いいえ、来週までに来るはずなんですが、まだなので少し不安です。きっと大丈夫ですよ。しっかり準備していましたから。","text_kana":"","text_zh":"小李，找工作进展如何？上周去某公司面试了。结果出来了吗？还没，本该下周前通知，可一直没来，有点不安。肯定没问题的。你准备得那么充分。","focus_zh":"「来るはずなんですが」用「はず」表按理该来（却没来）带落差；「きっと大丈夫ですよ」是安慰对方肯定没问题，不是问你是男子汉吗。","audio_text":"李さん、就職活動はどう？先週、ある会社の面接を受けたんです。結果はもう来ましたか。いいえ、来週までに来るはずなんですが、まだなので少し不安です。きっと大丈夫ですよ。しっかり準備していましたから。","url":"","license":"original"},{"id":"M0059","kind":"reading","title":"Tadoku Graded Readers / 多言語多読 日本語レベル別読物","text_ja":"","text_kana":"","text_zh":"","focus_zh":"","audio_text":"","url":"https://tadoku.org/japanese/en/graded-readers-en/","license":"CC BY-NC-ND 4.0（NPO多言語多読 / Tadoku Supporters：免费多読用 graded readers，需署名、禁止商用转售、禁止改编）"},{"id":"M0044","kind":"reading","title":"就職意識の調査ニュース","text_ja":"【調査】今年新しく就職した人に、仕事を選ぶときに何を大切にしたかを聞きました。給料より『働きやすい職場かどうか』を重視した人が、初めて半分を超えたそうです。残業の少なさや休みの取りやすさを理由に挙げる人が多く、専門家は『働き方への考え方が変わってきた結果だろう』と話しています。","text_kana":"","text_zh":"【调查】向今年新就业者询问择业时最看重什么。据称，比起工资，更重视『职场是否好待』的人首次超过半数。多数人举出的理由是加班少、请假容易，专家表示『这大概是工作方式观念变化的结果』。","focus_zh":"「半分を超えたそうです」的「そうです」是传闻据称，和样态看起来不同；「給料より」的「より」是比起工资的比较基准。","audio_text":"【調査】今年新しく就職した人に、仕事を選ぶときに何を大切にしたかを聞きました。給料より『働きやすい職場かどうか』を重視した人が、初めて半分を超えたそうです。残業の少なさや休みの取りやすさを理由に挙げる人が多く、専門家は『働き方への考え方が変わってきた結果だろう』と話しています。","url":"","license":"original"},{"id":"M0063","kind":"reading","title":"図書館の利用者が増加","text_ja":"市立図書館の利用者が増加しています。図書館によると、今年の利用者数は去年より一割ほど多いということです。仕事や子育てについて調べる大人が増えたことに加え、静かに勉強できる場所を求める学生も目立つようになりました。一方で、席が足りないという声も出ています。図書館は来月から、夜八時まで開館する日を週に二日増やす予定です。ただし、本の貸し出しの受付は七時半までとなります。また、静かな席を増やす工事も予定されています。","text_kana":"しりつとしょかんのりようしゃがぞうかしています。としょかんによると、ことしのりようしゃすうはきょねんよりいちわりほどおおいということです。しごとやこそだてについてしらべるおとながふえたことにくわえ、しずかにべんきょうできるばしょをもとめるがくせいもめだつようになりました。いっぽうで、せきがたりないというこえもでています。としょかんはらいげつから、よるはちじまでかいかんするひをしゅうにふつかふやすよていです。ただし、ほんのかしだしのうけつけはしちじはんまでとなります。また、しずかなせきをふやすこうじもよていされています。","text_zh":"市立图书馆的使用者正在增加。据图书馆说，今年的使用人数比去年多约一成。除了查工作、育儿资料的成年人增加，寻求安静学习场所的学生也显眼起来。另一方面，也有人反映座位不够。图书馆计划从下个月起，每周增加两天开馆到晚上八点。不过，借书受理到七点半为止。此外，还计划施工增加安静座位。","focus_zh":"「一割ほど」=约一成，不是一倍；「ことに加え」=加之；「一方で」是两面并列，不是因果。","audio_text":"市立図書館の利用者が増加しています。図書館によると、今年の利用者数は去年より一割ほど多いということです。仕事や子育てについて調べる大人が増えたことに加え、静かに勉強できる場所を求める学生も目立つようになりました。一方で、席が足りないという声も出ています。図書館は来月から、夜八時まで開館する日を週に二日増やす予定です。ただし、本の貸し出しの受付は七時半までとなります。また、静かな席を増やす工事も予定されています。","url":"","license":"original"},{"id":"M0071","kind":"reading","title":"観光客増加と交通対策","text_ja":"今年、この町を訪れた観光客は、去年より二割増えました。特に、週末に開かれる朝市を見に来る人が多く、地元の野菜や加工品がよく売れています。一方で、観光客の車が増えたことで、住民からは「道が混みすぎる」という声も上がっています。町は来月から、中心部に限って車の進入を制限し、代わりに無料のバスを走らせる方針です。商店の店主からは賛成の声がある一方、車で来る客が減ることを心配する声もあります。町は来月、住民説明会を開く予定です。","text_kana":"ことし、このまちをおとずれたかんこうきゃくは、きょねんよりにわりふえました。とくに、しゅうまつにひらかれるあさいちをみにくるひとがおおく、じもとのやさいやかこうひんがよくうれています。いっぽうで、かんこうきゃくのくるまがふえたことで、じゅうみんからは「みちがこみすぎる」というこえもあがっています。まちはらいげつから、ちゅうしんぶにかぎってくるまのしんにゅうをせいげんし、かわりにむりょうのバスをはしらせるほうしんです。しょうてんのてんしゅからはさんせいのこえがあるいっぽう、くるまでくるきゃくがへることをしんぱいするこえもあります。まちはらいげつ、じゅうみんせつめいかいをひらくよていです。","text_zh":"今年到访这个镇的游客比去年增加两成。特别是来看周末早市的人很多，当地蔬菜和加工品卖得很好。另一方面，游客车辆增加，居民也发出“道路太堵”的声音。镇里方针是从下个月起，仅限中心区域限制车辆进入，取而代之开通免费公交。商店店主有赞成的声音，另一方面也有人担心开车来的客人减少。镇里计划下个月召开居民说明会。","focus_zh":"「二割増えました」=增加两成；「一方で」是两面并列；「に限って」=仅限；「代わりに」=取而代之。","audio_text":"今年、この町を訪れた観光客は、去年より二割増えました。特に、週末に開かれる朝市を見に来る人が多く、地元の野菜や加工品がよく売れています。一方で、観光客の車が増えたことで、住民からは「道が混みすぎる」という声も上がっています。町は来月から、中心部に限って車の進入を制限し、代わりに無料のバスを走らせる方針です。商店の店主からは賛成の声がある一方、車で来る客が減ることを心配する声もあります。町は来月、住民説明会を開く予定です。","url":"","license":"original"}],"viz":{"day":63,"phase":"P4","new_count":9,"review_count":12,"question_count":6},"assessment":"weekly","lesson_core":[{"ja":"気象庁によると、あすの午後から西日本では雨と強い風が強まり、海や山では危ない状態になる恐れがあります。","kana":"","zh":"据气象厅，明天午后起西日本雨势和风力增强，海边和山区可能出现危险状况。","note_zh":"「気象庁によると」＝据气象厅标消息来源；「恐れがあります」是恐怕会出现…的书面负面预测，日常口语少用。","audio_text":"気象庁によると、あすの午後から西日本では雨と強い風が強まり、海や山では危ない状態になる恐れがあります。","origin":"material","source_id":"M0038"},{"ja":"鉄道会社は、雨や風の影響で、あすの一部の列車を運休することにしたと発表しました。","kana":"","zh":"各铁路公司宣布，受风雨影响，明天部分列车停运。","note_zh":"「気象庁によると」＝据气象厅标消息来源；「恐れがあります」是恐怕会出现…的书面负面预测，日常口语少用。","audio_text":"鉄道会社は、雨や風の影響で、あすの一部の列車を運休することにしたと発表しました。","origin":"material","source_id":"M0038"},{"ja":"最新の情報は、各社のホームページで確認できます。","kana":"","zh":"最新信息可在各公司官网查询。","note_zh":"「気象庁によると」＝据气象厅标消息来源；「恐れがあります」是恐怕会出现…的书面负面预测，日常口语少用。","audio_text":"最新の情報は、各社のホームページで確認できます。","origin":"material","source_id":"M0038"}],"review_plan":[{"kid":"V0322","surface":"避難","kana":"ひなん","zh":"避难","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":62,"next_hint_zh":"按课程间隔，大约 Day 64 再预习","planned_only":true},{"kid":"V0324","surface":"伝統","kana":"でんとう","zh":"传统","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":
