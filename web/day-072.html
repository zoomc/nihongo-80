},{"id":"Q0296","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『明明特意来接我，我却没赶上电车，真遗憾。』","options":[],"answer":"","rationale":"『特意』用 わざわざ（V0196），不用 せっかく（多修饰难得的成果）；『来接我』是「迎えに来てくれた」（G0052 别人给我做）；『却』用 のに 带遗憾（G0075），から/ので 只表因果。","audio_text":"","rubric":"①〜てくれた方向正确 1 分；②〜のに逆接遗憾语气 1 分；③わざわざ・残念・間に合わない用词与整体自然度 1 分","expected_production":"わざわざ迎えに来てくれたのに、電車に間に合わなくて、残念です。","difficulty":5},{"id":"Q0297","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『与其加班，我倒不如换个能早点做完的做法。』","options":[],"answer":"","rationale":"「むしろ」（V0199）用于比较后『倒不如』，与「〜より〜ほうが」（G0034）呼应；不能换成「かえって」（反预期结果，V0198）。『换做法』用 V0242 変える。","audio_text":"","rubric":"①〜より〜ほうが比较句式 1 分；②むしろ表取舍 1 分；③変える与〜ほうがいい建议语气自然 1 分","expected_production":"残業するより、むしろ早く終わる方法に変えたほうがいいと思います。","difficulty":5},{"id":"Q0298","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『老师把这本辞典送给了我，我会好好珍惜。』","options":[],"answer":"","rationale":"中文『送给我』无敬语方向；日语给的人（先生）作主语用「くださる」（V0232 尊敬语）。若主语是『我』则用 いただく；「さしあげる」方向相反，不能用。","audio_text":"","rubric":"①上位者给我用くださる 1 分；②不用さしあげる/いただく错方向 1 分；③大切に使う与敬体自然收尾 1 分","expected_production":"先生がこの辞書をくださいました。大切に使います。","difficulty":5}],"materials":[{"id":"M0070","kind":"reading","title":"営業の引き継ぎメモ","text_ja":"来月から営業部に来る後藤さんへ。今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。丸井商店は、毎月二十五日までに注文の確認をしないと、次の月の納品が遅れます。北川工業は、担当者が先月変わったばかりなので、こちらから連絡したほうがいいでしょう。引き継ぎの資料は、共有フォルダーの「営業引継ぎ」に入れてあります。分からないことがあったら、遠慮なく聞いてください。来週の月曜日に、一時間ほど時間を取って、一緒に確認しましょう。","text_kana":"らいげつからえいぎょうぶにくるごとうさんへ。いま、たんとうしているおきゃくさまのうち、とくにきをつけてほしいのは、まるいしょうてんときたかわこうぎょうのにしゃです。まるいしょうてんは、まいつきにじゅうごにちまでにちゅうもんのかくにんをしないと、つぎのつきののうひんがおくれます。きたかわこうぎょうは、たんとうしゃがせんげつかわったばかりなので、こちらかられんらくしたほうがいいでしょう。ひきつぎのしりょうは、きょうゆうフォルダーの「えいぎょうひきつぎ」にいれてあります。わからないことがあったら、えんりょなくきいてください。らいしゅうのげつようびに、いちじかんほどじかんをとって、いっしょにかくにんしましょう。","text_zh":"致下个月来营业部的后藤。现在负责的客户中，特别要留意的是丸井商店和北川工业两家。丸井商店如果不在每月25日前确认订单，下个月的供货就会延迟。北川工业的负责人上个月刚换，最好由我们主动联系。交接资料放在共享文件夹的“营业交接”里。有不明白的事，请尽管问。下周一腾出一小时左右，一起确认吧。","focus_zh":"「担当している」是当前负责；「しないと…遅れます」是条件；「変わったばかり」是刚换；「入れてあります」是已放好。","audio_text":"来月から営業部に来る後藤さんへ。今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。丸井商店は、毎月二十五日までに注文の確認をしないと、次の月の納品が遅れます。北川工業は、担当者が先月変わったばかりなので、こちらから連絡したほうがいいでしょう。引き継ぎの資料は、共有フォルダーの「営業引継ぎ」に入れてあります。分からないことがあったら、遠慮なく聞いてください。来週の月曜日に、一時間ほど時間を取って、一緒に確認しましょう。","url":"","license":"original"},{"id":"M0081","kind":"listening","title":"上司と部下：会議の時間と資料","text_ja":"A：田中さん、明日の企画会議は三時からですよね。\nB：はい、部長。三時からです。\nA：あ、すみません。三時ではなく、三時半からになりました。\nB：わかりました。三時半ですね。\nA：それから、会議室も変わりました。第二会議室ではなく、大会議室です。\nB：では、資料は何部用意すればいいですか。\nA：出席者は十二人なので、十三部お願いします。\nB：十三部ですね。念のため、十五部用意しておきます。\nA：助かります。よろしくお願いします。","text_kana":"A：たなかさん、あしたのきかくかいぎはさんじからですよね。\nB：はい、ぶちょう。さんじからです。\nA：あ、すみません。さんじではなく、さんじはんからになりました。\nB：わかりました。さんじはんですよね。\nA：それから、かいぎしつもかわりました。だいにかいぎしつではなく、だいかいぎしつです。\nB：では、しりょうはなんぶよういすればいいですか。\nA：しゅっせきしゃはじゅうににんなので、じゅうさんぶおねがいします。\nB：じゅうさんぶですね。ねんのため、じゅうごぶよういしておきます。\nA：たすかります。よろしくおねがいします。","text_zh":"A：田中，明天的企划会议是三点开始吧？\nB：是的，部长。三点开始。\nA：啊，抱歉。不是三点，改成三点半开始了。\nB：明白了。是三点半吧。\nA：还有，会议室也变了。不是第二会议室，是大会议室。\nB：那么，资料要准备几份呢？\nA：出席者有十二人，请准备十三份。\nB：十三份是吧。为保险起见，我准备十五份。\nA：帮大忙了。拜托了。","focus_zh":"人物关系是部长与部下。信息干扰：先说三点，马上改口三点半；会议室也从第二会议室改为大会议室。最后部长要十三份，部下主动多备到十五份。","audio_text":"A：田中さん、明日の企画会議は三時からですよね。\nB：はい、部長。三時からです。\nA：あ、すみません。三時ではなく、三時半からになりました。\nB：わかりました。三時半ですね。\nA：それから、会議室も変わりました。第二会議室ではなく、大会議室です。\nB：では、資料は何部用意すればいいですか。\nA：出席者は十二人なので、十三部お願いします。\nB：十三部ですね。念のため、十五部用意しておきます。\nA：助かります。よろしくお願いします。","url":"","license":"original"}],"viz":{"day":72,"phase":"P5","new_count":0,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"来月から営業部に来る後藤さんへ。","kana":"らいげつからえいぎょうぶにくるごとうさんへ。","zh":"致下个月来营业部的后藤。","note_zh":"「担当している」是当前负责；「しないと…遅れます」是条件；「変わったばかり」是刚换；「入れてあります」是已放好。","audio_text":"来月から営業部に来る後藤さんへ。","origin":"material","source_id":"M0070"},{"ja":"今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。","kana":"いま、たんとうしているおきゃくさまのうち、とくにきをつけてほしいのは、まるいしょうてんときたかわこうぎょうのにしゃです。","zh":"现在负责的客户中，特别要留意的是丸井商店和北川工业两家。","note_zh":"「担当している」是当前负责；「しないと…遅れます」是条件；「変わったばかり」是刚换；「入れてあります」是已放好。","audio_text":"今、担当しているお客様のうち、特に気をつけてほしいのは、丸井商店と北川工業の二社です。","origin":"material","
