"ko":"","ko_hint":"","caution":""},{"id":"V0255","surface":"渋滞","kana":"じゅうたい","romaji":"juutai","pos":"名詞/サ変","meaning_zh":"堵车；拥堵","jlpt":"N3","examples":[{"ja":"朝は道が渋滞しています。","zh":"早上路上堵车。","audio_text":"朝は道が渋滞しています。"}],"notes_for_zh":"「渋滞」じゅうたい 名词/サ変，「道が渋滞する／渋滞にはまる／渋滞に巻き込まれる」主语用 が；中日不能靠汉字猜词：中文“涩滞”生僻且义为“不流畅”，日语 じゅうたい 专指交通堵塞；「渋」ジュウ（渋い しぶい 训读）、「滞」タイ 随词变；韩语 정체(停滯) 不同源，说明不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0084","pattern":"V ます形(去ます) + 得る / V ない形(去ない) + ざるを 得ない","meaning_zh":"可能…、会有…／不得不…","connection":"動詞 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；動詞 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外）","example":"その可能性もあり得ます。","usage":"得る 表客观可能性/ conceivable（あり得る）；ざるを得ない 表「别无选择只好…」，书面","explanation_zh":"意思是「可能…、会有…／不得不…」；接续：動詞 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；動詞 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外）（中文术语：动词 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；动词 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外））；用法：得る 表客观可能性/ conceivable（あり得る）；ざるを得ない 表「别无选择只好…」，书面","common_errors":[{"wrong":"起こる得る","why":"得る 接 ます形去ます（起こり得る），不接辞书形；中文「可能发生」直译错","fix":"起こり得ます／起こり得る","learner":"zh"},{"wrong":"するざるを得ない","why":"サ変「する」接 ざる 要变 せ（せざるを得ない），不是 し/する；中文「不得不做」按原形推错","fix":"せざるを得ません","learner":"zh"}],"compare":[{"id":"G0024","diff":"可能形 表主语的能力/条件；得る 表「客观上可能存在/发生」，多用于 あり得る"},{"id":"G0046","diff":"なければならない 是一般义务；ざるを得ない 强调「虽不情愿但别无选择」"}],"examples":[{"ja":"その可能性もあり得ます。","zh":"那种可能性也存在。","audio_text":"その可能性もあり得ます。"},{"ja":"電車が止まったので、歩いて帰らざるを得ませんでした。","zh":"电车停了，只好走路回去。","audio_text":"電車が止まったので、歩いて帰らざるを得ませんでした。"}],"ko":"-(으)ㄹ 수 있다 / -지 않을 수 없다·-(으)ㄹ 수밖에 없다","ko_hint":"『可能…』≒ -(으)ㄹ 수 있다、『不得不…』≒ -지 않을 수 없다/-ㄹ 수밖에 없다，可对照可能与必然。","caution":"得る 读 うる/える、ざる 是文言否定助动词残存，韩语 -(으)ㄹ 수 있다/-수밖에 없다 是另一套形式，不同源；あり得る 表有可能、せざるを得ない 表被迫，两条语义不同，别都翻 수 있다。"}],"kanji":[{"id":"K0138","char":"能","onyomi":["ノウ"],"kunyomi":[],"meaning_zh":"能；能力；可能；艺能","zh_trap":"中文「能」néng；日语 能 音读 ノウ（可能 かのう、能力 のうりょく）；「能」另有传统艺能「能」のう 义，中文「能」无此义，不能按中文义域直推，此字无常用训读。","vocab_refs":["V0212"],"examples":[{"ja":"可能性","kana":"かのうせい","zh":"可能性"}],"ko_hint":""},{"id":"K0139","char":"情","onyomi":["ジョウ"],"kunyomi":["なさけ"],"meaning_zh":"情；感情；信息；情况","zh_trap":"中文「情」qíng；日语 情 音读 ジョウ（情報 じょうほう、事情 じじょう）、训读 なさけ（情け）；「情報」是「信息」，中文「情报」多指机密情报，义域不同，不可按中文猜。","vocab_refs":["V0217"],"examples":[{"ja":"情報","kana":"じょうほう","zh":"信息；资讯"}],"ko_hint":""}],"questions":[{"id":"Q0233","type":"fill","prompt_ja":"この機械はボタンが多くて、 ___ にくいです。","prompt_zh":"填入「〜にくい」前的ます形词干","options":[],"answer":"操作し","rationale":"「Vます形去ます＋にくい」＝难以…（G0062）；サ変「操作する」→「操作しにくい」。整体按い形容词变形。","audio_text":"","rubric":"填 操作し 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0245","type":"listen","prompt_ja":"駅の放送を聞いて、電車が止まっている原因を答えてください。","prompt_zh":"列车停靠（晚点）的原因是什么？","options":["事故","渋滞","天気","故障"],"answer":"事故","rationale":"「人身事故があったため」是原因（G0074 原因用法）。渋滞属道路、故障属机械、天気属雨雪，都与广播内容不符。","audio_text":"お客様にお知らせします。先ほど、隣の駅で人身事故があったため、この電車は現在、駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。","rubric":"选 事故 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0250","type":"listen","prompt_ja":"サポート電話を聞いて、パソコンに起きている問題を選んでください。","prompt_zh":"电脑出了什么问题？","options":["故障して動かない","操作が難しいだけ","画面が汚れている","電源を入れ忘れた"],"answer":"故障して動かない","rationale":"「画面が消えて、何度操作しても動きません」＝故障。客服让「電源を入れ直す」是排查步骤，不是『只是操作难』。","audio_text":"お客様サポートセンターです。パソコンの調子がおかしいんです。朝から急に画面が消えて、何度操作しても動きません。それでは、一度電源を切って、十分ほど待ってから入れ直していただけますか。分かりました。やってみます。","rubric":"选 故障して動かない 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0258","type":"read","prompt_ja":"【ニュース】大型の台風が近づいており、明日の午後から西日本で雨と強い風が予想されています。交通機関への影響も心配されるため、各鉄道会社は、明日の一部の列車を運休すると発表しました。最新の情報は、各社のホームページで確認できます。","prompt_zh":"与报道内容相符的是哪一项？","options":["一部の列車が運休になる","すべての電車が止まる","明日は晴れて暑くなる","台風はもう去った"],"answer":"一部の列車が運休になる","rationale":"「一部の列車を運休すると発表」。「すべて」是扩大化，「晴れ」「去った」与本文相反。注意「〜すると発表しました」与「運休になる」的替换表达。","audio_text":"","rubric":"选 一部の列車が運休になる 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0260","type":"read","prompt_ja":"図書館からのお知らせ：本を借りるには、利用カードが必要です。カードは、受付で申請書に記入し、身分が確認できるものを一つお見せいただければ、その場でお作りします。カードをなくした場合も、同じ手続きで再発行できますので、お気軽にお申し出ください。","prompt_zh":"办理借书证需要什么？","options":["申請書への記入と身分証明になるもの","お金と写真二枚","学校からの手紙","事前の予約"],"answer":"申請書への記入と身分証明になるもの","rationale":"文中明写「申請書に記入し、身分が確認できるものを一つお見せいただければ」。钱、照片、预约、介绍信都未出现，不能附加文中没有的信息（G0073 的「お見せいただければ」）。","audio_text":"","rubric":"选 申請書への記入と身分証明になるもの 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0319","type":"free_production","prompt_ja":"","prompt_zh":"假设你是新职员，用「〜て ほしい」（G0060）和「説明／操作／連絡」中至少一个词，写一句希望前辈做的事。","options":[],"answer":"","rationale":"「N に Vて ほしい」动作主体用 に（G0060）；后辈对前辈须用礼貌体并加铺垫（先輩、すみませんが…）；恰当使用至少一个给定 N3/N4 词。","audio_text":"","rubric":"①N に Vてほしい且主体用に 1 分；②恰用至少一个给定词 1 分；③礼貌体、符合后辈对前辈语气 1 分","expected_production":"先輩、この機械の操作をもう一度説明してほしいのですが。","difficulty":4}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","text_ja":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","text_kana":"","text_zh":"喜好因人而异。对我来说日语很难。我们来聊聊日语吧。","focus_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","url":"","license":"original"},{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが書けるようになりました。とても便利です。","text_kana":"","text_zh":"已经能用电脑写日语邮件了。非常方便。","focus_zh":"「書けるようになりました」表从不会到会的变化；「パソコンで」的「で」表工具手段用电脑，不是动作场所。","audio_text":"パソコンで日本語のメールが書けるようになりました。とても便利です。","url":"","license":"original"}],"viz":{"day":64,"phase":"P4","new_count":7,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"人によって好きなものが違います。","kana":"","zh":"喜好因人而异。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。"},{"ja":"私にとって、日本語は難しいです。","kana":"","zh":"对我来说日语很难。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"私にとって、日本語は難しいです。"},{"ja":"その可能性もあり得ます。","kana":"","zh":"那种可能性也存在。","note_zh":"得る 接 ます形去ます（起こり得る），不接辞书形；中文「可能发生」直译错","audio_text":"その可能性もあり得ます。"}],"review_plan":[{"kid":"V0245","surface":"残業","kana":"ざんぎょう","zh":"加班","
