tch":"V0080","surface":"本","ko":"책","hint_zh":"日语『本』＝书，但韩语『书』是固有词 책，不是汉字词 본；본 在韩语是本/根本/书本量词，别按汉字找同形词。","caution":"ほん ≠ 책 来源完全不同；看到日语汉字『本』别推韩语本；韩语 책 是固有词，与日语 本、中文『本』都不是同一来源。"},{"match":"V0082","surface":"勉強","ko":"공부","hint_zh":"【注意】中日同形异义＋韩语无同形汉字词：日语 勉強＝学习，中文『勉强』＝硬撑，韩语『学习』说 공부（固有词＋하다）、不用这个汉字词，三方都不同。","caution":"べんきょう 与 공부 来源无关；中文母语者极易把『日本語を勉強します』误解成勉强日语；韩语 면강 几乎不用，绝不能造一个『면강』来对照，硬套必错。"}]}}</script>
