<script type="application/json" id="nh80-day">{"day":70,"phase":"P5","theme":"交通出行｜交通出行","scene":"【交通出行】交通出行：在 weekly（交通出行｜交通出行）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出（素材：バス路線の一部変更｜主题键：transport｜对齐：review）","scene_tag":"交通出行","scene_topic_key":"transport","scene_topic":"交通出行","topic_match":"review","material_topic_keys":["transport","transport"],"material_pair":"same_topic","can_do":"在 weekly（交通出行｜交通出行）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出","focus":["production","grammar"],"objectives":["能读准今天汉字的日语读音，不照中文读音猜","能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","能从一小段通知或短文里找出主要意思，并说出一句依据","Can-do：在 weekly（交通出行｜交通出行）中分项展示五维能力，并用「V辞書形 / Vない形 / い形 / な形な + うちに」完成 1 次独立输出","本日评估 weekly：分项记录词汇/语法/阅读/听力/表达得分"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期项主动回忆，无提示优先"},{"min":10,"type":"new","desc":"当天新知识快速回顾（不新增超纲内容）"},{"min":5,"type":"interaction","desc":"短场景口头输出，保持表达能力训练"},{"min":30,"type":"assessment","desc":"合并执行当天唯一的 weekly，不叠加多套试卷"},{"min":5,"type":"feedback","desc":"归因、写档、生成下一日任务"}],"vocab":[],"grammar":[],"kanji":[],"questions":[{"id":"Q0277","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：工资高，另一方面加班也多（用「一方で」）","options":["残業も","一方で","多いです","給料が","高い"],"answer":"4,5,2,1,3","rationale":"「い形普通形＋一方で」（并列同一事物两面，G0085）→ 后项「残業も多いです」。な形/名词用 便利な／である，不用 だ。","audio_text":"","rubric":"编号序列为 4,5,2,1,3 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0278","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：他肯定正在看资料（用「に違いない」）","options":["に違いない","資料を","読んでいる","きっと","彼は"],"answer":"5,4,2,3,1","rationale":"主题「彼は」→「きっと」→「Vている」（G0027）→「普通形＋に違いない」（强烈推断，G0070）。动词普通形直接接，无需 である。","audio_text":"","rubric":"编号序列为 5,4,2,3,1 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0280","type":"error_correct","prompt_ja":"熱があるので、今日は病院に看病に行きます。","prompt_zh":"改正「看病」的误用（中日同形异义）","options":[],"answer":"熱があるので、今日は病院に診察を受けに行きます。","rationale":"中文『看病』＝病人去就诊，但日语「看病（かんびょう）」＝护理、照料（别的）病人，不能用于自己就诊。自己就诊说「診察を受ける／病院に行く」。","audio_text":"","rubric":"改为 診察を受けに行きます（或 病院に行きます）得 1 分，保留 看病 0 分","expected_production":"","difficulty":5},{"id":"Q0281","type":"error_correct","prompt_ja":"先生が私に辞書をさしあげました。","prompt_zh":"改正敬语方向（谦让语误用于上位者主语）","options":[],"answer":"先生が私に辞書をくださいました。","rationale":"「さしあげる」是谦让语（自己→上位者给），不能用于上位者做主语；先生给『我』要用尊敬语「くださる」。中文无敬语方向，极易混。","audio_text":"","rubric":"改为 くださいました 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0282","type":"error_correct","prompt_ja":"明日、私は先生のお宅にいらっしゃいます。","prompt_zh":"改正敬语方向（尊敬语误用于自己）","options":[],"answer":"明日、私は先生のお宅に伺います。","rationale":"「いらっしゃる」是尊敬语，不能用于自己；自己去对方家用谦让语「伺う」。","audio_text":"","rubric":"改为 伺います 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0283","type":"error_correct","prompt_ja":"友達が私の宿題を手伝ってあげました。","prompt_zh":"改正授受动词方向","options":[],"answer":"友達が私の宿題を手伝ってくれました。","rationale":"别人给『我/我方』做用「〜てくれる」；「〜てあげる」是我给别人做，方向相反（G0052）。中文『帮我』直译易误用 あげる。","audio_text":"","rubric":"改为 手伝ってくれました 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0074","kind":"reading","title":"バス路線の一部変更","text_ja":"来月一日から、市内を走る青葉バスの路線が一部変わります。これまで駅前から病院までを結んでいた便は、途中の図書館を経由するようになります。そのため、駅から病院までの所要時間は、これまでの十五分より五分ほど長くなります。朝夕の時間帯は、利用者が多いため、十分間隔で運行します。昼間は、これまで通り二十分間隔です。なお、工事が終わるまでの間、市民公園前の停留所は使用できません。近くの仮の停留所をご利用ください。","text_kana":"らいげつついたちから、しないをはしるあおばバスのろせんがいちぶかわります。これまでえきまえからびょういんまでをつないでいたびんは、とちゅうのとしょかんをけいゆするようになります。そのため、えきからびょういんまでのしょようじかんは、これまでのじゅうごふんよりごふんほどながくなります。あさゆうのじかんたいは、りようしゃがおおいため、じゅっぷんかんかくでうんこうします。ひるまは、これまでどおりにじゅっぷんかんかくです。なお、こうじがおわるまでのあいだ、しみんこうえんまえのていりゅうじょはしようできません。ちかくのかりのていりゅうじょをごりようください。","text_zh":"从下个月一号起，市内青叶公交的部分线路将变更。此前连接站前到医院的车次，将改为途经途中的图书馆。因此，从车站到医院所需时间比原来的十五分钟长约五分钟。早晚时段乘客多，每十分钟一班。白天仍为每二十分钟一班。另外，施工结束前，市民公园前站无法使用。请使用附近的临时站点。","focus_zh":"「一部変わります」不是全线；「経由するようになります」=改为途经；「五分ほど長く」是增加约5分钟；「仮の停留所」是临时站。","audio_text":"来月一日から、市内を走る青葉バスの路線が一部変わります。これまで駅前から病院までを結んでいた便は、途中の図書館を経由するようになります。そのため、駅から病院までの所要時間は、これまでの十五分より五分ほど長くなります。朝夕の時間帯は、利用者が多いため、十分間隔で運行します。昼間は、これまで通り二十分間隔です。なお、工事が終わるまでの間、市民公園前の停留所は使用できません。近くの仮の停留所をご利用ください。","url":"","license":"original"},{"id":"M0089","kind":"listening","title":"バスの運転手と乗客：到着場所","text_ja":"A：すみません、このバスは市民病院まで行きますか。\nB：はい、行きます。ですが、今日は工事で、病院の前ではなく、西門に到着します。\nA：西門ですか。病院まで歩いてどのくらいですか。\nB：三分ぐらいです。すぐ分かりますよ。\nA：よかった。あのう、運賃はいくらですか。\nB：二百円です。降りるときに払ってください。\nA：カードは使えますか。\nB：すみません、今日は機械が故障していて、現金だけです。\nA：じゃあ、小銭を用意します。ありがとうございます。","text_kana":"A：すみません、このバスはしみんびょういんまでいきますか。\nB：はい、いきます。ですが、きょうはこうじで、びょういんのまえではなく、にしもんにとうちゃくします。\nA：にしもんですか。びょういんまであるいてどのくらいですか。\nB：さんぷんぐらいです。すぐわかりますよ。\nA：よかった。あのう、うんちんはいくらですか。\nB：にひゃくえんです。おりるときにはらってください。\nA：カードはつかえますか。\nB：すみません、きょうはきかいがこしょうしていて、げんきんだけです。\nA：じゃあ、こぜにをよういします。ありがとうございます。","text_zh":"A：请问这趟公交到市民医院吗？\nB：是的，到。但今天因施工，不停医院前，而是到西门。\nA：西门吗？走到医院要多久？\nB：大约三分钟。马上就能找到。\nA：太好了。那个，车费多少？\nB：两百日元。下车时付。\nA：能用卡吗？\nB：抱歉，今天机器故障，只能现金。\nA：那我准备零钱。谢谢。","focus_zh":"人物关系是公交司机与乘客。信息干扰：平时到医院前，今天因施工到西门；支付方式也说今天只能现金。","audio_text":"A：すみません、このバスは市民病院まで行きますか。\nB：はい、行きます。ですが、今日は工事で、病院の前ではなく、西門に到着します。\nA：西門ですか。病院まで歩いてどのくらいですか。\nB：三分ぐらいです。すぐ分かりますよ。\nA：よかった。あのう、運賃はいくらですか。\nB：二百円です。降りるときに払ってください。\nA：カードは使えますか。\nB：すみません、今日は機械が故障していて、現金だけです。\nA：じゃあ、小銭を用意します。ありがとうございます。","url":"","license":"original"},{"id":"M0060","kind":"reading","title":"IRODORI: Japanese for Life in Japan（国際交流基金 公式）","text_ja":"","text_kana":"","text_zh":"","focus_zh":"","audio_text":"","url":"https://www.irodori.jpf.go.jp/en/","license":"© 国際交流基金日本語教育センター / The Japan Foundation（Irodori 官方 Terms of Use：除私用与学校教育外不得复制或改变；公开派生教材须免费并注明出处；禁止商用。非标准 CC 许可，以官网 Copyright and usage guidelines 为准）"}],"viz":{"day":70,"phase":"P5","new_count":0,"review_count":12,"question_count":6},"assessment":"weekly","lesson_core":[{"ja":"来月一日から、市内を走る青葉バスの路線が一部変わります。","kana":"らいげつついたちから、しないをはしるあおばバスのろせんがいちぶかわります。","zh":"从下个月一号起，市内青叶公交的部分线路将变更。","note_zh":"「一部変わります」不是全线；「経由するようになります」=改为途经；「五分ほど長く」是增加约5分钟；「仮の停留所」是临时站。","audio_text":"来月一日から、市内を走る青葉バスの路線が一部変わります。","origin":"material","source_id":"M0074"},{"ja":"これまで駅前から病院までを結んでいた便は、途中の図書館を経由するようになります。","kana":"これまでえきまえからびょういんまでをつないでいたびんは、とちゅうのとしょかんを
