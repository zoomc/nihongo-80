／影響を与える／影響を受ける」对象用 に；中文“影响”可直接带宾语，日语「物価を影響する」错，须用 に；韩语 영향 同源可帮记音读，但不能靠汉字猜助词；「影」エイ、「響」キョウ。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0214","surface":"関係","kana":"かんけい","romaji":"kankei","pos":"名詞/サ変","meaning_zh":"关系；关联","jlpt":"N3","examples":[{"ja":"この件には関係ありません。","zh":"和这件事没关系。","audio_text":"この件には関係ありません。"}],"notes_for_zh":"「関係」かんけい 名词/サ変，「〜と関係がある／〜に関係する／関係ない」；中文“有关系”日语用 が ある，不用 を ある；「関」カン、「係」ケイ 不可按中文 guān/xì 推；韩语 관계 同源可帮记，但不能靠汉字猜助词。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0215","surface":"状況","kana":"じょうきょう","romaji":"joukyou","pos":"名詞","meaning_zh":"状况；情形（外部局面）","jlpt":"N3","examples":[{"ja":"今の状況を報告してください。","zh":"请报告目前的情况。","audio_text":"今の状況を報告してください。"}],"notes_for_zh":"「状況」じょうきょう 名词，“外部局面/处境”，与「状態」じょうたい（事物自身状态）分工；中文“情况”两词都译，日语须分；韩语 상황 同源可帮记，但不能靠汉字猜；「況」キョウ 不可按中文 kuàng 推。","confusables":["V0218"],"ko":"","ko_hint":"","caution":""},{"id":"V0216","surface":"内容","kana":"ないよう","romaji":"naiyou","pos":"名詞","meaning_zh":"内容","jlpt":"N3","examples":[{"ja":"メールの内容を確認しました。","zh":"确认了邮件内容。","audio_text":"メールの内容を確認しました。"}],"notes_for_zh":"「内容」ないよう 名词，「〜の内容／内容を確認する」；中日同形义近但「内」ナイ、「容」ヨウ，不可按中文 nèiróng 推（尤其「容」不读 ロン）；韩语 내용 同源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0219","surface":"気持ち","kana":"きもち","romaji":"kimochi","pos":"名詞","meaning_zh":"心情；感受；心意","jlpt":"N3","examples":[{"ja":"気持ちを言葉にするのは難しい。","zh":"把心情化成语言很难。","audio_text":"気持ちを言葉にするのは難しい。"}],"notes_for_zh":"「気持ち」きもち 名词，“一时的情绪/心意”，「気持ちを込める／気持ちがいい」；与「気分」きぶん（身心状态/气氛）不同：気持ち 是“心里的感受”；「気」キ、「持」ジ，此词训读 きもち，不能靠汉字猜。","confusables":["V0220"],"ko":"","ko_hint":"","caution":""},{"id":"V0220","surface":"気分","kana":"きぶん","romaji":"kibun","pos":"名詞","meaning_zh":"心情；身体状态；气氛","jlpt":"N3","examples":[{"ja":"今日は気分が悪いです。","zh":"今天身体/心情不舒服。","audio_text":"今日は気分が悪いです。"}],"notes_for_zh":"「気分」きぶん 名词，「気分がいい／悪い／気分転換」；与「気持ち」分工：気分 偏“身心状态/氛围”；「気分が悪い」是“不舒服/想吐”，不止“心情坏”，中文易误；汉字不能靠猜。","confusables":["V0219"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0079","pattern":"V ば形 + 同一動詞 辞書形 + ほど","meaning_zh":"越…越…","connection":"動詞 条件形(ば) + 同じ動詞 辞書形 + ほど；い形 ければ＋い形＋ほど；な形 なら＋な形＋ほど","example":"練習すればするほど、上手になります。","usage":"前后同词重复，表成正比变化；常与 ますます 呼应","explanation_zh":"意思是「越…越…」；接续：動詞 条件形(ば) + 同じ動詞 辞書形 + ほど；い形 ければ＋い形＋ほど；な形 なら＋な形＋ほど（中文术语：动词 条件形(ば) + 同じ动词 辞书形 + ほど；い形 ければ＋い形＋ほど；な形 なら＋な形＋ほど）；用法：前后同词重复，表成正比变化；常与 ますます 呼应","common_errors":[{"wrong":"練習すれば、上手になります。","why":"这是普通条件句，不含「越…越…」；中文「越练越好」直译丢 ほど 错","fix":"練習すればするほど上手になります。","learner":"zh"},{"wrong":"高いば高いほど","why":"い形 ば形 是 高ければ（去 い＋ければ），不是 高い＋ば；中文无变形按汉字直译错","fix":"高ければ高いほど、…","learner":"zh"}],"compare":[{"id":"G0038","diff":"条件形使い分け 是单句条件；ば…ほど 是同词重复表比例变化"},{"id":"G0077","diff":"に伴って/につれて 是「A 变 B 也变」；ば…ほど 是「A 程度越高 B 程度越高」成正比"}],"examples":[{"ja":"練習すればするほど、上手になります。","zh":"越练越熟练。","audio_text":"練習すればするほど、上手になります。"},{"ja":"値段が高ければ高いほど、売れにくくなります。","zh":"价格越贵越难卖。","audio_text":"値段が高ければ高いほど、売れにくくなります。"}],"ko":"-(으)면 -(으)ㄹ수록","ko_hint":"『越…越…』≒ -(으)면 -(으)ㄹ수록，结构（同动词重复＋程度）可对照，是较贴近的一条。","caution":"日语靠 ば形＋ほど、韩语靠 -(으)면＋-(으)ㄹ수록，形式不同源；ほど 还表比较基准（G0034『不如』），别把两句都翻成 -만큼；同一动词要重复，韩语也重复但不能省后一半。"},{"id":"G0081","pattern":"普通形 + くせに / ものの / とはいえ","meaning_zh":"明明…却（责备）／虽然…但是／虽说…然而","connection":"くせに：普通形（な形/名词 用 な／である）；ものの：普通形（书面让步）；とはいえ：名词/普通形＋とはいえ","example":"知っているくせに、教えてくれませんでした。","usage":"くせに 带强烈责备/轻蔑（对人不满）；ものの 是中性书面让步；とはいえ 是「话虽如此」，常修正前句","explanation_zh":"意思是「明明…却（责备）／虽然…但是／虽说…然而」；接续：くせに：普通形（な形/名词 用 な／である）；ものの：普通形（书面让步）；とはいえ：名词/普通形＋とはいえ（中文术语：くせに：简体（な形/名词 用 な／である）；ものの：简体（书面让步）；とはいえ：名词/简体＋とはいえ）；用法：くせに 带强烈责备/轻蔑（对人不满）；ものの 是中性书面让步；とはいえ 是「话虽如此」，常修正前句","common_errors":[{"wrong":"先生は知っているくせに、教えてくれませんでした。","why":"くせに 带责备/轻蔑，对老师用极失礼；中文「明明…却」直译不看对象错","fix":"先生はご存じなのに、教えてくださいませんでした。","learner":"zh"},{"wrong":"子供だくせに、…","why":"名词/な形 接 くせに 用 な／である（子供なくせに），不用 だ；中文「明明是孩子」直译保留 だ 错","fix":"子供なくせに、…","learner":"zh"}],"compare":[{"id":"G0075","diff":"のに 只是意外/遗憾；くせに 带明显责备、轻蔑，语气更重，不能对长辈用"},{"id":"G0037","diff":"から/ので 顺接；ものの/とはいえ 是让步逆接，方向相反"}],"examples":[{"ja":"知っているくせに、教えてくれませんでした。","zh":"明明知道却不告诉我。","audio_text":"知っているくせに、教えてくれませんでした。"},{"ja":"買ったものの、使っていません。","zh":"虽然买了却没在用。","audio_text":"買ったものの、使っていません。"},{"ja":"高いとはいえ、品質はいいです。","zh":"虽说贵，质量倒不错。","audio_text":"高いとはいえ、品質はいいです。"}],"ko":"-면서(도)·-주제에 / -기는 하지만 / -다고는 해도","ko_hint":"『明明…却（责备）』≒ -면서도/-주제에、『虽然…但是』≒ -기는 하지만、『虽说…然而』≒ -다고는 해도，可分层对照。","caution":"くせに 带责备/轻蔑，韩语 -주제에 也带但更重、-면서도 偏中性，别一律翻 -면서；ものの/とはいえ 是书面让步，韩语 -기는 하지만/-다고는 해도 语域不同源；三者不能互换。"}],"kanji":[{"id":"K0114","char":"相","onyomi":["ソウ"],"kunyomi":["あい"],"meaning_zh":"相；互相；相貌；商谈","zh_trap":"中文「相」xiāng/xiàng；日语 相 音读 ソウ（相談 そうだん）/ショウ（首相 しゅしょう）、训读 あい（相手 あいて）；「相談」是「商量」，不能按中文「互相谈话」机械套。","vocab_refs":["V0248"],"examples":[{"ja":"相談","kana":"そうだん","zh":"商量；咨询"}],"ko_hint":"韩语汉字词可参考：상담(하다)。日韩汉字词形近义近（そうだん／상담＝商量/咨询）。"},{"id":"K0115","char":"談","onyomi":["ダン"],"kunyomi":[],"meaning_zh":"谈；商谈；谈话","zh_trap":"中文「谈」tán；日语 談 音读 ダン，「相談」そうだん「談話」だんわ；简体「谈」与「談」不同，「相談」是「商谈/咨询」不是单纯「聊天」，此字无常用训读。","vocab_refs":["V0248"],"examples":[{"ja":"相談","kana":"そうだん","zh":"商量；咨询"}],"ko_hint":"韩语汉字词可参考：상담(하다)。日韩汉字词形近义近（そうだん／상담＝商量/咨询）。"}],"questions":[{"id":"Q0271","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：会议资料已事先备好（用「てある」）","options":["もう","用意して","あります","会議の資料は"],"answer":"4,1,2,3","rationale":"主题「会議の資料は」→副词「もう」→「Vて形＋あります」（G0056）。宾语原本用 を，てある 句用 が/は 提示。","audio_text":"","rubric":"编号序列为 4,1,2,3 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0279","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：请确认部长是否来（用「かどうか」）","options":["かどうか","来る","確認して","部長が","ください"],"answer":"4,2,1,3,5","rationale":"「普通形＋かどうか」（是否，G0058）作确认的宾语从句，名词/な形不加 だ；后接「Vて＋ください」（G0026）。","audio_text":"","rubric":"编号序列为 4,2,1,3,5 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0288","type":"error_correct","prompt_ja":"昨日は会議があったです。","prompt_zh":"改正敬简混用（简体＋です）","options":[],"answer":"昨日は会議がありました。","rationale":"简体「あった」不能直接接「です」；礼貌体过去用「ありました」，或用说明语气「あったんです」（G0059）。中文『（过去）有』无敬简变形，直译易混。","audio_text":"","rubric":"改为 ありました（或 あったんです）得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0293","type":"error_correct","prompt_ja":"明日の会議は、行かなくていいです。","prompt_zh":"改正「〜なくても いい」漏「も」","options":[],"answer":"明日の会議は、行かなくてもいいです。","rationale":"「Vない形去ない＋くても＋いい」＝不必…（G0047）；「なくて」是中顿/原因，不能表许可。中文『不…也行』直译容易漏掉「も」。","audio_text":"","rubric":"改为 行かなくてもいい 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0375","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，会議は何時からになりましたか。","options":["2時半","3時半","3時","4時"],"answer":"3時半","rationale":"A 先说「三時から」，随即改口「三時ではなく、三時半から」。最终是3点半，不是3点。","audio_text":"A：田中さん、明日の企画会議は三時からですよね。\nB：はい、部長。三時からです。\nA：あ、すみません。三時ではなく、三時半からになりました。\nB：わかりました。三時半ですね。","rubric":"选 3時半 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0168","type":"error_correct","prompt_ja":"雨のおかげで、行けませんでした。","prompt_zh":"改错：消极结果误用 おかげで","options":[],"answer":"雨のせいで、行けませんでした。","rationale":"消极结果用 せいで，おかげで 只用于好事；名词后要加 の","audio_text":"","rubric":"改为 せいで 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0049","kind":"listening","title":"駅の遅延放送","text_ja":"お客様にお知らせいたします。先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。ご協力をお願いいたします。","text_kana":"","text_zh":"通知各位乘客。刚才邻站发生人身事故，本列车目前停在站间。预计下午六点左右恢复运行。赶时间的乘客请利用站前公交。感谢配合。","focus_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"お客様にお知らせいたします。先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。ご協力をお願いいたします。","url":"","license":"original"},{"id":"M0066","kind":"reading","title":"台風による運休のお知らせ","text_ja":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","text_kana":"たいふうじゅうにごうのせっきんにより、あしたのしはつからごぜんじゅうじまで、ちゅうおうせんのぜんせんでうんてんをとりやめます。ごぜんじゅうじいこうも、かぜのつよさによってはうんてんをさいかいできないばあいがあります。ふりかえゆそうとして、へいこうするしてつのろせんをりようできます。ただし、ふりかえゆそうはほんすうのおおいじかんたいにかぎります。えきのまどぐちでは、うんきゅうをしょうめいするかみをくばっています。つうきんやつうがくでりようするかたは、じかんによゆうをもってこうどうしてください。さいしんのじょうほうは、えきのけいじやホームページでかくにんしてください。","text_zh":"受12号台风接近影响，明天首班车至上午十点，中央线全线停运。上午十点以后，也可能因风力强弱而无法恢复运行。作为替代运输，可利用并行的私铁路线。但替代运输仅限班次较多的时段。车站窗口在发放停运证明。通勤通学的人请留出时间余量再行动。最新信息请在车站告示或网站确认。","focus_zh":"「取りやめます」=停运；「見込み」不是确定；「振替輸送」是替代运输，不是退票；「に限ります」=仅限。","audio_text":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","url":"","license":"original"}],"viz":{"day":55,"phase":"P4","new_count":12,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"お客様にお知らせいたします。","kana":"","zh":"通知各位乘客。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"お客様にお知らせいたします。","origin":"material","source_id":"M0049"},{"ja":"先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。","kana":"","zh":"刚才邻站发生人身事故，本列车目前停在站间。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。","origin":"material","source_id":"M0049"},{"ja":"運転を再開するのは、午後六時ごろになる見込みです。","kana":"","zh":"预计下午六点左右恢复运行。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"運転を再開するのは、午後六時ごろになる見込みです。","origin":"material","source_id":"M0049"}],"review_plan":[{"kid":"V0244","surface":"会議","kana":"かいぎ","zh":"会议","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":54,"next_hint_zh":"按课程间隔，大约 Day 56 再预习","planned_only":true},{"kid":"V0243","surface":"職場","kana":"しょくば","zh":"职场；工作岗位","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":54,"next_hint_zh":"按课程间隔，大约 Day 56 再预习","planned_only":true},{"kid":"V0249","surface":"就職","kana":"しゅうしょく","zh":"就职；就业","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":54,"next_hint_zh":"按课程间隔，大约 Day 56 再预习","planned_only":true},{"kid":"V0271","surface":"打ち合わせ","kana":"うちあわせ","zh"
