"romaji":"genshou","pos":"名詞/サ変","meaning_zh":"减少","jlpt":"N3","examples":[{"ja":"今年は外出する人が減少しました。","zh":"今年外出的人减少了。","audio_text":"今年は外出する人が減少しました。"}],"notes_for_zh":"「減少」是数量减少，书面；自动词「減る」；他动词「減らす」；中文“减少”不分自他。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0327","surface":"傾向","kana":"けいこう","romaji":"keikou","pos":"名詞","meaning_zh":"倾向","jlpt":"N3","examples":[{"ja":"その傾向は今年も続いています。","zh":"那个趋势今年也在持续。","audio_text":"その傾向は今年も続いています。"}],"notes_for_zh":"「傾向」是趋势/倾向；「〜傾向がある／傾向が続く」；中文“倾向”同义；读 けいこう。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0329","surface":"調査","kana":"ちょうさ","romaji":"chousa","pos":"名詞/サ変","meaning_zh":"调查","jlpt":"N3","examples":[{"ja":"市が住民に調査を行いました。","zh":"市里对居民进行了调查。","audio_text":"市が住民に調査を行いました。"}],"notes_for_zh":"「調査」是系统调查；「調査を行う／調査によると」；中文“调查”同义；读 ちょうさ。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0331","surface":"見込み","kana":"みこみ","romaji":"mikomi","pos":"名詞","meaning_zh":"预计；可能性","jlpt":"N3","examples":[{"ja":"雨は夜には止む見込みです。","zh":"预计雨夜里会停。","audio_text":"雨は夜には止む見込みです。"}],"notes_for_zh":"「見込み」是预计/有望；「〜見込みです／見込みがある」；中文无“看込”一词；读 みこみ。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0087","pattern":"V辞書形 / Vた形 / Nの + ついでに","meaning_zh":"顺便…；借…之便…","connection":"動詞辞書形/た形 + ついでに；名詞 + の + ついでに","example":"駅へ行くついでに、切符を買いました。","usage":"做主要事情时，顺便做另一件次要事情；次要动作通常耗时短、顺路。","explanation_zh":"意思是「顺便…；借…之便…」；接续：動詞辞書形/た形 + ついでに；名詞 + の + ついでに（中文术语：动词辞书形/た形 + ついでに；名词 + の + ついでに）；用法：做主要事情时，顺便做另一件次要事情；次要动作通常耗时短、顺路。","common_errors":[{"wrong":"駅へ行くのついでに、切符を買いました。","why":"辞书形后接 ついでに 不加 の；の 只能接名词。","fix":"駅へ行くついでに、切符を買いました。","learner":"zh"},{"wrong":"駅へ行くついでにで、切符を買いました。","why":"ついでに 后不接 で；中文“顺便”直译加 で。","fix":"駅へ行くついでに、切符を買いました。","learner":"zh"}],"compare":[{"id":"G0086","diff":"たびに 是每次反复；ついでに 是一次性的顺带行为，主次分明。"}],"examples":[{"ja":"駅へ行くついでに、切符を買いました。","zh":"去车站时顺便买了车票。","audio_text":"駅へ行くついでに、切符を買いました。"},{"ja":"資料を届けるついでに、部長に挨拶しました。","zh":"送资料时顺便向部长打了招呼。","audio_text":"資料を届けるついでに、部長に挨拶しました。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0136","char":"果","onyomi":["カ"],"kunyomi":["はたす"],"meaning_zh":"果；结果；果实；达成","zh_trap":"中文「果」guǒ；日语 果 音读 カ（結果 けっか、効果 こうか 的 果 读 カ）、训读 はたす（果たす 达成）；「結果」是「结果」读 ケッカ（促音+カ），不可按中文 guǒ 推。","vocab_refs":["V0208"],"examples":[{"ja":"結果","kana":"けっか","zh":"结果"}],"ko_hint":""}],"questions":[{"id":"Q0346","type":"mcq","prompt_ja":"雨は夜には止む___です。","prompt_zh":"【言語知識】填入表示“预计”的词。","options":["割合","傾向","見込み","対象"],"answer":"見込み","rationale":"「〜見込みです」表示预计；「傾向」是趋势，「割合」是比例，「対象」是对象，均不能构成“预计会停”。","audio_text":"","rubric":"选 見込み 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0347","type":"mcq","prompt_ja":"物価が上がる___があります。","prompt_zh":"【言語知識】填入表示“有…倾向”的词。","options":["見込み","条件","割合","傾向"],"answer":"傾向","rationale":"「〜傾向があります」表示有某种倾向；「見込み」是预计，「割合」是比例，「条件」是条件。","audio_text":"","rubric":"选 傾向 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0357","type":"mcq","prompt_ja":"市立図書館の利用者が増加しています。図書館によると、今年の利用者数は去年より一割ほど多いということです。仕事や子育てについて調べる大人が増えたことに加え、静かに勉強できる場所を求める学生も目立つようになりました。一方で、席が足りないという声も出ています。図書館は来月から、夜八時まで開館する日を週に二日増やす予定です。ただし、本の貸し出しの受付は七時半までとなります。また、静かな席を増やす工事も予定されています。","prompt_zh":"【読解】根据第2句，今年の利用者数はどうなりましたか。","options":["去年より約一割増えた","去年より約一割減った","去年と同じだった","去年の二倍になった"],"answer":"去年より約一割増えた","rationale":"第2句「去年より一割ほど多い」=比去年多约一成。不是减少、持平或翻倍。","audio_text":"","rubric":"选 去年より約一割増えた 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0363","type":"mcq","prompt_ja":"来月三日の午前九時から、市全体で防災訓練を行います。訓練の開始と同時に、防災無線から大きな音が流れますので、驚かないでください。この音は、地震が起きたことを知らせるものではありません。訓練では、近くの小学校まで歩いて避難する練習をします。参加する方は、動きやすい服装で、飲み物を持って来てください。車での来場は禁止です。雨の場合も実施しますが、警報が出たときは中止します。参加を希望する方は、今週金曜日までに町内会へ申し込んでください。","prompt_zh":"【読解】根据第6句，訓練に参加するとき、してはいけないことはどれですか。","options":["動きやすい服を着る","車で来場する","飲み物を持つ","歩いて避難する"],"answer":"車で来場する","rationale":"第6句「車での来場は禁止です」明确禁止开车来。步行避难、带饮料、穿便于活动的衣服都是文中要求。","audio_text":"","rubric":"选 車で来場する 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0170","type":"free_production","prompt_ja":"请用 はず 写一句基于依据的推断。","prompt_zh":"自由写作","options":[],"answer":"","rationale":"考查 はずです 的迁移使用","audio_text":"","rubric":"①前接普通形/た形得 1 分；②用 はずです 得 1 分；③语义为「理应」得 1 分","expected_production":"彼はもう家に帰ったはずです。","difficulty":5},{"id":"Q0171","type":"dialogue","prompt_ja":"A 问「高い料理は美味しいですか」，请用部分否定回答。","prompt_zh":"评价对话","options":[],"answer":"","rationale":"考查 わけではない 在问答中的运用","audio_text":"","rubric":"①用 からといって 承接得 1 分；②用 わけではありません 得 1 分；③礼貌体得 1 分","expected_production":"高いからといって、美味しいわけではありません。","difficulty":5}],"materials":[{"id":"M0067","kind":"reading","title":"退去の連絡と敷金","text_ja":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。敷金は、修理が必要な場合に使われ、残った分は返ってきます。ただし、通常の使用による傷は、借りた人の負担にならないのが一般的です。契約書に書いてある内容を、必ず確認しておきましょう。","text_kana":"ちんたいじゅうたくをでるときは、すくなくともいっかげつまえまでに、おおやさんかふどうさんがいしゃへれんらくしてください。たいきょのひがきまったら、へやのきずやよごれをかくにんし、じぶんでなおせるものはなおしておくと、ひようをおさえられます。れいぞうこやベッドなどのおおがたごみは、じぶんでしょぶんするか、しょぶんをたのむひつようがあります。しききんは、しゅうりがひつようなばあいにつかわれ、のこったぶんはかえってきます。ただし、つうじょうのしようによるきずは、かりたひとのふたんにならないのがいっぱんです。けいやくしょにかいてあるないようを、かならずかくにんしておきましょう。","text_zh":"搬出租房时，请至少提前一个月联系房东或房产公司。搬出日定下后，确认房间的伤痕和污渍，能自己修的先修好，可以压低费用。冰箱、床等大件垃圾，需要自己处理或委托处理。押金在需要修理时被使用，剩余部分会退还。不过，正常使用造成的伤痕，一般不由租客负担。合同书上写的内容，一定要事先确认。","focus_zh":"「敷金」可能退还，「礼金」不退；「通常の使用による傷」一般不由租客承担；「処分」是处理大件垃圾。","audio_text":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。敷金は、修理が必要な場合に使われ、残った分は返ってきます。ただし、通常の使用による傷は、借りた人の負担にならないのが一般的です。契約書に書いてある内容を、必ず確認しておきましょう。","url":"","license":"original"},{"id":"M0086","kind":"listening","title":"友人同士：引っ越しの手伝い","text_ja":"A：来週の引っ越し、土曜日に手伝ってもらえる？\nB：うん、いいよ。土曜日の午前中なら大丈夫。\nA：ありがとう。じゃあ、九時に新居に来てくれる？\nB：あ、ごめん。土曜日は昼から歯医者だった。日曜日でもいい？\nA：日曜日は大家さんが来るから、午後は無理なんだ。\nB：じゃあ、土曜日の夕方ならどう？　歯医者が終わってから行くよ。\nA：助かる。六時ごろでいい？\nB：うん。軽トラックは借りたの？\nA：まだ。明日借りに行く予定。\nB：なら、僕も一緒に行くよ。重い物は二人のほうが早いから。","text_kana":"A：らいしゅうのひっこし、どようびにてつだってもらえる？\nB：うん、いいよ。どようびのごぜんちゅうならだいじょうぶ。\nA：ありがとう。じゃあ、くじにしんきょにきてくれる？\nB：あ、ごめん。どようびはひるからはいしゃだった。にちようびでもいい？\nA：にちようびはおおやさんがくるから、ごごはむりなんだ。\nB：じゃあ、どようびのゆうがたならどう？　はいしゃがおわってからいくよ。\nA：たすかる。ろくじごろでいい？\nB：うん。けいトラックはかりたの？\nA：まだ。あしたかりにいくよてい。\nB：なら、ぼくもいっしょにいくよ。おもいものはふたりのほうがはやいから。","text_zh":"A：下周搬家，周六能来帮忙吗？\nB：嗯，可以。周六上午的话没问题。\nA：谢谢。那九点来新家可以吗？\nB：啊，抱歉。周六中午开始要看牙。周日可以吗？\nA：周日房东要来，下午不行。\nB：那周六傍晚怎么样？看完牙我就过去。\nA：那太好了。六点左右可以吗？\nB：嗯。轻型卡车借了吗？\nA：还没。打算明天去借。\nB：那我一起去。重东西两个人搬更快。","focus_zh":"人物关系是朋友，用普通体。信息干扰：先说周六上午，因看牙改周日，周日房东来，最后定周六傍晚六点。","audio_text":"A：来週の引っ越し、土曜日に手伝ってもらえる？\nB：うん、いいよ。土曜日の午前中なら大丈夫。\nA：ありがとう。じゃあ、九時に新居に来てくれる？\nB：あ、ごめん。土曜日は昼から歯医者だった。日曜日でもいい？\nA：日曜日は大家さんが来るから、午後は無理なんだ。\nB：じゃあ、土曜日の夕方ならどう？　歯医者が終わってから行くよ。\nA：助かる。六時ごろでいい？\nB：うん。軽トラックは借りたの？\nA：まだ。明日借りに行く予定。\nB：なら、僕も一緒に行くよ。重い物は二人のほうが早いから。","url":"","license":"original"}],"viz":{"day":62,"phase":"P4","new_count":9,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。","kana":"ちんたいじゅうたくをでるときは、すくなくともいっかげつまえまでに、おおやさんかふどうさんがいしゃへれんらくしてください。","zh":"搬出租房时，请至少提前一个月联系房东或房产公司。","note_zh":"「敷金」可能退还，「礼金」不退；「通常の使用による傷」一般不由租客承担；「処分」是处理大件垃圾。","audio_text":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。","origin":"material","source_id":"M0067"},{"ja":"退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。","kana":"たいきょのひがきまったら、へやのきずやよごれをかくにんし、じぶんでなおせるものはなおしておくと、ひようをおさえられます。","zh":"搬出日定下后，确认房间的伤痕和污渍，能自己修的先修好，可以压低费用。","note_zh":"「敷金」可能退还，「礼金」不退；「通常の使用による傷」一般不由租客承担；「処分」是处理大件垃圾。","audio_text":"退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。","origin":"material","source_id":"M0067"},{"ja":"冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。","kana":"れいぞうこやベッドなどのおおがたごみは、じぶんでしょぶんするか、しょぶんをたのむひつようがあります。","zh":"冰箱、床等大件垃圾，需要自己处理或委托处理。","note_zh":"「敷金」可能退还，「礼金」不退；「通常の使用による傷」一般不由租客承担；「処分」是处理大件垃圾。","audio_text":"冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。","origin":"material","source_id":"M0067"}],"review_plan":[{"kid":"V0307","surface":"睡眠","kana":"すいみん","zh":"睡眠","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":61,"next_hint_zh":"按课程间隔，大约 Day 63 再预习","
