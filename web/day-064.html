<script type="application/json" id="nh80-day">{"day":64,"phase":"P4","theme":"市政通知｜N / Vます形(去ます) + がちだ・せっかく・かえって","scene":"【市政通知】市政通知：读一份市政通知，用「N / Vます形(去ます) + がちだ」在 30 秒内说出要办的事、截止时间和一条原文依据（素材：ごみ収集日の変更のお知らせ｜主题键：notice｜对齐：exact）","scene_tag":"市政通知","scene_topic_key":"notice","scene_topic":"市政通知","topic_match":"exact","material_topic_keys":["notice","procedure"],"material_pair":"mixed_topic","can_do":"读一份市政通知，用「N / Vます形(去ます) + がちだ」在 30 秒内说出要办的事、截止时间和一条原文依据","focus":["reading","listening"],"objectives":["能听懂 市政通知 里常出现的词，并说出大概意思","能不看提示，自己说出至少 1 句完整的日语","能说清「N / Vます形(去ます) + がちだ」用在什么场合、前面该怎么接","当天新词：せっかく、かえって、むしろ（读音与用法都要验证，不靠汉字猜义）","当天句型：N / Vます形(去ます) + がちだ，须说出接续条件","当天汉字：能，音读/训读各给一例","Can-do：读一份市政通知，用「N / Vます形(去ます) + がちだ」在 30 秒内说出要办的事、截止时间和一条原文依据"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【市政通知】市政通知：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0197","surface":"せっかく","kana":"せっかく","romaji":"sekkaku","pos":"副詞/名詞","meaning_zh":"好不容易；特意；难得","jlpt":"N3","examples":[{"ja":"せっかくの休みなのに、雨です。","zh":"难得放假却下雨了。","audio_text":"せっかくの休みなのに、雨です。"}],"notes_for_zh":"「せっかく」副词/名词“好不容易/难得”，常配「〜のに／〜から／〜のだから」，多含“别浪费”语感；与「わざわざ」易混但方向相反；无汉字，不能靠汉字猜。","confusables":["V0196"],"ko":"","ko_hint":"","caution":""},{"id":"V0198","surface":"かえって","kana":"かえって","romaji":"kaette","pos":"副詞","meaning_zh":"反倒；反而","jlpt":"N3","examples":[{"ja":"安い物を買って、かえって高くつきました。","zh":"买了便宜货反倒更花钱。","audio_text":"安い物を買って、かえって高くつきました。"}],"notes_for_zh":"「かえって」副词“反倒/反而（结果与预期相反）”，常配「〜て、かえって…」，多含消极意外；与「むしろ」（宁可/倒不如，比较取舍）不同；中文“反而”直译可，但无汉字，不能靠汉字猜。","confusables":["V0199"],"ko":"","ko_hint":"","caution":""},{"id":"V0199","surface":"むしろ","kana":"むしろ","romaji":"mushiro","pos":"副詞","meaning_zh":"宁可；莫如；倒不如","jlpt":"N3","examples":[{"ja":"疲れるなら、むしろ休んだほうがいい。","zh":"累的话倒不如休息更好。","audio_text":"疲れるなら、むしろ休んだほうがいい。"}],"notes_for_zh":"「むしろ」副词“宁可/倒不如”，常配「〜より／〜ほうが／〜よりむしろ」表取舍；与「かえって」（结果相反）不同，是比较后主动选择；中文“不如”可直译；无汉字，不能靠汉字猜。","confusables":["V0198"],"ko":"","ko_hint":"","caution":""},{"id":"V0201","surface":"それとも","kana":"それとも","romaji":"soretomo","pos":"接続詞","meaning_zh":"还是；或者（选择疑问）","jlpt":"N3","examples":[{"ja":"コーヒーにしますか、それともお茶にしますか。","zh":"要咖啡，还是茶？","audio_text":"コーヒーにしますか、それともお茶にしますか。"}],"notes_for_zh":"「それとも」接続詞“还是/或者”，只用于选择疑问句（A か、それとも B か）；陈述句“或者”用「または／あるいは」，不能用 それとも——中文“或者”直译易错；不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0202","surface":"そのうえ","kana":"そのうえ","romaji":"sonoue","pos":"接続詞","meaning_zh":"加之；而且","jlpt":"N3","examples":[{"ja":"安いし、そのうえ品質もいい。","zh":"便宜，而且质量还好。","audio_text":"安いし、そのうえ品質もいい。"}],"notes_for_zh":"「そのうえ」接続詞“加之/而且”，累加同类信息，常配「〜し、そのうえ…／〜ばかりでなく」；与「そのため」（因此，因果）不同；书面也作「そのうえに」；不能靠汉字猜。","confusables":["V0204"],"ko":"","ko_hint":"","caution":""},{"id":"V0203","surface":"それでも","kana":"それでも","romaji":"soredemo","pos":"接続詞","meaning_zh":"尽管如此；即便那样","jlpt":"N3","examples":[{"ja":"雨が降りました。それでも試合は続きました。","zh":"下雨了，即便如此比赛仍继续。","audio_text":"雨が降りました。それでも試合は続きました。"}],"notes_for_zh":"「それでも」接続詞“尽管如此/即便那样”，逆接，常配前句不利条件；与「しかし」近义但更强调“在前述条件下仍…”；中文“即使这样”直译可；不能靠汉字猜。","confusables":["V0202"],"ko":"","ko_hint":"","caution":""},{"id":"V0222","surface":"不満","kana":"ふまん","romaji":"fuman","pos":"名詞/な形容詞","meaning_zh":"不满；不满意","jlpt":"N3","examples":[{"ja":"給料に不満があります。","zh":"对工资有不满。","audio_text":"給料に不満があります。"}],"notes_for_zh":"「不満」ふまん 名词/な形，对象用 に／が（〜に不満がある／不満を持つ）；与「満足」反义，接辞「不」フ 表否定；な形「不満な／不満だ」与名词「不満がある」两种用法别混；「不」フ/ブ、「満」マン 不可按中文 bù/mǎn 推。","confusables":["V0221"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0095","pattern":"N / Vます形(去ます) + がちだ","meaning_zh":"容易…；往往…（多指不好的倾向）","connection":"名詞 + がちだ；動詞ます形去ます + がちだ；がちな + 名詞","example":"朝は電車が遅れがちです。","usage":"表示某种（多负面）倾向容易发生；常用「〜がちです／がちな人」。","explanation_zh":"意思是「容易…；往往…（多指不好的倾向）」；接续：名詞 + がちだ；動詞ます形去ます + がちだ；がちな + 名詞（中文术语：名词 + がちだ；动词ます形去ます + がちだ；がちな + 名词）；用法：表示某种（多负面）倾向容易发生；常用「〜がちです／がちな人」。","common_errors":[{"wrong":"彼は病気がちなです。","why":"がち 是な形容詞型，接です 用「がちです」，不用「がちなです」；中文“容易生病”直译。","fix":"彼は病気がちです。","learner":"zh"},{"wrong":"朝は電車が遅れがちな。","why":"がちな 后面必须接名词；句末要用 がちだ／がちです。中文“容易晚点”直译成 な 收尾不合法。","fix":"朝は電車が遅れがちです。","learner":"zh"}],"compare":[{"id":"G0063","diff":"すぎる 是“过度”；がち 是“容易发生某倾向”，程度不一定过头。"}],"examples":[{"ja":"朝は電車が遅れがちです。","zh":"早上电车容易晚点。","audio_text":"朝は電車が遅れがちです。"},{"ja":"忙しい時期は、食事が不規則になりがちです。","zh":"忙碌时期，饮食容易不规律。","audio_text":"忙しい時期は、食事が不規則になりがちです。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0138","char":"能","onyomi":["ノウ"],"kunyomi":[],"meaning_zh":"能；能力；可能；艺能","zh_trap":"中文「能」néng；日语 能 音读 ノウ（可能 かのう、能力 のうりょく）；「能」另有传统艺能「能」のう 义，中文「能」无此义，不能按中文义域直推，此字无常用训读。","vocab_refs":["V0212"],"examples":[{"ja":"可能性","kana":"かのうせい","zh":"可能性"}],"ko_hint":""}],"questions":[{"id":"Q0213","type":"mcq","prompt_ja":"薬を飲んだら、___ 気分が悪くなりました。","prompt_zh":"选出最贴切的副词（本想变好却相反）","options":["むしろ","わざわざ","せっかく","かえって"],"answer":"かえって","rationale":"「かえって」表『反倒、反而』，接与预期相反的结果；「むしろ」是比较后『宁可/倒不如』的取舍，不接这种反预期变化。「せっかく」「わざわざ」语义不通。","audio_text":"","rubric":"选 かえって 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0214","type":"mcq","prompt_ja":"___ 作った料理だから、冷めないうちに食べてください。","prompt_zh":"选出最贴切的副词（别辜负难得的成果）","options":["わざわざ","せっかく","そろそろ","かえって"],"answer":"せっかく","rationale":"「せっかく」表『好不容易/特意做了，别浪费』，与「冷めないうちに食べて」呼应；「わざわざ」多修饰专程的移动或麻烦动作，不修饰成果。","audio_text":"","rubric":"选 せっかく 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0251","type":"listen","prompt_ja":"会話を聞いて、薬を飲んだあとどうなったか選んでください。","prompt_zh":"喝药之后结果如何？","options":["かえって気分が悪くなった","すっかり元気になった","頭痛だけ治った","眠れるようになった"],"answer":"かえって気分が悪くなった","rationale":"「かえって気分が悪くなって」＝与『本应变好』的预期相反、反倒变差，正是 V0198 的含义。医生因此建议「ゆっくり休んだほうがいい」。","audio_text":"顔色が悪いですよ。昨日から頭が痛くて、あまり眠れなかったんです。それは心配ですね。薬は飲みましたか。はい、でも、かえって気分が悪くなって…。そうですか。じゃあ、今日は無理をせず、ゆっくり休んだほうがいいですよ。","rubric":"选 かえって気分が悪くなった 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0255","type":"listen","prompt_ja":"会話を聞いて、先週お店に行った人の感想を選んでください。","prompt_zh":"第二个人（上周去过的）感想是哪一个？","options":["味に満足した","対応が早かった","値段が安いと思った","待たされて残念だった"],"answer":"待たされて残念だった","rationale":"第二个人说「混んでいて長く待たされた」「それは残念だったね」。『味に満足』『値段が高い』是第一个人的话，注意不要张冠李戴（考人物与发言归属）。","audio_text":"新しい食堂、どうだった？値段は少し高かったけど、味にはとても満足したよ。そう？私は先週行って、店が混んでいて長く待たされたの。それは残念だったね。そのうえ、私のときは店員の対応も遅くてね。じゃあ、評価が分かれるね。","rubric":"选 待たされて残念だった 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0180","type":"dialogue","prompt_ja":"A 问「日本語についてどう思いますか」，请用 にとって 回答。","prompt_zh":"学习感受对话","options":[],"answer":"","rationale":"考查 にとって 在问答中的运用","audio_text":"","rubric":"①用 にとって 表立场得 1 分；②用 は + 形容词谓语得 1 分；③礼貌体得 1 分","expected_production":"私にとって、日本語は難しいですが、好きです。","difficulty":5},{"id":"Q0217","type":"mcq","prompt_ja":"朝から大雨でした。___、運動会は中止になりました。","prompt_zh":"选出连接前后句（原因→结果）的接续词","options":["ところで","それでも","それとも","そのため"],"answer":"そのため","rationale":"前句是原因、后句是结果，用「そのため（因此）」；「それでも」是『尽管如此』转折，「それとも」是选择疑问，「ところで」是转话题。","audio_text":"","rubric":"选 そのため 得 1 分，其余 0 分","expected_production":"","difficulty":3}],"materials":[{"id":"M0061","kind":"reading","title":"ごみ収集日の変更のお知らせ","text_ja":"市民のみなさまへ。来月から、燃えるごみを集める日が変わります。これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。祝日がある週は、次の平日に順延します。ごみは朝八時までに、決められた場所へ出してください。指定の袋を使わないごみは集めることができませんので、ご注意ください。詳しくは市役所のホームページで確認してください。ごみを出す時間を守らないと、収集できないことがあります。市役所環境課よりお知らせしました。","text_kana":"しみんのみなさまへ。らいげつから、もえるごみをあつめるひがかわります。これまではまいしゅうげつようびともくようびでしたが、らいげつからはまいしゅうかようびときんようびになります。しゅくじつがあるしゅうは、つぎのへいじつにじゅんえんします。ごみはあさはちじまでに、きめられたばしょへだしてください。していのふくろをつかわないごみはあつめることができませんので、ごちゅういください。くわしくはしやくしょのホームページでかくにんしてください。ごみをだすじかんをまもらないと、しゅうしゅうできないことがあります。しやくしょかんきょうかよりおしらせしました。","text_zh":"致各位市民。从下个月起，可燃垃圾的收集日将变更。此前是每周一和周四，从下个月起改为每周二和周五。遇到节假日的那一周，顺延到下一个工作日。请于早上八点前将垃圾放到指定地点。不使用指定袋的垃圾无法收集，请注意。详情请到市政府网站确认。如果不遵守垃圾投放时间，有时无法收集。以上由市政府环境科通知。","focus_zh":"「順延」是“顺延到下一个工作日”，不是提前；「祝日がある週」是限定条件；「指定の袋」不是任意袋子。","audio_text":"市民のみなさまへ。来月から、燃えるごみを集める日が変わります。これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。祝日がある週は、次の平日に順延します。ごみは朝八時までに、決められた場所へ出してください。指定の袋を使わないごみは集めることができませんので、ご注意ください。詳しくは市役所のホームページで確認してください。ごみを出す時間を守らないと、収集できないことがあります。市役所環境課よりお知らせしました。","url":"","license":"original"},{"id":"M0095","kind":"listening","title":"図書館職員と利用者：返却期限","text_ja":"A：すみません、この本を返したいのですが。\nB：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。\nA：すみません。次から気をつけます。あのう、貸し出しは何日間ですか。\nB：通常は二週間です。ただし、新しい本は一週間です。\nA：この本は新しい本ですか。\nB：いいえ、通常の本なので、二週間借りられます。\nA：じゃあ、また借りたいです。お願いします。","text_kana":"A：すみません、このほんをかえしたいのですが。\nB：はい。あ、このほんはへんきゃくきげんがせんしゅうのきんようびですね。\nA：えっ、そうですか。なんにちおくれていますか。\nB：いつかおくれています。でも、はじめてのおくれですので、こんかいはちゅういだけでだいじょうぶです。\nA：すみません。つぎからきをつけます。あのう、かしだしはなんにちかんですか。\nB：つうじょうはにかんかんです。ただし、あたらしいほんはいっかんかんです。\nA：このほんはあたらしいほんですか。\nB：いいえ、つうじょうのほんなので、にかんかんかりられます。\nA：じゃあ、またかりたいです。おねがいします。","text_zh":"A：您好，我想还这本书。\nB：好的。啊，这本书的还书期限是上周五。\nA：诶，是吗？迟了几天？\nB：迟了五天。不过是第一次逾期，这次只提醒一下就行。\nA：抱歉。下次注意。那个，借书期是几天？\nB：通常两周。不过新书是一周。\nA：这本书是新书吗？\nB：不是，是普通书，可以借两周。\nA：那我还想借。拜托了。","focus_zh":"人物关系是图书馆职员与利用者。信息干扰：这本逾期五天，但首次只提醒；通常借两周，新书只借一周。","audio_text":"A：すみません、この本を返したいのですが。\nB：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。\nA：すみません。次から気をつけます。あのう、貸し出しは何日間ですか。\nB：通常は二週間です。ただし、新しい本は一週間です。\nA：この本は新しい本ですか。\nB：いいえ、通常の本なので、二週間借りられます。\nA：じゃあ、また借りたいです。お願いします。","url":"","license":"original"},{"id":"M0077","kind":"reading","title":"社員駐車場の利用規則","text_ja":"社員駐車場の利用について、お知らせします。駐車できるのは、許可証を車の前に貼っている車だけです。許可証のない車は、たとえ短い時間でも止めることができません。駐車場は先着順で、予約はできません。満車のときは、近くの有料駐車場を利用し、領収書を総務部に出してください。月に一度、経費として精算します。また、エンジンをかけたまま車を離れることは禁止です。違反が続く場合は、許可を取り消すことがあります。規則を守って、気持ちよく利用しましょう。","text_kana":"しゃいんちゅうしゃじょうのりようについて、おしらせします。ちゅうしゃできるのは、きょかしょうをくるまのまえにはっているくるまだけです。きょかしょうのないくるまは、たとえみじかいじかんでもとめることができません。ちゅうしゃじょうはせんちゃくじゅんで、よやくはできません。まんしゃのときは、ちかくのゆうりょうちゅうしゃじょうをりようし、りょうしゅうしょをそうむぶにだしてください。つきにいちど、けいひとしてせいさんします。また、エンジンをかけたままくるまをはなれることはきんしです。いはんがつづくばあいは、きょかをとりけすことがあります。きそくをまもって、きもちよくりようしましょう。","text_zh":"关于员工停车场的使用，通知如下。可停放的仅限在车前贴有许可证的车辆。没有许可证的车，即使很短时间也不能停。停车场先到先得，不能预约。满车时请利用附近收费停车场，并把收据交给总务部。每月一次作为经费报销。另外，禁止不熄火离开车辆。持续违规时可能取消许可。遵守规则，愉快使用吧。","focus_zh":"「先着順」=先到先得；「たとえ…でも」=即使；「精算」=报销结算；「取り消す」=取消。","audio_text":"社員駐車場の利用について、お知らせします。駐車できるのは、許可証を車の前に貼っている車だけです。許可証のない車は、たとえ短い時間でも止めることができません。駐車場は先着順で、予約はできません。満車のときは、近くの有料駐車場を利用し、領収書を総務部に出してください。月に一度、経費として精算します。また、エンジンをかけたまま車を離れることは禁止です。違反が続く場合は、許可を取り消すことがあります。規則を守って、気持ちよく利用しましょう。","url":"","license":"original"}],"viz":{"day":64,"phase":"P4","new_count":9,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"市民のみなさまへ。","kana":"しみんのみなさまへ。","zh":"致各位市民。","note_zh":"「順延」是“顺延到下一个工作日”，不是提前；「祝日がある週」是限定条件；「指定の袋」不是任意袋子。","audio_text":"市民のみなさまへ。","origin":"material","source_id":"M0061"},{"ja":"来月から、燃えるごみを集める日が変わります。","kana":"らいげつから、もえるごみをあつめるひがかわります。","zh":"从下个月起，可燃垃圾的收集日将变更。","note_zh":"「順延」是“顺延到下一个工作日”，不是提前；「祝日がある週」是限定条件；「指定の袋」不是任意袋子。","audio_text":"来月から、燃えるごみを集める日が変わります。","origin":"material","source_id":"M0061"},{"ja":"これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。","kana":"これまではまいしゅうげつようびともくようびでしたが、らいげつからはまいしゅうかようびときんようびになります。","zh":"此前是每周一和周四，从下个月起改为每周二和周五。","note_zh":"「順延」是“顺延到下一个工作日”，不是提前；「祝日がある週」是限定条件；「指定の袋」不是任意袋子。","audio_text":"これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。","origin":"material","source_id":"M0061"}],"review_plan":[{"kid":"V0333","surface":"積極的","kana":"せっきょくてき","zh":"积极的","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":63,"next_hint_zh":"按课程间隔，大约 Day 65 再预习","planned_only":true},{"kid":"V0334","surface":"一般的","kana":"いっぱんてき","zh":"一般的；普遍的","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":63,"next_hint_zh":"按课程间隔，大约 Day 65 再预习","planned_only":true},{"kid":"V0337","surface":"直ちに","kana":"ただちに","zh":"立刻；立即","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":63,"next_hint_zh":"按课程间隔，大约 Day 65 再预习","planned_only":true},{"kid":"V0338","surface":"次第に","kana":"しだいに","zh":"逐渐","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":63,"next_hint_zh":"按课程间隔，大约 Day 65 再预习","planned_only":true},{"kid":"V0193","surface":"だいぶ","kana":"だいぶ","zh":"相当（含变化）","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可
