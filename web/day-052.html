不熟的人请求，比 〜てください（G0026）礼貌；用否定疑问表委婉","explanation_zh":"意思是「能否请您…（很礼貌的请求）」；接续：動詞 て形 + いただく（谦让）可能形 いただけませんか；或 もらう 可能形 もらえませんか（中文术语：动词 て形 + いただく（谦让）可能形 いただけませんか；或 もらう 可能形 もらえませんか）；用法：对长辈/不熟的人请求，比 〜てください（G0026）礼貌；用否定疑问表委婉","common_errors":[{"wrong":"先生、待ってください。","why":"对老师直接 てください 偏指示/命令，中文「请等一下」直译不够礼貌","fix":"先生、少しお待ちいただけませんか。","learner":"zh"},{"wrong":"教えていただけますか。","why":"请求用否定疑问 いただけませんか 才委婉；中文「能教我吗」直译成肯定疑问 ますか 显得直接","fix":"教えていただけませんか。","learner":"zh"}],"compare":[{"id":"G0026","diff":"〜てください 是普通请求/指示；对长辈用 ていただけませんか 更礼貌"},{"id":"G0052","diff":"〜てもらう 是中性授受；いただけませんか 叠加谦让＋可能＋疑问三层礼貌"}],"examples":[{"ja":"少し待っていただけませんか。","zh":"能请您稍等一下吗？","audio_text":"少し待っていただけませんか。"},{"ja":"使い方を教えていただけませんか。","zh":"能教我一下用法吗？","audio_text":"使い方を教えていただけませんか。"}],"ko":"-아/어 주시겠어요? / -(으)ㄹ 수 있을까요? / -아/어 주실 수 있으세요?","ko_hint":"『能否请您…』的极礼貌请求，可对照韩语敬让请求形。","caution":"这是日语谦让＋可能＋否定的叠加（ていただけませんか），韩语靠 주시다/으실 수 있다 与疑问尾，层级都对不上；日语还有 てくださいませんか/ていただけないでしょうか 等多级客气度，韩语无一一对应，别一律翻成 주세요。"},{"id":"G0075","pattern":"普通形 + のに（な形・名詞 は 〜な のに）","meaning_zh":"明明…却…；…却（意外、不满、遗憾）","connection":"動詞・い形 普通形 + のに；な形・名詞 + な + のに；后项是与预期相反的结果","example":"たくさん勉強したのに、合格できませんでした。","usage":"逆接，带说话人意外/责备/遗憾情绪；比 が/けど 情绪强","explanation_zh":"意思是「明明…却…；…却（意外、不满、遗憾）」；接续：動詞・い形 普通形 + のに；な形・名詞 + な + のに；后项是与预期相反的结果（中文术语：动词・い形 简体 + のに；な形・名词 + な + のに；后项是与预期相反的结果）；用法：逆接，带说话人意外/责备/遗憾情绪；比 が/けど 情绪强","common_errors":[{"wrong":"高いのにを買いました。","why":"「のに」后不再接 を 等格助词提示前项；中文「虽然贵」直译叠加助词错","fix":"高いのに買いました。","learner":"zh"},{"wrong":"日曜日だのに、働きます。","why":"名词/な形 接 のに 用 な（日曜日なのに），不用 だ；中文「是周日却」直译保留 だ 错","fix":"日曜日なのに、働きます。","learner":"zh"}],"compare":[{"id":"G0037","diff":"から/ので 是顺接原因（因为…所以）；のに 是逆接转折（虽然…却），方向相反"}],"examples":[{"ja":"たくさん勉強したのに、合格できませんでした。","zh":"明明学了很多却没考上。","audio_text":"たくさん勉強したのに、合格できませんでした。"},{"ja":"今日は日曜日なのに、仕事に行きます。","zh":"明明是周日却要去上班。","audio_text":"今日は日曜日なのに、仕事に行きます。"}],"ko":"-(으)ㄴ/는데(도) / -건만 / -았/었는데도","ko_hint":"『明明…却…』≒ -(으)ㄴ/는데도，逆接带意外/不满，可对照。","caution":"のに 带强烈意外、不满、遗憾，韩语 -는데도 偏中性转折、语气弱一截，要用 -건만/-(으)ㄹ 텐데 补情绪；な形・名词后日语要插 な（静かなのに），韩语 -인데도 也变，但别把 のに 的 の 当成名词化套 것。"}],"kanji":[{"id":"K0128","char":"運","onyomi":["ウン"],"kunyomi":["はこぶ"],"meaning_zh":"运；搬运；运气；驾驶","zh_trap":"中文「运」yùn；日语 運 音读 ウン（運転 うんてん、運動 うんどう）、训读 はこぶ（運ぶ）；「運転」是「驾驶」，中文「运转/运输」≠日语「運転」，不能按中文猜。","vocab_refs":["V0257","V0156"],"examples":[{"ja":"運転","kana":"うんてん","zh":"驾驶；开车"},{"ja":"運ぶ","kana":"はこぶ","zh":"搬运；运送"}],"ko_hint":""},{"id":"K0129","char":"転","onyomi":["テン"],"kunyomi":["ころぶ"],"meaning_zh":"转；转动；摔倒；调职","zh_trap":"中文「转」zhuǎn/zhuàn；日语 転 音读 テン（運転 うんてん）、训读 ころぶ（転ぶ 摔倒）；简体「转」与「転」不同，「運転」驾驶 ≠ 中文「运转」，不能靠汉字猜。","vocab_refs":["V0257"],"examples":[{"ja":"運転","kana":"うんてん","zh":"驾驶；开车"}],"ko_hint":""}],"questions":[{"id":"Q0360","type":"mcq","prompt_ja":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","prompt_zh":"【読解】根据第2句，午前十時以降の運転について、正しいものはどれですか。","options":["必ず十時に再開する","十時以降は終日運休する","雨が降れば必ず再開する","風が強ければ再開できないことがある"],"answer":"風が強ければ再開できないことがある","rationale":"第2句「風の強さによっては運転を再開できない場合があります」=视风力可能无法恢复，不是必定或终日停运。","audio_text":"","rubric":"选 風が強ければ再開できないことがある 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0362","type":"mcq","prompt_ja":"株式会社山川商事 御中。いつもお世話になっております。新製品の展示会用に、パンフレットを三百部お願いしたく、ご連絡いたしました。先日お送りいただいた見積書を拝見し、価格は問題ありませんでした。つきましては、納品を来月十日の午前中にしていただけますでしょうか。当日は午後から会場の準備があるため、午前中の納品を希望しております。納品先は、本社ではなく、展示会場の受付です。ご確認のうえ、ご返信いただけますと幸いです。株式会社みなみ 営業部 佐藤より。","prompt_zh":"【読解】根据第6句，午前中の納品を希望する理由は何ですか。","options":["午後から会場の準備があるから","トラックが午前しかないから","午後は会社が休みだから","商品が午前しか届かないから"],"answer":"午後から会場の準備があるから","rationale":"第6句「当日は午後から会場の準備があるため、午前中の納品を希望」=因为下午要准备会场。其余理由文中没有。","audio_text":"","rubric":"选 午後から会場の準備があるから 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0368","type":"mcq","prompt_ja":"来月一日から、市内を走る青葉バスの路線が一部変わります。これまで駅前から病院までを結んでいた便は、途中の図書館を経由するようになります。そのため、駅から病院までの所要時間は、これまでの十五分より五分ほど長くなります。朝夕の時間帯は、利用者が多いため、十分間隔で運行します。昼間は、これまで通り二十分間隔です。なお、工事が終わるまでの間、市民公園前の停留所は使用できません。近くの仮の停留所をご利用ください。","prompt_zh":"【読解】根据第3句，駅から病院まで、所要時間は何分くらいになりますか。","options":["25分","10分","20分","15分"],"answer":"20分","rationale":"第3句「これまでの十五分より五分ほど長くなります」=15+5=约20分。不是15、10或25分。","audio_text":"","rubric":"选 20分 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0370","type":"mcq","prompt_ja":"山本さま。先日は、勉強会の日程についてご連絡いただき、ありがとうございました。誠に申し訳ありませんが、当日はどうしても外せない会議が入ってしまい、参加できなくなりました。楽しみにしていたので、とても残念です。代わりに、来週の木曜日か金曜日でしたら、時間を作ることができます。もしご都合がよろしければ、資料を送っていただけますでしょうか。今回の分は、後日、私のほうから先生に説明しておきます。急なご連絡で申し訳ありませんが、ご検討をお願いいたします。鈴木より。","prompt_zh":"【読解】根据第5句，筆者が参加できるのはいつですか。","options":["今週の木曜日","先週の金曜日","来週の木曜日か金曜日","来週の月曜日"],"answer":"来週の木曜日か金曜日","rationale":"第5句「来週の木曜日か金曜日でしたら、時間を作ることができます」=下周周四或周五。今週、月曜、先週都不对。","audio_text":"","rubric":"选 来週の木曜日か金曜日 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0372","type":"mcq","prompt_ja":"来月から、会社は週に二日まで在宅勤務を認めることになりました。対象は、入社一年以上の社員です。在宅勤務をする日は、前日の午後五時までに、上司にメールで知らせてください。仕事の開始と終了の時刻は、通常の勤務と同じです。会社のパソコンを持ち帰る場合は、情報が漏れないように、十分注意してください。自宅のインターネット環境が整っていない場合は、会社の端末を借りることもできます。不明な点は、人事部まで問い合わせてください。","prompt_zh":"【読解】根据第3句，在宅勤務の前日、何時までに上司へ連絡しますか。","options":["午後5時","午前9時","午後8時","午後3時"],"answer":"午後5時","rationale":"第3句「前日の午後五時までに、上司にメールで知らせてください」=前一天下午5点前。其余时间文中没有。","audio_text":"","rubric":"选 午後5時 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0382","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，納品日はいつになりましたか。","options":["土曜日","水曜日","木曜日","金曜日"],"answer":"木曜日","rationale":"原定周五，但周五货车不够，B 说周四上午可以送，A 同意。最终周四。","audio_text":"A：こちらこそお世話になっております。納品は金曜日でお願いしていましたが。\nB：はい。ただ、あいにく金曜日はトラックが足りません。\nA：では、木曜日に変更できますか。\nB：木曜日の午前中でしたら、お届けできます。","rubric":"选 木曜日 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0066","kind":"reading","title":"台風による運休のお知らせ","text_ja":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","text_kana":"たいふうじゅうにごうのせっきんにより、あしたのしはつからごぜんじゅうじまで、ちゅうおうせんのぜんせんでうんてんをとりやめます。ごぜんじゅうじいこうも、かぜのつよさによってはうんてんをさいかいできないばあいがあります。ふりかえゆそうとして、へいこうするしてつのろせんをりようできます。ただし、ふりかえゆそうはほんすうのおおいじかんたいにかぎります。えきのまどぐちでは、うんきゅうをしょうめいするかみをくばっています。つうきんやつうがくでりようするかたは、じかんによゆうをもってこうどうしてください。さいしんのじょうほうは、えきのけいじやホームページでかくにんしてください。","text_zh":"受12号台风接近影响，明天首班车至上午十点，中央线全线停运。上午十点以后，也可能因风力强弱而无法恢复运行。作为替代运输，可利用并行的私铁路线。但替代运输仅限班次较多的时段。车站窗口在发放停运证明。通勤通学的人请留出时间余量再行动。最新信息请在车站告示或网站确认。","focus_zh":"「取りやめます」=停运；「見込み」不是确定；「振替輸送」是替代运输，不是退票；「に限ります」=仅限。","audio_text":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","url":"","license":"original"},{"id":"M0083","kind":"listening","title":"駅員と乗客：ホームの変更","text_ja":"A：すみません、東京行きの電車は何番線ですか。\nB：東京行きは三番線です。駅の掲示もご確認ください。\nA：三番線ですね。ありがとうございます。\nB：あ、申し訳ありません。工事のため、今日は四番線に変わりました。\nA：四番線ですか。発車時刻も変わりますか。\nB：いいえ、時刻は変わりません。十時十五分発です。\nA：あと五分ですね。急いだほうがいいですか。\nB：はい。階段を上がって、すぐ右側です。お気をつけて。","text_kana":"A：すみません、とうきょうゆきのでんしゃはなんばんせんですか。\nB：とうきょうゆきはさんばんせんです。えきのけいじもごかくにんください。\nA：さんばんせんですね。ありがとうございます。\nB：あ、もうしわけありません。こうじのため、きょうはよんばんせんにかわりました。\nA：よんばんせんですか。はっしゃじこくもかわりますか。\nB：いいえ、じこくはかわりません。じゅうじじゅうごふんはつです。\nA：あとごふんですね。いそいだほうがいいですか。\nB：はい。かいだんをあがって、すぐみぎがわです。おきをつけて。","text_zh":"A：请问去东京的电车是几号站台？\nB：去东京是三号站台。也请看一下车站告示。\nA：三号站台是吧。谢谢。\nB：啊，非常抱歉。因施工，今天改到四号站台了。\nA：四号站台吗？发车时间也变了吗？\nB：不，时间不变。十点十五分发车。\nA：还有五分钟。我该快点吗？\nB：是的。上楼梯后右手边就是。请小心。","focus_zh":"人物关系是站务员与乘客。信息干扰：先说三号站台，马上更正为四号站台；发车时刻不变，仍是十点十五分。","audio_text":"A：すみません、東京行きの電車は何番線ですか。\nB：東京行きは三番線です。駅の掲示もご確認ください。\nA：三番線ですね。ありがとうございます。\nB：あ、申し訳ありません。工事のため、今日は四番線に変わりました。\nA：四番線ですか。発車時刻も変わりますか。\nB：いいえ、時刻は変わりません。十時十五分発です。\nA：あと五分ですね。急いだほうがいいですか。\nB：はい。階段を上がって、すぐ右側です。お気をつけて。","url":"","license":"original"}],"viz":{"day":52,"phase":"P4","new_count":12,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。","kana":"
