<script type="application/json" id="nh80-day">{"day":61,"phase":"P4","theme":"医院问诊｜V ます形(去ます) + かねない / かねる・V ます形(去ます) + 得る / V ない形(去ない) + ざるを 得ない・睡眠","scene":"【医院问诊】医院问诊：在医院问诊中用「V ます形(去ます) + かねない / かねる」说明症状从何时开始、如何变化，并复述医嘱（素材：眠りと健康の説明｜主题键：health｜对齐：exact）","scene_tag":"医院问诊","scene_topic_key":"health","scene_topic":"医院问诊","topic_match":"exact","material_topic_keys":["health","health"],"material_pair":"same_topic","can_do":"在医院问诊中用「V ます形(去ます) + かねない / かねる」说明症状从何时开始、如何变化，并复述医嘱","focus":["listening","reading"],"objectives":["能读准今天汉字的日语读音，不照中文读音猜","能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","能从一小段通知或短文里找出主要意思，并说出一句依据","当天新词：睡眠、状態、定期的（读音与用法都要验证，不靠汉字猜义）","当天句型：V ます形(去ます) + かねない / かねる、V ます形(去ます) + 得る / V ない形(去ない) + ざるを 得ない，须说出接续条件","当天汉字：状，音读/训读各给一例","Can-do：在医院问诊中用「V ます形(去ます) + かねない / かねる」说明症状从何时开始、如何变化，并复述医嘱"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【医院问诊】医院问诊：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0307","surface":"睡眠","kana":"すいみん","romaji":"suimin","pos":"名詞","meaning_zh":"睡眠","jlpt":"N3","examples":[{"ja":"睡眠を十分に取ることが大切です。","zh":"充足睡眠很重要。","audio_text":"睡眠を十分に取ることが大切です。"}],"notes_for_zh":"「睡眠」是睡眠；「睡眠を取る／睡眠不足」；中文“睡眠”同义，但日语多用于书面/健康话题。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0218","surface":"状態","kana":"じょうたい","romaji":"joutai","pos":"名詞","meaning_zh":"状态（事物/身体）","jlpt":"N3","examples":[{"ja":"患者の状態が安定しています。","zh":"患者状态稳定。","audio_text":"患者の状態が安定しています。"}],"notes_for_zh":"「状態」じょうたい 名词，“（事物/身体）状态”，与「状況」（外部局面）分工；中文“状态/情况”常混，日语须分；「態」タイ 不可按中文 tài 推；韩语 상태 同源可帮记，但不能靠汉字猜。","confusables":["V0215"],"ko":"","ko_hint":"","caution":""},{"id":"V0335","surface":"定期的","kana":"ていきてき","romaji":"teikiteki","pos":"な形容詞","meaning_zh":"定期地；周期性的","jlpt":"N3","examples":[{"ja":"定期的に健康診断を受けています。","zh":"定期做健康检查。","audio_text":"定期的に健康診断を受けています。"}],"notes_for_zh":"「定期的」是按固定周期；「定期的に健康診断を受ける」；中文“定期”同义，但日语常加「に」作副词。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0303","surface":"処方","kana":"しょほう","romaji":"shohou","pos":"名詞/サ変","meaning_zh":"开处方","jlpt":"N3","examples":[{"ja":"医者が薬を処方しました。","zh":"医生开了药。","audio_text":"医者が薬を処方しました。"}],"notes_for_zh":"「処方」是医生开药方；「薬を処方する／処方箋」；中文“处方”是名词，日语可サ変。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0317","surface":"経済","kana":"けいざい","romaji":"keizai","pos":"名詞","meaning_zh":"经济","jlpt":"N3","examples":[{"ja":"経済のニュースを毎朝見ます。","zh":"每天早上看经济新闻。","audio_text":"経済のニュースを毎朝見ます。"}],"notes_for_zh":"「経済」是经济；中文“经济”也可指“划算”，日语那用「経済的」；读 けいざい。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0319","surface":"物価","kana":"ぶっか","romaji":"bukka","pos":"名詞","meaning_zh":"物价","jlpt":"N3","examples":[{"ja":"最近、物価が上がっています。","zh":"最近物价在上涨。","audio_text":"最近、物価が上がっています。"}],"notes_for_zh":"「物価」是物价总水平；「物価が上がる／下がる」；注意促音 ぶっか。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0320","surface":"環境","kana":"かんきょう","romaji":"kankyou","pos":"名詞","meaning_zh":"环境","jlpt":"N3","examples":[{"ja":"環境を守るために、ごみを減らします。","zh":"为保护环境减少垃圾。","audio_text":"環境を守るために、ごみを減らします。"}],"notes_for_zh":"「環境」是自然/工作环境；「環境を守る／環境が整う」；读 かんきょう。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0083","pattern":"V ます形(去ます) + かねない / かねる","meaning_zh":"难保不会…、恐怕会…／难以…、不便…","connection":"動詞 ます形 去 ます + かねない／かねる；かねる 按一段动词变形（かねます／かねた）","example":"このままでは事故になりかねません。","usage":"かねない 是「有可能（多指坏结果）」的负面推测；かねる 是「（因立场/情理）难以做到」，常用于委婉拒绝「〜しかねます」","explanation_zh":"意思是「难保不会…、恐怕会…／难以…、不便…」；接续：動詞 ます形 去 ます + かねない／かねる；かねる 按一段动词变形（かねます／かねた）（中文术语：动词 ます形 去 ます + かねない／かねる；かねる 按一段动词变形（かねます／かねた））；用法：かねない 是「有可能（多指坏结果）」的负面推测；かねる 是「（因立场/情理）难以做到」，常用于委婉拒绝「〜しかねます」","common_errors":[{"wrong":"事故になるかねません。","why":"必须接 ます形去ます（なり），不能用辞书形 なる；中文「难保会出事故」直译错","fix":"事故になりかねません。","learner":"zh"},{"wrong":"雨が降りかねます。（想说恐怕会下雨）","why":"「恐怕会（坏事）」是 かねない（降りかねない）；かねる 是「难以做」，中文直译把两形搞反","fix":"雨が降りかねません。","learner":"zh"},{"wrong":"かねない／かねる 都接 辞书形","why":"【疑点】两形意义相反（负面推测 vs 难以做到）却同接 ます形，本条合并讲授，建议拆分二次核实，故标 needs_review","fix":"均接 ます形去ます：降りかねない／お受けしかねます","learner":"zh"}],"compare":[{"id":"G0045","diff":"かもしれない 是中性「也许」；かねない 专指「可能发生坏事」，带担忧"},{"id":"G0024","diff":"可能形 表能力/条件；かねる 表「因情理上不便而难做」，不是能力"}],"examples":[{"ja":"このままでは事故になりかねません。","zh":"这样下去难保会出事故。","audio_text":"このままでは事故になりかねません。"},{"ja":"ご期待に沿いかねますので、ご了承ください。","zh":"恕难满足您的期待，敬请谅解。","audio_text":"ご期待に沿いかねますので、ご了承ください。"}],"ko":"-(으)ㄹ지도 모른다（かねない）/ -기 어렵다·-(으)ㄹ 수 없다（かねる）","ko_hint":"『难保不会…（负面可能发生）』≒ -(으)ㄹ지도 모른다、『难以/不便…』≒ -기 어렵다，可对照两种语气。","caution":"かねない 只用于负面结果、かねる 表碍于情理做不到，韩语 -(으)ㄹ지도 몰라요/-기 어렵다 不共享这层语用限制，别把 かねない 翻成中性『也许』；这是书面/商务语域、口语少用，韩语无对等的一形两义。"},{"id":"G0084","pattern":"V ます形(去ます) + 得る / V ない形(去ない) + ざるを 得ない","meaning_zh":"可能…、会有…／不得不…","connection":"動詞 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；動詞 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外）","example":"その可能性もあり得ます。","usage":"得る 表客观可能性/ conceivable（あり得る）；ざるを得ない 表「别无选择只好…」，书面","explanation_zh":"意思是「可能…、会有…／不得不…」；接续：動詞 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；動詞 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外）（中文术语：动词 ます形 去 ます + 得る（读 うる／える，否定 得ない えない）；动词 ない形 去 ない + ざるを得ない（する→せざるを得ない 例外））；用法：得る 表客观可能性/ conceivable（あり得る）；ざるを得ない 表「别无选择只好…」，书面","common_errors":[{"wrong":"起こる得る","why":"得る 接 ます形去ます（起こり得る），不接辞书形；中文「可能发生」直译错","fix":"起こり得ます／起こり得る","learner":"zh"},{"wrong":"するざるを得ない","why":"サ変「する」接 ざる 要变 せ（せざるを得ない），不是 し/する；中文「不得不做」按原形推错","fix":"せざるを得ません","learner":"zh"}],"compare":[{"id":"G0024","diff":"可能形 表主语的能力/条件；得る 表「客观上可能存在/发生」，多用于 あり得る"},{"id":"G0046","diff":"なければならない 是一般义务；ざるを得ない 强调「虽不情愿但别无选择」"}],"examples":[{"ja":"その可能性もあり得ます。","zh":"那种可能性也存在。","audio_text":"その可能性もあり得ます。"},{"ja":"電車が止まったので、歩いて帰らざるを得ませんでした。","zh":"电车停了，只好走路回去。","audio_text":"電車が止まったので、歩いて帰らざるを得ませんでした。"}],"ko":"-(으)ㄹ 수 있다 / -지 않을 수 없다·-(으)ㄹ 수밖에 없다","ko_hint":"『可能…』≒ -(으)ㄹ 수 있다、『不得不…』≒ -지 않을 수 없다/-ㄹ 수밖에 없다，可对照可能与必然。","caution":"得る 读 うる/える、ざる 是文言否定助动词残存，韩语 -(으)ㄹ 수 있다/-수밖에 없다 是另一套形式，不同源；あり得る 表有可能、せざるを得ない 表被迫，两条语义不同，别都翻 수 있다。"}],"kanji":[{"id":"K0140","char":"状","onyomi":["ジョウ"],"kunyomi":[],"meaning_zh":"状；状态；状况；症状","zh_trap":"中文「状」zhuàng；日语 状 音读 ジョウ，「状態」じょうたい「状況」じょうきょう「症状」しょうじょう 都读 ジョウ（不读 ソウ/ゾウ）；简体「状」与「状」略同形但音读须按 ジョウ 验证。","vocab_refs":["V0218","V0215"],"examples":[{"ja":"状態","kana":"じょうたい","zh":"状态（事物/身体）"},{"ja":"状況","kana":"じょうきょう","zh":"状况；情形（外部局面）"}],"ko_hint":""}],"questions":[{"id":"Q0345","type":"mcq","prompt_ja":"医者が薬を___しました。","prompt_zh":"【言語知識】填入表示“开处方”的词。","options":["処方","診察","治療","予防"],"answer":"処方","rationale":"「薬を処方する」是开药方；「診察」是诊察，「治療」是治疗，「予防」是预防，均不能与「薬を」搭配。","audio_text":"","rubric":"选 処方 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0381","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，予約は何時になりましたか。","options":["11時","10時","10時半","9時半"],"answer":"10時半","rationale":"患者希望10点，前台说10点已满，10点半有空，患者同意。最终10点半。","audio_text":"A：はい。今日は何時ごろがご希望ですか。\nB：十時にお願いしたいです。\nA：あ、すみません。十時は予約が入っていますので、十時半でしたら空いています。\nB：では、十時半でお願いします。","rubric":"选 10時半 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0389","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，薬は1日何回飲みますか。","options":["2回","4回","3回","1回"],"answer":"3回","rationale":"医生先说一日两次，马上更正「この薬は一日三回です。昼にも飲んでください」。最终三次。","audio_text":"A：風邪ですね。お薬を処方します。一日二回、朝と晩に飲んでください。\nB：一日二回ですね。\nA：あ、すみません。この薬は一日三回です。昼にも飲んでください。","rubric":"选 3回 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0390","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，薬は何日分出ますか。","options":["5日分","2日分","1週間分","3日分"],"answer":"3日分","rationale":"医生最后说「三日分出します」。不是一周、两天或五天。","audio_text":"A：はい、食べた後でお願いします。三日分出します。","rubric":"选 3日分 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0166","type":"read","prompt_ja":"高いからといって、美味しいわけではありません。【問い】高い料理は必ず美味しいですか。","prompt_zh":"读短文回答部分否定","options":[],"answer":"いいえ、美味しいわけではありません","rationale":"「わけではない」表部分否定，可推出「贵不一定好吃」","audio_text":"高いからといって、美味しいわけではありません。","rubric":"答出部分否定得 1 分，答 はい 得 0 分","expected_production":"","difficulty":5},{"id":"Q0167","type":"reorder","prompt_ja":"把词块排成「他应该已经回去了」","prompt_zh":"句序：主题 + もう + た形 + はずです","options":["はずです","彼は","帰った","もう"],"answer":"2,4,3,1","rationale":"彼は + もう + 帰った + はずです，た形 + はず","audio_text":"","rubric":"顺序完全正确得 1 分，否则 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0039","kind":"reading","title":"眠りと健康の説明","text_ja":"夜、なかなか眠れないときは、寝る前の過ごし方を見直してみましょう。明るい画面を長く見ていると、かえって目がさえて、寝つきが悪くなることがあります。寝る一時間前には照明を少し暗くし、静かな音楽を聞くなどして、体を休める準備をするのがおすすめです。毎日同じ時間に起きるようにすることも、気分の安定につながります。","text_kana":"","text_zh":"夜里难以入睡时，不妨重新审视睡前习惯。长时间看明亮屏幕反而会让大脑兴奋、更难入睡。建议睡前一小时把灯光调暗、听听安静的音乐，让身体做好休息准备。坚持每天同一时间起床，也有助于情绪稳定。","focus_zh":"「寝つきが悪くなることがあります」的「ことがある」是有时会…的倾向，不是「たことがある」（曾经做过）；「かえって」＝反倒。","audio_text":"夜、なかなか眠れないときは、寝る前の過ごし方を見直してみましょう。明るい画面を長く見ていると、かえって目がさえて、寝つきが悪くなることがあります。寝る一時間前には照明を少し暗くし、静かな音楽を聞くなどして、体を休める準備をするのがおすすめです。毎日同じ時間に起きるようにすることも、気分の安定につながります。","url":"","license":"original"},{"id":"M0048","kind":"listening","title":"入院した母と娘の会話","text_ja":"お母さん、きょうの具合はどう？だいぶよくなったわ。でも、まだ一人で歩くのは少し危ないの。じゃあ、今夜も私がここに泊まって看病するね。あしたは父が来るって連絡があったよ。そう、ありがとう。それを聞いて安心したわ。","text_kana":"","text_zh":"妈，今天感觉怎么样？好多了。不过一个人走路还有点危险。那今晚我也留在这儿护理你。听说爸爸明天会来。是吗，谢谢。听你这么说我放心了。","focus_zh":"这段是母女间的简体口语：「どう？」「よくなったわ」「泊まって看病するね」用「わ／ね」等终助词、省助词，与前面商务敬语文体完全不同。","audio_text":"お母さん、きょうの具合はどう？だいぶよくなったわ。でも、まだ一人で歩くのは少し危ないの。じゃあ、今夜も私がここに泊まって看病するね。あしたは父が来るって連絡があったよ。そう、ありがとう。それを聞いて安心したわ。","url":"","license":"original"},{"id":"M0073","kind":"reading","title":"熱中症の予防","text_ja":"夏の暑い日は、熱中症の予防に注意が必要です。熱中症は、屋外だけでなく、風の通らない室内でも起こります。のどが渇いたと感じたときには、すでに体の水分が足りなくなっていることが多いので、時間を決めてこまめに水を飲みましょう。汗をたくさんかいた日は、水だけでなく、塩分も一緒に取ることが大切です。朝から頭が痛い、気分が悪いと感じたら、無理をせず、涼しい場所で休んでください。それでもよくならないときは、すぐに病院へ行きましょう。","text_kana":"なつのあついひは、ねっちゅうしょうのよぼうにちゅういがひつようです。ねっちゅうしょうは、おくがいだけでなく、かぜのとおらないしつないでもおこります。のどがかわいたとかんじたときには、すでにからだのすいぶんがたりなくなっていることがおおいので、じかんをきめてこまめにみずをのみましょう。あせをたくさんかいたひは、みずだけでなく、えんぶんもいっしょにとることがたいせつです。あさからあたまがいたい、きぶんがわるいとかんじたら、むりをせず、すずしいばしょでやすんでください。それでもよくならないときは、すぐにびょういんへいきましょう。","text_zh":"夏天炎热的日子要注意预防中暑。中暑不仅在室外，在不通风的室内也会发生。感到口渴时，身体往往已经缺水，所以定好时间勤喝水吧。大量出汗的日子，不仅补水，还要一起补充盐分。如果早上就头痛、恶心，不要硬撑，到凉快的地方休息。仍不见好转时，请立即去医院。","focus_zh":"「すでに」=已经；「ことが多い」不是绝对；「無理をせず」=不要硬撑；「それでも」=即便如此。","audio_text":"夏の暑い日は、熱中症の予防に注意が必要です。熱中症は、屋外だけでなく、風の通らない室内でも起こります。のどが渇いたと感じたときには、すでに体の水分が足りなくなっていることが多いので、時間を決めてこまめに水を飲みましょう。汗をたくさんかいた日は、水だけでなく、塩分も一緒に取ることが大切です。朝から頭が痛い、気分が悪いと感じたら、無理をせず、涼しい場所で休んでください。それでもよくならないときは、すぐに病院へ行きましょう。","url":"","license":"original"}],"viz":{"day":61,"phase":"P4","new_count":10,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"夜、なかなか眠れないときは、寝る前の過ごし方を見直してみましょう。","kana":"","zh":"夜里难以入睡时，不妨重新审视睡前习惯。","note_zh":"「寝つきが悪くなることがあります」的「ことがある」是有时会…的倾向，不是「たことがある」（曾经做过）；「かえって」＝反倒。","audio_text":"夜、なかなか眠れないときは、寝る前の過ごし方を見直してみましょう。","origin":"material","source_id":"M0039"},{"ja":"明るい画面を長く見ていると、かえって目がさえて、寝つきが悪くなることがあります。","kana":"","zh":"长时间看明亮屏幕反而会让大脑兴奋、更难入睡。","note_zh":"「寝つきが悪くなることがあります」的「ことがある」是有时会…的倾向，不是「たことがある」（曾经做过）；「かえって」＝反倒。","audio_text":"明るい画面を長く見ていると、かえって目がさえて、寝つきが悪くなることがあります。","origin":"material","source_id":"M0039"},{"ja":"寝る一時間前には照明を少し暗くし、静かな音楽を聞くなどして、体を休める準備をするのがおすすめです。","kana":"","zh":"建议睡前一小时把灯光调暗、听听安静的音乐，让身体做好休息准备。","note_zh":"「寝つきが悪くなることがあります」的「ことがある」是有时会…的倾向，不是「たことがある」（曾经做过）；「かえって」＝反倒。","audio_text":"寝る一時間前には照明を少し暗くし、静かな音楽を聞くなどして、体を休める準備をするのがおすすめです。","origin":"material","source_id":"M0039"}],"review_plan":[{"kid":"V0318","surface":"企業","kana":"きぎょう","zh":"企业","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":60,"next_hint_zh":"按课程间隔，大约 Day 62 再预习","planned_only":true},{"kid":"V0258","surface":"入院","kana":"にゅういん","zh":"住院","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":60,"next_hint_zh":"按课程间隔，大约 Day 62 再预习","planned_only":true},{"kid":"V0291","surface":"手数料","kana":"てすうりょう","zh":"手续费","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":60,"next_hint_zh":"按课程间隔，大约 Day 62 再预习","planned_only":true},{"kid":"V0301","surface":"症状","kana":"しょうじょう","zh":"症状","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":60,"next_hint_
