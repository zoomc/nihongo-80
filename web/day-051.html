,"fix":"映画を見ようと思います。","learner":"zh"},{"wrong":"きようと思っています。","why":"カ変「来る」意志形是 こよう，不是 きよう；中文按字形推读音错","fix":"こようと思っています。","learner":"zh"}],"compare":[{"id":"G0036","diff":"〜と 思う 引用「觉得/认为」；〜(よ)うと思う 引用的是自己的「打算」"},{"id":"G0032","diff":"〜ましょう 是邀对方一起做；〜(よ)うと思う 是自己内心的打算"}],"examples":[{"ja":"日曜日は映画を見ようと思っています。","zh":"周日打算看电影。","audio_text":"日曜日は映画を見ようと思っています。"},{"ja":"出かけようとしたら、雨が降ってきました。","zh":"正要出门时下起雨来了。","audio_text":"出かけようとしたら、雨が降ってきました。"}],"ko":"-(으)려고 하다 / -(으)ㄹ까 하다 / -(으)려던 참이다","ko_hint":"『打算…／正要…』≒ -(으)려고 하다，意志/尝试可对照。","caution":"日语意志形＋と思う 表打算、＋とする 表正要/试图，韩语 -(으)려고 하다/-려던 참이다 分工类似但不一一对应；と 是引用助词（G0036），韩语 -려고 里没有引用形，别加 라고。"},{"id":"G0069","pattern":"V辞書形/Vている/Vた形 + ところ(だ/に/を/で)","meaning_zh":"正要…／正在…／刚…；在…时候；…之际","connection":"辞書形 + ところだ（正要）；ている + ところだ（正在）；た形 + ところだ（刚做完）；ところに/を/で 后接外部动作或发现","example":"今から出かけるところです。","usage":"把动作切成「即将/进行/刚完」的时间点；ところを 多用于被看见/被打断（含被动、抱歉语气）","explanation_zh":"意思是「正要…／正在…／刚…；在…时候；…之际」；接续：辞書形 + ところだ（正要）；ている + ところだ（正在）；た形 + ところだ（刚做完）；ところに/を/で 后接外部动作或发现（中文术语：辞书形 + ところだ（正要）；ている + ところだ（正在）；た形 + ところだ（刚做完）；ところに/を/で 后接外部动作或发现）；用法：把动作切成「即将/进行/刚完」的时间点；ところを 多用于被看见/被打断（含被动、抱歉语气）","common_errors":[{"wrong":"今から出かけたところです。","why":"「正要出门」用 辞书形 出かけるところ；た形 变成「刚出去」，中文「正要」直译错","fix":"今から出かけるところです。","learner":"zh"},{"wrong":"食べているところにを見ました。","why":"ところ 后 に/を 只取其一，叠 に＋を 错；中文「在…的时候」直译叠加助词","fix":"食べているところを見ました。","learner":"zh"}],"compare":[{"id":"G0068","diff":"たばかり 强调「做完没多久」的主观感觉（可隔数日）；たところ 是「刚刚、此刻」的客观时点"},{"id":"G0027","diff":"ている 只说进行；ているところ 强调「恰好此刻正在」这个节骨眼"}],"examples":[{"ja":"今から出かけるところです。","zh":"正要出门。","audio_text":"今から出かけるところです。"},{"ja":"ご飯を食べているところに電話がかかってきました。","zh":"正吃饭时来了电话。","audio_text":"ご飯を食べているところに電話がかかってきました。"},{"ja":"駅に着いたところです。","zh":"刚到车站。","audio_text":"駅に着いたところです。"}],"ko":"-(으)려던 참이다 / -는 중이다 / -(으)ㄴ 참이다","ko_hint":"『正要…／正在…／刚…』分别在韩语用 -려던 참/-는 중/-은 참，可分层对照。","caution":"日语 ところ 靠前接动词形区分三阶段，韩语靠三个不同名词（참/중/참）＋定语，形式不同源；ところ 还表时候/场面（いいところに来た），韩语要用 -던 차에，别一律 참이다。"}],"kanji":[{"id":"K0109","char":"残","onyomi":["ザン"],"kunyomi":["のこる"],"meaning_zh":"残；剩下；残留","zh_trap":"中文「残」cán；日语 残 音读 ザン（残業 ざんぎょう）、训读 のこる（残る）；「残業」是「加班」，中文「残业」不成词，典型不能靠汉字猜词。","vocab_refs":["V0245"],"examples":[{"ja":"残業","kana":"ざんぎょう","zh":"加班"}],"ko_hint":""},{"id":"K0110","char":"業","onyomi":["ギョウ"],"kunyomi":["わざ"],"meaning_zh":"业；工作；学业","zh_trap":"中文「业」yè；日语 業 音读 ギョウ（残業 ざんぎょう、授業 じゅぎょう）、训读 わざ（手艺）；「残業」加班、「授業」上课，义项不能按中文「业」逐词套。","vocab_refs":["V0245"],"examples":[{"ja":"残業","kana":"ざんぎょう","zh":"加班"}],"ko_hint":""}],"questions":[{"id":"Q0308","type":"free_production","prompt_ja":"","prompt_zh":"用「〜たばかり」（G0068）写一句话，描述你刚刚做完的一件家务事。","options":[],"answer":"","rationale":"「Vた形＋ばかり」＝刚做完；不要与「〜たところだ」（G0069，刚…）或「だけ」（只）混淆。可自然使用 洗濯・片付ける・掃除 等 N4 动词（V0174/V0157/V0173）。","audio_text":"","rubric":"①Vた形＋ばかり表刚做完 1 分；②不与〜ところだ/だけ混淆 1 分；③时态与语境自然、家务词用得贴切 1 分","expected_production":"さっき洗濯をして、部屋を片付けたばかりです。","difficulty":4},{"id":"Q0373","type":"mcq","prompt_ja":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。地元の農家が作る干し柿は、甘くて柔らかいのが特徴で、以前から観光客に人気がありました。輸出を始めるにあたり、農家では、衛生管理の基準を満たすための設備を新しく作りました。町は、海外での販売を支援するため、現地のバイヤーとの話し合いの場を設ける予定です。生産量には限りがありますが、まずは少ない量から始め、味を確かめてもらう方針です。","prompt_zh":"【読解】根据第3句，農家が新しく作ったものは何ですか。","options":["干し柿の木","現地の工場","輸出用の港","衛生管理の基準を満たすための設備"],"answer":"衛生管理の基準を満たすための設備","rationale":"第3句「衛生管理の基準を満たすための設備を新しく作りました」=为达到卫生标准新建设备。港口、柿树、当地工厂都未提。","audio_text":"","rubric":"选 衛生管理の基準を満たすための設備 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0159","type":"error_correct","prompt_ja":"しないばなりません。","prompt_zh":"改错：ない形+ば 构成错误","options":[],"answer":"しなければなりません。","rationale":"「ない形+ば」是 しなければ，不是 しないば","audio_text":"","rubric":"改为 しなければ 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0160","type":"translate","prompt_ja":"中译日：明天不来也可以。","prompt_zh":"日译 なくてもいい","options":[],"answer":"","rationale":"来る ない形 来ない → 来なくてもいい，表许可不做","audio_text":"","rubric":"①用 なくても 得 1 分；②用 いいです 得 1 分；③礼貌体得 1 分","expected_production":"明日は来なくてもいいです。","difficulty":5},{"id":"Q0161","type":"free_production","prompt_ja":"请写一句自己必须做的事。","prompt_zh":"自由写作","options":[],"a
