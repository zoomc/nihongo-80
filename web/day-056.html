"結果に満足しています。"}],"notes_for_zh":"「満足」まんぞく 名词/サ変/な形，对象用 に（結果に満足する）；中文“满足于…”日语用 に，不说「結果を満足する」——助词易错；韩语 만족 同源可帮记，但不能靠汉字猜助词；「満」マン、「足」ソク 不可按中文 mǎn/zú 推。","confusables":["V0222"],"ko":"","ko_hint":"","caution":""},{"id":"V0223","surface":"不安","kana":"ふあん","romaji":"fuan","pos":"名詞/な形容詞","meaning_zh":"不安；担心","jlpt":"N3","examples":[{"ja":"試験の結果が不安です。","zh":"担心考试结果。","audio_text":"試験の結果が不安です。"}],"notes_for_zh":"「不安」ふあん 名词/な形，「〜が不安だ／不安に思う／不安がある」；与「心配」しんぱい 近义但「不安」偏“对未来的不确定感”，「心配」偏“牵挂某人/事”；中日同形义近，「不」フ、「安」アン 不可按中文 bù/ān 推。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0224","surface":"残念","kana":"ざんねん","romaji":"zannen","pos":"な形容詞","meaning_zh":"遗憾；可惜","jlpt":"N3","examples":[{"ja":"試合に負けて残念です。","zh":"输了比赛很遗憾。","audio_text":"試合に負けて残念です。"}],"notes_for_zh":"「残念」ざんねん な形容詞，「残念です／残念ながら／残念な結果」；中日同形但中文「残念」少用（多“遗憾”），日语极高频（婉拒/落选/坏消息都用）；な形变形「残念な＋名／残念だ」，别误当名词；「残」ザン、「念」ネン 不可按中文 cán/niàn 推。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0227","surface":"嬉しい","kana":"うれしい","romaji":"ureshii","pos":"い形容詞","meaning_zh":"高兴；开心","jlpt":"N3","examples":[{"ja":"合格して嬉しいです。","zh":"考上了很开心。","audio_text":"合格して嬉しいです。"}],"notes_for_zh":"「嬉しい」うれしい い形容詞，“因好事而即时喜悦”；与「楽しい」たのしい（享受过程/愉快）分工；描述他人心情一般不直陈「嬉しい」（用 嬉しそう／喜んでいる），中文“他很高兴”直译易错；变形 嬉しくない／嬉しかった。","confusables":["V0228"],"ko":"","ko_hint":"","caution":""},{"id":"V0232","surface":"くださる","kana":"くださる","romaji":"kudasaru","pos":"動詞/五段","meaning_zh":"给（我/我方）；赐予（尊敬语）","jlpt":"N3","examples":[{"ja":"先生が本をくださいました。","zh":"老师给了我一本书。","audio_text":"先生が本をくださいました。"}],"notes_for_zh":"「くださる」五段，「くれる」的尊敬语，主语是对方（给我方），用 が 标主语；ます形特殊「くださいます」、请求/命令用「ください」（不规则，不说 くださりなさい）；与「いただく」（我方受领，谦让）方向相对；中文“给”不分方向，不能直译。","confusables":["V0231"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0092","pattern":"普通形 + からこそ","meaning_zh":"正因为…才…","connection":"動詞・い形 普通形 + からこそ；な形・名詞 + だ + からこそ","example":"好きだからこそ、厳しく言うのです。","usage":"强调前项是后项成立的关键原因，常与「〜のだ／〜のです」呼应。","explanation_zh":"意思是「正因为…才…」；接续：動詞・い形 普通形 + からこそ；な形・名詞 + だ + からこそ（中文术语：动词・い形 简体 + からこそ；な形・名词 + だ
