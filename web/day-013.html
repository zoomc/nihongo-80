onfusables":[],"ko":"날씨","ko_hint":"日语『天気』是汉字词，但韩语日常说固有词 날씨（天气），不是汉字词 천기；这是『日韩不总能用同形汉字词对上』的重要例子。","caution":"てんき 与 날씨 来源完全不同、音也不近，看到汉字别硬找韩语汉字词；韩语 천기 极罕见且语义偏天机/天候，不能拿来对照。"},{"id":"V0099","surface":"映画","kana":"えいが","romaji":"eiga","pos":"名詞","meaning_zh":"电影","jlpt":"N5","examples":[{"ja":"映画を見ます。","zh":"看电影。","audio_text":"映画を見ます。"}],"notes_for_zh":"「映画」えいが 全音读；中文「电影」与日语「映画」用字不同，别写成「電影」；「映」不训读 うつ，复合用音读 えい。","confusables":[],"ko":"영화","ko_hint":"日韩汉字词同形同义（えいが／영화＝电影）。","caution":"えいが ≠ yeonghwa 读音不同；映画を見る≒영화를 보다，动词一致但韩语 보다 也兼看/见面，搭配别全推。"},{"id":"V0100","surface":"音楽","kana":"おんがく","romaji":"ongaku","pos":"名詞","meaning_zh":"音乐","jlpt":"N5","examples":[{"ja":"音楽を聞きます。","zh":"听音乐。","audio_text":"音楽を聞きます。"}],"notes_for_zh":"「音楽」おんがく，「楽」读 がく（训读 たの，如 楽しい）；同一「楽」字在 音楽(がく)/楽しい(たのしい) 读音不同。","confusables":["V0099"],"ko":"음악","ko_hint":"日韩汉字词同形同义（おんがく／음악＝音乐）。","caution":"おんがく ≠ eumak 读音不同；音楽を聞く≒음악을 듣다，日语『聞く』还表问、韩语 듣다 不表问，别据词猜。"}],"grammar":[{"id":"G0018","pattern":"な形容词 否定／过去／で","meaning_zh":"不…／曾…／而…（な形变形）","connection":"静か→静かではない／静かだった／静かで","example":"ここは静かではありません。","usage":"词干 + ではない(否定)、だった(过去简体)、で(中顿)","explanation_zh":"意思是「不…／曾…／而…（な形变形）」；接续：静か→静かではない／静かだった／静かで（中文术语：静か→静かではない／静かだった／静かで）；用法：词干 + ではない(否定)、だった(过去简体)、で(中顿)","common_errors":[{"wrong":"静かくないです。","why":"把い形容词的 〜くない 套到な形容词；中文「不安静」无词类提示","fix":"静かではありません。","learner":"zh"},{"wrong":"元気だったです。","why":"「だった」已含过去，再叠加 です 成双重礼貌/时态","fix":"元気でした。","learner":"zh"}],"compare":[],"examples":[{"ja":"ここは静かではありません。","zh":"这里不安静。","audio_text":"ここは静かではありません。"},{"ja":"昨日は元気でした。","zh":"昨天很精神。","audio_text":"昨日は元気でした。"}],"ko":"-지 않다 / 안（否定）、-았/었-（过去）、-고/-아서（中顿）","ko_hint":"な形容词的否定/过去/中顿同样靠句末形态，概念可对照。","caution":"な形容词 で 的中顿（静かで、便利で）韩语用 -고/-(이)며，不是单一形式；词干＋だった/ではなかった 与韩语 -았었- 层级不同源。"}],"kanji":[{"id":"K0036","char":"私","onyomi":["シ"],"kunyomi":["わたし","わたくし"],"meaning_zh":"我；私","zh_trap":"中文「私」读 sī 义为「私人/私自」；日语「私」训读 わたし 是「我」，音读 シ（私立 しりつ）；中日词义完全不同，千万别望文生义成「自私」。","vocab_refs":["V0001"],"examples":[{"ja":"私","kana":"わたし","zh":"我"}],"ko_hint
