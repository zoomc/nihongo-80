<script type="application/json" id="nh80-day">{"day":55,"phase":"P4","theme":"立场表达｜Vて + いただけませんか / もらえませんか・手続き・技術","scene":"【立场表达】科技：用「Vて + いただけませんか / もらえませんか」表示部分同意与保留，不用非黑即白的中文式直译（素材：アプリの初期設定の説明）","scene_tag":"立场表达","can_do":"用「Vて + いただけませんか / もらえませんか」表示部分同意与保留，不用非黑即白的中文式直译","focus":["production","grammar"],"objectives":["能不看提示，自己说出至少 1 句完整的日语","能说清「Vて + いただけませんか / もらえませんか」用在什么场合、前面该怎么接","能分清 手続き、技術、事故 和意思相近的词，别按中文硬套","当天新词：手続き、技術、事故（读音与用法都要验证，不靠汉字猜义）","当天句型：Vて + いただけませんか / もらえませんか，须说出接续条件","当天汉字：故、障，音读/训读各给一例","Can-do：用「Vて + いただけませんか / もらえませんか」表示部分同意与保留，不用非黑即白的中文式直译"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【立场表达】科技：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0250","surface":"手続き","kana":"てつづき","romaji":"tetsuzuki","pos":"名詞","meaning_zh":"手续；程序","jlpt":"N3","examples":[{"ja":"入学の手続きをします。","zh":"办理入学手续。","audio_text":"入学の手続きをします。"}],"notes_for_zh":"「手続き」てつづき 名词，「〜の手続き／手続きをする／手続きが要る」；中日不能靠汉字猜词：中文“手续”与日语 てつづき 同形近义（少数一致），但读法是训读 てつづき（続 つづき），不读 しゅぞく；「続」ゾク/つづく 一字两读须验证；韩语 수속 同源却读法不同，仍不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0252","surface":"技術","kana":"ぎじゅつ","romaji":"gijutsu","pos":"名詞","meaning_zh":"技术","jlpt":"N3","examples":[{"ja":"新しい技術を開発します。","zh":"开发新技术。","audio_text":"新しい技術を開発します。"}],"notes_for_zh":"「技術」ぎじゅつ 名词，「技術を身につける／技術が進歩する」；中日同形义近但「技」ギ、「術」ジュツ（入声 -ツ）不可按中文 jì/shù 推；韩语 기술 同源可帮记，但不能靠汉字猜训读（技 わざ／術 无训读）；与「テクノロジー」语体不同。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0256","surface":"事故","kana":"じこ","romaji":"jiko","pos":"名詞","meaning_zh":"事故；意外事件","jlpt":"N3","examples":[{"ja":"高速道路で事故がありました。","zh":"高速上发生了事故。","audio_text":"高速道路で事故がありました。"}],"notes_for_zh":"「事故」じこ 名词，「事故がある／起こす／に遭う」；与「故障」こしょう（机器故障）分工：事故 是“人或社会性意外”；中日同形义近但「事」ジ、「故」コ 不可按中文 shì/gù 推；韩语 사고 同源可帮记，但不能靠汉字猜搭配（事故に遭う 用 に）。","confusables":["V0253"],"ko":"사고","ko_hint":"日韩汉字词同形同义（じこ／사고＝事故/意外）。","caution":"じこ ≠ sago 读音不同；【注意】同音陷阱：韩语 사고 还表思考（思考 사고），日语 事故 不表思考，别混；日语『人身事故』韩语 인신사고，搭配不同。"}],"grammar":[{"id":"G0073","pattern":"Vて + いただけませんか / もらえませんか","meaning_zh":"能否请您…（很礼貌的请求）","connection":"動詞 て形 + いただく（谦让）可能形 いただけませんか；或 もらう 可能形 もらえませんか","example":"少し待っていただけませんか。","usage":"对长辈/不熟的人请求，比 〜てください（G0026）礼貌；用否定疑问表委婉","explanation_zh":"意思是「能否请您…（很礼貌的请求）」；接续：動詞 て形 + いただく（谦让）可能形 いただけませんか；或 もらう 可能形 もらえませんか（中文术语：动词 て形 + いただく（谦让）可能形 いただけませんか；或 もらう 可能形 もらえませんか）；用法：对长辈/不熟的人请求，比 〜てください（G0026）礼貌；用否定疑问表委婉","common_errors":[{"wrong":"先生、待ってください。","why":"对老师直接 てください 偏指示/命令，中文「请等一下」直译不够礼貌","fix":"先生、少しお待ちいただけませんか。","learner":"zh"},{"wrong":"教えていただけますか。","why":"请求用否定疑问 いただけませんか 才委婉；中文「能教我吗」直译成肯定疑问 ますか 显得直接","fix":"教えていただけませんか。","learner":"zh"}],"compare":[{"id":"G0026","diff":"〜てください 是普通请求/指示；对长辈用 ていただけませんか 更礼貌"},{"id":"G0052","diff":"〜てもらう 是中性授受；いただけませんか 叠加谦让＋可能＋疑问三层礼貌"}],"examples":[{"ja":"少し待っていただけませんか。","zh":"能请您稍等一下吗？","audio_text":"少し待っていただけませんか。"},{"ja":"使い方を教えていただけませんか。","zh":"能教我一下用法吗？","audio_text":"使い方を教えていただけませんか。"}],"ko":"-아/어 주시겠어요? / -(으)ㄹ 수 있을까요? / -아/어 주실 수 있으세요?","ko_hint":"『能否请您…』的极礼貌请求，可对照韩语敬让请求形。","caution":"这是日语谦让＋可能＋否定的叠加（ていただけませんか），韩语靠 주시다/으실 수 있다 与疑问尾，层级都对不上；日语还有 てくださいませんか/ていただけないでしょうか 等多级客气度，韩语无一一对应，别一律翻成 주세요。"}],"kanji":[{"id":"K0122","char":"故","onyomi":["コ"],"kunyomi":["ゆえ"],"meaning_zh":"故；原因；旧；故障","zh_trap":"中文「故」gù（故事/原因/旧的）；日语「故障」こしょう 是「故障/出毛病」，中文易按「故事/故意」误解；音读 コ、训读 ゆえ（故に），不能靠汉字猜词。","vocab_refs":["V0253"],"examples":[{"ja":"故障","kana":"こしょう","zh":"故障；出毛病"}],"ko_hint":""},{"id":"K0123","char":"障","onyomi":["ショウ"],"kunyomi":["さわる"],"meaning_zh":"障；障碍；故障","zh_trap":"中文「障」zhàng；日语 障 音读 ショウ，「故障」こしょう「障害」しょうがい；「故障」与中文同形同义（少数一致），但「障害」しょうがい 是「障碍/残疾」，不能一律按中文推。","vocab_refs":["V0253"],"examples":[{"ja":"故障","kana":"こしょう","zh":"故障；出毛病"}],"ko_hint":""}],"questions":[{"id":"Q0243","type":"listen","prompt_ja":"会話を聞いて、二人の関係を答えてください。","prompt_zh":"说话的两人是什么关系？","options":["部長と部下","医者と患者","店員と客","兄弟"],"answer":"部長と部下","rationale":"「部長」这一称呼，以及「用意して／お送りします」「増やしていただけませんか」的敬语方向，说明是上司（部长）与部下；请求由部长发向部下。","audio_text":"田中さん、明日の会議の資料はもうできていますか。はい、部長。夕方までに用意して、メールでお送りします。ありがとう。実は取引先が急に来ることになったので、資料を一枚増やしていただけませんか。分かりました。追加します。","rubric":"选 部長と部下 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0271","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：会议资料已事先备好（用「てある」）","options":["もう","用意して","あります","会議の資料は"],"answer":"4,1,2,3","rationale":"主题「会議の資料は」→副词「もう」→「Vて形＋あります」（G0056）。宾语原本用 を，てある 句用 が/は 提示。","audio_text":"","rubric":"编号序列为 4,1,2,3 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0279","type":"reorder","prompt_ja":"バラバラになった語を正しい順に並べてください。","prompt_zh":"排列成句：请确认部长是否来（用「かどうか」）","options":["かどうか","来る","確認して","部長が","ください"],"answer":"4,2,1,3,5","rationale":"「普通形＋かどうか」（是否，G0058）作确认的宾语从句，名词/な形不加 だ；后接「Vて＋ください」（G0026）。","audio_text":"","rubric":"编号序列为 4,2,1,3,5 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0288","type":"error_correct","prompt_ja":"昨日は会議があったです。","prompt_zh":"改正敬简混用（简体＋です）","options":[],"answer":"昨日は会議がありました。","rationale":"简体「あった」不能直接接「です」；礼貌体过去用「ありました」，或用说明语气「あったんです」（G0059）。中文『（过去）有』无敬简变形，直译易混。","audio_text":"","rubric":"改为 ありました（或 あったんです）得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0293","type":"error_correct","prompt_ja":"明日の会議は、行かなくていいです。","prompt_zh":"改正「〜なくても いい」漏「も」","options":[],"answer":"明日の会議は、行かなくてもいいです。","rationale":"「Vない形去ない＋くても＋いい」＝不必…（G0047）；「なくて」是中顿/原因，不能表许可。中文『不…也行』直译容易漏掉「も」。","audio_text":"","rubric":"改为 行かなくてもいい 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0310","type":"free_production","prompt_ja":"","prompt_zh":"用「〜に 違いない」（G0070）写一句话，对眼前的情况做一个有把握的推断。","options":[],"answer":"","rationale":"「普通形＋に違いない」强烈推断；动词/い形用普通形直接接，な形/名词用（である，可省）；常与「きっと」呼应。","audio_text":"","rubric":"①普通形＋に違いない强烈推断 1 分；②接续正确（动词普通形/名・な形である）1 分；③きっと等呼应、语境自然 1 分","expected_production":"部長の机に資料がないから、きっと会議中に違いない。","difficulty":4}],"materials":[{"id":"M0042","kind":"reading","title":"アプリの初期設定の説明","text_ja":"新しいアプリを使い始める前に、画面の指示に従って初期設定を済ませておいてください。設定を飛ばすと、あとでお知らせが届かなかったり、データが正しく保存されなかったりすることがあります。一度設定してしまえば、日々の操作はとても簡単で、説明書を読まなくても使えるほどです。わからない操作は、ヘルプの画面で調べられます。","text_kana":"","text_zh":"开始使用新应用前，请按照屏幕提示完成初始设置。若跳过设置，之后可能出现收不到通知、数据无法正确保存等情况。一旦设置完成，日常操作非常简单，甚至不用读说明书也能使用。不懂的操作可在帮助页面查询。","focus_zh":"「済ませておいてください」的「ておく」是事先设置好；「届かなかったり、保存されなかったり」用「〜たり〜たり」列举可能出的问题。","audio_text":"新しいアプリを使い始める前に、画面の指示に従って初期設定を済ませておいてください。設定を飛ばすと、あとでお知らせが届かなかったり、データが正しく保存されなかったりすることがあります。一度設定してしまえば、日々の操作はとても簡単で、説明書を読まなくても使えるほどです。わからない操作は、ヘルプの画面で調べられます。","url":"","license":"original"},{"id":"M0056","kind":"listening","title":"ハイキング延期の連絡","text_ja":"もしもし、あしたのハイキングのことだけど、天気予報が変わってね。うん、雨だって聞いたよ。そうなんだ。それで、行くのを来週に延ばすことにしたんだ。ごめん、わざわざ準備してくれたのに。ううん、大丈夫。連絡してくれて助かったよ。","text_kana":"","text_zh":"喂，关于明天徒步的事，天气预报变了。嗯，听说明天下雨。是啊。所以决定推迟到下周。抱歉，你还特意准备了。没事，别在意。你联系我反而帮了大忙。","focus_zh":"「うん、雨だって聞いたよ」「延ばすことにしたんだ」「ううん、大丈夫」全是朋友间简体＋终助词；这里「大丈夫」＝没事／别在意，不是中文男子汉。","audio_text":"もしもし、あしたのハイキングのことだけど、天気予報が変わってね。うん、雨だって聞いたよ。そうなんだ。それで、行くのを来週に延ばすことにしたんだ。ごめん、わざわざ準備してくれたのに。ううん、大丈夫。連絡してくれて助かったよ。","url":"","license":"original"}],"viz":{"day":55,"phase":"P4","new_count":6,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"新しいアプリを使い始める前に、画面の指示に従って初期設定を済ませておいてください。","kana":"","zh":"开始使用新应用前，请按照屏幕提示完成初始设置。","note_zh":"「済ませておいてください」的「ておく」是事先设置好；「届かなかったり、保存されなかったり」用「〜たり〜たり」列举可能出的问题。","audio_text":"新しいアプリを使い始める前に、画面の指示に従って初期設定を済ませておいてください。"},{"ja":"設定を飛ばすと、あとでお知らせが届かなかったり、データが正しく保存されなかったりすることがあります。","kana":"","zh":"若跳过设置，之后可能出现收不到通知、数据无法正确保存等情况。","note_zh":"「済ませておいてください」的「ておく」是事先设置好；「届かなかったり、保存されなかったり」用「〜たり〜たり」列举可能出的问题。","audio_text":"設定を飛ばすと、あとでお知らせが届かなかったり、データが正しく保存されなかったりすることがあります。"},{"ja":"少し待っていただけませんか。","kana":"","zh":"能请您稍等一下吗？","note_zh":"对老师直接 てください 偏指示/命令，中文「请等一下」直译不够礼貌","audio_text":"少し待っていただけませんか。"}],"review_plan":[{"kid":"V0242","surface":"変える","kana":"かえる","zh":"改变（他动）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"V0244","surface":"会議","kana":"かいぎ","zh":"会议","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"V0247","surface":"報告","kana":"ほうこく","zh":"报告；汇报","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"V0248","surface":"相談","kana":"そうだん","zh":"商量；咨询","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"G0071","surface":"普通形 + わけが ない / V辞書形 + わけには いかない","kana":"","zh":"不可能…／不能…、不好…","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"G0072","surface":"普通形 + と は 限らない","kana":"","zh":"未必…；不一定…；不见得…","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"K0120","surface":"技","kana":"","zh":"技；技能；技术","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"},{"kid":"K0121","surface":"術","kana":"","zh":"术；技术；手术；算术","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":54,"next_hint_zh":"大约 Day 56 再回顾"}],"teaching_notes":["记住：对老师直接 てください 偏指示/命令，中文「请等一下」直译不够礼貌","注意：请求用否定疑问 いただけませんか 才委婉；中文「能教我吗」直译成肯定疑问 ますか 显得直接","容易错：「手続き」てつづき 名词，「〜の手続き／手続きをする／手続きが要る」；中日不能靠汉字猜词：中文“手续”与日语 てつづき 同形近义（少数一致），","小提醒：「技術」ぎじゅつ 名词，「技術を身につける／技術が進歩する」；中日同形义近但「技」ギ、「術」ジュツ（入声 -ツ）不可按中文 jì/shù 推；"],"ko_analogy":{"grammar":[{"match":"G0073","pattern":"Vて + いただけませんか / もらえませんか","ko":"-아/어 주시겠어요? / -(으)ㄹ 수 있을까요? / -아/어 주실 수 있으세요?","hint_zh":"『能否请您…』的极礼貌请求，可对照韩语敬让请求形。","caution":"这是日语谦让＋可能＋否定的叠加（ていただけませんか），韩语靠 주시다/으실 수 있다 与疑问尾，层级都对不上；日语还有 てくださいませんか/ていただけないでしょうか 等多级客气度，韩语无一一对应，别一律翻成 주세요。"}],"vocab":[{"match":"V0256","surface":"事故","ko":"사고","hint_zh":"日韩汉字词同形同义（じこ／사고＝事故/意外）。","caution":"じこ ≠ sago 读音不同；【注意】同音陷阱：韩语 사고 还表思考（思考 사고），日语 事故 不表思考，别混；日语『人身事故』韩语 인신사고，搭配不同。"}]}}</script>
