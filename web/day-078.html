<script type="application/json" id="nh80-day">{"day":78,"phase":"P6","theme":"家庭交谈｜家庭","scene":"【家庭交谈】家庭：用「N / Vます形(去ます) + がちだ」向家人说明家庭里的安排和每个人的分工（素材：弟の希望｜主题键：family｜对齐：review）","scene_tag":"家庭交谈","scene_topic_key":"family","scene_topic":"家庭","topic_match":"review","material_topic_keys":["family","news_summary"],"material_pair":"mixed_topic","can_do":"用「N / Vます形(去ます) + がちだ」向家人说明家庭里的安排和每个人的分工","focus":["vocabulary","kanji"],"objectives":["能不看提示，自己说出至少 1 句完整的日语","能说清「N / Vます形(去ます) + がちだ」用在什么场合、前面该怎么接","能分清 当天新词 和意思相近的词，别按中文硬套","Can-do：用「N / Vます形(去ます) + がちだ」向家人说明家庭里的安排和每个人的分工"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【家庭交谈】家庭：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[],"grammar":[],"kanji":[],"questions":[{"id":"Q0354","type":"mcq","prompt_ja":"彼が約束を忘れる___がありません。","prompt_zh":"【言語知識】填入表示“不可能”的语法。","options":["最中","うち","はず","ばかり"],"answer":"はず","rationale":"「忘れるはずがない」=不可能忘记；「ばかり」表“尽是/刚刚”，“うち”是期间，“最中”是正在…时，均不能构成强烈否定推断。","audio_text":"","rubric":"选 はず 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0355","type":"mcq","prompt_ja":"市民のみなさまへ。来月から、燃えるごみを集める日が変わります。これまでは毎週月曜日と木曜日でしたが、来月からは毎週火曜日と金曜日になります。祝日がある週は、次の平日に順延します。ごみは朝八時までに、決められた場所へ出してください。指定の袋を使わないごみは集めることができませんので、ご注意ください。詳しくは市役所のホームページで確認してください。ごみを出す時間を守らないと、収集できないことがあります。市役所環境課よりお知らせしました。","prompt_zh":"【読解】根据第4句「祝日がある週は、次の平日に順延します」，祝日がある週のごみ収集はどうなりますか。","options":["土曜日に集める","その週は集めない","祝日の前日に集める","次の平日に順延される"],"answer":"次の平日に順延される","rationale":"第4句明说「次の平日に順延します」=顺延到下一个工作日。前移、整周不收集、固定周六都不对。","audio_text":"","rubric":"选 次の平日に順延される 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0356","type":"mcq","prompt_ja":"田中さま。お疲れさまです。来週水曜日の企画会議についてご連絡します。会場の都合で、開催日を木曜日の午後三時に変更することになりました。開始時刻は変わりませんが、会議室は三階の第二会議室から五階の大会議室に移ります。資料は前日までに共有フォルダーへ入れておいてください。当日は、先月の売上について五分ほど報告をお願いします。ご確認のうえ、返信をお願いいたします。不明な点があれば、企画部の山田までお問い合わせください。山田より。","prompt_zh":"【読解】根据第4、5句，このメールで変わったものはどれですか。","options":["開催日と会議室","報告の担当者","資料の枚数","開始時刻だけ"],"answer":"開催日と会議室","rationale":"第4句改举办日，第5句改会议室；第5句同时明说「開始時刻は変わりません」。资料枚数、报告人都未提。","audio_text":"","rubric":"选 開催日と会議室 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0358","type":"mcq","prompt_ja":"住民票の写しが必要な方は、市役所一階の窓口でお求めください。申請書に名前と住所を書き、本人確認の書類を見せてください。運転免許証やマイナンバーカードがあれば、一つの書類で足ります。手数料は一通三百円で、現金またはキャッシュレスで払えます。代理人が来る場合は、本人が書いた委任状と、代理人の本人確認の書類も必要です。郵送を希望する方は、返信用の封筒を入れてください。平日の午後五時までに受け付けた分は、その日のうちに発行できます。","prompt_zh":"【読解】根据第5句，代理人が手続きするとき、必要なものはどれですか。","options":["本人が書いた委任状","住民票の写し","印鑑","本人の運転免許証"],"answer":"本人が書いた委任状","rationale":"第5句明确要求「本人が書いた委任状」和「代理人の本人確認の書類」。本人驾照、印鑑、住民票の写し在第5句都没有作为代理人办理的必需项。","audio_text":"","rubric":"选 本人が書いた委任状 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0359","type":"mcq","prompt_ja":"睡眠不足が続くと、仕事や勉強の能率が下がるだけでなく、体の免疫力も弱くなります。成人の場合、六時間から八時間の睡眠が目安とされていますが、時間よりも大切なのは、毎日ほぼ同じ時刻に寝て、同じ時刻に起きることです。寝る前にスマートフォンを見ると、脳が起きたままと感じて、眠りにくくなることがあります。どうしても眠れないときは、無理に布団に入らず、部屋を暗くして軽くストレッチをするのも一つの方法です。昼寝をするなら、三十分以内にするとよいでしょう。","prompt_zh":"【読解】根据第2句，筆者が最も大切だと言っているのはどれですか。","options":["毎日ほぼ同じ時刻に寝て起きること","寝る前にスマホを見ること","眠れないとき布団に入ること","八時間以上眠ること"],"answer":"毎日ほぼ同じ時刻に寝て起きること","rationale":"第2句「時間よりも大切なのは…同じ時刻に寝て、同じ時刻に起きることです」明确把规律作息放在时长之上。","audio_text":"","rubric":"选 毎日ほぼ同じ時刻に寝て起きること 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0361","type":"mcq","prompt_ja":"賃貸住宅を出るときは、少なくとも一か月前までに、大家さんか不動産会社へ連絡してください。退去の日が決まったら、部屋の傷や汚れを確認し、自分で直せるものは直しておくと、費用を抑えられます。冷蔵庫やベッドなどの大型ごみは、自分で処分するか、処分を頼む必要があります。敷金は、修理が必要な場合に使われ、残った分は返ってきます。ただし、通常の使用による傷は、借りた人の負担にならないのが一般的です。契約書に書いてある内容を、必ず確認しておきましょう。","prompt_zh":"【読解】根据第4句，敷金について正しいものはどれですか。","options":["礼金と同じで返ってこない","必ず全額返ってくる","修理に使われ、残った分は返ってくる","退去時には一切使われない"],"answer":"修理に使われ、残った分は返ってくる","rationale":"第4句「修理が必要な場合に使われ、残った分は返ってきます」=用于修理，剩余退还。全額返、完全不使用都不对；礼金才不退。","audio_text":"","rubric":"选 修理に使われ、残った分は返ってくる 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0028","kind":"listening","title":"弟の希望","text_ja":"弟は家族と旅行に行きたがっています。しかし、雨が降るかもしれません。","text_kana":"","text_zh":"弟弟想去和家人旅行。不过也许会下雨。","focus_zh":"「行きたがっています」用「たがる」表弟弟（第三人称）想去，说自己想要只能用「たい」；「降るかもしれません」是也许会下的低把握推测。","audio_text":"弟は家族と旅行に行きたがっています。しかし、雨が降るかもしれません。","url":"","license":"original"},{"id":"M0079","kind":"reading","title":"干し柿の輸出開始","text_ja":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。地元の農家が作る干し柿は、甘くて柔らかいのが特徴で、以前から観光客に人気がありました。輸出を始めるにあたり、農家では、衛生管理の基準を満たすための設備を新しく作りました。町は、海外での販売を支援するため、現地のバイヤーとの話し合いの場を設ける予定です。生産量には限りがありますが、まずは少ない量から始め、味を確かめてもらう方針です。","text_kana":"このまちのとくさんひんであるほしがきが、らいげつからとうなんアジアへゆしゅつされることになりました。じもとののうかがつくるほしがきは、あまくてやわらかいのがとくちょうで、いぜんからかんこうきゃくににんきがありました。ゆしゅつをはじめるにあたり、のうかでは、えいせいかんりのきじゅんをみたすためのせつびをあたらしくつくりました。まちは、かいがいでのはんばいをしえんするため、げんちのバイヤーとはなしあいのばをもうけるよていです。せいさんりょうにはかぎりがありますが、まずはすくないりょうからはじめ、あじをたしかめてもらうほうしんです。","text_zh":"这个镇的特产柿饼，将从下个月起出口到东南亚。当地农家制作的柿饼以甜软为特点，此前就受游客欢迎。为开始出口，农家新建设备以满足卫生管理标准。镇里为支持海外销售，计划设置与当地采购商洽谈的场合。产量有限，但方针是先从少量开始，让对方确认味道。","focus_zh":"「輸出されることになりました」=已决定出口（被动）；「にあたり」=在…之际；「基準を満たす」=达到标准；「限りがあります」=有限。","audio_text":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。地元の農家が作る干し柿は、甘くて柔らかいのが特徴で、以前から観光客に人気がありました。輸出を始めるにあたり、農家では、衛生管理の基準を満たすための設備を新しく作りました。町は、海外での販売を支援するため、現地のバイヤーとの話し合いの場を設ける予定です。生産量には限りがありますが、まずは少ない量から始め、味を確かめてもらう方針です。","url":"","license":"original"}],"viz":{"day":78,"phase":"P6","new_count":0,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"弟は家族と旅行に行きたがっています。","kana":"","zh":"弟弟想去和家人旅行。","note_zh":"「行きたがっています」用「たがる」表弟弟（第三人称）想去，说自己想要只能用「たい」；「降るかもしれません」是也许会下的低把握推测。","audio_text":"弟は家族と旅行に行きたがっています。","origin":"material","source_id":"M0028"},{"ja":"しかし、雨が降るかもしれません。","kana":"","zh":"不过也许会下雨。","note_zh":"「行きたがっています」用「たがる」表弟弟（第三人称）想去，说自己想要只能用「たい」；「降るかもしれません」是也许会下的低把握推测。","audio_text":"しかし、雨が降るかもしれません。","origin":"material","source_id":"M0028"},{"ja":"この町の特産品である干し柿が、来月から東南アジアへ輸出されることになりました。","kana":"このまちのとくさんひんであるほしがきが、らいげつからとうなんアジアへゆしゅつされることになりました。","zh":"这个镇的特产柿
