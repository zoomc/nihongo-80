<script type="application/json" id="nh80-day">{"day":23,"phase":"P2","theme":"预约登记｜～が ほしい・比较（より／ほうが／ほど）・病院","scene":"【预约登记】寒暄：用礼貌体报出姓名、时间与人数，并核对对方复述是否正确（素材：朝のあいさつ）","scene_tag":"预约登记","can_do":"用礼貌体报出姓名、时间与人数，并核对对方复述是否正确","focus":["vocabulary","kanji"],"objectives":["能听懂 寒暄 里常出现的词，并说出大概意思","能不看提示，自己说出至少 1 句完整的日语","能说清「～が ほしい、比较（より／ほうが／ほど）」用在什么场合、前面该怎么接","当天新词：病院、野菜、兄（读音与用法都要验证，不靠汉字猜义）","当天句型：～が ほしい、比较（より／ほうが／ほど），须说出接续条件","当天汉字：来、買、読，音读/训读各给一例","Can-do：用礼貌体报出姓名、时间与人数，并核对对方复述是否正确"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【预约登记】寒暄：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0043","surface":"病院","kana":"びょういん","romaji":"byouin","pos":"名詞","meaning_zh":"医院","jlpt":"N5","examples":[{"ja":"病院に行きます。","zh":"去医院。","audio_text":"病院に行きます。"}],"notes_for_zh":"「病院」びょういん；中文「病院」非现代词，日语「医院」一词反而多指小诊所，大医院是「病院」，中日词义偏移。","confusables":[],"ko":"병원","ko_hint":"日韩汉字词形近义近（びょういん／병원＝医院）。","caution":"びょういん ≠ byeong-won 读音不同；日语『病院』指有床位的大医院、小诊所叫 診療所，韩语 병원 泛指医院，范围不同；中文『病院』是旧词，别按中文。"},{"id":"V0057","surface":"野菜","kana":"やさい","romaji":"yasai","pos":"名詞","meaning_zh":"蔬菜","jlpt":"N5","examples":[{"ja":"野菜を買います。","zh":"买蔬菜。","audio_text":"野菜を買います。"}],"notes_for_zh":"「野菜」やさい 是训读式复合；中文「野菜」在古汉语指野生的菜，现代日语「野菜」= 蔬菜，与中文「野菜(野生可食草)」词义不同。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0068","surface":"兄","kana":"あに","romaji":"ani","pos":"名詞","meaning_zh":"(我)哥哥","jlpt":"N5","examples":[{"ja":"兄は東京にいます。","zh":"我哥哥在东京。","audio_text":"兄は東京にいます。"}],"notes_for_zh":"「兄(あに)」对外称自己兄长，当面叫「お兄さん(おにいさん)」；中文「兄」可书面指他人兄长，日语「兄」默认自家。","confusables":["V0070"],"ko":"","ko_hint":"","caution":""},{"id":"V0069","surface":"姉","kana":"あね","romaji":"ane","pos":"名詞","meaning_zh":"(我)姐姐","jlpt":"N5","examples":[{"ja":"姉は学生です。","zh":"我姐姐是学生。","audio_text":"姉は学生です。"}],"notes_for_zh":"「姉(あね)」对外称自己姐姐，当面叫「お姉さ
