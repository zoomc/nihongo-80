源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0219","surface":"気持ち","kana":"きもち","romaji":"kimochi","pos":"名詞","meaning_zh":"心情；感受；心意","jlpt":"N3","examples":[{"ja":"気持ちを言葉にするのは難しい。","zh":"把心情化成语言很难。","audio_text":"気持ちを言葉にするのは難しい。"}],"notes_for_zh":"「気持ち」きもち 名词，“一时的情绪/心意”，「気持ちを込める／気持ちがいい」；与「気分」きぶん（身心状态/气氛）不同：気持ち 是“心里的感受”；「気」キ、「持」ジ，此词训读 きもち，不能靠汉字猜。","confusables":["V0220"],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0066","pattern":"V辞書形 / Vない形 + ことが ある","meaning_zh":"有时会…／有时不…（泛指倾向）","connection":"動詞 辞書形／ない形 + ことが ある；ある 可变形（ことがあります／あった）","example":"忙しくて、昼ご飯を忘れることがあります。","usage":"表示偶尔发生、有时会那样；与 〜たことがある（G0042，曾经做过）时态语义都不同","explanation_zh":"意思是「有时会…／有时不…（泛指倾向）」；接续：動詞 辞書形／ない形 + ことが ある；ある 可变形（ことがあります／あった）（中文术语：动词 辞书形／ない形 + ことが ある；ある 可变形（ことがあります／あった））；用法：表示偶尔发生、有时会那样；与 〜たことがある（G0042，曾经做过）时态语义都不同","common_errors":[{"wrong":"北海道へ行ったことがあります。（想说有时会去）","why":"「有时会去」须用 辞书形 行くことがある；たことがある 是「去过」，中文「有时」直译易混","fix":"北海道へ行くことがあります。","learner":"zh"},{"wrong":"忘れることがありますでした。","why":"「あります」已含礼貌体，不能再叠 でした；中文无时态变化易堆敬体","fix":"忘れることがありました。","learner":"zh"}],"compare":[{"id":"G0042","diff":"〜たことがある 是「曾经做过（至今为止的经验）」用 た形；〜ことがある 是「有时会（习惯/倾向）」用 辞书形"}],"examples":[{"ja":"忙しくて、昼ご飯を忘れることがあります。","zh":"忙起来有时会忘了吃午饭。","audio_text":"忙しくて、昼ご飯を忘れることがあります。"},{"ja":"彼はたまに遅刻することがあります。","zh":"他偶尔会迟到。","audio_text":"彼はたまに遅刻することがあります。"}],"ko":"-(으)ㄹ 때가 있다 / -기도 하다 / -지 않을 때가 있다","ko_hint":"『有时会…／有时不…』≒ -(으)ㄹ 때가 있다，泛指倾向可对照（与 G0042 经历不同）。","caution":"日语用辞书形＝有时、た形＝曾经（G0042），只差动词形，韩语 -(으)ㄹ 때가 있다/-(으)ㄴ 적이 있다 是两套，别把两条都翻成 있다；ことがある 的 がある 不表存在某物，别套 있다。"},{"id":"G0067","pattern":"V意志形 + と 思う / と する","meaning_zh":"打算…／正要…、试图…","connection":"動詞 意志形（五段 お段+う／一段 よう／する→しよう／来る→こよう）+ と 思う／と する","example":"日曜日は映画を見ようと思っています。","usage":"(よ)うと思う 表说话人打算（现在/将来）；(よ)うとする 表正要开始做或尝试做","explanation_zh":"意思是「打算…／正要…、试图…」；接续：動詞 意志形（五段 お段+う／一段 よう／する→しよう／来る→こよう）+ と 思う／と する（中文术语：动词 意志形（五段 お段+う／一段 よう／する→しよう／来る→こよう）+ と 思う／と する）；用法：(よ)うと思う 表说话人打算（现在/将来）；(よ)うとする 表正要开始做或尝试做","common_errors":[{"wrong":"映画を見ると思います。","why":"「打算看」须用意志形 見よう；用辞书形 見る 变成「觉得会看」，中文「想看」直译错","fix":"映画を見ようと思います。","learner":"zh"},{"wrong":"きようと思っています。","why":"カ変「来る」意志形是 こよう，不是 きよう；中文按字形推读音错","fix":"こようと思っています。","learner":"zh"}],"compare":[{"id":"G0036","diff":"〜と 思う 引用「觉得/认为」；〜(よ)うと思う 引用的是自己的「打算」"},{"id":"G0032","diff":"〜ましょう 是邀对方一起做；〜(よ)うと思う 是自己内心的打算"}],"examples":[{"ja":"日曜日は映画を見ようと思っています。","zh":"周日打算看电影。","audio_text":"日曜日は映画を見ようと思っています。"},{"ja":"出かけようとしたら、雨が降ってきました。","zh":"正要出门时下起雨来了。","audio_text":"出かけようとしたら、雨が降ってきました。"}],"ko":"-(으)려고 하다 / -(으)ㄹ까 하다 / -(으)려던 참이다","ko_hint":"『打算…／正要…』≒ -(으)려고 하다，意志/尝试可对照。","caution":"日语意志形＋と思う 表打算、＋とする 表正要/试图，韩语 -(으)려고 하다/-려던 참이다 分工类似但不一一对应；と 是引用助词（G0036），韩语 -려고 里没有引用形，别加 라고。"}],"kanji":[{"id":"K0113","char":"告","onyomi":["コク"],"kunyomi":["つげる"],"meaning_zh":"告；告诉；报告；广告","zh_trap":"中文「告」gào；日语 告 音读 コク（入声 -ク）、训读 つげる（告げる），「報告」ほうこく「広告」こうこく；不可按中文 gào 推成 ゴウ/カオ。","vocab_refs":["V0247"],"examples":[{"ja":"報告","kana":"ほうこく","zh":"报告；汇报"}],"ko_hint":"韩语汉字词可参考：보고(하다)。日韩汉字词同形同义（ほうこく／보고＝报告）。"},{"id":"K0114","char":"相","onyomi":["ソウ"],"kunyomi":["あい"],"meaning_zh":"相；互相；相貌；商谈","zh_trap":"中文「相」xiāng/xiàng；日语 相 音读 ソウ（相談 そうだん）/ショウ（首相 しゅしょう）、训读 あい（相手 あいて）；「相談」是「商量」，不能按中文「互相谈话」机械套。","vocab_refs":["V0248"],"examples":[{"ja":"相談","kana":"そうだん","zh":"商量；咨询"}],"ko_hint":"韩语汉字词可参考：상담(하다)。日韩汉字词形近义近（そうだん／상담＝商量/咨询）。"}],"questions":[{"id":"Q0318","type":"free_production","prompt_ja":"","prompt_zh":"用「V辞書形＋ことが ある」（G0066）写一句话，说明自己『有时会…』的习惯；注意别写成『曾经做过』。","options":[],"answer":"","rationale":"「V辞書形＋ことがある」＝有时会（泛指倾向，G0066）；「Vた形＋ことがある」＝曾经做过（G0042）。两者只差动词形，中文母语者极易混；可配 時々／忙しいとき 等。","audio_text":"","rubric":"①用辞书形而非た形（区分 G0042）1 分；②ことがある表泛指倾向 1 分；③频率副词/时间语境与句子自然 1 分","expected_production":"忙しいときは、昼ご飯を忘れることがあります。","difficulty":4},{"id":"Q0166","type":"read","prompt_ja":"高いからといって、美味しいわけではありません。【問い】高い料理は必ず美味しいですか。","prompt_zh":"读短文回答部分否定","options":[],"answer":"いいえ、美味しいわけではありません","rationale":"「わけではない」表部分否定，可推出「贵不一定好吃」","audio_text":"高いからといって、美味しいわけではありません。","rubric":"答出部分否定得 1 分，答 はい 得 0 分","expected_production":"","difficulty":5},{"id":"Q0167","type":"reorder","prompt_ja":"把词块排成「他应该已经回去了」","prompt_zh":"句序：主题 + もう + た形 + はずです","options":["はずです","彼は","帰った","もう"],"answer":"2,4,3,1","rationale":"彼は + もう + 帰った + はずです，た形 + はず","audio_text":"","rubric":"顺序完全正确得 1 分，否则 0 分","expected_production":"","difficulty":5},{"id":"Q0168","type":"error_correct","prompt_ja":"雨のおかげで、行けませんでした。","prompt_zh":"改错：消极结果误用 おかげで","options":[],"answer":"雨のせいで、行けませんでした。","rationale":"消极结果用 せいで，おかげで 只用于好事；名词后要加 の","audio_text":"","rubric":"改为 せいで 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0169","type":"translate","prompt_ja":"中译日：多亏老师，日语变好了。","prompt_zh":"日译 おかげで","options":[],"answer":"","rationale":"名词 先生 + の + おかげで，后项积极结果","audio_text":"","rubric":"①名词后加 の 得 1 分；②用 おかげで 得 1 分；③后项为积极结果得 1 分","expected_production":"先生のおかげで、日本語が上手になりました。","difficulty":5},{"id":"Q0170","type":"free_production","prompt_ja":"请用 はず 写一句基于依据的推断。","prompt_zh":"自由写作","options":[],"answer":"","rationale":"考查 はずです 的迁移使用","audio_text":"","rubric":"①前接普通形/た形得 1 分；②用 はずです 得 1 分；③语义为「理应」得 1 分","expected_production":"彼はもう家に帰ったはずです。","difficulty":5}],"materials":[{"id":"M0037","kind":"reading","title":"会議の時間変更のメール","text_ja":"件名：あしたの会議の時間について／田中様　お疲れさまです。佐藤です。あしたの会議ですが、始まる時間を十時から十一時に変更いたしました。資料は本日中にメールでお送りしますので、ご確認ください。お忙しいところ恐れ入りますが、よろしくお願いいたします。","text_kana":"","text_zh":"主题：关于明天会议时间／田中先生，辛苦了。我是佐藤。明天会议的开始时间由十点改为十一点。资料会在今天内用邮件发送，请查收。百忙之中打扰，抱歉，请多关照。","focus_zh":"「変更いたしました」「お送りします」用「いたす／お〜します」谦让语谈自己动作，「ご確認ください」用「ご〜ください」尊他语请对方动作，商务邮件不能换成朋友体。","audio_text":"件名：あしたの会議の時間について／田中様　お疲れさまです。佐藤です。あしたの会議ですが、始まる時間を十時から十一時に変更いたしました。資料は本日中にメールでお送りしますので、ご確認ください。お忙しいところ恐れ入りますが、よろしくお願いいたします。","url":"","license":"original"},{"id":"M0048","kind":"listening","title":"入院した母と娘の会話","text_ja":"お母さん、きょうの具合はどう？だいぶよくなったわ。でも、まだ一人で歩くのは少し危ないの。じゃあ、今夜も私がここに泊まって看病するね。あしたは父が来るって連絡があったよ。そう、ありがとう。それを聞いて安心したわ。","text_kana":"","text_zh":"妈，今天感觉怎么样？好多了。不过一个人走路还有点危险。那今晚我也留在这儿护理你。听说爸爸明天会来。是吗，谢谢。听你这么说我放心了。","focus_zh":"这段是母女间的简体口语：「どう？」「よくなったわ」「泊まって看病するね」用「わ／ね」等终助词、省助词，与前面商务敬语文体完全不同。","audio_text":"お母さん、きょうの具合はどう？だいぶよくなったわ。でも、まだ一人で歩くのは少し危ないの。じゃあ、今夜も私がここに泊まって看病するね。あしたは父が来るって連絡があったよ。そう、ありがとう。それを聞いて安心したわ。","url":"","license":"original"}],"viz":{"day":50,"phase":"P4","new_count":8,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"佐藤です。","kana":"","zh":"我是佐藤。","note_zh":"「変更いたしました」「お送りします」用「いたす／お〜します」谦让语谈自己动作，「ご確認ください」用「ご〜ください」尊他语请对方动作，商务邮件不能换成朋友体。","audio_text":"佐藤です。"},{"ja":"あしたの会議ですが、始まる時間を十時から十一時に変更いたしました。","kana":"","zh":"明天会议的开始时间由十点改为十一点。","note_zh":"「変更いたしました」「お送りします」用「いたす／お〜します」谦让语谈自己动作，「ご確認ください」用「ご〜ください」尊他语请对方动作，商务邮件不能换成朋友体。","audio_text":"あしたの会議ですが、始まる時間を十時から十一時に変更いたしました。"},{"ja":"忙しくて、昼ご飯を忘れることがあります。","kana":"","zh":"忙起来有时会忘了吃午饭。","note_zh":"「有时会去」须用 辞书形 行くことがある；たことがある 是「去过」，中文「有时」直译易混","audio_text":"忙しくて、昼ご飯を忘れることがあります。"}],"review_plan":[{"kid":"V0211","surface":"経験","kana":"けいけん","zh":"经验；经历","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":49,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"V0212","surface":"可能性","kana":"かのうせい","zh":"可能性","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":49,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"V0213","surface":"影響","kana":"えいきょう","zh":"影响","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":49,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"G0065","surface":"V辞書形/Vない形 + ことに する / なる","kana":"","zh":"（自己）决定…／（结果）定为…、将要…","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":49,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"K0112","surface":"報","kana":"","zh":"报；报告；报答；信息","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":49,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"V0207","surface":"原因","kana":"げんいん","zh":"原因（客观）","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":48,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"V0208","surface":"結果","kana":"けっか","zh":"结果","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":48,"next_hint_zh":"大约 Day 51 再回顾"},{"kid":"V0209","surface":"目的","kana":"もくてき","zh":"目的","reason_zh":"2 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":48,"next_hint_zh":"大约 Day 51 再回顾"}],"teaching_notes":["记住：「有时会去」须用 辞书形 行くことがある；たことがある 是「去过」，中文「有时」直译易混","注意：「あります」已含礼貌体，不能再叠 でした；中文无时态变化易堆敬体","容易错：「打算看」须用意志形 見よう；用辞书形 見る 变成「觉得会看」，中文「想看」直译错","小提醒：カ変「来る」意志形是 こよう，不是 きよう；中文按字形推读音错"],"ko_analogy":{"grammar":[{"match":"G0066","pattern":"V辞書形 / Vない形 + ことが ある","ko":"-(으)ㄹ 때가 있다 / -기도 하다 / -지 않을 때가 있다","hint_zh":"『有时会…／有时不…』≒ -(으)ㄹ 때가 있다，泛指倾向可对照（与 G0042 经历不同）。","caution":"日语用辞书形＝有时、た形＝曾经（G0042），只差动词形，韩语 -(으)ㄹ 때가 있다/-(으)ㄴ 적이 있다 是两套，别把两条都翻成 있다；ことがある 的 がある 不表存在某物，别套 있다。"},{"match":"G0067","pattern":"V意志形 + と 思う / と する","ko":"-(으)려고 하다 / -(으)ㄹ까 하다 / -(으)려던 참이다","hint_zh":"『打算…／正要…』≒ -(으)려고 하다，意志/尝试可对照。","caution":"日语意志形＋と思う 表打算、＋とする 表正要/试图，韩语 -(으)려고 하다/-려던 참이다 分工类似但不一一对应；と 是引用助词（G0036），韩语 -려고 里没有引用形，别加 라고。"}],"vocab":[]}}</script>
