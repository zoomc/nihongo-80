<script type="application/json" id="nh80-day">{"day":62,"phase":"P4","theme":"意见陈述｜普通形 + くせに / ものの / とはいえ・普通形 + わりに(は) / N + に しては・伺う","scene":"【意见陈述】意见讨论：用「普通形 + くせに / ものの / とはいえ、普通形 + わりに(は) / N + に しては」说明原因与推测的区别，避免把猜测说成事实（素材：人によって違います）","scene_tag":"意见陈述","can_do":"用「普通形 + くせに / ものの / とはいえ、普通形 + わりに(は) / N + に しては」说明原因与推测的区别，避免把猜测说成事实","focus":["grammar","production"],"objectives":["能从一小段通知或短文里找出主要意思，并说出一句依据","能把今天学的说法用到一个新场景，而不是只背原句","能分清「这是事实」和「这是我猜的」，不把猜测说成肯定","当天新词：伺う、申す、見つかる（读音与用法都要验证，不靠汉字猜义）","当天句型：普通形 + くせに / ものの / とはいえ、普通形 + わりに(は) / N + に しては，须说出接续条件","当天汉字：味、由，音读/训读各给一例","Can-do：用「普通形 + くせに / ものの / とはいえ、普通形 + わりに(は) / N + に しては」说明原因与推测的区别，避免把猜测说成事实"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【意见陈述】意见讨论：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0237","surface":"伺う","kana":"うかがう","romaji":"ukagau","pos":"動詞/五段","meaning_zh":"拜访；请教；打听（谦让语）","jlpt":"N3","examples":[{"ja":"明日、先生の研究室に伺います。","zh":"明天去老师的研究室拜访。","audio_text":"明日、先生の研究室に伺います。"}],"notes_for_zh":"「伺う」うかがう 五段，谦让语，兼「訪ねる（拜访）／聞く・尋ねる（请教/打听）」多义须靠语境；「〜に伺う／ちょっと伺いますが…」；与尊敬「いらっしゃる」方向相对。【疑点】对应哪个本动词、以及现代商务日语中「伺う」的适用边界建议二次核实，故标 needs_review；「伺」シ/うかがう 训读不能靠汉字猜。","confusables":["V0234"],"ko":"","ko_hint":"","caution":""},{"id":"V0238","surface":"申す","kana":"もうす","romaji":"mousu","pos":"動詞/五段","meaning_zh":"说；叫做（谦让语）","jlpt":"N3","examples":[{"ja":"田中と申します。よろしくお願いします。","zh":"我姓田中，请多关照。","audio_text":"田中と申します。よろしくお願いします。"}],"notes_for_zh":"「申す」もうす 五段，「言う」的谦让语，主语是“我/我方”；自我介绍固定「〜と申します」（比 〜と言います 更谦）；与尊敬「おっしゃる」相对，「申し上げる」更谦；中文“我叫…”日语用 と 引用，不能直译 は。","confusables":["V0236"],"ko":"","ko_hint":"","caution":""},{"id":"V0241","surface":"見つかる","kana":"みつかる","romaji":"mitsukaru","pos":"動詞/五段","meaning_zh":"被找到；（东西）找到了（自动）","jlpt":"N3","examples":[{"ja":"無くした時計が見つかりました。","zh":"丢的表找到了。","audio_text":"無くした時計が見つかりました。"}],"notes_for_zh":"「見つかる」五段自动词，“被找到/（东西）找到了”，主语用 が；与他动词「見つける」成对，中文“找到了”直译成 を 見つける 虽可，但「財布が見つかった」不能用 を；另有“被（人）发现”义（見つかって怒られた）；不能靠汉字猜自他。","confusables":["V0240"],"ko":"","ko_hint":"","caution":""},{"id":"V0243","surface":"職場","kana":"しょくば","romaji":"shokuba","pos":"名詞","meaning_zh":"职场；工作岗位","jlpt":"N3","examples":[{"ja":"職場の人と相談します。","zh":"和同事（职场的人）商量。","audio_text":"職場の人と相談します。"}],"notes_for_zh":"「職場」しょくば 名词，「職場で働く／職場の人」；汉字「場」音读 ジョウ（会場）但此词训读 ば（しょくば），一字两读随词变，不能按中文 chǎng 推；与「会社」かいしゃ（公司）不同：職場 指“实际工作的地方/团队”；韩语 직장 同源可帮记，但不能靠汉字猜。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0081","pattern":"普通形 + くせに / ものの / とはいえ","meaning_zh":"明明…却（责备）／虽然…但是／虽说…然而","connection":"くせに：普通形（な形/名词 用 な／である）；ものの：普通形（书面让步）；とはいえ：名词/普通形＋とはいえ","example":"知っているくせに、教えてくれませんでした。","usage":"くせに 带强烈责备/轻蔑（对人不满）；ものの 是中性书面让步；とはいえ 是「话虽如此」，常修正前句","explanation_zh":"意思是「明明…却（责备）／虽然…但是／虽说…然而」；接续：くせに：普通形（な形/名词 用 な／である）；ものの：普通形（书面让步）；とはいえ：名词/普通形＋とはいえ（中文术语：くせに：简体（な形/名词 用 な／である）；ものの：简体（书面让步）；とはいえ：名词/简体＋とはいえ）；用法：くせに 带强烈责备/轻蔑（对人不满）；ものの 是中性书面让步；とはいえ 是「话虽如此」，常修正前句","common_errors":[{"wrong":"先生は知っているくせに、教えてくれませんでした。","why":"くせに 带责备/轻蔑，对老师用极失礼；中文「明明…却」直译不看对象错","fix":"先生はご存じなのに、教えてくださいませんでした。","learner":"zh"},{"wrong":"子供だくせに、…","why":"名词/な形 接 くせに 用 な／である（子供なくせに），不用 だ；中文「明明是孩子」直译保留 だ 错","fix":"子供なくせに、…","learner":"zh"}],"compare":[{"id":"G0075","diff":"のに 只是意外/遗憾；くせに 带明显责备、轻蔑，语气更重，不能对长辈用"},{"id":"G0037","diff":"から/ので 顺接；ものの/とはいえ 是让步逆接，方向相反"}],"examples":[{"ja":"知っているくせに、教えてくれませんでした。","zh":"明明知道却不告诉我。","audio_text":"知っているくせに、教えてくれませんでした。"},{"ja":"買ったものの、使っていません。","zh":"虽然买了却没在用。","audio_text":"買ったものの、使っていません。"},{"ja":"高いとはいえ、品質はいいです。","zh":"虽说贵，质量倒不错。","audio_text":"高いとはいえ、品質はいいです。"}],"ko":"-면서(도)·-주제에 / -기는 하지만 / -다고는 해도","ko_hint":"『明明…却（责备）』≒ -면서도/-주제에、『虽然…但是』≒ -기는 하지만、『虽说…然而』≒ -다고는 해도，可分层对照。","caution":"くせに 带责备/轻蔑，韩语 -주제에 也带但更重、-면서도 偏中性，别一律翻 -면서；ものの/とはいえ 是书面让步，韩语 -기는 하지만/-다고는 해도 语域不同源；三者不能互换。"},{"id":"G0082","pattern":"普通形 + わりに(は) / N + に しては","meaning_zh":"（相较…）却…；按…来说倒是…","connection":"動詞・い形 普通形 / 名詞＋の + わりに；名詞 + にしては；后项是与前项预期不符的评价","example":"たくさん食べたわりに、太りませんでした。","usage":"以某标准为参照，结果出乎意料；わりに 偏「付出/程度与结果不匹配」，にしては 偏「以该身份/条件而论」","explanation_zh":"意思是「（相较…）却…；按…来说倒是…」；接续：動詞・い形 普通形 / 名詞＋の + わりに；名詞 + にしては；后项是与前项预期不符的评价（中文术语：动词・い形 简体 / 名词＋の + わりに；名词 + にしては；后项是与前项预期不符的评价）；用法：以某标准为参照，结果出乎意料；わりに 偏「付出/程度与结果不匹配」，にしては 偏「以该身份/条件而论」","common_errors":[{"wrong":"初心者にしてはは上手です","why":"にしては 已含 は，不叠加；中文「作为初学者」直译堆 は 错","fix":"初心者にしては上手です。","learner":"zh"},{"wrong":"勉強したわりに、合格しました","why":"わりに 后项须是「与预期相反」的结果；「努力了所以考上」顺理成章，用 わりに 不自然；中文「按…来说」直译不看落差","fix":"勉強したわりに、合格できませんでした。","learner":"zh"}],"compare":[{"id":"G0075","diff":"のに 是单纯逆接（意外/遗憾）；わりに/にしては 是「与某个基准相比」的评价，含比较"},{"id":"G0034","diff":"より/ほうが 是两者直接比较；わりに 是「相对预期」的落差评价"}],"examples":[{"ja":"たくさん食べたわりに、太りませんでした。","zh":"吃了那么多却没胖。","audio_text":"たくさん食べたわりに、太りませんでした。"},{"ja":"初心者にしては、上手に作りましたね。","zh":"作为初学者，做得挺不错呢。","audio_text":"初心者にしては、上手に作りましたね。"}],"ko":"-에 비해(서) / -치고는","ko_hint":"『相较…却…』≒ -에 비해、『按…来说倒是…』≒ -치고는，可对照『与预期不符』的语气。","caution":"わりに 偏与投入/程度不相称、にしては 偏按某标准看竟…，韩语 -에 비해/-치고는 分工类似但不重合；にしては 的 に 不是 G0009 的 에（韩语用 -치고는），别据 に 猜 에。"}],"kanji":[{"id":"K0134","char":"味","onyomi":["ミ"],"kunyomi":["あじ"],"meaning_zh":"味；味道；意味","zh_trap":"中文「味」wèi；日语 味 音读 ミ（意味 いみ）、训读 あじ（味道）；「意味」是「意思」，与「味道」无关，中文易按「味」猜成「滋味」，典型陷阱，不能靠汉字猜。","vocab_refs":["V0205"],"examples":[{"ja":"意味","kana":"いみ","zh":"意思；含义"}],"ko_hint":"韩语汉字词可参考：의미 / 뜻。日韩都表『意思/含义』，의미 是汉字词、뜻 是固有词。"},{"id":"K0135","char":"由","onyomi":["ユ","ユウ"],"kunyomi":["よし"],"meaning_zh":"由；理由；经由；缘由","zh_trap":"中文「由」yóu；日语 由 音读 ユ（経由 けいゆ）/ユウ（理由 りゆう）/ユイ，训读 よし（古语，现代罕用）；「理由」是「理由」。【疑点】ユ/ユウ/ユイ 三读随词分布、训读 よし 是否列常用建议二次核实，故标 needs_review；不可按中文 yóu 类推成单一读音。","vocab_refs":["V0206"],"examples":[{"ja":"理由","kana":"りゆう","zh":"理由；缘由"}],"ko_hint":"韩语汉字词可参考：이유。日韩汉字词同形同义（りゆう／이유＝理由）。"}],"questions":[{"id":"Q0220","type":"mcq","prompt_ja":"なくした鍵が、かばんの中で ___。","prompt_zh":"选出正确动词形式（自他动词之别）","options":["見つかりました","見つけました","見つけています","見つかりたいです"],"answer":"見つかりました","rationale":"「見つかる」是自动词，主语是被找到的东西（鍵が）；「見つける」是他动词，主语须是人（私が鍵を見つけた）。中文『找到了』主客易混。","audio_text":"","rubric":"选 見つかりました 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0231","type":"fill","prompt_ja":"約束の時間に遅れてすみません。実は、電車が ___ んです。","prompt_zh":"填入「んです」前的普通形","options":[],"answer":"遅れた","rationale":"「んです」用于说明原因/强调，前接普通形（G0059）；「遅れる」た形「遅れた」＋「んです」。中文母语者常误用「でした」或加「だ」。","audio_text":"","rubric":"填 遅れた 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0241","type":"fill","prompt_ja":"日本の大学に進学する ___ 、日本語を勉強しています。","prompt_zh":"填入表示『为了（目的）』的表达","options":[],"answer":"ために","rationale":"「V辞書形＋ため(に)」＝为了…（目的，前项为意志动词，G0074）；原因用法的「ため(に)」前多接 た形/ている/ない形。中文『为了』直译易混。","audio_text":"","rubric":"填 ために 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0253","type":"listen","prompt_ja":"会話を聞いて、二人が明日どうすることにしたか選んでください。","prompt_zh":"两人决定明天怎么办？","options":["ハイキングを延期する","雨でも行く","中止して二度としない","場所だけ変える"],"answer":"ハイキングを延期する","rationale":"「行くのを来週に延ばすことにした」＝延期（G0065）。不是中止，而是挪到下周；理由是雨（V0096）。","audio_text":"もしもし、明日のハイキングのことだけど、天気予報が変わってね。うん、雨だって聞いたよ。そうなんだ。それで、行くのを来週に延ばすことにしたんだ。ごめん、わざわざ準備してくれたのに。ううん、大丈夫。連絡してくれて助かったよ。","rubric":"选 ハイキングを延期する 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0256","type":"read","prompt_ja":"【お知らせ】来月から、資源ごみの出し方が変わります。これまで毎週水曜日でしたが、来月からは毎週金曜日の朝八時までに出してください。集める曜日が変わるだけで、出す場所や分け方は今までと同じです。ご協力をお願いします。／市役所 環境課","prompt_zh":"这则通知里，变更的是什么？","options":["出す曜日","出す場所","ごみの分け方","集める回数"],"answer":"出す曜日","rationale":"文中明写「水曜日→金曜日」「曜日が変わるだけで、場所や分け方は今までと同じ」。时间是「朝八時までに」，场所、分け方、回数均未变。","audio_text":"","rubric":"选 出す曜日 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0257","type":"read","prompt_ja":"件名：明日の会議について／田中様　お疲れさまです。佐藤です。明日の会議ですが、開始時間を十時から十一時に変更いたしました。資料は今日中にメールでお送りします。お忙しいところ恐れ入りますが、ご確認のほどよろしくお願いいたします。","prompt_zh":"这封邮件的主要事项是什么？","options":["会議の開始時間が変わったこと","会議が中止になったこと","資料が作れなかったこと","佐藤が休むこと"],"answer":"会議の開始時間が変わったこと","rationale":"「十時から十一時に変更いたしました」是用件（G0065 主观决定的结果用于告知）。资料是「今日中に送る」（会发），中止、缺席均无记述。","audio_text":"","rubric":"选 会議の開始時間が変わったこと 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0023","kind":"reading","title":"人によって違います","text_ja":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","text_kana":"","text_zh":"喜好因人而异。对我来说日语很难。我们来聊聊日语吧。","focus_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。私にとって、日本語は難しいです。日本語について話しましょう。","url":"","license":"original"},{"id":"M0024","kind":"listening","title":"パソコンで書ける","text_ja":"パソコンで日本語のメールが書けるようになりました。とても便利です。","text_kana":"","text_zh":"已经能用电脑写日语邮件了。非常方便。","focus_zh":"「書けるようになりました」表从不会到会的变化；「パソコンで」的「で」表工具手段用电脑，不是动作场所。","audio_text":"パソコンで日本語のメールが書けるようになりました。とても便利です。","url":"","license":"original"}],"viz":{"day":62,"phase":"P4","new_count":8,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"人によって好きなものが違います。","kana":"","zh":"喜好因人而异。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"人によって好きなものが違います。"},{"ja":"私にとって、日本語は難しいです。","kana":"","zh":"对我来说日语很难。","note_zh":"这段把三个易混的「に」系句型放一起：「人によって」＝因人而异、「私にとって」＝对我来说、「日本語について」＝关于日语，不能互相替换。","audio_text":"私にとって、日本語は難しいです。"},{"ja":"知っているくせに、教えてくれませんでした。","kana":"","zh":"明明知道却不告诉我。","note_zh":"くせに 带责备/轻蔑，对老师用极失礼；中文「明明…却」直译不看对象错","audio_text":"知っているくせに、教えてくれませんでした。"}],"review_plan":[{"kid":"V0233","surface":"さしあげる","kana":"さしあげる","zh":"（谦让地）给；呈上","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":61,"next_hint_zh":"大约 Day 63 再回顾"},{"kid":"V0235","surface":"なさる","kana":"なさる","zh":"做（尊敬语）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":61,"next_hint_zh":"大约 Day 63 再回顾"},{"kid":"V0236","surface":"おっしゃる","kana":"おっしゃる","zh":"说（尊敬语）","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":61,"next_hint_zh":"大约 Day 63 再回顾"},{"kid":"G0080","surface":"N(＋助詞) + さえ／こそ／すら；V ば形 前 + さえ…ば","kana":"","zh":"甚至…／只要…就／正是…／连…都","reason_zh":"1 天前学的，按 1/2/3/7/14/30 天间隔今天该回顾","learned_day":61,"next_hint_zh":"大约 Day 63 再回顾"},{"kid":"K0133","surface":"意","kana":"","zh":"意；意思；意见；注意","reaso
