+ おかげで／せいで；简体 + おかげで／せいで）；用法：おかげで 表积极原因（多亏），せいで 表消极原因（都怪）；感情色彩固定","common_errors":[{"wrong":"雨のおかげで、行けませんでした","why":"消极结果用 せいで，おかげで 只用于好事","fix":"雨のせいで、行けませんでした。","learner":"zh"},{"wrong":"先生のおかげで（漏 の）","why":"名词后接 おかげで 要加 の：先生のおかげで","fix":"先生のおかげで…","learner":"zh"}],"compare":[],"examples":[{"ja":"先生のおかげで、日本語が上手になりました。","zh":"多亏老师，日语变好了。","audio_text":"先生のおかげで、日本語が上手になりました。"},{"ja":"雨のせいで、行けませんでした。","zh":"都怪下雨，没能去成。","audio_text":"雨のせいで、行けませんでした。"}],"ko":"덕분에 / 때문에·탓에","ko_hint":"『多亏…』≒ 덕분에、『都怪…』≒ 때문에/탓에，正负原因成对，可对照。","caution":"おかげで 只用于好结果、せいで 只用于坏结果，韩语 덕분에/탓에 大体对应但 때문에 中性、可搭好/坏结果，边界不同；せいで 还能推卸责任，韩语 탓에 也有，但别把两者都翻 때문에。"},{"id":"G0055","pattern":"～によって / ～について / ～にとって","meaning_zh":"因…而异／关于…／对…来说","connection":"名詞 + によって／について／にとって","example":"人によって意見が違います。","usage":"によって 表「因…而不同/依据/手段被动」、について「关于」、にとって「对…而言（评价）」","explanation_zh":"意思是「因…而异／关于…／对…来说」；接续：名詞 + によって／について／にとって（中文术语：名词 + によって／について／にとって）；用法：によって 表「因…而不同/依据/手段被动」、について「关于」、にとって「对…而言（评价）」","common_errors":[{"wrong":"私について、日本語は難しいです","why":"「对…来说」用 にとって，について 是「关于」，中文「对」易混","fix":"私にとって、日本語は難しいです。","learner":"zh"},{"wrong":"人にとって 意見が違います","why":"「因…而异」用 によって，にとって 是评价立场","fix":"人によって意見が違います。","learner":"zh"}],"compare":[],"examples":[{"ja":"人によって意見が違います。","zh":"意见因人而异。","audio_text":"人によって意見が違います。"},{"ja":"日本語について話します。","zh":"谈谈日语。","audio_text":"日本語について話します。"},{"ja":"私にとって、日本語は難しいです。","zh":"对我来说日语很难。","audio_text":"私にとって、日本語は難しいです。"}],"ko":"-에 따라(서) / -에 대해(서) / -에게(는)·-에 있어(서)","ko_hint":"三个『に』系句型分别≈因…而异/关于…/对…来说，可成组对照记忆。","caution":"によって 还表被动施事、手段、原因（地震によって/人によって），韩语 -에 따라/-에 의해/-로 要分，不止一个；について≈-에 대해 较贴近，にとって≈-에게는 但韩语还能用 -에는，别一一对死。"}],"kanji":[{"id":"K0118","char":"申","onyomi":["シン"],"kunyomi":["もうす"],"meaning_zh":"申；申请；说（谦让）","zh_trap":"中文「申」shēn；日语 申 音读 シン（申請 しんせい）、训读 もうす（申す 谦让语「说」）；「申請」是「申请」，中文「申」无此稳定对应，不能按中文音推。","vocab_refs":["V0251","V0238"],"examples":[{"ja":"申請","kana":"しんせい","zh":"申请（书面）"},{"ja":"申す","kana":"もうす","zh":"说；叫做（谦让语）"}],"ko_hint":""},{"id":"K0119","char":"請","onyomi":["セイ"],"kunyomi":[],"meaning_zh":"请；请求；申请","zh_trap":"中文「请」qǐng 是礼貌邀请；日语 請 音读 セイ（申請 しんせい 中读 セイ）、「請う」こう（乞求）；简体「请」与「請」不同，「申請」是「提交申请」，义差大。【疑点】「請」的音读（セイ/シン/ショウ）与训读（こう/うける）边界、以及本字是否单列 N3 建议二次核实，故标 needs_review。","vocab_refs":["V0251"],"examples":[{"ja":"申請","kana":"しんせい","zh":"申请（书面）"}],"ko_hint":""}],"questions":[{"id":"Q0260","type":"read","prompt_ja":"図書館からのお知らせ：本を借りるには、利用カードが必要です。カードは、受付で申請書に記入し、身分が確認できるものを一つお見せいただければ、その場でお作りします。カードをなくした場合も、同じ手続きで再発行できますので、お気軽にお申し出ください。","prompt_zh":"办理借书证需要什么？","options":["申請書への記入と身分証明になるもの","学校からの手紙","お金と写真二枚","事前の予約"],"answer":"申請書への記入と身分証明になるもの","rationale":"文中明写「申請書に記入し、身分が確認できるものを一つお見せいただければ」。钱、照片、预约、介绍信都未出现，不能附加文中没有的信息（G0073 的「お見せいただければ」）。","audio_text":"","rubric":"选 申請書への記入と身分証明になるもの 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0333","type":"mcq","prompt_ja":"「確認」の読み方を選んでください。","prompt_zh":"【言語知識】选出「確認」的正确读音。","options":["がくにん","かくいん","こうにん","かくにん"],"answer":"かくにん","rationale":"「確認」读 かくにん；「確」かく、「認」にん。かくいん/がくにん/こうにん 都是形近误读。","audio_text":"","rubric":"选 かくにん 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0334","type":"mcq","prompt_ja":"「検討」の意味として最も近いものを選んでください。","prompt_zh":"【言語知識】选出「検討」最接近的中文意思。","options":["严厉批评；检讨","拒绝；推翻","研究讨论；探讨","复制；转载"],"answer":"研究讨论；探讨","rationale":"「検討」是中性“研究讨论、考虑”；中文“检讨”是贬义自我批评。商务「検討します」常是委婉保留，不是答应。","audio_text":"","rubric":"选 研究讨论；探讨 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0335","type":"mcq","prompt_ja":"「承認」の意味として最も近いものを選んでください。","prompt_zh":"【言語知識】选出「承認」最接近的中文意思。","options":["拒绝；反对","申请；提交","确认；校对","批准；认可"],"answer":"批准；认可","rationale":"「承認」是上级或系统对申请的批准/认可；「申請」是申请，「確認」是核对。中文“承认错误”不能用 承認 直译。","audio_text":"","rubric":"选 批准；认可 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0336","type":"mcq","prompt_ja":"会議の資料を明日までに___ください。","prompt_zh":"【言語知識】填入正确形式，构成“请提交”。","options":["提出する","提出します","提出して","提出した"],"answer":"提出して","rationale":"「〜てください」前接て形；「提出」是サ変，て形为「提出して」。其余是辞书形/た形/ます形，不能直接接 ください。","audio_text":"","rubric":"选 提出して 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0394","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，この本は何日遅れていますか。","options":["3日","7日","5日","2日"],"answer":"5日","rationale":"B 说「五日遅れています」。虽然第一次只提醒，但迟的天数是5天。","audio_text":"B：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。","rubric":"选 5日 得 1 分，其余 0 分","expected_production":"","difficulty":4}],"materials":[{"id":"M0040","kind":"reading","title":"図書館の利用カードの掲示","text_ja":"図書館の利用カードについて／本を借りるには、利用カードが必要です。カードは受付で作れます。申請書に名前と住所を書き、身分が確認できるものを一つ見せていただければ、その日のうちにお渡しします。カードをなくした場合も、同じ手続きで再発行できますので、遠慮なくお申し出ください。","text_kana":"","text_zh":"关于图书馆借书证／借书需要借书证。借书证可在服务台办理。填写申请书上的姓名和住址，出示一件能证明身份的证件，当天即可领取。遗失时也可按同样手续补办，请不必客气前来申请。","focus_zh":"「借りるには、カードが必要です」的「には」＝若要借书；「見せていただければ」是若能请您出示的谦让假定形，窗口用语很客气。","audio_text":"図書館の利用カードについて／本を借りるには、利用カードが必要です。カードは受付で作れます。申請書に名前と住所を書き、身分が確認できるものを一つ見せていただければ、その日のうちにお渡しします。カードをなくした場合も、同じ手続きで再発行できますので、遠慮なくお申し出ください。","url":"","license":"original"},{"id":"M0053","kind":"listening","title":"窓口での更新の手続き","text_ja":"すみません、在留カードの更新の手続きをしたいのですが。はい。まず、この申請書にご記入ください。それから、写真が一枚必要です。写真は持ってきました。ここで撮らなければなりませんか。いいえ、お持ちいただければ結構ですよ。","text_kana":"","text_zh":"您好，我想办理在留卡更新手续。好的。请先填写这份申请书。另外需要一张照片。照片我带来了。必须在这里拍吗？不用，您带了就可以。","focus_zh":"「撮らなければなりませんか」是问必须在这里拍吗；「お持ちいただければ結構ですよ」的「結構です」＝不用了／这样就可以了，别当成很好。","audio_text":"すみません、在留カードの更新の手続きをしたいのですが。はい。まず、この申請書にご記入ください。それから、写真が一枚必要です。写真は持ってきました。ここで撮らなければなりませんか。いいえ、お持ちいただければ結構ですよ。","url":"","license":"original"},{"id":"M0072","kind":"reading","title":"印鑑登録の手続き","text_ja":"印鑑登録の手続きは、市民課の窓口で行います。登録できる印鑑は、自分の名前がはっきり読めるもので、他の人と区別できるものに限ります。ゴム印や、文字が欠けている印鑑は登録できません。手続きのときは、印鑑と本人確認の書類を持って来てください。登録が済むと、印鑑登録証明書がすぐに発行できます。この証明書は、家を借りるときや、会社を設立するときなどに使われます。代理人が手続きをする場合は、本人からの委任状が別に必要です。","text_kana":"いんかんとうろくのてつづきは、しみんかのまどぐちでおこないます。とうろくできるいんかんは、じぶんのなまえがはっきりよめるもので、ほかのひととくべつできるものにかぎります。ゴムいんや、もじがかけているいんかんはとうろくできません。てつづきのときは、いんかんとほんにんかくにんのしょるいをもってきてください。とうろくがすむと、いんかんとうろくしょうめいしょがすぐにはっこうできます。このしょうめいしょは、いえをかりるときや、かいしゃをせつりつするときなどにつかわれます。だいりにんがてつづきをするばあいは、ほんにんからのいにんじょうがべつにひつようです。","text_zh":"印章登记手续在市民科窗口办理。可登记的印章，限于能清楚读出本人姓名、可与他人区分的印章。橡胶章或缺字的印章不能登记。办理时请带印章和身份证明文件。登记完成后，可立即签发印章登记证明。该证明用于租房、设立公司等场合。代理人办理时，另需本人的委托书。","focus_zh":"「に限ります」=限于；「ゴム印」「欠けている」不能登记；「委任状」是代理人办理时必需。","audio_text":"印鑑登録の手続きは、市民課の窓口で行います。登録できる印鑑は、自分の名前がはっきり読めるもので、他の人と区別できるものに限ります。ゴム印や、文字が欠けている印鑑は登録できません。手続きのときは、印鑑と本人確認の書類を持って来てください。登録が済むと、印鑑登録証明書がすぐに発行できます。この証明書は、家を借りるときや、会社を設立するときなどに使われます。代理人が手続きをする場合は、本人からの委任状が別に必要です。","url":"","license":"original"}],"viz":{"day":47,"phase":"P4","new_count":12,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"カードは受付で作れます。","kana":"","zh":"借书证可在服务台办理。","note_zh":"「借りるには、カードが必要です」的「には」＝若要借书；「見せていただければ」是若能请您出示的谦让假定形，窗口用语很客气。","audio_text":"カードは受付で作れます。","origin":"material","source_id":"M0040"},{"ja":"申請書に名前と住所を書き、身分が確認できるものを一つ見せていただければ、その日のうちにお渡しします。","kana":"","zh":"填写申请书上的姓名和住址，出示一件能证明身份的证件，当天即可领取。","note_zh":"「借りるには、カードが必要です」的「には」＝若要借书；「見せていただければ」是若能请您出示的谦让假定形，窗口用语很客气。","audio_text":"申請書に名前と住所を書き、身分が確認できるものを一つ見せていただければ、その日のうちにお渡しします。","origin":"material","source_id":"M0040"},{"ja":"カードをなくした場合も、同じ手続きで再発行できますので、遠慮なくお申し出ください。","kana":"","zh":"遗失时也可按同样手续补办，请不必客气前来申请。","note_zh":"「借りるには、カードが必要です」的「には」＝若要借书；「見せていただければ」是若能请您出示的谦让假定形，窗口用语很客气。","audio_text":"カードをなくした場合も、同じ手続きで再発行できますので、遠慮なくお申し出ください。","origin":"material","source_id":"M0040"}],"review_plan":[{"kid":"V0250","surface":"手続き","kana":"てつづき","zh":"手续；程序","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":46,"next_hint_zh":"按课程间隔，大约 Day 48 再预习","planned_only":true},{"kid":"V0283","surface":"受付","kana":"うけつけ","zh":"接待处；受理","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":46,"next_hint_zh":"按课程间隔，大约 Day 48 再预习","planned_only":true},{"kid":"V0309","surface":"遅延","kana":"ちえん","zh":"延误；晚点","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":46,"next_hint_zh":"按课程间隔，大约 Day 48 再预习","planned_only":true},{"kid":"V0282","surface":"窓口","kana":"まどぐち","zh":"窗口；
