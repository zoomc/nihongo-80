a":"電車に二十分の遅延が出ています。","zh":"电车晚点20分钟。","audio_text":"電車に二十分の遅延が出ています。"}],"notes_for_zh":"「遅延」是交通/系统晚点，比「遅れ」书面；「電車に遅延が出る」；中文“迟延”不常用。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0282","surface":"窓口","kana":"まどぐち","romaji":"madoguchi","pos":"名詞","meaning_zh":"窗口；柜台","jlpt":"N3","examples":[{"ja":"質問がある方は、三番の窓口へ来てください。","zh":"有问题的人请到3号窗口。","audio_text":"質問がある方は、三番の窓口へ来てください。"}],"notes_for_zh":"中文“窗口”也可指电脑窗口，日语「窓口」多指办事柜台/咨询窗口；读 まどぐち。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0272","surface":"資料","kana":"しりょう","romaji":"shiryou","pos":"名詞","meaning_zh":"资料；材料","jlpt":"N3","examples":[{"ja":"会議の資料をコピーしました。","zh":"复印了会议资料。","audio_text":"会議の資料をコピーしました。"}],"notes_for_zh":"中文“资料”范围广，日语「資料」多指会议/研究用的书面材料；注意「資料」≠「材料」ざいりょう。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0273","surface":"書類","kana":"しょるい","romaji":"shorui","pos":"名詞","meaning_zh":"文件；书面材料","jlpt":"N3","examples":[{"ja":"必要な書類を窓口に出してください。","zh":"请把必要文件交到窗口。","audio_text":"必要な書類を窓口に出してください。"}],"notes_for_zh":"「書類」是正式文件/表格，日常纸张多用「紙」；「書類を出す／書類を揃える」。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0296","surface":"引っ越し","kana":"ひっこし","romaji":"hikkoshi","pos":"名詞","meaning_zh":"搬家","jlpt":"N3","examples":[{"ja":"引っ越しの荷物をまとめています。","zh":"正在打包搬家的行李。","audio_text":"引っ越しの荷物をまとめています。"}],"notes_for_zh":"「引っ越し」是搬家；动词「引っ越す」；注意促音 ひっこし，也可写「引越し」，读音同。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0313","surface":"出発","kana":"しゅっぱつ","romaji":"shuppatsu","pos":"名詞/サ変","meaning_zh":"出发","jlpt":"N3","examples":[{"ja":"バスは八時に出発します。","zh":"公交8点出发。","audio_text":"バスは八時に出発します。"}],"notes_for_zh":"「出発」是出发；「出発する／出発時刻」；注意促音 しゅっぱつ，不是 しゅはつ。","confusables":[],"ko":"","ko_hint":"","caution":""}],"grammar":[{"id":"G0074","pattern":"V辞書形 + ため(に) / 普通形・N の + ため(に)","meaning_zh":"为了…（目的）／因为…、由于…（原因）","connection":"目的：意志动词 辞書形 + ため(に)；原因：普通形（多为 た形/ている/ない）或 名詞 + の + ため(に)","example":"日本語を勉強するために、日本に来ました。","usage":"目的句后项须是意志动作；原因句多接客观、非意志结果（事故・遅刻等），偏书面/正式，に 可省","explanation_zh":"意思是「为了…（目的）／因为…、由于…（原因）」；接续：目的：意志动词 辞書形 + ため(に)；原因：普通形（多为 た形/ている/ない）或 名詞 + の + ため(に)（中文术语：目的：意志动词 辞书形 + ため(に)；原因：简体（多为 た形/ている/ない）或 名词 + の + ため(に)）；用法：目的句后项须是意志动作；原因句多接客观、非意志结果（事故・遅刻等），偏书面/正式，に 可省","common_errors":[{"wrong":"日本語を勉強したために、来ました。","why":"目的用 辞书形 勉強する；た形 变成「因为学了日语」原因义，中文「为了」直译用过去式错","fix":"日本語を勉強するために来ました。","learner":"zh"},{"wrong":"事故ため、電車が止まりました。","why":"名词接 ため 要加 の：事故のため；中文「因事故」直译漏 の 错","fix":"事故のため、電車が止まりました。","learner":"zh"}],"compare":[{"id":"G0037","diff":"から/ので 偏主观/口语原因；ため(に) 偏客观、书面、正式（新闻/公告多用）"},{"id":"G0064","diff":"ようにする 是「努力做到某状态」；ために 是「为达成目的而做后项」"}],"examples":[{"ja":"日本語を勉強するために、日本に来ました。","zh":"为了学日语来了日本。","audio_text":"日本語を勉強するために、日本に来ました。"},{"ja":"渋滞のために、会議に遅れました。","zh":"因为堵车，开会迟到了。","audio_text":"渋滞のために、会議に遅れました。"}],"ko":"-(으)기 위해(서)（目的）/ -(으)ㄴ/는 바람에·때문에（原因）","ko_hint":"『为了…』≒ -기 위해、『因为…』≒ -때문에，目的/原因两义可对照。","caution":"ため 兼目的与原因两义，靠前接形与语境分，韩语 -기 위해/-때문에 是两套，别一律翻 때문에；ため 偏书面、较生硬，韩语 -기 위해서 也书面，但口语常用 -(으)려고，文体边界不同。"},{"id":"G0091","pattern":"普通形 + ものだから / もので","meaning_zh":"因为…（所以…）；由于…","connection":"動詞・い形 普通形 + ものだから；な形・名詞 + な/だ + ものだから；もので 更书面","example":"朝寝坊したものだから、電車に遅れました。","usage":"用于说明原因，常带辩解/道歉语气；后项多为自己的行为或请求，不用于客观叙述自然现象。","explanation_zh":"意思是「因为…（所以…）；由于…」；接续：動詞・い形 普通形 + ものだから；な形・名詞 + な/だ + ものだから；もので 更书面（中文术语：动词・い形 简体 + ものだから；な形・名词 + な/だ + ものだから；もので 更书面）；用法：用于说明原因，常带辩解/道歉语气；后项多为自己的行为或请求，不用于客观叙述自然现象。","common_errors":[{"wrong":"忙しいだものだから、行けません。","why":"い形「忙しい」后不能加 だ；ものだから 直接接普通形。中文“因为忙”直译容易保留“是”。","fix":"忙しいものだから、行けません。","learner":"zh"},{"wrong":"忙しいなものだから、行けません。","why":"い形「忙しい」后不加 な；な 只接な形/名词。","fix":"忙しいものだから、行けません。","learner":"zh"}],"compare":[{"id":"G0037","diff":"から/ので 是普通因果；ものだから 带主观辩解/道歉，语气更强。"}],"examples":[{"ja":"朝寝坊したものだから、電車に遅れました。","zh":"因为睡过头，所以没赶上电车。","audio_text":"朝寝坊したものだから、電車に遅れました。"},{"ja":"日本語が分からないものですから、ゆっくり話してください。","zh":"因为我不懂日语，请说慢一点。","audio_text":"日本語が分からないものですから、ゆっくり話してください。"}],"ko":"","ko_hint":"","caution":""}],"kanji":[{"id":"K0117","char":"続","onyomi":["ゾク"],"kunyomi":["つづく"],"meaning_zh":"续；继续；手续","zh_trap":"中文「续」xù；日语 続 音读 ゾク、训读 つづく（続く）；但「手続き」てつづき 中读 つづき（训读），不读 しゅぞく；「手続き」是「手续」，不能按「手+续」字面猜读音。","vocab_refs":["V0250"],"examples":[{"ja":"手続き","kana":"てつづき","zh":"手续；程序"}],"ko_hint":""},{"id":"K0133","char":"意","onyomi":["イ"],"kunyomi":[],"meaning_zh":"意；意思；意见；注意","zh_trap":"中文「意」yì；日语 意 音读 イ，「意味」いみ 是「意思/含义」、「意見」いけん、「注意」ちゅうい；中文「意」单用少，日语「意」构成大量抽象词，须按 イ 验证，此字无常用训读。","vocab_refs":["V0205"],"examples":[{"ja":"意味","kana":"いみ","zh":"意思；含义"}],"ko_hint":"韩语汉字词可参考：의미 / 뜻。日韩都表『意思/含义』，의미 是汉字词、뜻 是固有词。"}],"questions":[{"id":"Q0392","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，面接の会場はどこですか。","options":["空港","駅前の支社","本社","工場"],"answer":"駅前の支社","rationale":"A 先说本社，马上更正「本社ではなく、駅前の支社です」。最终是站前分公司。","audio_text":"A：李さんですね。面接は来週の火曜日の午後二時からです。\nB：火曜日ですね。会場は本社ですか。\nA：あ、申し訳ありません。本社ではなく、駅前の支社です。","rubric":"选 駅前の支社 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0393","type":"mcq","prompt_ja":"会話を聞いて、質問に答えてください。","prompt_zh":"【聴解】听对话，今日は何時までチェックアウトできますか。","options":["9時半","11時","10時","12時"],"answer":"11時","rationale":"B 说通常10点，但今天可以到11点。10点是平时，不是今天。","audio_text":"B：三〇五号室ですね。通常のチェックアウトは十時ですが、今日は十一時まで大丈夫です。","rubric":"选 11時 得 1 分，其余 0 分","expected_production":"","difficulty":4},{"id":"Q0145","type":"mcq","prompt_ja":"空が暗いです。雨が___そうです。","prompt_zh":"选出样态 そう 的正确接续","options":["降って","降る","降った","降り"],"answer":"降り","rationale":"样态 そう 接ます形词干（降り）；传闻才接普通形","audio_text":"雨が降りそうです。","rubric":"选 降り 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0146","type":"fill","prompt_ja":"明日は雨___しれません。","prompt_zh":"填入表「也许」的推测表达","options":[],"answer":"かも","rationale":"かもしれません 是固定推测形，礼貌形不用 〜です 叠加","audio_text":"","rubric":"填 かも 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0147","type":"listen","prompt_ja":"听录音，写出听到的整句。","prompt_zh":"听写整句","options":[],"answer":"明日は雨かもしれません","rationale":"名词 雨 + かもしれません，礼貌形是 かもしれません 而非 かもしれないです","audio_text":"明日は雨かもしれません。","rubric":"完整写出「明日は雨かもしれません」得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0148","type":"read","prompt_ja":"彼は忙しいようです。明日は雨かもしれません。【問い】明日の天気はどうですか。","prompt_zh":"读短文回答天气推测","options":[],"answer":"雨かもしれません","rationale":"文中「明日は雨かもしれません」给出不确定推测","audio_text":"彼は忙しいようです。明日は雨かもしれません。","rubric":"答出「也许下雨」得 1 分，答 忙しい 得 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0046","kind":"reading","title":"電車の遅れの掲示","text_ja":"お客様へ／ただいま、線路の中に人が入った影響で、電車に最大二十分の遅れが出ています。運転はまもなく再開しますが、しばらくは電車と電車の間が空きます。お急ぎのお客様は、ほかの路線をご利用ください。ご不便をおかけして、申し訳ございません。／駅係員","text_kana":"","text_zh":"致各位乘客／因有人进入轨道，目前列车最多晚点二十分钟。即将恢复运行，但一段时间内班次间隔会拉大。赶时间的乘客请改乘其他线路。给您带来不便，深表歉意。／站务员","focus_zh":"「遅れが出ています」用「ている」表晚点状态持续；「再開しますが、しばらくは…空きます」先肯定再转折，是广播/告示常见的缓冲说法。","audio_text":"お客様へ／ただいま、線路の中に人が入った影響で、電車に最大二十分の遅れが出ています。運転はまもなく再開しますが、しばらくは電車と電車の間が空きます。お急ぎのお客様は、ほかの路線をご利用ください。ご不便をおかけして、申し訳ございません。／駅係員","url":"","license":"original"},{"id":"M0095","kind":"listening","title":"図書館職員と利用者：返却期限","text_ja":"A：すみません、この本を返したいのですが。\nB：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。\nA：すみません。次から気をつけます。あのう、貸し出しは何日間ですか。\nB：通常は二週間です。ただし、新しい本は一週間です。\nA：この本は新しい本ですか。\nB：いいえ、通常の本なので、二週間借りられます。\nA：じゃあ、また借りたいです。お願いします。","text_kana":"A：すみません、このほんをかえしたいのですが。\nB：はい。あ、このほんはへんきゃくきげんがせんしゅうのきんようびですね。\nA：えっ、そうですか。なんにちおくれていますか。\nB：いつかおくれています。でも、はじめてのおくれですので、こんかいはちゅういだけでだいじょうぶです。\nA：すみません。つぎからきをつけます。あのう、かしだしはなんにちかんですか。\nB：つうじょうはにかんかんです。ただし、あたらしいほんはいっかんかんです。\nA：このほんはあたらしいほんですか。\nB：いいえ、つうじょうのほんなので、にかんかんかりられます。\nA：じゃあ、またかりたいです。おねがいします。","text_zh":"A：您好，我想还这本书。\nB：好的。啊，这本书的还书期限是上周五。\nA：诶，是吗？迟了几天？\nB：迟了五天。不过是第一次逾期，这次只提醒一下就行。\nA：抱歉。下次注意。那个，借书期是几天？\nB：通常两周。不过新书是一周。\nA：这本书是新书吗？\nB：不是，是普通书，可以借两周。\nA：那我还想借。拜托了。","focus_zh":"人物关系是图书馆职员与利用者。信息干扰：这本逾期五天，但首次只提醒；通常借两周，新书只借一周。","audio_text":"A：すみません、この本を返したいのですが。\nB：はい。あ、この本は返却期限が先週の金曜日ですね。\nA：えっ、そうですか。何日遅れていますか。\nB：五日遅れています。でも、初めての遅れですので、今回は注意だけで大丈夫です。\nA：すみません。次から気をつけます。あのう、貸し出しは何日間ですか。\nB：通常は二週間です。ただし、新しい本は一週間です。\nA：この本は新しい本ですか。\nB：いいえ、通常の本なので、二週間借りられます。\nA：じゃあ、また借りたいです。お願いします。","url":"","license":"original"},{"id":"M0069","kind":"reading","title":"防災訓練のお知らせ","text_ja":"来月三日の午前九時から、市全体で防災訓練を行います。訓練の開始と同時に、防災無線から大きな音が流れますので、驚かないでください。この音は、地震が起きたことを知らせるものではありません。訓練では、近くの小学校まで歩いて避難する練習をします。参加する方は、動きやすい服装で、飲み物を持って来てください。車での来場は禁止です。雨の場合も実施しますが、警報が出たときは中止します。参加を希望する方は、今週金曜日までに町内会へ申し込んでください。","text_kana":"らいげつみっかのごぜんくじから、しぜんたいでぼうさいくんれんをおこないます。くんれんのかいしとどうじに、ぼうさいむせんからおおきなおとがながれますので、おどろかないでください。このおとは、じしんがおきたことをしらせるものではありません。くんれんでは、ちかくのしょうがっこうまであるいてひなんするれんしゅうをします。さんかするかたは、うごきやすいふくそうで、のみものをもってきてください。くるまでのらいじょうはきんしです。あめのばあいもじっししますが、けいほうがでたときはちゅうしします。さんかをきぼうするかたは、こんしゅうきんようびまでにちょうないかいへもうしこんでください。","text_zh":"下个月三日上午九点起，全市进行防灾训练。训练开始同时，防灾无线会播放很大的声音，请不要惊慌。这个声音并不是通知发生地震。训练中会练习步行到附近小学避难。参加者请穿便于活动的服装，并自带饮料。禁止开车前来。下雨也实施，但发布警报时中止。希望参加的人，请在本周五前向町内会报名。","focus_zh":"「訓練」不是真实地震；「車での来場は禁止」；「警報が出たときは中止」；「開始と同時に」是同步。","audio_text":"来月三日の午前九時から、市全体で防災訓練を行います。訓練の開始と同時に、防災無線から大きな音が流れますので、驚かないでください。この音は、地震が起きたことを知らせるものではありません。訓練では、近くの小学校まで歩いて避難する練習をします。参加する方は、動きやすい服装で、飲み物を持って来てください。車での来場は禁止です。雨の場合も実施しますが、警報が出たときは中止します。参加を希望する方は、今週金曜日までに町内会へ申し込んでください。","url":"","license":"original"}],"viz":{"day":46,"phase":"P4","new_count":12,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"運転はまもなく再開しますが、しばらくは電車と電車の間が空きます。","kana":"","zh":"即将恢复运行，但一段时间内班次间隔会拉大。","note_zh":"「遅れが出ています」用「ている」表晚点状态持续；「再開しますが、しばらくは…空きます」先肯定再转折，是广播/告示常见的缓冲说法。","audio_text":"運転はまもなく再開しますが、しばらくは電車と電車の間が空きます。","origin":"material","source_id":"M0046"},{"ja":"お急ぎのお客様は、ほかの路線をご利用ください。","kana":"","zh":"赶时间的乘客请改乘其他线路。","note_zh":"「遅れが出ています」用「ている」表晚点状态持续；「再開しますが、しばらくは…空きます」先肯定再转折，是广播/告示常见的缓冲说法。","audio_text":"お急ぎのお客様は、ほかの路線をご利用ください。","origin":"material","source_id":"M0046"},{"ja":"ご不便をおかけして、申し訳ございません。","kana":"","zh":"给您带来不便，深表歉意。","note_zh":"「遅れが出ています」用「ている」表晚点状态持续；「再開しますが、しばらくは…空きます」先肯定再转折，是广播/告示常见的缓冲说法。","audio_text":"ご不便をおかけして、申し訳ございません。","origin":"material","source_id":"M0046"}],"review_plan":[{"kid":"V0166","surface":"間に合う","kana":"まにあう","zh":"赶得上；来得及","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":45,"next_h
