<script type="application/json" id="nh80-day">{"day":6,"phase":"P1","theme":"家庭介绍｜を（宾语／移动经过）・に（时点／归着点／存在场所／对象）・学校","scene":"【家庭介绍】休闲娱乐：用「を（宾语／移动经过）、に（时点／归着点／存在场所／对象）」说出自己与同伴的身份关系，不给对方名字误加 さん（素材：日曜日の映画）","scene_tag":"家庭介绍","can_do":"用「を（宾语／移动经过）、に（时点／归着点／存在场所／对象）」说出自己与同伴的身份关系，不给对方名字误加 さん","focus":["listening","reading"],"objectives":["能分清 学校、会社、駅 和意思相近的词，别按中文硬套","能读准今天汉字的日语读音，不照中文读音猜","能听懂一段正常语速的短对话，说清谁和谁、接下来要做什么","当天新词：学校、会社、駅（读音与用法都要验证，不靠汉字猜义）","当天句型：を（宾语／移动经过）、に（时点／归着点／存在场所／对象），须说出接续条件","当天汉字：八、九、十，音读/训读各给一例","Can-do：用「を（宾语／移动经过）、に（时点／归着点／存在场所／对象）」说出自己与同伴的身份关系，不给对方名字误加 さん"],"minutes":60,"blocks":[{"min":10,"type":"review","desc":"FSRS 到期复习 + 上一日错题重做"},{"min":20,"type":"new","desc":"新知识：先给场景让学生推测，再揭示规则"},{"min":15,"type":"interaction","desc":"【家庭介绍】休闲娱乐：听读素材 + 至少 1 次无提示独立输出"},{"min":10,"type":"quiz","desc":"当天测验，先作答后讲解"},{"min":5,"type":"feedback","desc":"错误归因、写档、明日任务"}],"vocab":[{"id":"V0039","surface":"学校","kana":"がっこう","romaji":"gakkou","pos":"名詞","meaning_zh":"学校","jlpt":"N5","examples":[{"ja":"学校へ行きます。","zh":"去学校。","audio_text":"学校へ行きます。"}],"notes_for_zh":"「学校」がっこう 是促音便（学 がく + 校 こう → がっこう）；中文照字面读 xué xiào 会漏促音。","confusables":[],"ko":"학교","ko_hint":"日韩都是汉字词、音近义近（がっこう／학교＝学校），可批量记大意。","caution":"がっこう ≠ 학교 读音不同，看到韩语汉字词推不出日语读音；日语『学校』多指中小学、大学说 大学，韩语 학교 泛指各级学校，范围不同。"},{"id":"V0040","surface":"会社","kana":"かいしゃ","romaji":"kaisha","pos":"名詞","meaning_zh":"公司","jlpt":"N5","examples":[{"ja":"会社で働きます。","zh":"在公司工作。","audio_text":"会社で働きます。"}],"notes_for_zh":"「会社」かいしゃ；中文「会社」不是词，日语「社」指公司/神社，「公司」在日语里若写成「公司」是古语「公の司」，别望文生义。","confusables":["V0039"],"ko":"회사","ko_hint":"日韩汉字词同形同义（かいしゃ／회사＝公司），可对照。","caution":"かいしゃ ≠ hoesa 读音不同；中文『会社』不是常用词，别按中文猜；日语『会社』偏上班的公司、韩语 회사 同，但『会社員／회사원』构词略不同。"},{"id":"V0041","surface":"駅","kana":"えき","romaji":"eki","pos":"名詞","meaning_zh":"车站","jlpt":"N5","examples":[{"ja":"駅で電車に乗ります。","zh":"在车站上电车。","audio_text":"駅で電車に乗ります。"}],"notes_for_zh":"「駅」えき 是训读；中文「驿」是古代驿站，现代「车站」不用「駅」，日语却专指火车站/地铁站。","confusables":[],"ko":"역","ko_hint":"日韩汉字词（駅／驛→역）同指车站，是较贴近的一条。","caution":"えき ≠ yeok 读音不同；日语用简化字『駅』、韩语『驛』读 역、中文『驿/站』，字形三方不同；韩语 역 还用于站点复合词，别据形猜音。"},{"id":"V0042","surface":"店","kana":"みせ","romaji":"mise","pos":"名詞","meaning_zh":"商店；店铺","jlpt":"N5","examples":[{"ja":"駅の前に店があります。","zh":"车站前有家店。","audio_text":"駅の前に店があります。"}],"notes_for_zh":"「店」训读 みせ，音读 てん（喫茶店 きっさてん）；单用「店」多读 みせ，复合词多读 てん，别一律读 てん。","confusables":[],"ko":"","ko_hint":"","caution":""},{"id":"V0044","surface":"図書館","kana":"としょかん","romaji":"toshokan","pos":"名詞","meaning_zh":"图书馆","jlpt":"N5","examples":[{"ja":"図書館で本を読みます。","zh":"在图书馆读书。","audio_text":"図書館で本を読みます。"}],"notes_for_zh":"「図」と、「書」しょ、「館」かん 全音读；「書館」不可读成 しょかん 之外，别把「書」训读 か 套进来。","confusables":[],"ko":"도서관","ko_hint":"日韩汉字词一一对应（図書館／도서관＝图书馆），汉字形近、义一致。","caution":"としょかん ≠ doseogwan 读音不同；日语『図』是简化字、韩语用『圖』、中文『图』，字形三方不同，别照字形猜音。"}],"grammar":[{"id":"G0008","pattern":"を（宾语／移动经过）","meaning_zh":"把…（标宾语）","connection":"名詞 + を + 他動詞","example":"ご飯を食べます。","usage":"标动作直接宾语；也表移动经过的场所（空を飛ぶ）","explanation_zh":"意思是「把…（标宾语）」；接续：名詞 + を + 他動詞（中文术语：名词 + を + 他动词）；用法：标动作直接宾语；也表移动经过的场所（空を飛ぶ）","common_errors":[{"wrong":"ご飯が食べます。","why":"他动词宾语用 を；中文「饭」是主语感觉，直译成 が 错","fix":"ご飯を食べます。","learner":"zh"},{"wrong":"学校を 行きます。","why":"「行く」表移动方向用 に/へ，を 表经过（道を歩く），不能混","fix":"学校へ行きます。","learner":"zh"}],"compare":[{"id":"G0009","diff":"を 标动作对象，に 标归着点/时点；「去学校」易混成 学校を行く"}],"examples":[{"ja":"ご飯を食べます。","zh":"吃饭。","audio_text":"ご飯を食べます。"}],"ko":"을/를（宾格，近似）","ko_hint":"を/을/를 都贴在宾语后，概念可平移；中文没有助词，有韩语背景更好接受『要加助词』这件事。","caution":"只作近似：を 还表离开/经过的场所（空を飛ぶ、道を歩く），韩语用 을/를 或 에서，边界不同；を 写作 を 通常读 o、不随词变形，을/를 要按收音选。"},{"id":"G0009","pattern":"に（时点／归着点／存在场所／对象）","meaning_zh":"在／于／向…","connection":"名詞 + に","example":"七時に起きます。","usage":"表时间点、动作归着点、存在场所、动作对象","explanation_zh":"意思是「在／于／向…」；接续：名詞 + に（中文术语：名词 + に）；用法：表时间点、动作归着点、存在场所、动作对象","common_errors":[{"wrong":"七時で 起きます。","why":"具体时点用 に，手段/场所用 で；中文「在七点」的「在」误对应 で","fix":"七時に起きます。","learner":"zh"},{"wrong":"学校に 勉強します。","why":"动作发生的场所用 で；に 只表静态存在/归着","fix":"学校で勉強します。","learner":"zh"}],"compare":[{"id":"G0010","diff":"に 表存在/归着点，で 表动作发生的
