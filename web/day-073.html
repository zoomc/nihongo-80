ranslate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『越查越不明白，反倒是更乱了。』","options":[],"answer":"","rationale":"「Vば形＋同じ動詞辞書形＋ほど」＝越…越…（G0079），ほど 前须同一动词的ば形＋辞书形；『反倒』用 かえって（V0198），不用 むしろ（取舍）；『变不明白』用 分からなくなる（G0048）。","audio_text":"","rubric":"①〜ば〜ほど「越…越…」1 分；②〜なくなる变化与〜てきました 1 分；③かえって反预期语气 1 分","expected_production":"調べれば調べるほど分からなくなって、かえって混乱してきました。","difficulty":5},{"id":"Q0303","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『为了不迟到，我决定比平时早一小时出门。』","options":[],"answer":"","rationale":"『为了不…』用「Vない形＋ように（する）」（G0064），不用「ために」（ため 前多接意志动词表目的，G0074）；『决定』用 ことにした（G0065，自己主观决定），ことになった 是客观结果；「家を出る」用 を。","audio_text":"","rubric":"①Vない形＋ように（する）『设法不…』1 分；②〜ことにする主观决定 1 分；③〜より比较、一時間早く与助词「を」正确 1 分","expected_production":"遅れないように、いつもより一時間早く家を出ることにしました。","difficulty":5},{"id":"Q0304","type":"translate","prompt_ja":"","prompt_zh":"把中文译成自然日语：『关于这次的手续，我想向窗口咨询一下。』（用「に関して」）","options":[],"answer":"","rationale":"「N＋に関して」（G0076）是比「について」（G0055，口语）更书面的『关于』，用于正式咨询；「に対して」是对某对象采取动作/态度，不表『关于』。「相談する」「手続き」对应 V0248/V0250。","audio_text":"","rubric":"①N＋に関して书面『关于』1 分；②区分について/に対して 1 分；③相談する・手続き用词与敬体自然 1 分","expected_production":"今回の手続きに関して、窓口に相談したいのですが。","difficulty":5}],"materials":[{"id":"M0049","kind":"listening","title":"駅の遅延放送","text_ja":"お客様にお知らせいたします。先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。ご協力をお願いいたします。","text_kana":"","text_zh":"通知各位乘客。刚才邻站发生人身事故，本列车目前停在站间。预计下午六点左右恢复运行。赶时间的乘客请利用站前公交。感谢配合。","focus_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"お客様にお知らせいたします。先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。運転を再開するのは、午後六時ごろになる見込みです。お急ぎのお客様は、駅前のバスをご利用ください。ご協力をお願いいたします。","url":"","license":"original"},{"id":"M0066","kind":"reading","title":"台風による運休のお知らせ","text_ja":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","text_kana":"たいふうじゅうにごうのせっきんにより、あしたのしはつからごぜんじゅうじまで、ちゅうおうせんのぜんせんでうんてんをとりやめます。ごぜんじゅうじいこうも、かぜのつよさによってはうんてんをさいかいできないばあいがあります。ふりかえゆそうとして、へいこうするしてつのろせんをりようできます。ただし、ふりかえゆそうはほんすうのおおいじかんたいにかぎります。えきのまどぐちでは、うんきゅうをしょうめいするかみをくばっています。つうきんやつうがくでりようするかたは、じかんによゆうをもってこうどうしてください。さいしんのじょうほうは、えきのけいじやホームページでかくにんしてください。","text_zh":"受12号台风接近影响，明天首班车至上午十点，中央线全线停运。上午十点以后，也可能因风力强弱而无法恢复运行。作为替代运输，可利用并行的私铁路线。但替代运输仅限班次较多的时段。车站窗口在发放停运证明。通勤通学的人请留出时间余量再行动。最新信息请在车站告示或网站确认。","focus_zh":"「取りやめます」=停运；「見込み」不是确定；「振替輸送」是替代运输，不是退票；「に限ります」=仅限。","audio_text":"台風十二号の接近により、明日の始発から午前十時まで、中央線の全線で運転を取りやめます。午前十時以降も、風の強さによっては運転を再開できない場合があります。振替輸送として、並行する私鉄の路線を利用できます。ただし、振替輸送は本数の多い時間帯に限ります。駅の窓口では、運休を証明する紙を配っています。通勤や通学で利用する方は、時間に余裕を持って行動してください。最新の情報は、駅の掲示やホームページで確認してください。","url":"","license":"original"}],"viz":{"day":73,"phase":"P5","new_count":0,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"お客様にお知らせいたします。","kana":"","zh":"通知各位乘客。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"お客様にお知らせいたします。","origin":"material","source_id":"M0049"},{"ja":"先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。","kana":"","zh":"刚才邻站发生人身事故，本列车目前停在站间。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"先ほど、となりの駅で人身事故があったため、この電車はただいま駅と駅の間で止まっています。","origin":"material","source_id":"M0049"},{"ja":"運転を再開するのは、午後六時ごろになる見込みです。","kana":"","zh":"预计下午六点左右恢复运行。","note_zh":"「人身事故があったため」的「ため」是书面因为；「六時ごろになる見込みです」＝预计六点左右，广播用「でございます／いたします」郑重体。","audio_text":"運転を再開するのは、午後六時ごろになる見込みです。","origin":"material","source_id":"M0049"}],"review_plan":[{"kid":"V0328","surface":"割合","kana":"わりあい","zh":"比例；比率","reason_zh":"这是预习建议（非 FSRS 到期项）：14 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":59,"next_hint_zh":"按课程间隔，大约 Day 89 再预习","planned_only":true},{"kid":"V0332","surface":"具体的","kana":"ぐたいてき","zh":"具体的","reason_zh":"这是预习建议（非 FSRS 到期项）：14 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":59,"next_hint_zh":"按课程间隔，大约 Day 89 再预习","planned_only":true},{"kid":"V0235","surface":"なさる","kana":"なさる","zh":"做（尊敬语）","reason_
