:"おっしゃいました","rationale":"部長（上位者）『说』用尊敬语「おっしゃる」；「申す/伺う/いたす」是谦让语，用于自己一方，不能用于部長。","audio_text":"","rubric":"选 おっしゃいました 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0225","type":"mcq","prompt_ja":"明日、三時に御社に ___ ます。","prompt_zh":"选出『自己去对方公司』的敬语","options":["伺い","おっしゃり","いらっしゃり","なさり"],"answer":"伺い","rationale":"自己去对方公司（御社）用谦让语「伺う→伺います」；「いらっしゃる/おっしゃる/なさる」是尊敬语，不能用于自己。","audio_text":"","rubric":"选 伺い 得 1 分，其余 0 分","expected_production":"","difficulty":5},{"id":"Q0227","type":"mcq","prompt_ja":"母が入院したので、毎日病院へ ___ に行っています。","prompt_zh":"选出表示『去照料病人』的词","options":["見物","診察","見学","看病"],"answer":"看病","rationale":"日语「看病（かんびょう）」是『护理、照料病人』，「看病に行く」＝去照料；中文『看病』是『就诊/诊治』，方向相反，不能按汉字猜。「診察」主语应是医生。","audio_text":"","rubric":"选 看病 得 1 分，其余 0 分","expected_production":"","difficulty":5}],"materials":[{"id":"M0041","kind":"reading","title":"予約の人数変更の返信メール","text_ja":"先日はご予約をありがとうございました。ご連絡いただいた人数の変更、二名から三名へ承知いたしました。お席はそのままご用意しておきます。なお、当日のご到着が午後六時を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。二十時までお取りしておきます。／さくら食堂","text_kana":"","text_zh":"感谢您此前的预约。已收到人数由两位改为三位的通知。席位照旧为您预留。另外，若当天抵达时间超过下午六点，麻烦请联系我们一次。座位将保留至二十点。／樱花食堂。","focus_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"先日はご予約をありがとうございました。ご連絡いただいた人数の変更、二名から三名へ承知いたしました。お席はそのままご用意しておきます。なお、当日のご到着が午後六時を過ぎる場合は、恐れ入りますが一度ご連絡くださいますようお願いいたします。二十時までお取りしておきます。／さくら食堂","url":"","license":"original"},{"id":"M0082","kind":"listening","title":"不動産会社と客：敷金と共益費","text_ja":"A：この部屋を借りたいのですが、敷金はいくらですか。\nB：敷金は家賃の二か月分です。\nA：二か月分ですか。少し高いですね。\nB：あ、失礼しました。この部屋は一か月分でした。\nA：一か月分なら、助かります。礼金はかかりますか。\nB：礼金はかかりません。その代わり、共益費が毎月五千円かかります。\nA：共益費に水道代は含まれますか。\nB：いいえ、水道代は別です。電気代とガス代も自分で払ってください。\nA：わかりました。では、来週の土曜日に契約したいです。\nB：土曜日は午後三時以降でしたら、お部屋をご案内できます。","text_kana":"A：このへやをかりたいのですが、しききんはいくらですか。\nB：しききんはやちんのにかげつぶんです。\nA：にかげつぶんですか。すこしたかいですね。\nB：あ、しつれいしました。このへやはいっかげつぶんでした。\nA：いっかげつぶんなら、たすかります。れいきんはかかりますか。\nB：れいきんはかかりません。そのかわり、きょうえきひがまいつきごせんえんかかります。\nA：きょうえきひにすいどうだいはふくまれますか。\nB：いいえ、すいどうだいはべつです。でんきだいとガスだいもじぶんではらってください。\nA：わかりました。では、らいしゅうのどようびにけいやくしたいです。\nB：どようびはごごさんじいこうでしたら、おへやをごあんないできます。","text_zh":"A：我想租这个房间，押金是多少？\nB：押金是两个月房租。\nA：两个月吗？有点贵。\nB：啊，失礼了。这个房间是一个月。\nA：一个月的话还好。需要礼金吗？\nB：不需要礼金。但每月要五千日元公共区域费。\nA：公共区域费包含水费吗？\nB：不，水费另算。电费和燃气费也请自己付。\nA：明白了。那我想下周六签约。\nB：周六下午三点以后，可以带您看房。","focus_zh":"人物关系是房产中介与看房客。信息干扰：先说敷金两个月，马上更正为一个月；共益费含什么、不含什么要分清。","audio_text":"A：この部屋を借りたいのですが、敷金はいくらですか。\nB：敷金は家賃の二か月分です。\nA：二か月分ですか。少し高いですね。\nB：あ、失礼しました。この部屋は一か月分でした。\nA：一か月分なら、助かります。礼金はかかりますか。\nB：礼金はかかりません。その代わり、共益費が毎月五千円かかります。\nA：共益費に水道代は含まれますか。\nB：いいえ、水道代は別です。電気代とガス代も自分で払ってください。\nA：わかりました。では、来週の土曜日に契約したいです。\nB：土曜日は午後三時以降でしたら、お部屋をご案内できます。","url":"","license":"original"}],"viz":{"day":66,"phase":"P5","new_count":0,"review_count":12,"question_count":6},"assessment":"none","lesson_core":[{"ja":"先日はご予約をありがとうございました。","kana":"","zh":"感谢您此前的预约。","note_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"先日はご予約をありがとうございました。","origin":"material","source_id":"M0041"},{"ja":"ご連絡いただいた人数の変更、二名から三名へ承知いたしました。","kana":"","zh":"已收到人数由两位改为三位的通知。","note_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"ご連絡いただいた人数の変更、二名から三名へ承知いたしました。","origin":"material","source_id":"M0041"},{"ja":"お席はそのままご用意しておきます。","kana":"","zh":"席位照旧为您预留。","note_zh":"「承知いたしました」是已悉／知道了的谦让说法，比「わかりました」郑重；「ご連絡くださいますよう」是店家对客人的郑重请求，不能对朋友用。","audio_text":"お席はそのままご用意しておきます。","origin":"material","source_id":"M0041"}],"review_plan":[{"kid":"V0226","surface":"悩み","kana":"なやみ","zh":"烦恼；苦恼","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":65,"next_hint_zh":"按课程间隔，大约 Day 67 再预习","planned_only":true},{"kid":"V0228","surface":"悲しい","kana":"かなしい","zh":"悲伤；难过","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":65,"next_hint_zh":"按课程间隔，大约 Day 67 再预习","planned_only":true},{"kid":"V0238","surface":"申す","kana":"もうす","zh":"说；叫做（谦让语）","reason_zh":"这是预习建议（非 FSRS 到期项）：1 天前学过，可按 1/2/3/7/14/30 天间隔预看","learned_day":65,"next_hint_zh":"按课程间隔，大约 Day 67 再预习","planned_only":true},{
